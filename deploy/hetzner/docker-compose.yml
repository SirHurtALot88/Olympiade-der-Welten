services:
  oly-app:
    build:
      context: ../..
      dockerfile: Dockerfile
      # Build-Stempel fuer die Sidebar-Version-Badge (siehe lib/app-version.ts).
      # Werte kommen aus der Shell-Umgebung, die auto-deploy.sh bzw.
      # scripts/deploy-hetzner-with-backup.sh vor `docker compose ... --build`
      # setzen. Ohne gesetzte Vars bleiben es leere Strings -> Dockerfile-ARG
      # Default greift, UI zeigt den "dev"-Fallback statt eines falschen Stempels.
      args:
        NEXT_PUBLIC_OLY_BUILD_SHA: ${NEXT_PUBLIC_OLY_BUILD_SHA:-}
        NEXT_PUBLIC_OLY_BUILD_DATE: ${NEXT_PUBLIC_OLY_BUILD_DATE:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Beide Spieler sitzen in Deutschland. `Europe/Berlin` (statt einer
      # festen +1/+2-Verschiebung) wechselt automatisch zwischen MEZ/MESZ, so
      # dass Server-Timestamps und Save-Namen in deutscher Ortszeit landen.
      TZ: Europe/Berlin
      OLY_APP_SQLITE_PATH: /app/data/persistence/oly-app.sqlite
      # Player/team images (macOS Dropbox paths) are served from a host folder
      # mounted read-only below. Upload the Dropbox subtree to /opt/oly-media on
      # the host, i.e. /opt/oly-media/Chris/Olympiade der Welten/...
      OLY_MEDIA_DROPBOX_ROOT: /app/media/dropbox
      # Phase-1-Login (optional, standardmaessig AUS). Siehe deploy/hetzner/.env.example.
      OLY_AUTH_ENABLED: ${OLY_AUTH_ENABLED:-}
      OLY_AUTH_SECRET: ${OLY_AUTH_SECRET:-}
      OLY_USER_CHRIS_PASSWORD: ${OLY_USER_CHRIS_PASSWORD:-}
      OLY_USER_FRANKY_PASSWORD: ${OLY_USER_FRANKY_PASSWORD:-}
    volumes:
      - oly-data:/app/data/persistence
      # Bug-Meldungen MUESSEN ein eigenes Volume haben. Ohne dieses Mount schreibt die Flagge nach
      # /app/data/bug-reports INNERHALB des Containers — und der Auto-Deploy baut bei jedem Push auf
      # main einen neuen Container. Jede auf dem Live-Server gemeldete Sache war damit beim naechsten
      # Deploy geloescht, ohne Spur und ohne Fehlermeldung.
      - oly-bug-reports:/app/data/bug-reports
      # Verkleinerte Portraits/Logos. Dieselbe Falle wie eine Zeile darueber, nur mit
      # Geschwindigkeit statt Datenverlust als Folge: ohne Volume lag der Thumbnail-Bestand IM
      # Container, und der Auto-Deploy warf ihn bei jedem Push auf main weg. Danach musste jede
      # Teamseite ihre Portraits neu dekodieren und verkleinern — gedrosselt auf vier gleichzeitig.
      # Der Inhalt ist reiner Cache (ableitbar aus den Quellbildern), das Volume darf also jederzeit
      # geloescht werden; es kostet dann nur einmalig die Neuberechnung.
      - oly-media-cache:/app/.cache/media-thumbs
      - /opt/oly-media:/app/media/dropbox:ro
    expose:
      - "3000"

  # Lord Enterich Cards — Shop-Analytics. Eigenstaendige App (apps/LEC), eigene
  # DB, eigener Login. Bewusst getrennt von der Oly, eigene Subdomain (siehe
  # Caddyfile + KONZEPT §4.2). Baut unabhaengig; ein LEC-Build-Fehler betrifft
  # den bereits laufenden oly-app-Container nicht.
  lec-app:
    build:
      context: ../../apps/LEC
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      LEC_SQLITE_PATH: /app/data/lec.sqlite
      # Zugangsschutz (Single-User). In Produktion ist der Login PFLICHT — ohne
      # Passwort/Secret sperrt sich die App (fail closed). Werte aus .env.
      LEC_AUTH_ENABLED: ${LEC_AUTH_ENABLED:-1}
      LEC_PASSWORD: ${LEC_PASSWORD:-}
      LEC_AUTH_SECRET: ${LEC_AUTH_SECRET:-}
    volumes:
      - lec-data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - oly-app
      - lec-app
    environment:
      OLY_DOMAIN: ${OLY_DOMAIN}
      LEC_DOMAIN: ${LEC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  oly-data:
  oly-bug-reports:
  oly-media-cache:
  lec-data:
  caddy-data:
  caddy-config:

