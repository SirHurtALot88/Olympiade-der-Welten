services:
  oly-app:
    build:
      context: ../..
      dockerfile: Dockerfile
      # Build-Stempel fuer die Sidebar-Version-Badge (siehe lib/app-version.ts).
      # Werte kommen aus der Shell-Umgebung, die auto-deploy.sh bzw.
      # scripts/deploy-hetzner-with-backup.sh vor `docker compose ... --build`
      # setzen. Ohne gesetzte Vars bleiben es leere Strings -> Dockerfile-ARG
      # Default greift, UI zeigt den "dev"-Fallback statt eines falschen Stempels.
      args:
        NEXT_PUBLIC_OLY_BUILD_SHA: ${NEXT_PUBLIC_OLY_BUILD_SHA:-}
        NEXT_PUBLIC_OLY_BUILD_DATE: ${NEXT_PUBLIC_OLY_BUILD_DATE:-}
        # Wertungsskalen (18.11., lib/resolve/wertungs-skalen.ts): der Browser rechnet PPS-Duell-Zeilen im
        # Ledger nach und braucht den Schalter deshalb schon beim BUILD (Next.js inlined NEXT_PUBLIC_*).
        # Ohne eigenen Wert gilt der Server-Schalter OLY_PP_SKALA / OLY_ERGEBNIS_SKALA aus deploy/hetzner/.env,
        # damit Server und Browser nie auseinanderlaufen. Leer = Standard (neue Skala), nichts aendert sich.
        NEXT_PUBLIC_OLY_PP_SKALA: ${NEXT_PUBLIC_OLY_PP_SKALA:-${OLY_PP_SKALA:-}}
        NEXT_PUBLIC_OLY_ERGEBNIS_SKALA: ${NEXT_PUBLIC_OLY_ERGEBNIS_SKALA:-${OLY_ERGEBNIS_SKALA:-}}
        # PP-Tagesanker (22.11., lib/resolve/pp-tagesanker.ts): derselbe Weg, ohne eigenen Wert gilt OLY_PP_TAGESANKER. Leer = an.
        NEXT_PUBLIC_OLY_PP_TAGESANKER: ${NEXT_PUBLIC_OLY_PP_TAGESANKER:-${OLY_PP_TAGESANKER:-}}
        # Climbing-Format (Canyon live, 18.11., lib/resolve/climbing-format.ts): derselbe Weg wie oben, ohne
        # eigenen Wert gilt der Server-Schalter OLY_CLIMBING_FORMAT. Leer = Canyon.
        NEXT_PUBLIC_OLY_CLIMBING_FORMAT: ${NEXT_PUBLIC_OLY_CLIMBING_FORMAT:-${OLY_CLIMBING_FORMAT:-}}
        # Battlefield-Format (Fuenf Punkte live, 22.11., lib/resolve/battlefield-format.ts): derselbe Weg, ohne
        # eigenen Wert gilt der Server-Schalter OLY_BATTLEFIELD_FORMAT. Leer = fuenf Punkte.
        NEXT_PUBLIC_OLY_BATTLEFIELD_FORMAT: ${NEXT_PUBLIC_OLY_BATTLEFIELD_FORMAT:-${OLY_BATTLEFIELD_FORMAT:-}}
        # Hockey-Torwart-Regel (22.11., lib/resolve/hockey-torwart.ts): derselbe Weg, ohne eigenen Wert gilt der
        # Server-Schalter OLY_HOCKEY_TORWART. Leer = neue Regel.
        NEXT_PUBLIC_OLY_HOCKEY_TORWART: ${NEXT_PUBLIC_OLY_HOCKEY_TORWART:-${OLY_HOCKEY_TORWART:-}}
        # Basketball-Puste (22.11., lib/resolve/basketball-puste.ts): derselbe Weg, ohne eigenen Wert gilt der
        # Server-Schalter OLY_BASKETBALL_PUSTE. Leer = neue Regel.
        NEXT_PUBLIC_OLY_BASKETBALL_PUSTE: ${NEXT_PUBLIC_OLY_BASKETBALL_PUSTE:-${OLY_BASKETBALL_PUSTE:-}}
        # Breaking-Format (22.11., lib/resolve/breaking-format.ts): derselbe Weg, ohne eigenen Wert gilt der
        # Server-Schalter OLY_BREAKING_FORMAT. Leer = Tag-Team.
        NEXT_PUBLIC_OLY_BREAKING_FORMAT: ${NEXT_PUBLIC_OLY_BREAKING_FORMAT:-${OLY_BREAKING_FORMAT:-}}
    restart: unless-stopped
    # E1 (docs/design/battle-arena-auto-run-anbindung-plan-16-10.md Abschnitt 4.1, Fund F11):
    # Chromium braucht beides, nicht nur eins von beiden.
    #
    # `init: true` haengt Dockers Mini-Init (tini) als PID 1 ein, STATT `npm run start`
    # direkt. Ohne das laeuft `npm` selbst als PID 1 (`scripts/start-hosted.sh`) -- und PID 1
    # ist der EINZIGE Prozess, der verwaiste Kindprozesse per `wait()` einsammelt. Stuerzt ein
    # Chromium-Kindprozess ab (Renderer-Crash, OOM), bleibt er ohne Init als Zombie stehen.
    # Node/npm raeumen das nicht von selbst auf.
    #
    # `shm_size: "256m"` ersetzt Dockers Standard-`/dev/shm` von NUR 64 MB. Chromium legt dort
    # seine Tab-/Renderer-Shared-Memory-Segmente ab und stuerzt bei zu wenig Platz bekanntlich
    # ab (das klassische "Chromium in Docker"-Problem). 256m ist reichlich bemessen fuer EINEN
    # Browser mit einer Seite (on demand, Plan 4.3/4.4) -- bewusst OHNE das zusaetzliche
    # Launch-Flag `--disable-dev-shm-usage` (das waere eine lib/-Aenderung in
    # `arena-headless-runner.ts`, nicht Teil dieses PRs; die Kombination beider waere die
    # vom Plan vorgeschlagene doppelte Absicherung, hier reicht die Compose-Seite als erster
    # Schritt).
    init: true
    shm_size: "256m"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Beide Spieler sitzen in Deutschland. `Europe/Berlin` (statt einer
      # festen +1/+2-Verschiebung) wechselt automatisch zwischen MEZ/MESZ, so
      # dass Server-Timestamps und Save-Namen in deutscher Ortszeit landen.
      TZ: Europe/Berlin
      OLY_APP_SQLITE_PATH: /app/data/persistence/oly-app.sqlite
      # Player/team images (macOS Dropbox paths) are served from a host folder
      # mounted read-only below. Upload the Dropbox subtree to /opt/oly-media on
      # the host, i.e. /opt/oly-media/Chris/Olympiade der Welten/...
      OLY_MEDIA_DROPBOX_ROOT: /app/media/dropbox
      # Phase-1-Login (optional, standardmaessig AUS). Siehe deploy/hetzner/.env.example.
      OLY_AUTH_ENABLED: ${OLY_AUTH_ENABLED:-}
      OLY_AUTH_SECRET: ${OLY_AUTH_SECRET:-}
      OLY_USER_CHRIS_PASSWORD: ${OLY_USER_CHRIS_PASSWORD:-}
      OLY_USER_FRANKY_PASSWORD: ${OLY_USER_FRANKY_PASSWORD:-}
      OLY_USER_RAMONA_PASSWORD: ${OLY_USER_RAMONA_PASSWORD:-}
      # Arena-Vorlauf (Latenz-Fix 18.10., PR #1290): ohne diese Durchreichung erreichte ein Wert in
      # deploy/hetzner/.env den Container NIE (Compose nimmt .env nur zur Interpolation dieser Datei)
      # -- der Notschalter waere nur per Code-Aenderung schaltbar gewesen. Standard jetzt "0" (seriell),
      # Nachtrag 25.10. zum Chromium-Produktions-Image (PR #1270/#160): der Server hat nur 3,8 GB RAM,
      # "available" lag beim Server-Check knapp unter der 2048-MB-Guard-Schwelle -- ein ganzer gesparter
      # Browser-Prozess (~770-790 MB laut CI-Messung) wiegt bei dieser Marge deutlich mehr als ein
      # Geschwindigkeitsgewinn durch Parallelbetrieb. Auf "1"/jeden anderen Wert setzen, um wieder
      # parallel zu fahren (z.B. nach einem RAM-Upgrade). Siehe deploy/hetzner/.env.example.
      OLY_ARENA_TIER_PARALLEL: ${OLY_ARENA_TIER_PARALLEL:-0}
      OLY_ARENA_TIER_PARALLEL_MIN_FREE_MB: ${OLY_ARENA_TIER_PARALLEL_MIN_FREE_MB:-}
      # Mini-DM-FFA-Rollback (Opus-Review, PR 5 des 6-PR-Opus-Plans 21.10., "Vorlauf-Verdrahtung"):
      # DIESELBE Falle wie bei OLY_ARENA_TIER_PARALLEL zwei Zeilen drueber -- ohne diese Durchreichung
      # erreicht ein Wert in deploy/hetzner/.env den Container NIE, der Code-Kommentar an
      # `istMiniDmFfaVorlaufAktiv()` (lib/battle/arena-vorlauf-service.ts) waere eine leere
      # Behauptung. Leer = Code-Standard (Mini-DM-FFA-Vorlauf AN). Siehe deploy/hetzner/.env.example.
      OLY_MINI_DM_FFA_VORLAUF: ${OLY_MINI_DM_FFA_VORLAUF:-}
      # E1, Plan Abschnitt 4.1/9.5: Platzhalter fuer einen expliziten Chromium-Pfad-Override
      # (Fund F7, Revision 1194 lokal vs. 1223 in CI/Prod). Leer = kein Override, der Runner
      # faellt automatisch auf die im Image installierte Revision zurueck (s. Dockerfile-
      # Kommentar bei `PLAYWRIGHT_BROWSERS_PATH`). `lib/battle/arena-headless-runner.ts` liest
      # diese Variable HEUTE NOCH NICHT -- das ist bewusst nicht Teil dieses PRs, s.
      # PR-Beschreibung.
      OLY_ARENA_CHROMIUM_EXECUTABLE: ${OLY_ARENA_CHROMIUM_EXECUTABLE:-}
      # Wertungsskalen-Schalter (18.11., PP-Skala C2 / Ergebnisskala E1): DIESELBE Falle wie bei
      # OLY_ARENA_TIER_PARALLEL oben -- ohne diese Durchreichung erreicht ein Wert in deploy/hetzner/.env den
      # Container NIE, der Rueckweg aus docs/design/pp-skala-18-11.md Abschnitt 8.4 waere wirkungslos.
      # Leer = Code-Standard (neue Skala an). Siehe deploy/hetzner/.env.example.
      OLY_PP_SKALA: ${OLY_PP_SKALA:-}
      OLY_ERGEBNIS_SKALA: ${OLY_ERGEBNIS_SKALA:-}
      # PP-Tagesanker (22.11., docs/design/pp-tagesanker-live-22-11.md): leer = neue Saisons bekommen ihn im Stempel;
      # "aus" = Rueckweg (neue Saisons), "aus-sofort" = Notbremse. Wie oben: nach einer Aenderung neu BAUEN.
      OLY_PP_TAGESANKER: ${OLY_PP_TAGESANKER:-}
      # Climbing-Format (Canyon live, 18.11., docs/design/climbing-canyon-live-18-11.md): leer = Canyon,
      # "standard" = Abschalt-Schalter (ab dem naechsten gewerteten Spieltag wieder das alte Format; gebuchte
      # Spieltage bleiben, wie sie gebucht sind). Siehe deploy/hetzner/.env.example.
      OLY_CLIMBING_FORMAT: ${OLY_CLIMBING_FORMAT:-}
      # Battlefield-Format (Fuenf Punkte live, 22.11., docs/design/battlefield-5punkte-22-11.md): leer = fuenf
      # Punkte mit Respawn, "alt" = Abschalt-Schalter (ab dem naechsten gewerteten Spieltag wieder das Gefecht je
      # Ort; gebuchte Spieltage bleiben). Siehe deploy/hetzner/.env.example.
      OLY_BATTLEFIELD_FORMAT: ${OLY_BATTLEFIELD_FORMAT:-}
      # Hockey-Torwart-Regel (22.11., docs/design/hockey-torwart-22-11.md): leer = neue Regel (Guete aus Eignung,
      # Puste unter Dauerfeuer, Gegentore halb als erwartete), "alt" = Abschalt-Schalter (ab dem naechsten
      # gewerteten Spieltag wieder die alte Regel; gebuchte Spieltage bleiben). Siehe deploy/hetzner/.env.example.
      OLY_HOCKEY_TORWART: ${OLY_HOCKEY_TORWART:-}
      # Basketball-Puste (22.11., docs/design/basketball-puste-22-11.md): leer = neue Regel (Puste-Vorrat aus AUSDAUER,
      # Beteiligungsboden in der Pass-Lotterie), "alt" = Abschalt-Schalter (ab dem naechsten gewerteten Spieltag wieder die
      # alte Regel; gebuchte Spieltage bleiben). Siehe deploy/hetzner/.env.example.
      OLY_BASKETBALL_PUSTE: ${OLY_BASKETBALL_PUSTE:-}
      OLY_QUOTE_UEBER_PFLICHTKADER: ${OLY_QUOTE_UEBER_PFLICHTKADER:-}
      OLY_BOARD_ERWARTUNG_ANKER: ${OLY_BOARD_ERWARTUNG_ANKER:-}
      OLY_KI_KERNSCHUTZ: ${OLY_KI_KERNSCHUTZ:-}
      # Startbudget-Staffel (22.11., docs/design/startbudget-staffel-22-11.md): leer = neue Spiele bekommen den Aufschlag auf die Startkasse, "aus" = Rueckweg (neue Spiele ohne). Nur Server; die Regel steht im Spielstand (seasonState.startbudgetStaffel).
      OLY_STARTBUDGET_STAFFEL: ${OLY_STARTBUDGET_STAFFEL:-}
      # Formkarten Plus/Minus (22.11., docs/design/formkarten-plusminus-22-11.md): leer = Standard (neue Saisons bekommen die Regel
      # plusminus), "aus" = Rueckweg (neue Saisons alt), "aus-sofort" = Notbremse (Gegenfarbe und Duellgewicht aus, auch mitten in
      # der Saison). Nur Server: der Browser loest die Regel nie selbst auf, sie steht im Spielstand. Siehe deploy/hetzner/.env.example.
      OLY_FORMKARTEN_PLUSMINUS: ${OLY_FORMKARTEN_PLUSMINUS:-}
      # Marketing (22.11., docs/design/marketing-bau-22-11.md): leer = Standard (neue Saisons bekommen Werbegeld, Team-Anteil, Teammarke und
      # Moral-Zuschlag), "aus" = Rueckweg (neue Saisons ohne), "aus-sofort" = Notbremse (keine Buchung, kein Zuschlag, auch mitten in der
      # Saison). Nur Server (kein NEXT_PUBLIC): die Regel steht im Spielstand (seasonState.marketingRegel). Siehe deploy/hetzner/.env.example.
      OLY_MARKETING: ${OLY_MARKETING:-}
      # Breaking-Format (22.11., docs/design/breaking-tagteam-22-11.md): leer = Tag-Team (6 gegen 6, je Team einer im Ring,
      # Gang mit zwei Phasen, verdeckter Wechsel, Waffe frei waehlbar), "alt" = Abschalt-Schalter (ab dem naechsten gewerteten
      # Spieltag wieder der Gauntlet; gebuchte Spieltage bleiben). Siehe deploy/hetzner/.env.example.
      OLY_BREAKING_FORMAT: ${OLY_BREAKING_FORMAT:-}
      # Ausruestung (22.11., docs/design/ausruestung-phase1a-22-11.md): leer = Besitz (Lager, Truhen, Ruhm; Phase 1a beruehrt die Wertung
      # nicht), "aus" = ab dem naechsten gewerteten Spieltag aus (der Besitz bleibt im Spielstand liegen), "aus-sofort" = Notbremse.
      # Nur Server (kein NEXT_PUBLIC): die Regel steht im Spielstand, seasonState.ausruestungRegel. Siehe deploy/hetzner/.env.example.
      OLY_AUSRUESTUNG: ${OLY_AUSRUESTUNG:-}
      # Liga-Draft (Draft-Seite, #1619/#1623, docs/design/draft-neubau-kern-18-11.md): DIESELBE Falle wie oben -- ohne diese
      # Durchreichung erreicht ein Wert aus deploy/hetzner/.env den Container NIE (gefunden in der Abnahme 19.11.,
      # docs/design/abnahme-saison-19-11.md). Leer = Code-Standard (seit 19.11.: neuer Draft mit Draft-Seite); "block" = Rueckweg
      # auf den alten Hintergrund-Draft. Wirkt nur beim Anlegen einer neuen Liga.
      OLY_LIGA_DRAFT_MODUS: ${OLY_LIGA_DRAFT_MODUS:-}
    volumes:
      - oly-data:/app/data/persistence
      # Bug-Meldungen MUESSEN ein eigenes Volume haben. Ohne dieses Mount schreibt die Flagge nach
      # /app/data/bug-reports INNERHALB des Containers — und der Auto-Deploy baut bei jedem Push auf
      # main einen neuen Container. Jede auf dem Live-Server gemeldete Sache war damit beim naechsten
      # Deploy geloescht, ohne Spur und ohne Fehlermeldung.
      - oly-bug-reports:/app/data/bug-reports
      # Verkleinerte Portraits/Logos. Dieselbe Falle wie eine Zeile darueber, nur mit
      # Geschwindigkeit statt Datenverlust als Folge: ohne Volume lag der Thumbnail-Bestand IM
      # Container, und der Auto-Deploy warf ihn bei jedem Push auf main weg. Danach musste jede
      # Teamseite ihre Portraits neu dekodieren und verkleinern — gedrosselt auf vier gleichzeitig.
      # Der Inhalt ist reiner Cache (ableitbar aus den Quellbildern), das Volume darf also jederzeit
      # geloescht werden; es kostet dann nur einmalig die Neuberechnung.
      - oly-media-cache:/app/.cache/media-thumbs
      - /opt/oly-media:/app/media/dropbox:ro
    expose:
      - "3000"

  # Lord Enterich Cards — Shop-Analytics. Eigenstaendige App (apps/LEC), eigene
  # DB, eigener Login. Bewusst getrennt von der Oly, eigene Subdomain (siehe
  # Caddyfile + KONZEPT §4.2).
  #
  # BAUT UNABHAENGIG — aber das stimmt erst seit 16.11. wirklich. Vorher rief
  # auto-deploy.sh ein einziges "docker compose up -d --build" fuer BEIDE Dienste auf: schlug
  # lec-apps Build fehl, brach der GESAMTE Befehl ab, bevor ueberhaupt ein Container ersetzt
  # wurde -- auch oly-app blieb dann unbemerkt auf dem alten Image stehen (konkret zwei Tage
  # lang, 14.11. bis 16.11., wegen eines abgelaufenen APT-GPG-Schluesselbunds im gecachten
  # LEC-Basis-Image). "Baut unabhaengig" galt also nur fuer den schon LAUFENDEN Container, nicht
  # fuers Neubauen. auto-deploy.sh baut und startet oly-app und lec-app seitdem in getrennten
  # Befehlen (s. dort) -- ein Fehler im einen haelt den anderen nicht mehr auf, und keiner baut
  # neu, wenn nur der jeweils andere sich geaendert hat.
  lec-app:
    build:
      context: ../../apps/LEC
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      LEC_SQLITE_PATH: /app/data/lec.sqlite
      # Zugangsschutz (Single-User). In Produktion ist der Login PFLICHT — ohne
      # Passwort/Secret sperrt sich die App (fail closed). Werte aus .env.
      LEC_AUTH_ENABLED: ${LEC_AUTH_ENABLED:-1}
      LEC_PASSWORD: ${LEC_PASSWORD:-}
      LEC_AUTH_SECRET: ${LEC_AUTH_SECRET:-}
      # Billbee-API (optional): ohne die drei Werte bleibt der Abruf aus. Werte aus .env.
      BILLBEE_API_KEY: ${BILLBEE_API_KEY:-}
      BILLBEE_USER: ${BILLBEE_USER:-}
      BILLBEE_PASSWORD: ${BILLBEE_PASSWORD:-}
    volumes:
      - lec-data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - oly-app
      - lec-app
    environment:
      OLY_DOMAIN: ${OLY_DOMAIN}
      LEC_DOMAIN: ${LEC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  oly-data:
  oly-bug-reports:
  oly-media-cache:
  lec-data:
  caddy-data:
  caddy-config:

