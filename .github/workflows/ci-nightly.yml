name: CI Nightly

on:
  # Nightly-Schedule deaktiviert (Owner-Wunsch): der tägliche Full-Season-Durchlauf erzeugte rotes CI bei
  # Spiel-/Balancing-Themen (z. B. incomplete_lineups an einem Spieltag) ohne praktischen Nutzen. Der Job
  # bleibt erhalten und kann bei Bedarf jederzeit manuell über „Run workflow" (workflow_dispatch) gestartet
  # werden — er läuft nur nicht mehr automatisch um Mitternacht.
  workflow_dispatch:
  # PUSH NACH MAIN HINZUGEFÜGT (04.09., Merge-Hygiene-Runde) — NUR für `rangtreue-schranke` unten,
  # nicht für `full-season-playthrough`: der bleibt über das `if:` am Job selbst weiterhin
  # ausschließlich manuell (Grund s. Kommentar oben, gilt unverändert). `rangtreue-schranke` ist
  # der einzige Job im gesamten CI, der die 0,80-Rangtreue-Schranke gegen
  # `data/generated/rangtreue-basislinie.json` prüft (docs/design/messgrundlage-kaderfest.md), und
  # er lief seit seiner Einführung noch KEIN einziges Mal automatisch — nur auf Zuruf per
  # `workflow_dispatch`. Er ist deterministisch (bit-identische Reproduktion nachgewiesen, s.
  # `docs/design/naechste-schritte-fable-04-09.md` Abschnitt 2.7 Punkt 2) und kostet gemessen
  # ~11 Minuten (`scripts/baue-rangtreue-basislinie.mjs`) — das lief bislang als Grund, ihn aus dem
  # PFLICHT-Check `ci.yml` herauszuhalten (s. Kommentar am Job unten), ist aber kein Grund, ihn
  # NIRGENDS automatisch zu fahren: 11 Minuten LAUFEN PARALLEL zu den Jobs in `ci.yml` (eigener
  # Workflow, eigener Runner) und verlängern die Wartezeit auf einen grünen Merge nicht spürbar.
  push:
    branches: [main]

jobs:
  full-season-playthrough:
    # NUR MANUELL, unveraendert seit der Nightly-Abschaltung oben — der neue `push`-Trigger gilt
    # workflowweit, soll aber ausschliesslich `rangtreue-schranke` automatisch anstossen.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set CI SQLite path
        run: echo "OLY_APP_SQLITE_PATH=${RUNNER_TEMP}/ci-oly-nightly.sqlite" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Start dev server
        run: |
          npm run dev &
          echo $! > .dev-server.pid
      - run: npm run app:check-live -- --startup-retries 90 --startup-delay-ms 2000
      - run: npm run season:full-ui-playthrough -- --skip-ui --no-start
      - name: Stop dev server
        if: always()
        run: kill "$(cat .dev-server.pid)" 2>/dev/null || true

  # DIE RHO-SCHRANKE (docs/design/messgrundlage-kaderfest.md, Ausloeser
  # docs/design/projekt-ueberwachung-opus.md Abschnitt 3.1 B): 1008 Testdateien und keine
  # einzige, die die Abnahmezahl des Projekts prueft (rho zwischen Eignung und Spielergebnis,
  # s. CLAUDE.md). Drei ehrliche Hockey-Berichte ergaben zusammen eine unehrliche Bilanz
  # (0,670 -> 0,612 -> 0,617 -> 0,647), weil jeder sich nur gegen den letzten Zwischenstand
  # verglich, nie gegen den Tagesanfang. Dieser Job ist die fehlende Instanz.
  #
  # BRAUCHT WEDER DEV-SERVER NOCH SQLITE: `disziplinProbe` laeuft gegen die statische
  # public/mockups/battle-mode.html per file://, komplett unabhaengig vom App-Server — nur
  # Chromium fuer Playwright, genau wie im Job oben.
  #
  # EIGENER JOB statt Schritt im PFLICHT-Check `ci.yml`: alle zwanzig Disziplinen mit je
  # fuenf Kader-Varianten (n=24) kosten rund 11 Minuten (nachgemessen,
  # scripts/baue-rangtreue-basislinie.mjs) — zu teuer, um jeden Pull Request zu blockieren,
  # aber billig genug fuer diesen Job, der parallel zu `ci.yml` laeuft, ohne dessen Laufzeit zu
  # verlaengern.
  #
  # SEIT 04.09. AUCH AUF `push` NACH `main` (s. `on:`-Block oben), nicht mehr nur manuell. Vorher
  # war dieser Job — die EINZIGE Pruefung im ganzen CI gegen die 0,80-Rangtreue-Schranke — nur per
  # `workflow_dispatch` erreichbar und lief seit seiner Einfuehrung nie automatisch; jeder Merge
  # nach `main` konnte die Schranke unbemerkt reissen. `full-season-playthrough` bleibt ueber sein
  # eigenes `if:` unveraendert NUR manuell (der Grund von vorher gilt weiter: der volle
  # Saisondurchlauf macht Nightly unzuverlaessig, nicht dieser Job hier).
  rangtreue-schranke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run ci:rangtreue-schranke
