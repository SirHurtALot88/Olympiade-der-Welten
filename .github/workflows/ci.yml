name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Manuell startbar: wenn ein Lauf ohne eigenes Zutun stirbt (kein Runner
  # zugeteilt, Kontingent leer, Abbruch von außen), gab es bisher keinen Weg,
  # die Checks eines Branches neu anzufordern — ein Re-run hängt am alten
  # Commit, und ein Leer-Commit nur zum Auslösen verschmutzt die Historie.
  workflow_dispatch:

concurrency:
  # Der Event-Typ gehört in den Gruppennamen, sonst teilt sich ein manuell
  # angeforderter Lauf die Gruppe mit dem automatischen desselben Refs. Genau
  # daran ist der Branch hier hängengeblieben: Ein Re-run (Run 31119230237) blieb
  # dauerhaft in "queued" stehen, ließ sich weder abbrechen ("Cannot cancel a
  # workflow re-run that has not yet queued") noch löschen — und blockierte damit
  # jeden weiteren Lauf DIESES Pull Requests, während andere Branches normal
  # Runner bekamen. Mit dem Event im Namen kommt man an so einem Zombie vorbei,
  # ohne auf GitHub-Support angewiesen zu sein.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Auf main NICHT abbrechen. Ein abgebrochener Lauf schließt mit conclusion
  # "failure" ab — main sah dadurch rot aus, obwohl kein einziger Test
  # fehlgeschlagen war (Lauf 31124228216: 15 Minuten, kein Runner, kein
  # ausgeführter Step, trotzdem rot). Für Pull Requests bleibt das Abbrechen
  # richtig: dort macht ein neuer Push den vorherigen Lauf gegenstandslos.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set CI SQLite path
        run: echo "OLY_APP_SQLITE_PATH=${RUNNER_TEMP}/ci-oly.sqlite" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      # DER EINZIGE SCHRITT HIER OHNE ZEITGRENZE — UND GENAU DER HAT SICH AUFGEHAENGT.
      #
      # `--with-deps` faehrt `apt-get update` auf dem Runner. Am 19.08. abends stand das in SECHS
      # von sieben Laeufen still: der Azure-Mirror antwortete nicht (`Ign: azure.archive.ubuntu.com`
      # ueber alle Zeilen), apt fiel auf `archive.ubuntu.com` zurueck, holte noch vier InRelease-
      # Dateien — und danach kam nichts mehr. Letzte Logzeile jeweils
      # `Get:5 .../noble-security InRelease`, dann 25 Minuten Stille, bis `timeout-minutes: 30` den
      # Job abraeumte; im Aufraeumen steht der Beweis: `Terminate orphan process: npm exec playwright
      # install chromium --with-deps`.
      #
      # WAS DAS ANRICHTET: ein abgeraeumter Pflicht-Check schliesst mit `cancelled` ab und wird nie
      # gruen. Damit hing JEDER offene Pull Request gleichzeitig fest (#573, #575, #576, #581, #582,
      # #583) — bei allen sechs war `full-test-suite` gruen und nur dieser Schritt tot. Im selben
      # Zeitfenster lief #580 in 25 Minuten normal durch, es ist also keine zu knappe Zeitgrenze und
      # kein zu langsamer Test, sondern ein Netzhaenger ohne Deckel.
      #
      # DER DECKEL: nach 6 Minuten abbrechen und die Browser OHNE Systempakete nachholen. Die
      # Zeitgrenze bleibt bei 30 Minuten — sie hat richtig gehandelt, sie kam nur als Letzte.
      # Fehlt danach wirklich eine Systembibliothek, faellt der erste Browser-Smoke mit einer
      # echten Meldung um, statt den Job stumm auszusitzen: ein lauter Fehler ist besser als ein
      # leiser Abbruch, der aussieht wie ein Testfehler.
      - name: Install Chromium for Playwright
        run: timeout 360 npx playwright install chromium --with-deps || npx playwright install chromium
      - run: npm run ci:import-exists
      - run: npm run ci:flow-smoke
      # DIE QUELLTEXT-WAECHTER, und sie stehen hier aus einem gemessenen Grund.
      #
      # `full-test-suite` unten ist KEIN Pflicht-Check. Am 20.08. sind dadurch zwei rote Wächter
      # durchgerutscht: zwei Apron-Zusicherungen (#589) und ein CSS-Ratchet (#595). Beide Tests
      # existierten, sie liefen nur nicht im Tor. Beide lesen den QUELLTEXT (Klassennamen, Ratchets,
      # Vertragstexte), brauchen weder Datenbank noch Browser und kosten zusammen 69 Sekunden fuer
      # 120 Dateien und 1830 Tests — das passt hier hinein, waehrend die volle Suite mit ihren
      # ~20 Minuten weiter im eigenen Job laeuft.
      #
      # Die Auswahl wird ERRECHNET, nicht aufgezaehlt (siehe scripts/fahre-quelltext-waechter.ts):
      # eine feste Liste veraltet ab dem ersten neuen Waechter, und genau so eine nicht mitwachsende
      # Auswahl ist die Ursache, die hier behoben wird.
      - run: npm run ci:quelltext-waechter
      # DIE TESTS, DIE WIRKLICH RENDERN — 21 Dateien, 196 Tests, 15 Sekunden.
      #
      # Hier stand bis eben, der Absturz aus #586 (die Kaufphasen-Warnung warf beim Rendern der
      # Arena) sei nur ueber `full-test-suite` als Pflicht-Check zu fangen. Das war zu pauschal:
      # die RENDERNDEN Tests sind eine eigene, winzige Teilmenge, die weder Browser noch Build noch
      # Datenbank braucht. Sie passt hier hinein wie die Quelltext-Waechter daneben — und sie kann
      # etwas, was jene prinzipbedingt nie koennen: sehen, dass eine Komponente beim AUSFUEHREN
      # wirft, nicht nur, dass eine Zeichenkette in ihrer Datei steht.
      #
      # EHRLICH GEMESSEN, damit die Zeile nicht mehr verspricht, als sie haelt: #586 selbst haette
      # auch dieser Schritt nicht gefangen. Kein Test rendert die Arena — `DisciplineStageArena.tsx`
      # kommt in zehn Testdateien vor, alle lesen ihren Quelltext oder pruefen die Logik daneben.
      # Der Schritt ist das Geruest, in das so ein Test gehoert, nicht der Beweis, dass es ihn gibt.
      - run: npm run ci:render-waechter
      - run: npm run perf:regression-smoke
      # Serve the browser smokes from the PRODUCTION server (npm run start =
      # NODE_ENV=production, using the build from the step above). The dev server
      # (npm run dev) compiles every route on-demand on first hit, which on the CI
      # runner takes 1.5-3 min per view — the player-profile dynamic() chunk cold-
      # compiled past the 90s waitFor and made app:smoke-gameplay flaky/red. Prod
      # serves the prebuilt bundle instantly.
      - name: Start production server for browser smokes
        run: |
          npm run start &
          echo $! > .dev-server.pid
      - run: npm run app:check-live -- --startup-retries 90 --startup-delay-ms 2000
      - run: npm run ci:ensure-gameplay-smoke-save
      - run: npm run perf:resolve-preview
      - run: npm run app:smoke-gameplay
      # Coop-Smoke (Ebene 3 aus docs/design/coop-absicherung.md). Bis hierher lief KEIN einziger
      # Coop-Pfad in CI: der 2-Browser-E2E darunter ist auskommentiert, und dieser Smoke existierte
      # zwar, war aber nirgends verdrahtet. Jede Coop-Regression waere also nur im Spiel
      # aufgefallen.
      #
      # Er haengt bewusst HINTER app:smoke-gameplay: derselbe Produktionsserver laeuft schon, und
      # ist der Solo-Pfad kaputt, sagt ein roter Coop-Smoke nichts Eigenes. Er ist UI-selektorfrei
      # gebaut und prueft die zwei Kern-Garantien — eine Aenderung erreicht den Mitspieler, und die
      # Besitz-Isolation haelt.
      #
      # `--no-start`, weil der Produktionsserver oben schon laeuft — ohne das startet der Smoke
      # einen zweiten (dev-)Server auf demselben Port.
      - run: npm run app:smoke-coop-sync -- --no-start
      # ZWEI-BROWSER-E2E (Stufe 4.1, docs/MULTIPLAYER_VOLLAUSBAU_PLAN.md) — seit 11.07.2026 draussen,
      # jetzt zurueck im Tor. Er ist die EINZIGE Pruefung hier, die zwei echte Playwright-Browser
      # (Chris + Franky) gegen denselben Room-Socket fuehrt und dabei den kompletten Reveal-Pfad im
      # DOM anfasst — `app:smoke-coop-sync` daneben bleibt bewusst UI-selektorfrei und sieht diesen
      # Pfad nicht.
      #
      # WARUM ER SO LANGE DRAUSSEN WAR: er deckte einen echten Produktfehler auf (Befund B3) — nach
      # dem Weiterschalten des Hosts im Discipline-Stage-Arena-Reveal blieb der Ticker des Gasts
      # dauerhaft leer. Ursache (gefunden, Commit 7ea0efa1): beide Aufrufstellen sendeten die
      # Etappen-Zaehlgrenze hart als `{ d1: 0, d2: 0 }` statt der echten Etappenzahl —
      # `revealedSlotCount < maxSlotRevealCount` war damit fuer den Gast nie wahr, sein
      # `slotRevealIndex` blieb für immer 0. Kein Test fing das, weil auch die Smoke-Skripte selbst
      # nur erfundene Platzhalterwerte sendeten statt der echten, im Client berechneten
      # (`computeStageSlotCount`) — siehe `ensureFullLeagueLineupReadiness` in
      # scripts/smoke-multiplayer-e2e.ts fuer den Fix: der Host-Client startet die Arena inzwischen
      # SELBST (ueber echte Aufstellungen aller 32 Liga-Teams, per Sammelroute erzeugt), sodass auch
      # der `maxSlotRevealCountByDiscipline`-Wert im Sync-Pfad echt ist, nicht geraten.
      #
      # STAND 16.08.2026 — JETZT AKTIV. Der alte Blocker (B3) war schon behoben. Der neuere
      # ("ai-preview lieferte keine entries fuer D-P … incomplete_roster") lag NICHT dort, wo die
      # erste Einschaetzung vermutete: nicht nur die acht menschlichen Teams (Chris/Franky) fehlte
      # ein Kader, sondern der GESAMTEN 32-Team-Liga — nachgemessen an einer frischen Kopie des
      # isolierten E2E-Saves: 30/32 Teams mit exakt 0 Rosterspielern. Grund: der isolierte Save
      # kommt aus `bootstrapSingleplayerSave()` (lib/persistence/persistence-service.ts) — anders
      # als der "Neues Spiel"-Assistent (app/api/new-game/route.ts:88, `kickoffLeagueSetupDraft`)
      # laesst dieser Bootstrap-Pfad die Liga unbespielt, unabhaengig von Solo/Koop oder
      # Mensch/KI-Steuerung.
      #
      # Fix: `ensureLeagueRostersPlayable` in scripts/smoke-multiplayer-e2e.ts besorgt VOR den
      # Aufstellungen (`ensureFullLeagueLineupReadiness`) einen echten Kader fuer alle 32 Teams —
      # der Host (Chris) draftet KI-Teams + seine eigenen 4 ueber `/api/ai/picks-run` (host-level,
      # scope-begrenzt durch `resolveAiBulkTeamWriteScope`), Franky kauft seine 4 Teams manuell
      # ueber `/api/transfermarkt/buy` (kein KI-Weg fuer ein fremdes Menschen-Team erreichbar —
      # Sicherheitsregel, kein Bug). Exakt das Muster aus `scripts/audit-koop-spielbarkeit.ts`
      # ("A2c"/"A2d"), keine neue Mechanik erfunden. Ausserdem oeffnet die jetzt echte Saison-1-
      # Situation zum ersten Mal das Season-Briefing-Modal ueber der Arena-Buehne
      # (`shouldAutoOpenSeasonBriefing`) — `openFoundationArenaPage` schliesst es jetzt ("Später"),
      # bevor es den `arena-prematch-start-cta`-Klick blockiert.
      #
      # Fuenfmal gruen verifiziert: dreimal vom bauenden Agenten, zweimal unabhaengig nachgemessen
      # (~3:50 min pro Lauf, davon ~3 min fuer den Kader-Schritt).
      #
      # WICHTIGE EINSCHRAENKUNG, selbst gemessen — und sie ist eine FOLGE UNSERER EIGENEN STUFE 0.1:
      # der erste unabhaengige Lauf fiel mit `room_state_timeout:ready-chris:formcards` um. Ursache
      # waren 11 Raeume, die aus frueheren Laeufen in der `rooms`-Tabelle lagen. Vor der
      # Raum-Persistenz raeumte ein Serverneustart die weg; seit sie in der Datenbank stehen,
      # sammeln sie sich ueber Laeufe hinweg an — der Test schliesst seinen Raum nicht. Nach dem
      # Leeren der Tabelle lief derselbe Test zweimal hintereinander sauber durch.
      #
      # Fuer DIESES Tor ohne Wirkung: der CI-Job setzt `OLY_APP_SQLITE_PATH` auf eine frische
      # Datei je Lauf (siehe „Set CI SQLite path" oben), es kann sich also nichts ansammeln. Wer
      # den Test aber LOKAL mehrfach fahren will, muss die `rooms`-Tabelle zwischendurch leeren —
      # oder besser: der Test sollte seinen Raum am Ende ueber `closeRoom` (Stufe 0.4) schliessen.
      # Das waere die saubere Loesung und ist noch nicht gebaut.
      - run: npm run app:smoke-multiplayer-e2e -- --no-start
      - name: Stop dev server
        if: always()
        run: kill "$(cat .dev-server.pid)" 2>/dev/null || true

  # DIE VOLLE TESTSUITE — seit diesem Commit im Tor.
  #
  # WARUM ES SIE VORHER NICHT GAB, und warum das der eigentliche Befund ist: die CI fuhr
  # ausschliesslich `ci:flow-smoke` (18 Dateien, 205 Tests). Die volle Suite — 869 Dateien,
  # ueber 6.800 Tests — lief NIE im Tor. Genau deshalb konnte sie unbemerkt auf 66 rote Tests in
  # 33 Dateien laufen: eine rote Suite, die niemanden alarmiert, warnt auch dann nicht, wenn ein
  # echter Fehler dazukommt. Man gewoehnt sich an die Farbe.
  #
  # WARUM EIN EIGENER JOB statt eines weiteren Schritts in `test-and-smoke`: der Lauf braucht
  # rund 20 Minuten, jener Job hat 30 und baut, installiert Chromium und faehrt drei Browser-
  # Smokes. Zusammengelegt waere beides an der Zeitgrenze gestorben, und ein Timeout haette wie
  # ein Testfehler ausgesehen. Getrennt laufen sie parallel, und wer rot ist, ist auch der, der
  # kaputt ist.
  #
  # KEIN `npm run build`, KEIN Chromium: die Suite ist reines Node — sie braucht nur die
  # Importdaten (deshalb `ci:import-exists`) und einen eigenen SQLite-Pfad.
  full-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set CI SQLite path
        run: echo "OLY_APP_SQLITE_PATH=${RUNNER_TEMP}/ci-oly-full-suite.sqlite" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run ci:import-exists
      - run: npm test

  # DIE PERSISTENZ-SUITEN ALS EIGENER, ANHAKBARER CHECK — Chris' Antwort 4b.
  #
  # DER ZWECK: `full-test-suite` daneben ist kein Pflicht-Check, und die Einstellung dafuer liegt
  # im Branch-Schutz, an den ein Agent nicht herankommt. Dieser Job ist die Teilmenge, deren Fehler
  # den SPIELSTAND kosten — und er ist klein genug, dass ihn niemand aus Zeitgruenden ablehnen muss.
  #
  # ZWEI ZAHLEN VON MIR WAREN FALSCH, und sie stehen hier, damit sie niemand nochmal aufwaermt:
  #
  #   „~5 Minuten"  (Vorschlag 4b)      -> gemessen 174 Dateien, 1346 Tests, 11m20s
  #   „~16 statt ~4 Minuten je PR"      -> beide Jobs starten gleichzeitig und laufen PARALLEL
  #
  # Zur zweiten: `test-and-smoke` ist der laengste Job und war es immer (#607 24:49, #610 25:27).
  # `full-test-suite` blieb in jedem gemessenen Lauf darunter (22:20 / 20:59). Ein zusaetzlicher
  # Pflicht-Check unter dieser Marke verlaengert die Wartezeit auf einen Merge um NULL.
  #
  # WAS ER NICHT ABDECKT: die Render-Klasse aus #586. Dafuer laeuft `ci:render-waechter` oben im
  # bestehenden Pflicht-Job mit — 15 Sekunden, kein Haekchen noetig.
  #
  # ZUM ANHAKEN: Settings -> Branches -> Regel fuer `main` -> Require status checks to pass ->
  # `persistenz-suiten` dazu. Ohne diesen Klick laeuft der Job zwar, haelt aber nichts auf.
  persistenz-suiten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set CI SQLite path
        run: echo "OLY_APP_SQLITE_PATH=${RUNNER_TEMP}/ci-oly-persistenz.sqlite" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run ci:import-exists
      - run: npm run ci:persistenz-suiten
