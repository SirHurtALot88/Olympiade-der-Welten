<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saisonstand – modern (Mockup 17.11.)</title>
<!--
  SAISONSTAND IM BROADCAST-STIL (Fable, 17.11.). Drittes Mockup zum Plan docs/design/oly-seiten-modern-17-11.md,
  Entwurfstext: docs/design/saisonstand-modern-17-11.md.
  Gleiche Tokens, gleiche Schiene, gleicher Hero-Kopf, gleiche Tafel wie einsatzliste-modern-17-11.html und oly-start-modern-17-11.html.
  ECHT (Live-Abbild 17.11., Save vom 31.10.): 32 Teams, Wappen, Liga-Zuordnung, Startplaetze, Spielplan (320 Paarungen),
        Disziplin-Plan (20 Spieltage x 2), Kader, Spielernamen, Portraits, Klassen, Disziplinwerte, Marktwert, Gehalt, Cash.
        Sponsoren und GuV aus dem Bild fable-uiux-screenshots-14-11/04 (derselbe Save).
  ERFUNDEN: jedes Ergebnis (der Save steht vor Spieltag 1). Simulation: Kaderstaerke je Disziplin + Rauschen. Daraus Punkte, Bilanz,
        Verhaeltnis, Form, Verlauf, Matchwinner, Rekorde. Eigene Mannschaft = Vigilante Wranglers wie in den beiden anderen Mockups
        (im echten Save ist es Nunchuck Ninjas: ?wir=N-N). "Franky" und "Rivale" sind Beispielmarken.
  Keine externen Skripte, Schriften lokal.
  URL: ?szene=tabelle|teamkarte|liga1|gesamt|verein|matrix|kader|verlauf|punkte|spieltage|ansetzungen|bestenliste|start|ende
       &liga=1|2|0  &st=0..20  &team=X-X  &wir=X-X  &still=1  &phone=1  &blatt=kontext
-->
<style>
@font-face{font-family:"RaniraSeason";src:url("../fonts/ranira-bold-italic.otf") format("opentype");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url("einsatzliste-modern-17-11/barlow-condensed-latin-500-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url("einsatzliste-modern-17-11/barlow-condensed-latin-600-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url("einsatzliste-modern-17-11/barlow-condensed-latin-700-normal.woff2") format("woff2");font-display:swap}
:root{
  --grund:#06080c; --flaeche:rgba(9,12,18,.90); --flaeche-1:#0c1017; --flaeche-2:#121824; --flaeche-3:#1a2231;
  --linie:rgba(244,230,196,.13); --linie-2:rgba(244,230,196,.30);
  --creme:#f4e6c4; --gold:#f0c35a; --tinte:#eef2f8; --leise:#9aa7ba; --stumm:#66738a;
  --heim:#F2A03D; --gast:#45B0C9; --gut:#62d394; --warn:#ff6058; --acht:#f3b54a;
  --p1:#e0637a; --p2:#e89a4c; --p3:#c3cf5e; --p4:#4fc7b2; --p5:#62a0f4; --p6:#ac8af2;
  --haus:"RaniraSeason",Georgia,"Times New Roman",serif;
  --zahl:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --r:10px; --r-s:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020305;color:var(--tinte);font-family:var(--zahl);font-size:16px;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.t{font-variant-numeric:tabular-nums}
.gk{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
img{display:block}
.plus{color:var(--gut)} .minus{color:var(--warn)} .null{color:var(--stumm)}

/* ---------- Mockup-Steuerung (gehoert NICHT zum UI) ---------- */
.demo{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#0d1016;border-bottom:1px solid #222a38;font-size:14px;color:var(--leise);white-space:nowrap;overflow-x:auto}
.demo b{color:var(--creme);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;margin-right:4px}
.demo button{padding:3px 10px;border:1px solid #2b3445;border-radius:999px;color:var(--tinte);font-weight:600}
.demo button:hover{border-color:var(--gold)} .demo button[aria-pressed=true]{background:var(--gold);color:#17120a;border-color:var(--gold)}
.demo a{color:var(--gold);margin-left:auto;font-weight:600}
.demo kbd,.kbd{font:inherit;font-size:12px;border:1px solid #333d50;border-radius:4px;padding:0 5px;color:var(--leise)}
body.still .demo{display:none}

/* ---------- Geruest ---------- */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);height:calc(100vh - 38px);min-height:760px;background:var(--grund)}
body.still .app{height:100vh}
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;background:#080b11;border-right:1px solid var(--linie)}
.rail .logo{width:40px;height:40px;border-radius:9px;overflow:hidden;border:1px solid var(--linie-2);margin-bottom:10px}
.rail .logo img{width:100%;height:100%;object-fit:cover}
.rail a{position:relative;width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font-size:20px;color:var(--stumm)}
.rail a:hover{background:var(--flaeche-2);color:var(--tinte)}
.rail a.an{background:linear-gradient(180deg,rgba(240,195,90,.2),rgba(240,195,90,.06));color:var(--gold)}
.rail a.an::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--gold)}
.rail .zahl{position:absolute;right:3px;top:3px;min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.rail .luecke{flex:1}
main{display:flex;flex-direction:column;min-width:0;min-height:0}

/* Tooltip (ein Muster fuer alles) */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:90;left:50%;top:calc(100% + 7px);transform:translateX(-50%);width:max-content;max-width:280px;white-space:pre-line;
  padding:6px 9px;border-radius:6px;background:#020305;border:1px solid var(--linie-2);color:var(--tinte);font:500 13.5px/1.3 var(--zahl);letter-spacing:0;text-transform:none;text-align:left;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.6)}
[data-tip].tr::after{left:calc(100% + 8px);top:50%;transform:translateY(-50%)}
[data-tip].tl::after{left:auto;right:0;transform:none}
[data-tip].tll::after{left:0;transform:none}
[data-tip].to::after{top:auto;bottom:calc(100% + 7px)}
body.phone [data-tip]::after{display:none}

/* ---------- Hero-Kopf ---------- */
.hero{position:relative;flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch;gap:22px;padding:14px 20px 0;border-bottom:1px solid var(--linie);overflow:hidden;isolation:isolate}
.hero .kul{position:absolute;inset:-30px;z-index:-2;background:url("../szenen/basketball/parkett.jpg") center 40%/cover;filter:blur(14px) saturate(1.15);opacity:.5}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,8,12,.94) 0%,rgba(6,8,12,.72) 38%,rgba(6,8,12,.62) 62%,rgba(6,8,12,.93) 100%),linear-gradient(180deg,transparent 40%,var(--grund) 100%)}
.hk{display:flex;align-items:center;gap:14px;padding-bottom:14px}
.hk .crest{width:62px;height:62px;border-radius:10px;overflow:hidden;border:2px solid var(--heim);box-shadow:0 6px 18px rgba(0,0,0,.5);flex:none}
.hk .crest img{width:100%;height:100%;object-fit:cover}
.hk h1{margin:0;font:400 34px/1 var(--haus);color:#fff;letter-spacing:.01em}
.hk .sub{margin-top:5px;font-size:15px;color:var(--leise);font-weight:500;white-space:nowrap}
.hk .sub b{color:var(--creme);font-weight:600}
.mdw{display:inline-flex;align-items:center;gap:2px;margin-bottom:5px}
.mdw button{width:24px;height:24px;border-radius:5px;border:1px solid var(--linie);display:grid;place-items:center;color:var(--leise)}
.mdw button:hover{border-color:var(--gold);color:var(--gold)} .mdw button[disabled]{opacity:.3;cursor:default}
.mdw span{padding:0 8px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);white-space:nowrap}
/* Liga-Reiter (derselbe Baustein wie die Disziplin-Reiter der Einsatzliste) */
.tabs{display:flex;align-items:flex-end;gap:10px;min-width:0}
.dtab{position:relative;flex:1 1 0;min-width:0;max-width:340px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 20px 12px 18px;
  background:rgba(18,24,36,.72);border:1px solid var(--linie);border-bottom:0;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);color:var(--leise);transition:background .15s}
.dtab:hover{background:rgba(26,34,49,.9)}
.dtab.an{background:linear-gradient(180deg,rgba(240,195,90,.2),rgba(18,24,36,.92) 70%);color:var(--tinte)}
.dtab.an::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gold)}
.dtab .ic{width:38px;height:38px;border-radius:8px;overflow:hidden;display:grid;place-items:center;font-size:22px;background:rgba(0,0,0,.35);border:1px solid var(--linie);color:var(--creme)}
.dtab .ic img{width:100%;height:100%;object-fit:cover}
.dtab.an .ic{color:var(--gold);border-color:rgba(240,195,90,.5)}
.dtab em{display:block;font-style:normal;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtab b{display:block;font:400 22px/1.1 var(--haus);color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtab .erw{text-align:right}
.dtab .erw strong{display:block;font-size:28px;line-height:1;font-weight:700;color:var(--creme)}
.dtab .erw span{font-size:12px;color:var(--stumm);letter-spacing:.06em;white-space:nowrap}
.dtab .mein{position:absolute;right:20px;top:-1px;height:15px;padding:0 6px;background:var(--heim);color:#17120a;font-size:10.5px;font-weight:700;letter-spacing:.1em;border-radius:0 0 3px 3px}
.hr{display:flex;align-items:center;gap:16px;padding-bottom:14px}
.frist{text-align:right;white-space:nowrap}
.frist strong{display:block;font-size:22px;line-height:1.1;font-weight:700;color:var(--creme);max-width:250px;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:7px;border:1px solid var(--linie-2);background:var(--flaeche-2);font-weight:600;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.btn:hover{background:var(--flaeche-3);border-color:var(--creme)}
.btn.klein{height:30px;padding:0 10px;font-size:14px}

/* ---------- Arbeitsflaeche ---------- */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:12px;padding:12px 14px}
.pan{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);overflow:hidden}
.pk{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--linie);min-height:46px}
.pk h2{margin:0;font:400 19px/1 var(--haus);color:var(--creme);white-space:nowrap}
.pk h2 i,.sg h3 i{font:700 19px/1 var(--zahl);font-style:normal}
.pk .sp{flex:1}
.pk .hin{font-size:13.5px;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ktabs{flex:none;display:flex;border-bottom:1px solid var(--linie)}
.ktabs button{flex:1;height:42px;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--stumm);border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:0 10px}
.ktabs button:hover{color:var(--tinte)} .ktabs button.an{color:var(--gold);border-bottom-color:var(--gold)}
.kb{flex:1;overflow-y:auto;min-height:0;padding:12px}
.seg{display:inline-flex;border:1px solid var(--linie-2);border-radius:7px;overflow:hidden;flex:none}
.seg button{text-align:center;height:30px;padding:0 11px;font-weight:600;font-size:14px;color:var(--leise);border-right:1px solid var(--linie);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--flaeche-2);color:var(--tinte)}
.seg button[aria-pressed=true]{background:var(--creme);color:#17120a}
.marke{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#0b0d12;background:var(--pc,var(--leise));flex:none}
.marke.rot{background:var(--warn);color:#fff} .marke.leer{background:none;border:1px solid var(--linie-2);color:var(--leise)}
.marke.wir{background:var(--heim)} .marke.fr{background:var(--gast)} .marke.gold{background:var(--gold)} .marke.gut{background:var(--gut)}
.kf{flex:none;padding:7px 12px;border-top:1px solid var(--linie);font-size:13px;color:var(--stumm);display:flex;gap:14px;align-items:center;white-space:nowrap;overflow:hidden}
.kf i{display:inline-block;width:4px;height:13px;border-radius:2px;vertical-align:-2px;margin-right:5px}
.kf .sp{flex:1}

/* ---------- Tabelle (Raster-Zeilen wie die Kaderliste) ---------- */
.tl{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.th,.tz{display:grid;gap:8px;align-items:center;padding:0 12px 0 0;width:100%}
.sport .th,.sport .tz{grid-template-columns:50px 34px minmax(170px,1fr) 70px 56px 104px 88px 30px 30px 30px 30px 36px 46px 54px}
.verein .th,.verein .tz{grid-template-columns:50px minmax(170px,1fr) 52px 66px 88px 76px 92px 88px 84px 54px}
.th{flex:none;height:28px;border-bottom:1px solid var(--linie);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stumm);font-weight:600;position:sticky;top:0;background:var(--flaeche-1);z-index:5}
.th button{color:inherit;letter-spacing:inherit;text-transform:inherit;font-weight:inherit;text-align:right;white-space:nowrap}
.th button.li{text-align:left} .th button.mi{text-align:center}
.th button.an{color:var(--gold)} .th button:hover{color:var(--tinte)}
.th button:first-child{padding-left:16px;text-align:left}
.tz{position:relative;flex:1 1 0;min-height:33px;max-height:42px;border-bottom:1px solid rgba(244,230,196,.06);font-size:16px;text-align:right}
.tz:hover{background:var(--flaeche-2)}
.tz::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.tz.z-titel::before{background:var(--gold)} .tz.z-auf::before{background:var(--gut)} .tz.z-ab::before{background:var(--warn)}
.tz.g-u{border-bottom:1px dashed var(--zc)} .tz.z-titel{--zc:var(--gold)} .tz.z-auf{--zc:var(--gut)} .tz.g-o{border-top:1px dashed var(--warn);margin-top:-1px}
.tz.wir{background:linear-gradient(90deg,rgba(242,160,61,.22),rgba(242,160,61,.04));color:#fff}
.tz.gew{box-shadow:inset 0 0 0 2px var(--gold);background:rgba(240,195,90,.08)}
.tz .rg{padding-left:16px;text-align:left;font-size:19px;font-weight:700;color:var(--stumm)}
.tz.z-titel .rg{color:var(--gold)} .tz.z-auf .rg{color:var(--gut)} .tz.z-ab .rg{color:var(--warn)} .tz.wir .rg{color:var(--heim)}
.tz .tr{font-size:13.5px;font-weight:700;text-align:left;white-space:nowrap}
.tm{display:flex;align-items:center;gap:9px;min-width:0;text-align:left}
.tm img{width:26px;height:26px;border-radius:5px;object-fit:cover;flex:none}
.tm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tinte)}
.tz.wir .tm b{color:#fff}
.tz .bil{color:var(--leise);letter-spacing:.02em}
.tz .pt strong{font-size:21px;font-weight:700;color:var(--creme)}
.tz .ar{color:var(--stumm);font-size:15px} .tz .ar.top{color:var(--creme);font-weight:700}
.tz .ab{color:var(--leise);font-size:15px}
.tz .nx{display:flex;justify-content:flex-end} .tz .nx img{width:22px;height:22px;border-radius:4px;object-fit:cover;opacity:.9}
.fm{display:flex;gap:3px;justify-content:flex-end}
.fm i{width:13px;height:13px;transform:skewX(-14deg);background:var(--gut);border-radius:1px;flex:none} .fm i.n{background:var(--warn)} .fm i.u{background:var(--stumm)} .fm i.o{background:rgba(255,255,255,.1)}
.tz svg.spk{width:84px;height:22px;display:block;margin-left:auto}
.lgtr{flex:none;display:flex;align-items:center;gap:10px;height:30px;padding:0 16px;background:var(--flaeche-2);border-bottom:1px solid var(--linie);border-top:1px solid var(--linie)}
.leerh{flex:none;display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--linie);font-size:14.5px;color:var(--leise);background:linear-gradient(90deg,rgba(240,195,90,.12),transparent)}
.leerh b{color:var(--creme);font-weight:600}

/* ---------- Disziplin-Matrix ---------- */
.mx{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.mh,.mz{display:grid;grid-template-columns:minmax(196px,1fr) repeat(20,minmax(34px,44px)) 54px;gap:2px;align-items:stretch;padding:0 12px 0 0;width:100%}
.mh{flex:none;position:sticky;top:0;z-index:6;background:var(--flaeche-1)}
.mh.grp{height:24px;padding-top:6px} .mh.grp span{grid-column:span 5;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--pc);border-bottom:2px solid var(--pc);text-align:center;margin:0 1px}
.mh.lab{top:24px;height:30px;border-bottom:1px solid var(--linie)}
.mh.lab button{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--leise);text-align:center;border-radius:4px}
.mh.lab button:hover{color:var(--tinte);background:var(--flaeche-2)} .mh.lab button.an{color:var(--gold)}
.mh.lab button.heute{box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}
.mh.lab button:first-child{text-align:left;padding-left:16px;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--stumm)}
.mz{position:relative;flex:1 1 0;min-height:31px;max-height:40px;margin-top:2px}
.mz::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0 2px 2px 0}
.mz.z-titel::before{background:var(--gold)} .mz.z-auf::before{background:var(--gut)} .mz.z-ab::before{background:var(--warn)}
.mz .tmz{display:flex;align-items:center;gap:8px;padding-left:14px;min-width:0;overflow:hidden;position:sticky;left:0;background:var(--flaeche-1);z-index:2}
.mz .tmz span{width:22px;font-weight:700;color:var(--stumm);font-size:15px;flex:none}
.mz.wir .tmz{background:linear-gradient(90deg,#3a2a14,#191510)} .mz.wir .tmz span{color:var(--heim)}
.mz.gew .tmz{box-shadow:inset 0 0 0 2px var(--gold)}
.mz .c{display:grid;place-items:center;border-radius:3px;font-size:15px;font-weight:700;color:#fff;background:rgba(255,255,255,.05)}
.mz .c.leer{color:var(--stumm);font-weight:500;background:rgba(255,255,255,.025)}
.mz .c:hover{outline:2px solid var(--creme);z-index:3}
.mz .su{display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--creme)}
.mx.spalte .mz .c:not(.sp-an){opacity:.38}
.skala{display:inline-flex;align-items:center;gap:3px} .skala i{width:16px;height:12px;border-radius:2px;margin:0}

/* ---------- Saisonverlauf ---------- */
.vl{flex:1;min-height:320px;position:relative}
.vl svg{position:absolute;inset:0;width:100%;height:100%}
.vl text{font-family:var(--zahl);fill:var(--stumm);font-size:12.5px}
.vl .ln path.s{fill:none;stroke:#5a6679;stroke-width:1.6;opacity:.55;stroke-linejoin:round;stroke-linecap:round}
.vl .ln path.h{fill:none;stroke:transparent;stroke-width:13;cursor:pointer}
.vl .ln text{fill:var(--leise);font-size:14.5px;font-weight:500;cursor:pointer}
.vl .ln:hover path.s{stroke:var(--creme);stroke-width:3;opacity:1} .vl .ln:hover text{fill:#fff}
.vl .ln.zone path.s{opacity:.8}
.vl .ln.wir path.s{stroke:var(--heim);stroke-width:3.6;opacity:1} .vl .ln.wir text{fill:var(--heim);font-weight:700}
.vl .ln.gew path.s{stroke:var(--gast);stroke-width:3.6;opacity:1} .vl .ln.gew text{fill:var(--gast);font-weight:700}
.vl circle{stroke:var(--flaeche-1);stroke-width:2}

/* ---------- Spieltage ---------- */

var AREA=[["pow","POW","Power","--p1"],["spe","SPE","Speed","--p4"],["men","MEN","Mental","--p5"],["soc","SOC","Social","--p6"]];
var q=new URLSearchParams(location.search);
var WIR=T[q.get("wir")]?q.get("wir"):"V-W", FRANKY=WIR==="N-N"?"V-W":"N-N", RIVALE=WIR==="V-W"?"A-A":"B-P";
var Z={liga:T[WIR].l,n:12,view:"tab",team:null,ctab:"lage",cols:"sport",mat:"pkt",ver:"rang",spt:"erg",sort:"rank",dir:1,spalte:null};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function ic(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function logo(c){return "../team-logos/"+c+".jpg"}
function por(p){return "../portraits/"+P[p][1]+".jpg"}
function de(x,d){return x.toFixed(d==null?1:d).replace(".",",")}
function vz(x,d){return (x>0?"+":x<0?"−":"±")+de(Math.abs(x),d)}
function kl(x){return x>0?"plus":x<0?"minus":"null"}
function phone(){return document.body.classList.contains("phone")}
function sag(t){var e=$("#toast");e.textContent=t;e.classList.add("an");clearTimeout(sag.t);sag.t=setTimeout(function(){e.classList.remove("an")},2200)}

/* ---------- Stand nach n Spieltagen (reine Summe der gebuchten Einsaetze, wie summiereSaisonBilanz) ---------- */
var cache={};
function ordne(s,l){return CODES.filter(function(c){return T[c].l===l}).sort(function(a,b){return s[b].pts-s[a].pts||s[b].vh-s[a].vh||T[a].sp-T[b].sp})}
function stand(n){
  if(cache[n])return cache[n];
  var s={};CODES.forEach(function(c){s[c]={c:c,pts:0,S:0,U:0,N:0,vh:0,dp:DIS.map(function(){return 0}),dn:DIS.map(function(){return 0}),ein:[],hist:[0],rk:[T[c].sp],pod:[0,0,0,0]}});
  function add(c,mi,di,p,o){var t=s[c];t.pts+=p;if(p>=2)t.S++;else if(p>=1)t.U++;else t.N++;t.dp[di]+=p;t.dn[di]++;t.vh+=o.d||0;o.mi=mi;o.di=di;o.p=p;t.ein.push(o);if(o.platz)t.pod[o.platz-1]++}
  for(var mi=0;mi<n;mi++){
    [1,2].forEach(function(l){var day=R[l][mi];
      [0,1].forEach(function(side){var di=MD[mi][side];
        if(day.p[side])day.p[side].forEach(function(pod,pi){for(var k=0;k<4;k++)add(pod[k][0],mi,di,k===0?2:k===1?1:0,{platz:k+1,pi:pi,wert:pod[k][1],pod:pod})});
        else day.f.forEach(function(row){var r=row[2+side];if(!r)return;
          add(row[0],mi,di,r[0],{opp:row[1],sa:r[2],sb:r[3],d:r[4],heim:1});add(row[1],mi,di,r[1],{opp:row[0],sa:r[3],sb:r[2],d:-r[4]})})})});
    [1,2].forEach(function(l){ordne(s,l).forEach(function(c,i){s[c].rk.push(i+1)})});
    CODES.forEach(function(c){s[c].hist.push(s[c].pts)});
  }
  var o={s:s,o:{1:ordne(s,1),2:ordne(s,2)}};
  [1,2].forEach(function(l){o.o[l].forEach(function(c,i){s[c].rank=i+1;s[c].ges=(l-1)*16+i+1})});
  return cache[n]=o;
}
function zone(c,rank){var l=T[c].l;return l===1?(rank===1?"titel":rank>=14?"ab":""):(rank<=3?"auf":"")}
function naechster(c,n){if(n>=20)return null;var f=R[T[c].l][n].f;for(var i=0;i<f.length;i++){if(f[i][0]===c)return {opp:f[i][1],heim:1};if(f[i][1]===c)return {opp:f[i][0],heim:0}}return null}
function papier(a,b,di){return Math.round(100/(1+Math.exp(-(T[a].st[di]-T[b].st[di])/10)))}
function staerkeRang(c,di){var l=T[c].l,v=T[c].st[di],r=1;CODES.forEach(function(x){if(T[x].l===l&&T[x].st[di]>v)r++});return r}
function arPts(t,a){var x=0;for(var i=a*5;i<a*5+5;i++)x+=t.dp[i];return x}
function lagetext(c,S){var t=S.s[c],o=S.o[T[c].l],l=T[c].l;
  if(Z.n===0)return "Startplatz <b>"+t.rank+".</b> · noch kein Spieltag gewertet";
  if(l===2){if(t.rank<=3)return "auf <b>Aufstiegsplatz "+t.rank+"</b> · "+(t.pts-S.s[o[3]].pts)+" Pkt vor Platz 4";return "<b>"+(S.s[o[2]].pts-t.pts)+" Pkt</b> hinter Aufstiegsplatz 3"}
  if(t.rank===1)return "<b>Tabellenführer</b> · "+(t.pts-S.s[o[1]].pts)+" Pkt vor Platz 2";
  if(t.rank>=14)return "auf <b>Abstiegsplatz "+t.rank+"</b> · "+(S.s[o[12]].pts-t.pts)+" Pkt hinter Platz 13";
  return "<b>"+(t.pts-S.s[o[13]].pts)+" Pkt</b> vor Abstiegsplatz 14 · "+(S.s[o[0]].pts-t.pts)+" hinter Platz 1"}
function marken(c,kurz){var m="";if(c===WIR)m+='<span class="marke wir">DU</span>';if(c===FRANKY)m+='<span class="marke fr'+(kurz?" xs2":"")+'" data-tip="Von Franky gesteuert">FRANKY</span>';if(c===RIVALE)m+='<span class="marke leer xs2" data-tip="Dein Rivale">RIVALE</span>';return m}
function ligen(){return Z.liga?[Z.liga]:[1,2]}
function ligaName(){return Z.liga?"Liga "+Z.liga:"Gesamt"}

/* ---------- Kopf ---------- */
function zKopf(){var S=stand(Z.n),t=S.s[WIR];
  $("#raillogo").src=logo(WIR);
  $("#hk").innerHTML='<span class="crest"><img src="'+logo(WIR)+'" alt=""></span><div><div class="mdw"><button data-st="-1" aria-label="Spieltag zurück"'+(Z.n<=0?" disabled":"")+'>'+ic("l")+'</button><span><span class="sai">Saison 1 · </span>'+(Z.n===0?"vor Spieltag 1":Z.n===20?"Endstand":"nach Spieltag "+Z.n+" von 20")+'</span><button data-st="1" aria-label="Spieltag vor"'+(Z.n>=20?" disabled":"")+'>'+ic("r")+'</button></div><h1>Saisonstand</h1><div class="sub">'+esc(T[WIR].n)+' · Liga '+T[WIR].l+' · '+lagetext(WIR,S)+'</div></div>';
  var h="";[1,2,0].forEach(function(l){var an=Z.liga===l;
    if(l){var f=S.o[l][0];h+='<button class="dtab'+(an?" an":"")+(T[WIR].l===l?" eig":"")+'" role="tab" aria-selected="'+an+'" data-liga="'+l+'">'+(T[WIR].l===l?'<span class="mein">DEINE LIGA</span>':"")+'<span class="ic"><img src="'+logo(f)+'" alt=""></span><span><em>'+(Z.n?"1. "+esc(T[f].n):"16 Teams")+'</em><b>Liga '+l+'</b></span><span class="erw t"><strong>'+(T[WIR].l===l?t.rank+".":Z.n?S.s[f].pts:"–")+'</strong><span>'+(T[WIR].l===l?"dein Rang":"Pkt Platz 1")+'</span></span></button>'}
    else h+='<button class="dtab'+(an?" an":"")+'" role="tab" aria-selected="'+an+'" data-liga="0"><span class="ic">'+ic("welt")+'</span><span><em>32 Teams</em><b>Gesamt</b></span><span class="erw t"><strong>'+t.ges+'.</strong><span>von 32</span></span></button>'});
  $("#tabs").innerHTML=h;
  var nx=naechster(WIR,Z.n);
  $("#hr").innerHTML=nx?'<div class="frist"><span class="gk">Spieltag '+(Z.n+1)+' · '+DIS[MD[Z.n][0]][2]+' + '+DIS[MD[Z.n][1]][2]+'</span><strong>gegen '+esc(T[nx.opp].n)+'</strong></div><button class="btn" data-view="spt" data-spt="ans">Ansetzungen '+ic("r")+'</button>'
    :'<div class="frist"><span class="gk">Saison 1 beendet</span><strong>'+(zone(WIR,t.rank)==="auf"?"Aufstieg in Liga 1":zone(WIR,t.rank)==="ab"?"Abstieg in Liga 2":zone(WIR,t.rank)==="titel"?"Meister":"Klasse gehalten")+'</strong></div><button class="btn" data-ctab="lage">Abschluss '+ic("r")+'</button>';
}

/* ---------- Haupttafel ---------- */
var VIEWS=[["tab","Tabelle"],["mat","Disziplin-Matrix"],["ver","Saisonverlauf"],["spt","Spieltage"]];
function seg(name,cur,items){return '<span class="seg" role="group">'+items.map(function(i){return '<button data-'+name+'="'+i[0]+'" aria-pressed="'+(cur===i[0])+'">'+i[1]+'</button>'}).join("")+'</span>'}
function zHaupt(){
  $("#vtabs").innerHTML=VIEWS.map(function(v){return '<button role="tab" class="'+(Z.view===v[0]?"an":"")+'" data-view="'+v[0]+'">'+(phone()?v[1].replace("Disziplin-","").replace("Saison",""):v[1])+'</button>'}).join("");
  ({tab:zTabelle,mat:zMatrix,ver:zVerlauf,spt:zSpieltage})[Z.view]();
}
function legende(){var z=[];if(Z.liga!==2)z.push('<span><i style="background:var(--gold)"></i>Titel</span>','<span><i style="background:var(--warn)"></i>Abstieg (3)</span>');if(Z.liga!==1)z.push('<span><i style="background:var(--gut)"></i>Aufstieg (3)</span>');
  z.push('<span><i style="background:var(--heim)"></i>dein Team</span>');return z.join("")}

/* Tabelle */
var SP_SPORT=[["rank","#","li"],["trend","±","li xs"],["name","Team","li"],["bil","S-U-N","xs0"],["vh","Verh.","xs c-vh"],["form","Form","mi0"],["kur","Verlauf","xs c-kur"],["a0","POW","xs"],["a1","SPE","xs"],["a2","MEN","xs"],["a3","SOC","xs"],["nx","Nä.","xs c-nx"],["ab","Abst.","xs"],["pts","Pkt",""]];
var SP_VEREIN=[["rank","#","li"],["name","Team","li"],["k","Kader","xs"],["ovr","Ø Top 8","xs"],["mw","Marktwert",""],["cash","Cash","xs"],["spo","Sponsoren","xs"],["geh","Gehälter","xs"],["guv","GuV",""],["pts","Pkt",""]];
var TIPS={trend:"Plätze gegenüber dem Spieltag davor",bil:"Siege – Unentschieden – Niederlagen je Disziplin-Einsatz (2 je Spieltag)",vh:"Punkteverhältnis: Summe der Abstände aller Duelle. Erster Tiebreaker nach den Punkten.",form:"Die letzten sechs Einsätze, neuester rechts",kur:"Rang von Spieltag 1 bis heute",a0:"Punkte in den fünf Power-Disziplinen",a1:"Punkte in den fünf Speed-Disziplinen",a2:"Punkte in den fünf Mental-Disziplinen",a3:"Punkte in den fünf Social-Disziplinen",nx:"Nächster Gegner",ab:"Rückstand auf Platz 1 der Liga",ovr:"Mittel der acht besten Spieler",guv:"Gewinn und Verlust der Saison, hochgerechnet"};
function sortWert(c,S){var t=S.s[c],k=Z.sort;if(k==="rank"||k==="pts"||k==="ab")return t.ges;if(k==="name")return T[c].n;if(k==="trend")return -(Z.n?t.rk[Z.n-1]-t.rk[Z.n]:0);
  if(k==="vh")return -t.vh;if(k==="bil")return -t.S;if(k==="form")return -t.ein.slice(-6).reduce(function(a,e){return a+e.p},0);if(k[0]==="a"&&k.length===2)return -arPts(t,+k[1]);if(k==="nx"||k==="kur")return t.ges;return -T[c][k]}
function spark(t,wir){var n=Z.n;if(n<2)return "";var w=84,h=22,pts=[];for(var k=1;k<=n;k++)pts.push((3+(k-1)/(n-1)*(w-8)).toFixed(1)+","+(3+(t.rk[k]-1)/15*(h-6)).toFixed(1));
  var e=pts[pts.length-1].split(",");return '<svg class="spk" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts.join(" ")+'" fill="none" stroke="'+(wir?"var(--heim)":"var(--leise)")+'" stroke-width="1.6" stroke-linejoin="round"/><circle cx="'+e[0]+'" cy="'+e[1]+'" r="2.4" fill="'+(wir?"var(--heim)":"var(--creme)")+'"/></svg>'}
function formHtml(t){var e=t.ein.slice(-6),h="";for(var i=e.length;i<6;i++)h+='<i class="o"></i>';e.forEach(function(x){h+='<i class="'+(x.p>=2?"":x.p>=1?"u":"n")+'"></i>'});return '<span class="fm">'+h+'</span>'}
function zeile(c,S,sortiert){var t=S.s[c],tt=T[c],z=zone(c,t.rank),lead=S.s[S.o[tt.l][0]],nr=Z.liga?t.rank:t.ges;
  var cl="tz"+(z?" z-"+z:"")+(c===WIR?" wir":"")+(c===Z.team?" gew":"");
  if(!sortiert){if((z==="titel")||(z==="auf"&&t.rank===3))cl+=" g-u";if(z==="ab"&&t.rank===14)cl+=" g-o"}
  var ende=Z.n===20&&z?'<span class="marke '+(z==="ab"?"rot":z==="auf"?"gut":"gold")+' xs2">'+(z==="ab"?"ABSTIEG":z==="auf"?"AUFSTIEG":"MEISTER")+'</span>':"";
  var team='<span class="tm"><img src="'+logo(c)+'" alt=""><b>'+esc(tt.n)+'</b>'+marken(c,1)+ende+'</span>';
  var h='<button class="'+cl+'" data-team="'+c+'"><span class="rg t">'+nr+'.</span>';
  if(Z.cols==="sport"){var d=Z.n?t.rk[Z.n-1]-t.rk[Z.n]:0,best=-1,bv=0;for(var a=0;a<4;a++){var v=arPts(t,a);if(v>bv){bv=v;best=a}}
    var nx=naechster(c,Z.n);
    h+='<span class="tr xs '+kl(d)+'">'+(Z.n?(d>0?"▲"+d:d<0?"▼"+(-d):"–"):"")+'</span>'+team+
      '<span class="bil t">'+(Z.n?t.S+"-"+t.U+"-"+t.N:"–")+'</span><span class="t xs c-vh '+kl(t.vh)+'">'+(Z.n?vz(t.vh):"–")+'</span>'+formHtml(t)+'<span class="xs c-kur">'+spark(t,c===WIR)+'</span>';
    for(a=0;a<4;a++)h+='<span class="ar t xs'+(a===best?" top":"")+'">'+(Z.n?arPts(t,a):"–")+'</span>';
    h+='<span class="nx xs c-nx">'+(nx?'<img src="'+logo(nx.opp)+'" alt="'+esc(T[nx.opp].n)+'" title="'+esc(T[nx.opp].n)+'">':"")+'</span><span class="ab t xs">'+(Z.n?(lead.pts-t.pts?"−"+(lead.pts-t.pts):"–"):"–")+'</span>';
  }else{h+=team+'<span class="t xs">'+tt.k+'</span><span class="t xs">'+de(tt.ovr)+'</span><span class="t">'+de(tt.mw)+' Mio</span><span class="t xs">'+de(tt.cash)+' Mio</span><span class="t xs plus">'+de(tt.spo)+' Mio</span><span class="t xs">'+de(tt.geh)+' Mio</span><span class="t '+kl(tt.guv)+'">'+vz(tt.guv)+' Mio</span>'}
  return h+'<span class="pt t"><strong>'+(Z.n?t.pts:"–")+'</strong></span></button>'}
function zTabelle(){var S=stand(Z.n),sp=Z.cols==="sport"?SP_SPORT:SP_VEREIN,sortiert=!(Z.sort==="rank"||Z.sort==="pts");
  $("#vk").innerHTML='<h2>'+ligaName()+' · Tabelle</h2><span class="hin">'+(Z.n?"Klick auf ein Team öffnet die Teamkarte":"")+'</span><span class="sp"></span>'+seg("cols",Z.cols,[["sport","Sport"],["verein","Verein"]])+'<button class="btn klein nurphone" data-blatt="kontext" data-ctab="lage">'+ic("blitz")+'Showdown</button>';
  var h='<div class="tl '+Z.cols+'">';
  if(!Z.n)h+='<div class="leerh">'+ic("info")+'<span><b>Noch kein Spieltag gewertet.</b> Die Reihenfolge ist der Startplatz. Punkte, Bilanz und Form füllen sich ab Spieltag 1.</span></div>';
  h+='<div class="th">'+sp.map(function(s){var kls=s[2].replace("xs0","").replace("mi0","mi");return '<button class="'+kls+(Z.sort===s[0]?" an":"")+(TIPS[s[0]]?" to":"")+'" data-sort="'+s[0]+'"'+(TIPS[s[0]]?' title="'+esc(TIPS[s[0]])+'"':"")+'>'+s[1]+(Z.sort===s[0]&&sortiert?(Z.dir>0?" ↓":" ↑"):"")+'</button>'}).join("")+'</div>';
  ligen().forEach(function(l,i){var o=S.o[l].slice();
    if(sortiert)o.sort(function(a,b){var x=sortWert(a,S),y=sortWert(b,S);return (x<y?-1:x>y?1:0)*Z.dir});
    if(!Z.liga)h+='<div class="lgtr"><span class="gk" style="color:var(--creme)">Liga '+l+'</span><span class="gk">'+(l===1?"Platz 1 bis 16 · Meister und drei Absteiger":"Platz 17 bis 32 · drei Aufsteiger")+'</span></div>';
    h+=o.map(function(c){return zeile(c,S,sortiert)}).join("")});
  $("#vb").innerHTML=h+'</div>';
  $("#vf").innerHTML=legende()+'<span class="sp"></span><span class="xs">'+(Z.cols==="sport"?"Sieg 2 · Unentschieden 1 · Niederlage 0 Punkte je Disziplin · bei Gleichstand entscheidet das Verhältnis":"Marktwert, Cash, Gehälter aus dem Kader · Sponsoren und GuV hochgerechnet")+'</span>';
}

/* Disziplin-Matrix */
function heat(p,m){if(!m)return "";var s=p/m;return s>=1?"rgba(98,211,148,.72)":s>=.75?"rgba(98,211,148,.42)":s>.5?"rgba(98,211,148,.26)":s===.5?"rgba(255,255,255,.11)":s>=.25?"rgba(255,96,88,.30)":"rgba(255,96,88,.58)"}
function heatRang(r){return "rgba(240,195,90,"+(0.04+Math.pow((16-r)/15,1.6)*.74).toFixed(2)+")"}
function zMatrix(){var S=stand(Z.n),mat=Z.n?Z.mat:"kader",heute=Z.n<20?MD[Z.n]:[];
  $("#vk").innerHTML='<h2>'+ligaName()+' · Disziplin-Matrix</h2><span class="hin">'+(mat==="pkt"?"Punkte je Disziplin · Kopf anklicken sortiert":"Rang der Kaderstärke je Disziplin in der Liga")+'</span><span class="sp"></span>'+seg("mat",mat,[["pkt","Punkte"],["kader","Kaderstärke"]]);
  var h='<div class="mx'+(Z.spalte!=null?" spalte":"")+'"><div class="mh grp"><span style="visibility:hidden;grid-column:auto"></span>'+AREA.map(function(a){return '<span style="--pc:var('+a[3]+')">'+a[2].toUpperCase()+'</span>'}).join("")+'</div>';
  h+='<div class="mh lab"><button data-spalte="">Team</button>'+DIS.map(function(d,i){return '<button class="to'+(Z.spalte===i?" an":"")+(heute.indexOf(i)>=0?" heute":"")+'" data-spalte="'+i+'" data-tip="'+esc(d[2])+(d[4]?" · Vierer-Pod":" · Duell")+(heute.indexOf(i)>=0?"\nam nächsten Spieltag":"")+'" style="--x:0">'+d[1]+'</button>'}).join("")+'<button data-spalte="">'+(mat==="pkt"?"Σ":"Ø")+'</button></div>';
  ligen().forEach(function(l){var o=S.o[l].slice();
    if(Z.spalte!=null)o.sort(function(a,b){return mat==="pkt"?(S.s[b].dp[Z.spalte]-S.s[a].dp[Z.spalte]||T[b].st[Z.spalte]-T[a].st[Z.spalte]):T[b].st[Z.spalte]-T[a].st[Z.spalte]});
    o.forEach(function(c){var t=S.s[c],z=zone(c,t.rank);
      h+='<div class="mz'+(z?" z-"+z:"")+(c===WIR?" wir":"")+(c===Z.team?" gew":"")+'"><button class="tmz tm" data-team="'+c+'" data-code="'+c+'"><span class="t">'+(Z.liga?t.rank:t.ges)+'</span><img src="'+logo(c)+'" alt=""><b>'+esc(T[c].n)+'</b></button>';
      var sum=0;DIS.forEach(function(d,i){var sa=Z.spalte===i?" sp-an":"";
        if(mat==="pkt"){var m=t.dn[i]*2;if(!m)h+='<span class="c leer'+sa+'">·</span>';else{var er=t.ein.filter(function(e){return e.di===i}).map(function(e){return "ST "+(e.mi+1)+": "+(e.platz?"Platz "+e.platz+" im Vierer-Pod":e.sa+" : "+e.sb+" gegen "+T[e.opp].n)}).join("\n");
          h+='<span class="c t'+sa+(i>13?" tl":"")+'" style="background:'+heat(t.dp[i],m)+'" data-tip="'+esc(d[2]+": "+t.dp[i]+" von "+m+" Punkten\n"+er)+'">'+t.dp[i]+'</span>'}}
        else{var r=staerkeRang(c,i);sum+=r;h+='<span class="c t'+sa+(i>13?" tl":"")+'" style="background:'+heatRang(r)+';color:'+(r<=5?"#17120a":"#fff")+'" data-tip="'+esc(d[2]+": Kaderstärke "+de(T[c].st[i])+" (Mittel der vier Besten)\nRang "+r+" in Liga "+l)+'">'+r+'</span>'}});
      h+='<span class="su t">'+(mat==="pkt"?t.pts:de(sum/20))+'</span></div>'})});
  $("#vb").innerHTML=h+'</div>';
  $("#vf").innerHTML=(mat==="pkt"?'<span class="skala"><i style="background:rgba(255,96,88,.58)"></i><i style="background:rgba(255,96,88,.30)"></i><i style="background:rgba(255,255,255,.11)"></i><i style="background:rgba(98,211,148,.42)"></i><i style="background:rgba(98,211,148,.72)"></i></span><span>Anteil der möglichen Punkte: keine · die Hälfte · alle</span><span>· = noch nicht gespielt</span>'
    :'<span class="skala"><i style="background:'+heatRang(1)+'"></i><i style="background:'+heatRang(5)+'"></i><i style="background:'+heatRang(9)+'"></i><i style="background:'+heatRang(16)+'"></i></span><span>Rang 1 bis 16 der Kaderstärke</span>')+'<span style="color:var(--gold)">▢ am nächsten Spieltag</span><span class="sp"></span><span class="xs">Zelle überfahren zeigt die Ergebnisse</span>';
}

/* Saisonverlauf */
function zVerlauf(){var l=Z.liga||T[Z.team||WIR].l;
  $("#vk").innerHTML='<h2>Liga '+l+' · Saisonverlauf</h2><span class="hin">'+(Z.liga?"":"Gesamt zeigt die Liga des gewählten Teams · ")+'Linie oder Name anklicken wählt das Team</span><span class="sp"></span>'+seg("ver",Z.ver,[["rang","Rang"],["pkt","Punkte"]]);

      if(!bestD||Math.abs(r[4])>Math.abs(bestD.r[4]))bestD={r:r,a:row[0],b:row[1],mi:mi,di:MD[mi][s]}})});
    Object.keys(day.p).forEach(function(s){day.p[s].forEach(function(pod){(mw[pod[4]]=mw[pod[4]]||{n:0,c:pod[0][0]}).n++})})});
  var top=Object.keys(mw).map(function(p){return {p:+p,n:mw[p].n,c:mw[p].c}}).sort(function(a,b){return b.n-a.n||P[b.p][4]-P[a.p][4]}).slice(0,6);
  h+='<div class="gk" style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Matchwinner · '+ligaName()+'</span><span style="color:var(--stumm);letter-spacing:.04em;text-transform:none;font-weight:500;font-size:12.5px">bester Spieler eines gewonnenen Einsatzes</span></div>';
  h+=top.map(function(x,i){return '<button class="kand" data-team="'+x.c+'"><em class="t">'+(i+1)+'</em><img src="'+por(x.p)+'" alt="" loading="lazy"><span style="min-width:0"><b>'+esc(P[x.p][0])+'</b><small>'+esc(P[x.p][2])+' · '+esc(T[x.c].n)+'</small></span><img class="w" src="'+logo(x.c)+'" alt=""><strong class="t">'+x.n+'×</strong></button>'}).join("");
  h+='<div class="ab2"><div class="gk"><span>Disziplin-Beste</span><em>Team mit den meisten Punkten</em></div><div class="dkg">'+DIS.map(function(d,i){var b=null;CODES.forEach(function(c){if(ls.indexOf(T[c].l)<0||!S.s[c].dn[i])return;if(!b||S.s[c].dp[i]>S.s[b].dp[i]||(S.s[c].dp[i]===S.s[b].dp[i]&&T[c].st[i]>T[b].st[i]))b=c});
    return b?'<button data-team="'+b+'" title="'+esc(d[2])+'"><span>'+d[1]+'</span><img src="'+logo(b)+'" alt=""><b>'+esc(T[b].n)+'</b><strong class="t">'+S.s[b].dp[i]+'</strong></button>':'<button disabled style="opacity:.4"><span>'+d[1]+'</span><span></span><b>offen</b><span></span></button>'}).join("")+'</div></div>';
  CODES.forEach(function(c){if(ls.indexOf(T[c].l)<0)return;var run=0,mx=0,v=0,t=S.s[c];t.ein.forEach(function(e){run=e.p>=2?run+1:0;if(run>mx)mx=run});for(var k=1;k<=Z.n;k++)if(t.hist[k]-t.hist[k-1]===4)v++;
    if(mx>serie.n)serie={c:c,n:mx};if(v>voll.n)voll={c:c,n:v}});
  h+='<div class="ab2"><div class="gk"><span>Rekorde der Saison</span></div>'+(bestD?rek("Deutlichster Sieg",DIS[bestD.di][2]+", ST "+(bestD.mi+1)+": "+esc(T[bestD.a].n)+" "+bestD.r[2]+" : "+bestD.r[3]+" "+esc(T[bestD.b].n),vz(Math.abs(bestD.r[4]))):"")+
    rek("Längste Siegesserie",esc(T[serie.c].n)+", Einsätze in Folge",serie.n)+rek("Spieltage mit 4 Punkten",esc(T[voll.c].n),voll.n+"×")+'</div>';
  return h}

/* ---------- Steuerung ---------- */
function alles(){zKopf();zHaupt();zKontext();zDemo()}
function blatt(n){if(n)document.body.dataset.blatt=n;else delete document.body.dataset.blatt}
var SZENEN={tabelle:{},teamkarte:{team:"D-L",ctab:"team"},liga1:{liga:1},gesamt:{liga:0},verein:{cols:"verein"},matrix:{view:"mat"},kader:{view:"mat",mat:"kader"},verlauf:{view:"ver",team:"D-L",ctab:"team"},punkte:{view:"ver",ver:"pkt"},
  spieltage:{view:"spt"},ansetzungen:{view:"spt",spt:"ans"},bestenliste:{ctab:"best"},start:{n:0},ende:{n:20}};
var SZ_NAMEN={tabelle:"Tabelle",teamkarte:"Teamkarte",liga1:"Liga 1",gesamt:"Gesamt",verein:"Verein",matrix:"Matrix",kader:"Kaderstärke",verlauf:"Verlauf",punkte:"Punkteverlauf",spieltage:"Spieltag",ansetzungen:"Ansetzungen",bestenliste:"Bestenliste",start:"Vor Spieltag 1",ende:"Saisonende"};
var szene="tabelle";
function setze(n){szene=n;Z={liga:T[WIR].l,n:12,view:"tab",team:null,ctab:"lage",cols:"sport",mat:"pkt",ver:"rang",spt:"erg",sort:"rank",dir:1,spalte:null};var s=SZENEN[n]||{};for(var k in s)Z[k]=s[k];blatt("");alles()}
function zDemo(){$("#demo").innerHTML='<b>Mockup</b>'+Object.keys(SZENEN).map(function(k){return '<button data-szene="'+k+'" aria-pressed="'+(szene===k)+'">'+SZ_NAMEN[k]+'</button>'}).join("")+'<button data-phone="1" aria-pressed="'+phone()+'">Phone</button><span><span class="kbd">←</span> <span class="kbd">→</span> Spieltag · <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">G</span> Liga · <span class="kbd">T</span> <span class="kbd">M</span> <span class="kbd">V</span> <span class="kbd">S</span> Ansicht</span><a href="oly-start-modern-17-11.html">→ zur Startseite</a>'}
document.addEventListener("click",function(ev){var t=ev.target,x;
  if(t.id==="schleier"){blatt("");return}
  if((x=t.closest("[data-szene]"))){setze(x.dataset.szene);return}
  if((x=t.closest("[data-phone]"))){document.body.classList.toggle("phone");phoneFest=document.body.classList.contains("phone");alles();return}
  if((x=t.closest("[data-nix]"))){sag(x.dataset.nix+" öffnet sich in der App. Im Mockup nicht verdrahtet.");return}
  if((x=t.closest("[data-spieler]"))){ev.preventDefault();sag(P[+x.dataset.spieler][0]+": Spielerkarte öffnet sich in der App.");return}
  if((x=t.closest("[data-st]"))){Z.n=Math.max(0,Math.min(20,Z.n+ +x.dataset.st));szene="";alles();return}
  if((x=t.closest("[data-liga]"))){Z.liga=+x.dataset.liga;Z.spalte=null;szene="";alles();return}
  if((x=t.closest("[data-sort]"))){var k=x.dataset.sort;if(Z.sort===k)Z.dir=-Z.dir;else{Z.sort=k;Z.dir=1}zHaupt();return}
  if((x=t.closest("[data-spalte]"))){var v=x.dataset.spalte;Z.spalte=v===""||Z.spalte===+v?null:+v;zHaupt();return}
  var treffer=false;
  if((x=t.closest("[data-team]"))){var c=x.dataset.team;Z.team=(Z.team===c&&Z.ctab==="team"&&!phone())?null:c;Z.ctab="team";treffer=true;if(phone())blatt("kontext")}
  if((x=t.closest("[data-view]"))){Z.view=x.dataset.view;treffer=true;if(phone())blatt("")}
  ["cols","mat","ver","spt","ctab"].forEach(function(k){var y=t.closest("[data-"+k+"]");if(y){Z[k]=y.dataset[k];treffer=true}});
  if((x=t.closest("[data-blatt]"))){blatt(phone()?x.dataset.blatt:"");treffer=true}
  if(treffer){szene="";alles()}
});
document.addEventListener("keydown",function(ev){if(ev.metaKey||ev.ctrlKey||ev.altKey)return;var k=ev.key.toLowerCase(),ok=true;
  if(k==="arrowleft")Z.n=Math.max(0,Z.n-1);else if(k==="arrowright")Z.n=Math.min(20,Z.n+1);else if(k==="1")Z.liga=1;else if(k==="2")Z.liga=2;else if(k==="g")Z.liga=0;
  else if(k==="t")Z.view="tab";else if(k==="m")Z.view="mat";else if(k==="v")Z.view="ver";else if(k==="s")Z.view="spt";
  else if(k==="escape"){if(document.body.dataset.blatt)blatt("");else Z.team=null}else ok=false;
  if(ok){szene="";alles()}});
var phoneFest=!!q.get("phone");
(function(){if(q.get("still"))document.body.classList.add("still");
  function ph(){var p=phoneFest||innerWidth<760;if(p!==phone()){document.body.classList.toggle("phone",p)}}
  ph();setze(SZENEN[q.get("szene")]?q.get("szene"):"tabelle");
  if(q.get("liga")!=null&&q.get("liga")!=="")Z.liga=+q.get("liga");if(q.get("st")!=null&&q.get("st")!=="")Z.n=Math.max(0,Math.min(20,+q.get("st")));if(T[q.get("team")]){Z.team=q.get("team");Z.ctab="team"}
  alles();if(q.get("blatt"))blatt(q.get("blatt"));
  var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){ph();alles()},80)});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(Z.view==="ver")zVerlauf()});
})();
</script>
