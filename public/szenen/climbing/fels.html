<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climbing Sandsteinschlucht</title>
<style>
:root { --bg:#0b0d12; --panel:#151922; --fg:#eef1f6; --muted:#97a1b3; --accent:#f9d51f; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding-block:24px; }
.wrap { max-width:640px; margin:0 auto; padding-inline:16px; }
h1 { font-size:1.35rem; margin:0 0 6px; text-wrap:balance; }
p.lead { color:var(--muted); font-size:0.9rem; line-height:1.55; margin:0 0 14px; max-width:65ch; }
.stage { position:relative; width:100%; max-width:600px; margin:0 auto; border-radius:12px; overflow:hidden; background:#000; box-shadow:0 8px 30px rgba(0,0,0,.45); }
canvas { display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; }
.controls { display:flex; flex-wrap:wrap; gap:8px; margin:14px auto 0; max-width:600px; }
button { background:var(--panel); color:var(--fg); border:1px solid #2a3140; border-radius:8px; padding:8px 12px; font:inherit; font-size:0.85rem; cursor:pointer; }
button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
button:disabled { opacity:.4; cursor:not-allowed; }
.note { color:var(--muted); font-size:0.8rem; margin-top:10px; max-width:600px; margin-inline:auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Climbing: Sandsteinwand in der Schlucht</h1>
  <p class="lead">Dieselbe Route wie in der Halle (gleiche Griffe, Expressen und H&ouml;hen), nur drau&szlig;en am Fels: Sandsteinb&auml;nder und Risse statt Platten, Crashpads auf dem Sand, ein Adler kreist.</p>
  <div class="stage"><canvas id="cv" width="600" height="720"></canvas></div>
  <div class="controls">
    <button id="mWalk" aria-pressed="true">Gehzyklus (Ersatz)</button>
    <button id="mClimb" aria-pressed="false">Kletter-Animation</button>
    <button id="bPause">Pause</button>
    <button id="bRestart">Neu starten</button>
  </div>
  <p class="note" id="note"></p>
</div>

const VIEW_W = 300, VIEW_H = 360, Z = 2;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

const R = D.routes[3];
const TEAM = `rgb(${D.team.join(',')})`, TEAM_D = 'rgb(176,140,14)';

const BEL = { x: R.cx + 30, y: 640 };

// ---------- image loading
function loadImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }
const IM = {};
function silhouette(img) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;

  x.globalCompositeOperation = 'source-in'; x.fillStyle = 'rgba(10,10,20,1)'; x.fillRect(0, 0, c.width, c.height);
  return c;
}

// ---------- deterministic rng
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const ease = u => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;

// ---------- timeline (pure function of t)
let MODE = SP.climb ? 'climb' : 'walk';
let TL;
function build() {
  let poses;

    const sp = SP.climb, sc = D.CHAR_H / sp.contentH;
    let prevX = FLOOR_POSE.x;

      const side = h.x < prevX ? 'L' : 'R', rc = sp.reach[side];
      const p = { x: h.x - (rc.hx - sp.ax) * sc, y: h.y - (rc.hy - sp.ay) * sc, hold: h, i, side };

  }
  if (opts.floorShadow) {
    ctx.fillStyle = 'rgba(0,0,8,0.4)'; ctx.beginPath(); ctx.ellipse(foot.x, foot.y, 15, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.drawImage(img, x, y, w, w);
}
function teamRing(foot) {
  ctx.lineWidth = 1; ctx.strokeStyle = TEAM; ctx.beginPath(); ctx.ellipse(foot.x, foot.y, 22, 5, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(176,140,14,0.8)'; ctx.beginPath(); ctx.ellipse(foot.x, foot.y, 20.5, 4, 0, 0, Math.PI * 2); ctx.stroke();
}
function ropePath(pts, t) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [col, dy] of [[TEAM_D, 0.6], [TEAM, 0]]) {
    ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y + dy);
    // first segment (climber -> last clip) hangs with slack
    const a = pts[0], b = pts[1], len = Math.hypot(b.x - a.x, b.y - a.y);
    const sag = Math.min(18, 4 + len * 0.16);
    ctx.quadraticCurveTo((a.x + b.x) / 2 + 5, Math.max(a.y, b.y) + sag + dy, b.x, b.y + dy);
    for (let i = 2; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y + dy);
    ctx.stroke();
  }
}

// pixel bell glyph (8x8)
const BELL = ['...##...', '..####..', '.######.', '.######.', '.######.', '########', '........', '...##...'];
function drawBell(cx, cy, col) {
  ctx.fillStyle = col;
  BELL.forEach((row, r) => [...row].forEach((c, k) => { if (c === '#') ctx.fillRect(cx - 8 + 2 * k, cy - 8 + 2 * r, 2, 2); }));
}

// ---------- the frame
function render(t) {
  t = ((t % TL.T) + TL.T) % TL.T;
  const B = bodyAt(t), s = B.s;
  const cy = camY(t);
  ctx.setTransform(Z, 0, 0, Z, -CAM_X * Z, -Math.round(cy * Z));
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(IM.wall, 0, 0);
  if (window.__fx) window.__fx(ctx);

  // clipped draws: small glint at the moment of clipping
  const clippedPts = TL.clips.filter(c => c.t <= t && !(s.type === 'idle' && t < 1.3)).map(c => c.q);
  for (const c of TL.clips) {
    const dt = t - c.t;
    if (dt >= 0 && dt < 0.35) {
      ctx.fillStyle = `rgba(255,255,255,${0.9 * (1 - dt / 0.35)})`;
      const r = 2 + dt * 18; ctx.fillRect(c.q.x - r / 2, c.q.y + 13 - r / 2, r, r);
    }
  }

  // floor characters behind the rope: teammates + belayer
  const pump = Math.floor(t / 0.35) % 2;
  const jump = s.type === 'top' ? Math.abs(Math.sin((t - TL.tTop) * 9)) * 3 : 0;
  const m1 = { x: R.cx - 70, y: 706 }, m2 = { x: R.cx + 96, y: 708 };
  teamRing(m1); teamRing(m2); teamRing(BEL);
  drawSprite('golem', pump, { x: m1.x, y: m1.y - jump }, { floorShadow: true });
  drawSprite('genta', 0, { x: m2.x, y: m2.y - (s.type === 'top' ? jump : 0) }, { floorShadow: true });
  const payout = s.type === 'move' ? Math.sin(B.u * Math.PI * 2) : 0;
  const bel = { x: BEL.x + Math.round(payout), y: BEL.y };
  drawSprite('belayer', 0, bel, { floorShadow: true });

  // climber pose / frame
  let key = MODE === 'climb' ? 'climb' : 'walk', frame = 0;
  if (s.type === 'idle') key = 'kitiIdle';
  else if (MODE === 'climb') {
    const rc = p => SP.climb.reach[TL.poses[p].side];
    if (s.type === 'move') { const seq = rc(s.idx).seq; frame = seq[Math.min(seq.length - 1, Math.floor(B.u * seq.length))]; }
    else if (s.type === 'hold') frame = rc(s.idx).frame;
    else if (s.type === 'top') frame = (t - TL.tTop) < 0.9 ? rc(s.idx).frame : (Math.floor((t - TL.tTop) / 0.4) % 2 ? 7 : 3);
    else if (s.type === 'lower') frame = 1;
  } else if (s.type === 'move') frame = Math.floor(B.u * IM[key].length * 0.999);
  const onWall = s.type !== 'idle';
  const foot = { x: B.x, y: B.y };

  // rope (drawn first, so it runs behind the climber): harness -> highest clipped point
  // -> ... -> belayer's hands -> slack pile
  const harness = { x: B.x, y: B.y - 28 };
  const hand = { x: bel.x - 7, y: bel.y - 32 };
  const pts = [harness, ...clippedPts.slice().sort((a, b) => a.y - b.y).map(q => ({ x: q.x, y: q.y + 13 })), hand];
  if (pts.length === 2) pts.splice(1, 0, { x: (harness.x + hand.x) / 2, y: (harness.y + hand.y) / 2 });
  // loop seam: in the closing idle the threaded rope is pulled (fades out) while the plain
  // start rope fades in, so the wrap to t=0 shows no pop
  const fadeOut = s === TL.segs[TL.segs.length - 1] ? (t - s.t0) / (s.t1 - s.t0) : 0;
  ctx.globalAlpha = 1 - fadeOut; ropePath(pts, t);
  if (fadeOut > 0) { ctx.globalAlpha = fadeOut; ropePath([harness, { x: (harness.x + hand.x) / 2, y: (harness.y + hand.y) / 2 }, hand], t); }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = TEAM; ctx.beginPath(); ctx.moveTo(hand.x, hand.y);
  ctx.quadraticCurveTo(hand.x - 10, hand.y + 18, hand.x - 14, bel.y + 1); ctx.stroke();
  ctx.fillStyle = TEAM_D; ctx.fillRect(hand.x - 21, bel.y - 1, 12, 3); ctx.fillStyle = TEAM; ctx.fillRect(hand.x - 20, bel.y - 1, 10, 1);

  drawSprite(key, frame, foot, onWall ? { wallShadow: true } : { floorShadow: true });

  // chalk puffs on every new hold
  TL.segs.forEach((sg, si) => {
    if (sg.type !== 'move') return;
    const dt = t - sg.t1; if (dt < 0 || dt > 0.9) return;
    const h = TL.poses[sg.idx].hold, r = rng(si * 7919 + 13);
    for (let k = 0; k < 11; k++) {
      const a = r() * Math.PI * 2, v = 8 + r() * 16;
      const x = h.x + Math.cos(a) * v * dt, y = h.y + Math.sin(a) * v * dt * 0.7 + 10 * dt * dt;
      ctx.fillStyle = `rgba(250,250,244,${0.85 * (1 - dt / 0.9)})`; ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
  });
  // chalk dip at the start
  if (s.type === 'idle' && t < 1.3) {
    const r = rng(77);
    for (let k = 0; k < 14; k++) {
      const ph = (t * 0.9 + r()) % 1, x = foot.x + (r() - 0.5) * 10, y = foot.y - 30 - ph * 14;
      ctx.fillStyle = `rgba(250,250,244,${0.7 * (1 - ph)})`; ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
  }

  // top-out: bell flash + confetti
  const dtop = t - TL.tTop;
  if (dtop >= 0 && dtop < 3.6) {
    const A = R.anchor;
    for (let k = 0; k < 3; k++) {
      const d = dtop - k * 0.18; if (d < 0 || d > 0.8) continue;
      ctx.strokeStyle = `rgba(255,236,140,${1 - d / 0.8})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(A.x, A.y - 2, 4 + d * 40, 0, Math.PI * 2); ctx.stroke();
    }
    if (dtop < 2.6) drawBell(A.x, A.y - 14 + Math.round(Math.sin(dtop * 18) * (dtop < 1 ? 1 : 0)), dtop % 0.3 < 0.15 ? '#fff6c8' : TEAM);
    const r = rng(4242), cols = [...D.routes.map(rt => `rgb(${rt.col.join(',')})`), TEAM, '#ffffff'];
    for (let k = 0; k < 160; k++) {
      const a = -Math.PI / 2 + (r() - 0.5) * 2.6, v = 40 + r() * 70, x0 = A.x + (r() - 0.5) * 20;
      const x = x0 + Math.cos(a) * v * dtop * 0.8 + Math.sin(dtop * 3 + k) * 4;
      const y = A.y + Math.sin(a) * v * dtop + 0.5 * 60 * dtop * dtop * 0.9;
      const fade = Math.min(1, (3.6 - dtop) / 0.8);
      ctx.globalAlpha = fade; ctx.fillStyle = cols[k % cols.length];
      const flip = Math.floor(dtop * 10 + k) % 2;
      ctx.fillRect(Math.round(x), Math.round(y), flip ? 3 : 2, flip ? 2 : 3);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- HUD (screen space)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (dtop >= 0 && dtop < 0.35) { ctx.fillStyle = `rgba(255,250,220,${0.4 * (1 - dtop / 0.35)})`; ctx.fillRect(0, 0, cv.width, cv.height); }
  const hM = Math.max(0, (D.WALL_Y1 - (B.y - 30)) / D.PX_PER_M - 0.0);
  const bx = cv.width - 30, by = 44, bh = 300;
  ctx.fillStyle = 'rgba(10,12,18,0.72)'; ctx.fillRect(bx - 8, by - 30, 30, bh + 58);
  ctx.fillStyle = '#1c3a36'; ctx.fillRect(bx, by, 14, bh);
  const fill = Math.min(1, hM / 15) * bh;
  ctx.fillStyle = 'rgb(96,236,196)'; ctx.fillRect(bx, by + bh - fill, 14, fill);
  for (let m = 0; m <= 15; m += 5) { ctx.fillStyle = '#eef1f6'; ctx.fillRect(bx - 4, by + bh - m / 15 * bh, 4, 2); }
  ctx.font = 'bold 13px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#eef1f6';
  ctx.fillText(dtop >= 0 && dtop < 3.4 ? 'TOP' : hM.toFixed(1) + 'm', bx + 7, by + bh + 22);
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(10,12,18,0.72)'; ctx.fillRect(10, 10, 150, 26);
  ctx.fillStyle = `rgb(${R.col.join(',')})`; ctx.fillRect(18, 18, 10, 10);
  ctx.fillStyle = '#eef1f6'; ctx.fillText('Route 4 · ' + R.name, 34, 28);
}

// ---------- loop + controls
let t0 = performance.now(), paused = false, pauseAt = 0, seekT = null;
function now() { return seekT !== null ? seekT : paused ? pauseAt : (performance.now() - t0) / 1000; }
function loop() { render(now()); requestAnimationFrame(loop); }
window.__seek = t => { seekT = t; render(t); };
window.__info = () => ({ T: TL.T, tTop: TL.tTop, mode: MODE, poses: TL.poses.length, clips: TL.clips.map(c => +c.t.toFixed(2)) });
window.__setMode = m => setMode(m);
function setMode(m) {
  if (m === 'climb' && !SP.climb) return;
  MODE = m; build(); t0 = performance.now();
  document.getElementById('mWalk').setAttribute('aria-pressed', m === 'walk');
  document.getElementById('mClimb').setAttribute('aria-pressed', m === 'climb');
}
document.getElementById('mWalk').onclick = () => setMode('walk');
document.getElementById('mClimb').onclick = () => setMode('climb');
document.getElementById('bPause').onclick = e => {
  if (!paused) { pauseAt = now(); paused = true; e.target.textContent = 'Weiter'; }
  else { t0 = performance.now() - pauseAt * 1000; paused = false; e.target.textContent = 'Pause'; }
};
document.getElementById('bRestart').onclick = () => { seekT = null; paused = false; t0 = performance.now(); document.getElementById('bPause').textContent = 'Pause'; };

(async () => {
  IM.wall = await loadImg(WALL_SRC);
  for (const k of Object.keys(SP)) {
    IM[k] = await Promise.all(SP[k].src.map(loadImg));
    IM[k + 'Sil'] = IM[k].map(silhouette);
  }
  if (!SP.climb) { document.getElementById('mClimb').disabled = true; document.getElementById('note').textContent = 'Nur Gehzyklus-Ersatz eingebettet.'; }
  else document.getElementById('note').textContent = 'Kletter-Animation: eigene PixelLab-Animation (Kiti, Blick nach Norden). Gehzyklus zum Vergleich.';
  setMode(MODE);
  document.body.dataset.ready = '1';
  loop();
})();

window.__fx = (ctx) => {
  const t = performance.now() / 1000;
  // Adler kreist vor der Wand, Staubkoerner treiben im Aufwind
  const gx = 350 + Math.cos(t * 0.4) * 220, gy = 220 + Math.sin(t * 0.4) * 60, f = Math.sin(t * 5) > 0 ? -2 : 1;
  ctx.fillStyle = '#3b2618';
  ctx.fillRect(Math.round(gx) - 1, Math.round(gy), 3, 2);
  ctx.fillRect(Math.round(gx) - 8, Math.round(gy) + f, 7, 1); ctx.fillRect(Math.round(gx) + 2, Math.round(gy) + f, 7, 1);
  for (let i = 0; i < 50; i++) {
    const x = (i * 131 + Math.sin(t + i) * 20) % 700, y = 580 - ((t * (10 + i % 7) + i * 97) % 600);
    ctx.fillStyle = i % 2 ? 'rgba(240,200,150,0.55)' : 'rgba(190,130,90,0.5)';
    ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
  }
};
</script>
</body>
