<style>

  #tl { flex: 1; min-width: 160px; accent-color: var(--accent); }

</style>

// ------------------------------------------------------------------ pixel font 3x5
const FONT = {

  "5":"111100111001111","6":"111100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001111",

  "U":"101101101101111","V":"101101101101010","W":"101101111111101","X":"101101010101101","Y":"101101010010010",
  "Z":"111001010100111"};
function text(s, x, y, col, k) {
  ctx.fillStyle = col;
  for (const ch of s) {
    const g = FONT[ch] || FONT[" "];
    for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++) if (g[j * 3 + i] === "1") ctx.fillRect(x + i * k, y + j * k, k, k);
    x += 4 * k;
  }
}
const textW = (s, k) => s.length * 4 * k - k;
const rgb = (c, f = 1) => `rgb(${Math.min(255, c[0] * f) | 0},${Math.min(255, c[1] * f) | 0},${Math.min(255, c[2] * f) | 0})`;

// ------------------------------------------------------------------ pieces (side silhouettes, 3 px core)
const PB = {
  P: [".#.", "###", ".#.", "###"],
  R: ["#.#", "###", "###", "###", "###"],
  N: [".#.", "###", "##.", "##.", ".#.", "###"],          // faces east (white); black mirrored
  B: [".#.", "###", "###", ".#.", ".#.", "###"],
  Q: ["#.#", ".#.", "###", ".#.", ".#.", ".#.", "###"],
  K: [".#.", "###", ".#.", "###", ".#.", ".#.", ".#.", "###"],
};
const PCOL = {
  w: { fill: [238, 228, 204], hi: [255, 250, 236], sh: [190, 172, 140], ol: [44, 30, 22] },
  b: { fill: [58, 48, 44], hi: [128, 110, 96], sh: [30, 24, 22], ol: [10, 7, 7] },
};
function bitmap(type, color) {
  const b = PB[type];
  return color === 'b' && type === 'N' ? b.map(r => r.split('').reverse().join('')) : b;
}
// precomputed outline masks: 5 wide, h+2 tall (1 px ring around the core)
const PMASK = {};
for (const t in PB) for (const c of ['w', 'b']) {
  const bm = bitmap(t, c), h = bm.length, m = [];
  for (let j = -1; j <= h; j++) {
    const row = [];
    for (let i = -1; i <= 3; i++) {
      const core = j >= 0 && j < h && i >= 0 && i < 3 && bm[j][i] === '#';
      let ring = false;
      if (!core) for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        const jj = j + dj, ii = i + di;
        if (jj >= 0 && jj < h && ii >= 0 && ii < 3 && bm[jj][ii] === '#') ring = true;
      }
      // shading: left-most core pixel of a row = highlight, right-most = shade
      let kind = core ? 'fill' : ring ? 'ol' : null;
      if (core) {
        const r = bm[j];
        const first = r.indexOf('#'), last = r.lastIndexOf('#');
        if (i === first && last > first) kind = 'hi';
        else if (i === last && last > first) kind = 'sh';
      }
      row.push(kind);
    }
    m.push(row);
  }
  PMASK[t + c] = m;
}
// piece position = render px of the outline box's left column and of the core's bottom row
function drawPiece(p, x, yb) {
  const m = PMASK[p.type + p.color], col = PCOL[p.color], h = PB[p.type].length;
  for (let j = 0; j < m.length; j++) for (let i = 0; i < 5; i++) {
    const k = m[j][i];
    if (!k) continue;
    ctx.fillStyle = rgb(col[k]);
    ctx.fillRect(x + i * S, yb + (j - h) * S, S, S);
  }
}
const pieceH = t => PB[t].length;

// ------------------------------------------------------------------ board geometry
const FILES = "abcdefgh";
function sqPos(sq) {                      // render px: [x of outline column = cell left, y of core bottom row]
  const f = FILES.indexOf(sq[0]), r = +sq[1];

const START = [];
function put(color, list) { for (const s of list.split(' ')) START.push({ id: color + s, color, type: s[0], sq: s.slice(1) }); }

const PL = SC.players;

function restHand(name) {
  const p = PL[name];

  return p.facing > 0 ? [(SC.TX0 + 10) * S, (SC.TY1 - 2) * S] : [(SC.TX1 - 10) * S, (SC.TY1 - 2) * S];

function minLean(name, h) {           // smallest lean (native px) that keeps the hand 3 render px inside the reach

  TL.releases.push({ t: K(0.15, tG), id: moverId, to: toSq });             // set down exactly on the grid
  K(0.30, [btnHand(btn, false)[0], btnHand(btn, false)[1] - 7 * S]);       // over the clock
  const tc = K(0.07, btnHand(btn, false));                                 // contact with the raised plunger

  TL.slaps.push({ t: tc, side, dur: 0.06 });

  // lean per key: the minimum that keeps the hand inside the arm's reach, a bit of anticipation
  for (const k of keys) if (k.lean === undefined) k.lean = minLean(name, [k.x, k.y]);

}
const T_END_W = buildMove('arlen', 'w', 0, 0.9, 'wNf3', 'f3', 'e5', 'bPe5');
const T_END_B = buildMove('kaijo', 'b', T_END_W, 0.75, 'bNc6', 'c6', 'e5', 'wNf3');
TL.keys.kaijo.unshift({ t: 0, x: restHand('kaijo')[0], y: restHand('kaijo')[1], lean: 0 });
TL.keys.arlen.push({ t: T_END_B, x: restHand('arlen')[0], y: restHand('arlen')[1], lean: 0 });
const HOLD = 1.4, FADE = 0.45;
const TOTAL = T_END_B + HOLD + FADE;
// lean: widen each lean bump a little so the torso starts before the hand and settles after it
function smooth(u) { u = Math.min(1, Math.max(0, u)); return u * u * (3 - 2 * u); }
function track(name, t) {

  for (let i = 1; i < k.length; i++) {

// ------------------------------------------------------------------ state at time t
function pieceStates(t, hands) {
  const out = [];

    let pos = sqPos(p.sq), sq = p.sq, held = null;
    const ev = TL.grabs.filter(e => e.id === p.id).map(e => ({ ...e, k: 'g' }))
      .concat(TL.releases.filter(e => e.id === p.id).map(e => ({ ...e, k: 'r' }))).sort((a, b) => a.t - b.t);
    for (const e of ev) {
      if (t < e.t) break;
      if (e.k === 'g') held = e.who;

    if (held) { const h = hands[held], gp = grip(p.type, [0, 0]); pos = [h.x - gp[0], h.y - gp[1]]; }
    out.push({ p, x: pos[0], y: pos[1], held, sq });

}
function clockState(t) {
  // white runs from 0; every slap hands the clock over
  let run = 'w', w = 161, b = 137, last = 0;
  for (const s of TL.slaps) {
    if (t < s.t) break;
    if (run === 'w') w -= s.t - last; else b -= s.t - last;
    run = s.side === 'w' ? 'b' : 'w'; last = s.t;
  }
  if (run === 'w') w -= t - last; else b -= t - last;

  // start: black's plunger is down -> white's clock runs
  let btn = [0, 1];
  for (const s of TL.slaps) {
    if (t < s.t) break;

// ------------------------------------------------------------------ drawing
const IM = {};
function line1(x0, y0, x1, y1, col) {        // 1 render px Bresenham
  ctx.fillStyle = col;
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) { ctx.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function thick(x0, y0, x1, y1, w, col) {     // square-stamped thick pixel line
  ctx.fillStyle = col;
  const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
  const o = Math.floor(w / 2);
  for (let i = 0; i <= n; i++) {
    const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
    ctx.fillRect(x - o, y - o, w, w);
  }
}
function ik(sh, h, facing) {
  let dx = h[0] - sh[0], dy = h[1] - sh[1], d = Math.hypot(dx, dy);
  const over = Math.max(0, d - REACH);
  const dd = Math.min(Math.max(d, Math.abs(ARM_U - ARM_F) + 1), REACH);
  const a = Math.atan2(dy, dx);
  const c = Math.min(1, Math.max(-1, (ARM_U * ARM_U + dd * dd - ARM_F * ARM_F) / (2 * ARM_U * dd)));
  const al = Math.acos(c);
  // elbow bends down and back (away from the facing direction)
  const e1 = [sh[0] + ARM_U * Math.cos(a + al), sh[1] + ARM_U * Math.sin(a + al)];
  const e2 = [sh[0] + ARM_U * Math.cos(a - al), sh[1] + ARM_U * Math.sin(a - al)];
  const el = (e1[1] > e2[1]) ? e1 : e2;

}
function drawArm(name, hand, lean) {
  const p = PL[name], sh = shoulder(name, lean), hc = HANDCOL[name];
  const { el, over } = ik(sh, [hand.x, hand.y], p.facing);
  const ol = rgb(hc.ol), sl = rgb(name === 'kaijo' ? [46, 46, 58] : p.sleeve), hi = rgb(SLEEVE_HI[name]);
  thick(sh[0], sh[1], el[0], el[1], 8, ol);
  thick(el[0], el[1], hand.x, hand.y, 7, ol);
  thick(sh[0], sh[1], el[0], el[1], 6, sl);
  thick(el[0], el[1], hand.x, hand.y, 5, sl);
  thick(sh[0], sh[1] - 2, el[0], el[1] - 2, 1, hi);
  // hand: 6x5 mitt, outlined, thumb towards the body
  ctx.fillStyle = ol; ctx.fillRect(hand.x - 4, hand.y - 3, 8, 7);
  ctx.fillStyle = rgb(hc.skin); ctx.fillRect(hand.x - 3, hand.y - 2, 6, 5);
  ctx.fillStyle = rgb(hc.skin, 1.12); ctx.fillRect(hand.x - 3, hand.y - 2, 6, 1);

}
function drawPlayer(name, lean) {
  // lean = shear: the hip row stays on the chair, the head moves the full amount, rows in
  // between move proportionally (2 render px strips) -- no seam at the hip
  const p = PL[name], im = IM[name];
  const cut = p.hipy - 4, full = Math.round(lean * S) * p.facing;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, WR, HR);
  ctx.rect(SC.TX0 * S, SC.TABLE_MID * S, (SC.TX1 - SC.TX0) * S, HR);     // under the table's near half
  ctx.clip('evenodd');
  ctx.drawImage(im, 0, cut, p.w, p.h - cut, p.x, p.y + cut, p.w, p.h - cut);
  for (let y = 0; y < cut; y += 2) {
    const sh = Math.round(full * (cut - y) / cut);
    ctx.drawImage(im, 0, y, p.w, 2, p.x + sh, p.y + y, p.w, 2);

}
function shoulder(name, lean) {
  const p = PL[name], cut = p.hipy - 4, yy = p.shoulder[1] - p.y;
  return [p.shoulder[0] + Math.round(Math.round(lean * S) * p.facing * (cut - yy) / cut), p.shoulder[1]];
}
function drawClock(cs) {
  const C = SC.CLOCK, n = (x, y, w, h, col) => { ctx.fillStyle = rgb(col); ctx.fillRect(x * S, y * S, w * S, h * S); };
  const w = C.x1 - C.x0;
  // plungers (behind the top face's front edge)
  for (let i = 0; i < 2; i++) {
    const [b0, b1] = SC.BUTTONS[i];
    const top = btnTop(i, false) + (btnTop(i, true) - btnTop(i, false)) * cs.btn[i];
    const y = Math.round(top);
    const bw = (b1 - b0) * S;
    ctx.fillStyle = '#100c0b'; ctx.fillRect(b0 * S, y, bw, BTN_BASE * S - y + S);           // outline / stem
    ctx.fillStyle = '#8f9097'; ctx.fillRect(b0 * S + 1, y + 1, bw - 2, BTN_BASE * S - y - 1); // chrome plunger
    ctx.fillStyle = '#e6e7ec'; ctx.fillRect(b0 * S + 1, y + 1, bw - 2, 2);                   // lit cap
    ctx.fillStyle = '#c4c5cc'; ctx.fillRect(b0 * S + 1, y + 3, 2, Math.max(0, BTN_BASE * S - y - 3));
  }

  n(C.x0, C.top, w, 1, [150, 96, 56]);
  n(C.x0, C.face0, w, C.base - C.face0, [92, 52, 30]);  // front face
  n(C.x0, C.face0, w, 1, [62, 34, 20]);
  n(C.x0, C.base - 1, w, 1, [48, 26, 16]);
  n(C.x0 - 1, C.base, w + 2, 1, [20, 30, 24]);     // contact shadow on the cloth
  // dials, drawn at render resolution
  const rem = [cs.w, cs.b];
  for (let i = 0; i < 2; i++) {
    const cx = SC.DIALS[i][0] * S + 1, cy = SC.DIALS[i][1] * S + 1;
    ctx.fillStyle = '#100a08';
    for (let y = -7; y <= 7; y++) for (let x = -7; x <= 7; x++) if (x * x + y * y <= 44) ctx.fillRect(cx + x, cy + y, 1, 1);
    ctx.fillStyle = '#efe6cf';
    for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++) if (x * x + y * y <= 30) ctx.fillRect(cx + x, cy + y, 1, 1);
    ctx.fillStyle = '#b2a58a';

}
const fmt = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const TEAMC = { 'V-W': [196, 44, 52], 'A-A': [40, 160, 84] };
// 8x8 diagram glyphs for the broadcast board
const G8 = {
  P: ["........", "...##...", "..####..", "..####..", "...##...", "..####..", ".######.", "........"],
  R: ["........", ".#.##.#.", ".######.", "..####..", "..####..", "..####..", ".######.", "........"],
  N: ["...#....", "..####..", ".######.", "##.####.", "...####.", "..####..", ".######.", "........"],
  B: ["...##...", "..#.##..", "..##.#..", "..####..", "...##...", "..####..", ".######.", "........"],
  Q: [".#.##.#.", "..####..", "..####..", "...##...", "...##...", "..####..", ".######.", "........"],
  K: ["...##...", "..####..", "...##...", "..####..", "..####..", "...##...", ".######.", "........"],

function glyph(type, color, x, y) {
  const g = G8[type];
  const on = (i, j) => j >= 0 && j < 8 && i >= 0 && i < 8 && g[j][i] === '#';
  ctx.fillStyle = color === 'w' ? '#2c1e16' : '#0a0707';
  for (let j = -1; j <= 8; j++) for (let i = -1; i <= 8; i++) if (!on(i, j) && (on(i - 1, j) || on(i + 1, j) || on(i, j - 1) || on(i, j + 1))) ctx.fillRect(x + i, y + j, 1, 1);

    ctx.fillStyle = color === 'w' ? (i < 4 ? '#fffaf0' : '#e2d5b8') : (i < 4 ? '#4a3f3a' : '#241e1c');

function drawHUD(t, cs, ps) {
  // top bar: team tag, name, clock | clock, name, team tag
  const k = 2, kt = 3, cy = 8;
  const L = 'KING ARLEN', R = 'KAIJO MURANE';
  const tw = textW('0:00', kt) + 10;
  const total = 26 + textW(L, k) + 8 + tw + 6 + tw + 8 + textW(R, k) + 26;
  let x = Math.round(VW / 2 - total / 2);
  ctx.fillStyle = 'rgba(12,8,8,0.82)'; ctx.fillRect(x - 6, cy - 4, total + 12, 27);
  ctx.fillStyle = rgb(TEAMC['V-W']); ctx.fillRect(x, cy, 20, 19); text('VW', x + 3, cy + 5, '#fff', 2); x += 26;
  text(L, x, cy + 5, '#efe3cc', k); x += textW(L, k) + 8;
  for (const side of ['w', 'b']) {
    const on = cs.run === side;
    ctx.fillStyle = on ? '#e3a83a' : '#2a221e'; ctx.fillRect(x, cy, tw, 19);
    text(fmt(side === 'w' ? cs.w : cs.b), x + 5, cy + 2, on ? '#1a1008' : '#8d7f70', kt);
    x += tw + 6;
  }
  x += 2;
  text(R, x, cy + 5, '#efe3cc', k); x += textW(R, k) + 6;
  ctx.fillStyle = rgb(TEAMC['A-A']); ctx.fillRect(x, cy, 20, 19); text('AA', x + 3, cy + 5, '#fff', 2);

  const cell = 10, bx = VW - 8 * cell - 8, by = 40;
  ctx.fillStyle = 'rgba(12,8,8,0.82)'; ctx.fillRect(bx - 4, by - 14, 8 * cell + 8, 8 * cell + 30);
  text('BRETT 1/3', bx, by - 10, '#d9c8a8', 1);
  text('BLITZ 3+0', bx + 8 * cell - textW('BLITZ 3+0', 1), by - 10, '#8d7f70', 1);
  const last = TL.releases.filter(r => t >= r.t && !r.to.startsWith('tray')).pop();
  const lastFrom = last ? (last.id === 'wNf3' ? 'f3' : 'c6') : null;
  for (let f = 0; f < 8; f++) for (let r = 1; r <= 8; r++) {
    const x = bx + f * cell, y = by + (8 - r) * cell, sq = FILES[f] + r;
    const dark = (f + r) % 2 === 0;
    let c = dark ? [148, 96, 56] : [226, 206, 160];

    const f = FILES.indexOf(s.sq[0]), r = +s.sq[1];

  text(mv, bx, by + 8 * cell + 5, '#efe3cc', 1);
}

// ------------------------------------------------------------------ frame
function render(t, opt = {}) {
  const players = opt.players !== false, hud = opt.hud !== false;
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(1, 0, 0, 1, -VX, -VY);
  ctx.drawImage(IM.bg, 0, 0);

  const hands = { arlen: track('arlen', t), kaijo: track('kaijo', t) };
  if (!players) { hands.arlen.lean = 0; hands.kaijo.lean = 0; }
  ctx.drawImage(IM.table, 0, 0);
  const ps = pieceStates(t, hands);
  const rest = ps.filter(s => !s.held).sort((a, b) => a.y - b.y || a.x - b.x);
  // depth order: far files (behind the players' depth) -> players -> near files
  const mid = SC.TABLE_MID * S;

  if (players) { drawPlayer('arlen', hands.arlen.lean); drawPlayer('kaijo', hands.kaijo.lean); }

  if (t > TOTAL - FADE) a = (t - (TOTAL - FADE)) / FADE;
  if (t < 0.3 && opt.fade !== false) a = Math.max(a, 1 - t / 0.3);
  if (a > 0 && opt.fade !== false) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, a)})`; ctx.fillRect(0, 0, VW, VH); }
  return { probe: { pieces: ps.map(s => ({ id: s.p.id, x: s.x, y: s.y, held: s.held, sq: s.sq })), hands, over, clock: cs, fade: a } };
}

// ------------------------------------------------------------------ playback
let playing = !location.hash.includes('static'), slow = 1, tNow = 0, lastTs = null;
const tl = document.getElementById('tl'), lbl = document.getElementById('lbl');
function frame(ts) {
  if (lastTs !== null && playing) tNow = (tNow + Math.max(0, ts - lastTs) / 1000 * slow) % TOTAL;
  lastTs = ts;
  render(tNow);
  tl.value = Math.round(tNow / TOTAL * 1000);
  lbl.textContent = `${tNow.toFixed(2)} s / ${TOTAL.toFixed(2)} s`;
  if (!location.hash.includes('static')) requestAnimationFrame(frame);
}
document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Abspielen'; };
document.getElementById('slow').onclick = e => { slow = slow === 1 ? 0.25 : 1; e.target.textContent = slow === 1 ? 'Zeitlupe: aus' : 'Zeitlupe: an'; };
tl.oninput = () => { tNow = tl.value / 1000 * TOTAL; playing = false; document.getElementById('play').textContent = 'Abspielen'; };

let pending = Object.keys(IMGS).length;
for (const [k, src] of Object.entries(IMGS)) {
  const im = new Image();
  im.onload = () => { if (--pending === 0) { window.READY = true; if (!location.hash.includes('static')) requestAnimationFrame(frame); else render(0.5); } };
  im.src = src; IM[k] = im;
}
window.render = render; window.TOTAL = TOTAL; window.TL = TL; window.SC = SC; window.sqPos = sqPos; window.TRAYPOS = TRAYPOS;
window.grip = grip; window.REACH = REACH; window.T_END_W = T_END_W; window.T_END_B = T_END_B;

window.__fx = (ctx) => {
  const t = performance.now() / 1000;
  // fallendes Laub, Wasserstrahl im Brunnen
  const cols = ['#cc6028', '#e28c32', '#b44024', '#ecb848'];
  for (let i = 0; i < 26; i++) {
    const sp = 14 + (i * 7) % 12, x0 = (i * 97) % 576;
    const y = (i * 53 + t * sp) % 330 - 6, x = x0 + Math.sin(t * 1.5 + i) * 10;
    ctx.fillStyle = cols[i % 4];

  }
  ctx.fillStyle = 'rgba(200,230,255,0.8)';
  for (let i = 0; i < 10; i++) {
    const ph = (t * 1.2 + i / 10) % 1, a = (i % 2 ? 1 : -1) * (6 + i * 1.5);
    ctx.fillRect(Math.round(100 + a * ph), Math.round(136 - 28 * ph + 40 * ph * ph), 2, 2);

};
