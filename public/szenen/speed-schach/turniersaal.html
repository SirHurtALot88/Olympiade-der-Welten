<style>
  :root { --bg: #120d0b; --fg: #e8dcc8; --dim: #9a8b78; --accent: #d9a441; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #efe7da; --fg: #2a211a; --dim: #6b5d4e; --accent: #8a5a12; } }

  button { font: inherit; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--dim); background: transparent; color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #tl { flex: 1; min-width: 160px; accent-color: var(--accent); }
  #lbl { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 120px; }
</style>

    ctx.fillStyle = '#100a08';
    for (let y = -7; y <= 7; y++) for (let x = -7; x <= 7; x++) if (x * x + y * y <= 44) ctx.fillRect(cx + x, cy + y, 1, 1);
    ctx.fillStyle = '#efe6cf';
    for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++) if (x * x + y * y <= 30) ctx.fillRect(cx + x, cy + y, 1, 1);
    ctx.fillStyle = '#b2a58a';
    for (const [x, y] of [[0, -5], [5, 0], [0, 5], [-5, 0]]) ctx.fillRect(cx + x, cy + y, 1, 1);
    ctx.fillStyle = '#c0282c'; ctx.fillRect(cx + 1, cy - 6, 2, 2);              // flag at twelve
    const r = rem[i];
    const am = 2 * Math.PI * (1 - (r / 60) / 60), as = 2 * Math.PI * ((60 - (r % 60)) / 60);
    line1(cx, cy, cx + Math.sin(am) * 5, cy - Math.cos(am) * 5, '#1a1210');   // minute hand
    line1(cx, cy, cx + Math.sin(as) * 5, cy - Math.cos(as) * 5, '#c0282c');   // sweep hand (only runs on the live side)
    ctx.fillStyle = '#1a1210'; ctx.fillRect(cx, cy, 1, 1);
  }
}
const fmt = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const TEAMC = { 'V-W': [196, 44, 52], 'A-A': [40, 160, 84] };
// 8x8 diagram glyphs for the broadcast board
const G8 = {
  P: ["........", "...##...", "..####..", "..####..", "...##...", "..####..", ".######.", "........"],
  R: ["........", ".#.##.#.", ".######.", "..####..", "..####..", "..####..", ".######.", "........"],
  N: ["...#....", "..####..", ".######.", "##.####.", "...####.", "..####..", ".######.", "........"],
  B: ["...##...", "..#.##..", "..##.#..", "..####..", "...##...", "..####..", ".######.", "........"],
  Q: [".#.##.#.", "..####..", "..####..", "...##...", "...##...", "..####..", ".######.", "........"],
  K: ["...##...", "..####..", "...##...", "..####..", "..####..", "...##...", ".######.", "........"],
};
function glyph(type, color, x, y) {
  const g = G8[type];
  const on = (i, j) => j >= 0 && j < 8 && i >= 0 && i < 8 && g[j][i] === '#';
  ctx.fillStyle = color === 'w' ? '#2c1e16' : '#0a0707';
  for (let j = -1; j <= 8; j++) for (let i = -1; i <= 8; i++) if (!on(i, j) && (on(i - 1, j) || on(i + 1, j) || on(i, j - 1) || on(i, j + 1))) ctx.fillRect(x + i, y + j, 1, 1);
  for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) if (on(i, j)) {
    ctx.fillStyle = color === 'w' ? (i < 4 ? '#fffaf0' : '#e2d5b8') : (i < 4 ? '#4a3f3a' : '#241e1c');
    ctx.fillRect(x + i, y + j, 1, 1);
  }
}
function drawHUD(t, cs, ps) {
  // top bar: team tag, name, clock | clock, name, team tag
  const k = 2, kt = 3, cy = 8;
  const L = 'KING ARLEN', R = 'KAIJO MURANE';
  const tw = textW('0:00', kt) + 10;
  const total = 26 + textW(L, k) + 8 + tw + 6 + tw + 8 + textW(R, k) + 26;
  let x = Math.round(VW / 2 - total / 2);
  ctx.fillStyle = 'rgba(12,8,8,0.82)'; ctx.fillRect(x - 6, cy - 4, total + 12, 27);
  ctx.fillStyle = rgb(TEAMC['V-W']); ctx.fillRect(x, cy, 20, 19); text('VW', x + 3, cy + 5, '#fff', 2); x += 26;
  text(L, x, cy + 5, '#efe3cc', k); x += textW(L, k) + 8;
  for (const side of ['w', 'b']) {
    const on = cs.run === side;
    ctx.fillStyle = on ? '#e3a83a' : '#2a221e'; ctx.fillRect(x, cy, tw, 19);
    text(fmt(side === 'w' ? cs.w : cs.b), x + 5, cy + 2, on ? '#1a1008' : '#8d7f70', kt);
    x += tw + 6;
  }
  x += 2;
  text(R, x, cy + 5, '#efe3cc', k); x += textW(R, k) + 6;
  ctx.fillStyle = rgb(TEAMC['A-A']); ctx.fillRect(x, cy, 20, 19); text('AA', x + 3, cy + 5, '#fff', 2);
  // broadcast board (top right): pieces jump when a move is released (UI, not the scene)
  const cell = 10, bx = VW - 8 * cell - 8, by = 40;
  ctx.fillStyle = 'rgba(12,8,8,0.82)'; ctx.fillRect(bx - 4, by - 14, 8 * cell + 8, 8 * cell + 30);
  text('BRETT 1/3', bx, by - 10, '#d9c8a8', 1);
  text('BLITZ 3+0', bx + 8 * cell - textW('BLITZ 3+0', 1), by - 10, '#8d7f70', 1);
  const last = TL.releases.filter(r => t >= r.t && !r.to.startsWith('tray')).pop();
  const lastFrom = last ? (last.id === 'wNf3' ? 'f3' : 'c6') : null;
  for (let f = 0; f < 8; f++) for (let r = 1; r <= 8; r++) {
    const x = bx + f * cell, y = by + (8 - r) * cell, sq = FILES[f] + r;
    const dark = (f + r) % 2 === 0;
    let c = dark ? [148, 96, 56] : [226, 206, 160];
    if (last && (sq === last.to || sq === lastFrom)) c = dark ? [176, 150, 52] : [232, 222, 120];
    ctx.fillStyle = rgb(c); ctx.fillRect(x, y, cell, cell);
  }
  for (const s of ps) {
    if (s.held || s.sq.startsWith('tray')) continue;
    const f = FILES.indexOf(s.sq[0]), r = +s.sq[1];
    glyph(s.p.type, s.p.color, bx + f * cell + 1, by + (8 - r) * cell + 1);
  }
  const mv = t >= TL.releases[3].t ? '9. SXE5  SXE5' : t >= TL.releases[1].t ? '9. SXE5' : '9. ...';
  text(mv, bx, by + 8 * cell + 5, '#efe3cc', 1);
}

// ------------------------------------------------------------------ frame
function render(t, opt = {}) {
  const players = opt.players !== false, hud = opt.hud !== false;
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(1, 0, 0, 1, -VX, -VY);
  ctx.drawImage(IM.bg, 0, 0);
  const hands = { arlen: track('arlen', t), kaijo: track('kaijo', t) };
  if (!players) { hands.arlen.lean = 0; hands.kaijo.lean = 0; }
  ctx.drawImage(IM.table, 0, 0);
  const ps = pieceStates(t, hands);
  const rest = ps.filter(s => !s.held).sort((a, b) => a.y - b.y || a.x - b.x);
  // depth order: far files (behind the players' depth) -> players -> near files
  const mid = SC.TABLE_MID * S;
  for (const s of rest) if (s.y < mid) drawPiece(s.p, s.x, s.y);
  if (players) { drawPlayer('arlen', hands.arlen.lean); drawPlayer('kaijo', hands.kaijo.lean); }
  for (const s of rest) if (s.y >= mid) drawPiece(s.p, s.x, s.y);
  const cs = clockState(t);
  drawClock(cs);
  const over = { arlen: 0, kaijo: 0 };
  if (players) {
    for (const name of ['arlen', 'kaijo']) {
      for (const s of ps) if (s.held === name) drawPiece(s.p, s.x, s.y);
      over[name] = drawArm(name, hands[name], hands[name].lean);
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (hud) drawHUD(t, cs, ps);
  // loop fade (only in the last FADE seconds and the first 0.3 s)
  let a = 0;
  if (t > TOTAL - FADE) a = (t - (TOTAL - FADE)) / FADE;
  if (t < 0.3 && opt.fade !== false) a = Math.max(a, 1 - t / 0.3);
  if (a > 0 && opt.fade !== false) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, a)})`; ctx.fillRect(0, 0, VW, VH); }
  return { probe: { pieces: ps.map(s => ({ id: s.p.id, x: s.x, y: s.y, held: s.held, sq: s.sq })), hands, over, clock: cs, fade: a } };
}

// ------------------------------------------------------------------ playback
let playing = !location.hash.includes('static'), slow = 1, tNow = 0, lastTs = null;
const tl = document.getElementById('tl'), lbl = document.getElementById('lbl');
function frame(ts) {
  if (lastTs !== null && playing) tNow = (tNow + Math.max(0, ts - lastTs) / 1000 * slow) % TOTAL;
  lastTs = ts;
  render(tNow);
  tl.value = Math.round(tNow / TOTAL * 1000);
  lbl.textContent = `${tNow.toFixed(2)} s / ${TOTAL.toFixed(2)} s`;
  if (!location.hash.includes('static')) requestAnimationFrame(frame);
}
document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Abspielen'; };
document.getElementById('slow').onclick = e => { slow = slow === 1 ? 0.25 : 1; e.target.textContent = slow === 1 ? 'Zeitlupe: aus' : 'Zeitlupe: an'; };
tl.oninput = () => { tNow = tl.value / 1000 * TOTAL; playing = false; document.getElementById('play').textContent = 'Abspielen'; };

let pending = Object.keys(IMGS).length;
for (const [k, src] of Object.entries(IMGS)) {
  const im = new Image();
  im.onload = () => { if (--pending === 0) { window.READY = true; if (!location.hash.includes('static')) requestAnimationFrame(frame); else render(0.5); } };
  im.src = src; IM[k] = im;
}
window.render = render; window.TOTAL = TOTAL; window.TL = TL; window.SC = SC; window.sqPos = sqPos; window.TRAYPOS = TRAYPOS;
window.grip = grip; window.REACH = REACH; window.T_END_W = T_END_W; window.T_END_B = T_END_B;
window.exportFrame = (t, opt) => { render(t, Object.assign({ fade: false }, opt)); return cv.toDataURL('image/png'); };
</script>
</body>
