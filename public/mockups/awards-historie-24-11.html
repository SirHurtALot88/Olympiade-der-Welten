<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Awards, Medaillen und Historie – modern (Mockup 24.11.)</title>
<!--
  AWARDS, MEDAILLEN UND HISTORIE IM NEUEN STIL (Fable, 24.11.). Erklaerung: docs/design/awards-historie-24-11.md
  Fuenf Ansichten: Award-Katalog, Trophaeenschrank im Spielerprofil, Medaillen und Medaillenspiegel im Teamprofil,
  Team-Historie (je Liga getrennt), Spieler-Historie (ohne Liga-Trennung). Fuehrt historie-modern-18-11.html weiter.
  ECHT (Live-Abbild 24.11., Saison 1, 11 Spieltage gewertet; modern-24-11/daten.js): Teams, Liga, Tabelle, Punkte, Kasse, Kaderwert,
        Player Points und Einsaetze je Spieler, beste Disziplinen je Spieler, Stand der Disziplin-Wertung (Medaillen-Kurs).
  BEISPIEL (im UI markiert): alle abgeschlossenen Saisons (der Live-Stand steht in Saison 1), Gebaeudewert, Entwicklung (OVR),
        Spieler des Spieltags. Mit ?saisons=1 zeigt die Seite nur, was heute echt da ist.
  Embleme: public/sprites/awards/ (PixelLab, 14 Generationen; Silber und Bronze lokal umgefaerbt), Herkunft in quellen.json.
  URL: ?ansicht=katalog|schrank|medaillen|teams|spieler  ?saisons=5|1  ?liga=1|2  ?team=D-P|…  ?spieler=<slug>
       ?zeit=alle|saison  ?farbe=0..3  ?kader=1  ?sort=<spalte>&dir=-1|1  ?still=1
-->
<link rel="stylesheet" href="modern-24-11/rahmen.css">
<link rel="stylesheet" href="modern-24-11/bausteine.css">
<style>
:root{--silber:#cfd8e6;--bronze:#d68b52}
img.emb{image-rendering:pixelated;object-fit:contain;flex:none;width:3rem;height:3rem}
.g0{color:var(--gold)} .g1{color:var(--silber)} .g2{color:var(--bronze)}
.gsb{display:inline-flex;gap:.45rem;font-weight:700;font-size:1rem} .gsb i{font-style:normal;min-width:.9rem;text-align:right}
.gsb i.n0{opacity:.28}
.lf{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gut);border:1px solid rgba(98,211,148,.5);border-radius:.2rem;padding:.02rem .3rem;font-family:var(--zahl)}
.umsch{display:inline-flex;border:1px solid var(--linie-2);border-radius:.3rem;overflow:hidden;flex:none}
.umsch a{padding:.2rem .65rem;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--leise)!important}
.umsch a.an{background:var(--gold);color:#17120a!important}
.pk .bsp{margin-left:.1rem}
.tz .wap{width:1.9rem;height:1.9rem}
.tz .tn{display:flex;align-items:center;gap:.5rem;min-width:0} .tz .tn .nm{min-width:0}
.sz{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1} .sz b{font-size:1.04rem;color:var(--tinte)} .sz small{font-size:.66rem;color:var(--stumm);font-weight:700}
.sz.r1 small{color:var(--gold)} .sz.r2 small{color:var(--silber)} .sz.r3 small{color:var(--bronze)} .sz.lauf b{color:var(--gut)}
.and{font-size:.66rem;font-weight:700;color:var(--stumm);border:1px dashed var(--linie);border-radius:.2rem;padding:0 .25rem}
.zn{font-weight:700;font-size:1.02rem} .zn.n0{color:var(--stumm);font-weight:500}
.zw2{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.02} .zw2 b{font-size:1rem} .zw2 small{font-size:.68rem;font-weight:700}
svg.spark{width:100%;height:1.5rem;display:block;overflow:visible}

/* ---------- Katalog ---------- */
.seite.kat{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
.ak{display:grid;grid-template-columns:8.6rem minmax(0,1fr);gap:.2rem .8rem;padding:.7rem .85rem .6rem .6rem;background:var(--flaeche-1);border:1px solid var(--linie);border-top:.2rem solid var(--linie-2);border-radius:var(--r);min-width:0;min-height:0;overflow:hidden}
.ak.f0{border-top-color:var(--pow)} .ak.f1{border-top-color:var(--spe)} .ak.f2{border-top-color:var(--men)} .ak.f3{border-top-color:var(--soc)} .ak.team{border-top-color:var(--gast)}
.ak .eb{display:grid;grid-template-columns:1fr 1fr;justify-items:center;align-content:center;gap:.2rem;background:radial-gradient(circle at 50% 38%,rgba(240,195,90,.16),transparent 68%)}
.ak .eb img:first-child{grid-column:1/3;width:6.6rem;height:6.6rem} .ak .eb img{width:3.3rem;height:3.3rem}
.ak .tx{display:flex;flex-direction:column;min-width:0;min-height:0}
.ak h3{margin:0;font:400 1.3rem/1.1 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ak .tg{display:flex;gap:.3rem;margin:.3rem 0 .35rem;flex-wrap:wrap;height:1.3rem;overflow:hidden}
.ak p{margin:0;font-size:.88rem;line-height:1.25;color:var(--leise)} .ak p b{color:var(--tinte);font-weight:600}
.ak .ks{margin-top:auto;border-top:1px solid var(--linie);padding-top:.25rem}
.ak .ks h4{margin:0 0 .1rem;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--stumm);font-weight:700;display:flex;gap:.4rem;align-items:center}
.ak .ks div{display:grid;grid-template-columns:1.1rem minmax(0,1fr) auto;gap:.3rem;font-size:.9rem;line-height:1.28;white-space:nowrap}
.ak .ks div span{overflow:hidden;text-overflow:ellipsis;color:var(--tinte)} .ak .ks div small{color:var(--stumm);font-size:.78rem} .ak .ks div b{color:var(--creme)}
.ak.info{grid-column:span 2;grid-template-columns:1fr 1fr;padding:.75rem 1rem;border-top-color:var(--gold);gap:.2rem 1.4rem}
.ak.info h3{font-size:1.15rem;margin-bottom:.3rem} .ak.info li{font-size:.88rem;line-height:1.3;color:var(--leise);margin-bottom:.22rem} .ak.info ul{margin:0;padding-left:1rem} .ak.info li b{color:var(--tinte);font-weight:600}

/* ---------- Trophaeenschrank ---------- */
.seite.sch{grid-template-columns:22.5rem minmax(0,1fr) 33rem}
.held{display:flex;flex-direction:column;align-items:center;gap:.3rem;text-align:center;flex:none}
.held .bild{width:9rem;height:9rem;border-radius:.6rem;overflow:hidden;border:1px solid var(--linie-2);background:var(--flaeche-3) center/45% no-repeat} .held .bild img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.held h3{margin:.3rem 0 0;font:400 1.8rem/1 var(--haus);color:#fff}
.held .zl{display:flex;gap:.6rem;align-items:center;font-size:.9rem;color:var(--leise)}
.summe{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.7rem 0 .5rem;flex:none}
.stat{flex:1;min-height:0;overflow:hidden;margin-top:.6rem} .stat h4{margin:0 0 .2rem;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
.stat div{display:grid;grid-template-columns:1.9rem minmax(0,1fr) auto;gap:.5rem;align-items:center;padding:.22rem 0;border-top:1px solid rgba(244,230,196,.07);font-size:.9rem;white-space:nowrap} .stat div span{overflow:hidden;text-overflow:ellipsis;color:var(--tinte)} .stat div small{color:var(--stumm);margin-left:.3rem} .stat div b{color:var(--creme)}
#s-schrank .tz .nm b{font-size:.9rem;white-space:normal;line-height:1.02} #s-medaillen .tz .nm b{font-size:.96rem} #s-schrank .tz .wap{width:1.7rem;height:1.7rem}
.summe div{display:flex;flex-direction:column;align-items:center;padding:.5rem 0 .4rem;border:1px solid var(--linie);border-radius:.4rem;background:var(--flaeche-2)}
.summe strong{font-size:2rem;line-height:1;font-weight:700} .summe small{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
.wechsel{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:auto} .wechsel a{font-size:.8rem;padding:.15rem .5rem;border:1px solid var(--linie);border-radius:1rem;color:var(--leise);white-space:nowrap} .wechsel a.an{border-color:var(--gold);color:var(--gold)}
.regal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:.6rem;flex:1;min-height:0}
.tro{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;padding:.4rem .4rem .5rem;border-radius:.5rem;border:1px solid var(--linie);background:linear-gradient(180deg,var(--flaeche-2),var(--flaeche-1));text-align:center;min-width:0;min-height:0;overflow:hidden}
.tro::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:.18rem;border-radius:2px;background:currentColor;opacity:.7}
.tro.g0{border-color:rgba(240,195,90,.5);background:radial-gradient(circle at 50% 34%,rgba(240,195,90,.2),transparent 70%),var(--flaeche-2)}
.tro.g1{border-color:rgba(207,216,230,.4);background:radial-gradient(circle at 50% 34%,rgba(207,216,230,.14),transparent 70%),var(--flaeche-2)}
.tro.g2{border-color:rgba(214,139,82,.45);background:radial-gradient(circle at 50% 34%,rgba(214,139,82,.16),transparent 70%),var(--flaeche-2)}
.tro img.emb{width:auto;height:50%;max-height:7rem;aspect-ratio:1}
.tro b{font:400 1.02rem/1.08 var(--haus);color:#fff;max-width:100%;text-wrap:balance}
.tro small{font-size:.8rem;color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%} .tro small i{font-style:normal;font-weight:700}
.tro .mal{position:absolute;right:.45rem;top:.35rem;font-size:1.15rem;font-weight:700}
.tro.leer{border-style:dashed;background:none;color:var(--stumm)} .tro.leer::after{display:none} .tro.leer img{opacity:.22;filter:grayscale(1)}
.kurs{display:flex;gap:.4rem;flex:none;margin-top:.7rem;padding-top:.6rem;border-top:1px solid var(--linie);align-items:center;overflow:hidden;white-space:nowrap}
.kurs .kc{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .55rem .12rem .2rem;border:1px dashed var(--linie-2);border-radius:1.2rem;font-size:.86rem;color:var(--leise)} .kurs .kc img{width:1.7rem;height:1.7rem} .kurs .kc b{color:var(--creme)}
.sbalken{display:flex;align-items:flex-end;justify-content:center;gap:.7rem;flex:1;min-height:0;padding-top:.3rem}
.sbalken div{flex:1;max-width:9rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.2rem;min-width:0}
.sbalken i{display:block;width:100%;background:linear-gradient(180deg,var(--gold),rgba(240,195,90,.35));border-radius:.2rem .2rem 0 0;min-height:2px} .sbalken .lauf i{background:repeating-linear-gradient(135deg,rgba(98,211,148,.8) 0 .3rem,rgba(98,211,148,.4) .3rem .6rem)}
.sbalken b{font-size:.95rem;color:var(--creme)} .sbalken small{font-size:.72rem;color:var(--leise);font-weight:700;display:flex;gap:.25rem;align-items:center} .sbalken small img.wap{width:1.2rem;height:1.2rem}
.embz{display:inline-flex;gap:.1rem;align-items:center} .embz img.emb{width:1.5rem;height:1.5rem}

/* ---------- Medaillen ---------- */
.seite.med{grid-template-columns:minmax(0,1fr) 43rem;grid-template-rows:auto minmax(0,1fr)}
.seite.med .rechtsp{grid-row:1/3;grid-column:2}
.schmuck{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.7rem 1rem;white-space:nowrap;overflow:hidden}
.schmuck img.wap{width:4.2rem;height:4.2rem;border:2px solid var(--heim)} .schmuck .nmb{min-width:0;flex:0 1 15rem;overflow:hidden}
.schmuck .bl{display:flex;align-items:center;gap:.4rem;flex:none} .schmuck .bl img.emb{width:3.7rem;height:3.7rem}
.schmuck .bl strong{font-size:1.9rem;line-height:.95;font-weight:700;display:block} .schmuck .bl small{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--leise);font-weight:600;display:block}
.schmuck .tr{width:1px;align-self:stretch;background:var(--linie)}
.schmuck h3{margin:0;font:400 1.45rem/1.05 var(--haus);color:#fff;overflow:hidden;text-overflow:ellipsis} .schmuck p{margin:.15rem 0 0;font-size:.82rem;color:var(--leise);line-height:1.25;white-space:normal}
.wand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:.5rem;flex:1;min-height:0}
.wz{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);border:1px solid var(--linie);border-radius:.4rem;border-bottom:.18rem solid var(--stumm);padding:.4rem .55rem .35rem;min-width:0;min-height:0;overflow:hidden;background:var(--flaeche-2)}
.wz.a0{border-bottom-color:var(--pow)} .wz.a1{border-bottom-color:var(--spe)} .wz.a2{border-bottom-color:var(--men)} .wz.a3{border-bottom-color:var(--soc)}
.wz h4{margin:0;display:flex;align-items:center;gap:.35rem;font:400 1.05rem/1.1 var(--haus);color:#fff;white-space:nowrap;overflow:hidden} .wz h4 img.dic{width:1.3rem;height:1.3rem} .wz h4 small{margin-left:auto;font:600 .76rem/1 var(--zahl);color:var(--leise)} .wz h4 small b{color:var(--tinte);font-size:.9rem}
.wz .ms{display:flex;gap:.25rem;flex:1;align-items:center;min-height:0}
.wz .ms span{flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;align-items:center;gap:.15rem;min-width:0;height:100%;padding:.2rem 0 .25rem} .wz .ms img.emb{width:min(100%,3.5rem);height:auto;aspect-ratio:1}
.wz .ms u{display:block;width:.5rem;height:.5rem;border-radius:50%;background:rgba(255,255,255,.1)} .wz .ms u.x{width:1.5rem;height:1.5rem;background:none;border:1px dashed var(--linie-2)}
.wz .ms small{font-size:.66rem;font-weight:700;color:var(--stumm);line-height:1;white-space:nowrap} .wz .ms small i{font-style:normal;color:var(--gast)}
.wz .kz{display:flex;justify-content:space-between;font-size:.76rem;color:var(--leise);white-space:nowrap} .wz .kz b{color:var(--tinte)}

/* ---------- Historie ---------- */
.seite.his{grid-template-columns:minmax(0,1fr) 29rem}
.spalte{display:flex;flex-direction:column;gap:.72rem;min-width:0;min-height:0} .spalte>.pan{flex:1}
.kopfz{display:flex;align-items:center;gap:.7rem;flex:none;margin-bottom:.5rem;min-width:0} .kopfz img.wap{width:3rem;height:3rem} .kopfz .por{width:3.4rem;height:3.4rem}
.kopfz h3{margin:0;font:400 1.35rem/1.05 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .kopfz small{font-size:.82rem;color:var(--leise);white-space:nowrap}
.stapel{display:flex;align-items:flex-end;justify-content:center;gap:.8rem;flex:1;min-height:0}
.stapel>div{flex:1;max-width:9rem;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:.15rem;min-width:0}
.stapel .st{width:100%;display:flex;flex-direction:column-reverse;border-radius:.2rem .2rem 0 0;overflow:hidden} .stapel .st i{display:block;min-height:1px}
.stapel b{font-size:.98rem;color:var(--creme)} .stapel small{font-size:.72rem;color:var(--leise);font-weight:700}
.c-ka{background:var(--gold)} .c-kd{background:var(--heim)} .c-ge{background:var(--gast)} .c-neg{background:var(--warn)}
.leg i.c-ka,.leg i.c-kd,.leg i.c-ge{transform:skewX(-14deg)}
.fahr{flex:1;min-height:0;width:100%}
.fahr text{font-family:var(--zahl);font-weight:700}
.dreier{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;flex:none;margin-bottom:.5rem}
.dreier div{line-height:1.05;min-width:0} .dreier small{display:block;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);font-weight:600;white-space:nowrap} .dreier strong{font-size:1.4rem;color:var(--creme);white-space:nowrap} .dreier em{font-style:normal;font-size:.74rem;color:var(--stumm);display:block;white-space:nowrap}
.awl{display:flex;flex-wrap:wrap;gap:.3rem;align-content:flex-start;flex:1;min-height:0;overflow:hidden}
.awl span{display:inline-flex;align-items:center;gap:.25rem;padding:.1rem .5rem .1rem .15rem;border:1px solid var(--linie);border-radius:1.2rem;font-size:.82rem;color:var(--leise);white-space:nowrap} .awl span img.emb{width:1.7rem;height:1.7rem} .awl span b{color:var(--tinte);font-weight:600}
.fchips{display:flex;gap:.3rem;align-items:center} .fchips a{font-size:.74rem;font-weight:700;letter-spacing:.08em;padding:.12rem .5rem;border:1px solid var(--linie);border-radius:1rem;color:var(--leise)!important;text-transform:uppercase} .fchips a.an{background:var(--gold);border-color:var(--gold);color:#17120a!important}
.tz .por{width:2.1rem;max-height:2.3rem}
.leerh{display:grid;place-items:center;text-align:center;flex:1;color:var(--leise);font-size:.95rem;line-height:1.35;padding:0 2rem} .leerh b{display:block;font:400 1.3rem/1.2 var(--haus);color:var(--creme);margin-bottom:.3rem}
</style>
</head>
<body>
<script src="modern-24-11/daten.js"></script>
<script src="modern-24-11/rahmen.js"></script>
<script src="modern-24-11/tabelle.js"></script>
<script>
"use strict";
/* ============================== Zustand ============================== */
var BSP=q.get("saisons")!=="1",NS=BSP?5:1,AKT=NS;
var Z={ans:q.get("ansicht")||"katalog",liga:+q.get("liga")||ICH.liga,team:TC[q.get("team")]||ICH,sort:q.get("sort"),dir:+q.get("dir")||-1,blatt:0,
  zeit:q.get("zeit")||(BSP?"alle":"saison"),farbe:q.get("farbe")==null?-1:+q.get("farbe"),kader:q.get("kader")==="1"};
var STN=["Gold","Silber","Bronze"],STD=["gold","silber","bronze"];
function emb(k,st,tip){return '<img class="emb" src="../sprites/awards/'+k+'-'+STD[st]+'.png" alt=""'+(tip?' title="'+esc(tip)+'"':"")+'>'}
function bsp(t){return '<i class="bsp" title="Beispielwerte: der Live-Stand steht in Saison 1">'+(t||"Beispiel")+'</i>'}
function sn(s){return "S"+s}
function gsb(a){return '<span class="gsb">'+[0,1,2].map(function(i){return '<i class="g'+i+(a[i]?"":" n0")+'">'+a[i]+'</i>'}).join("")+'</span>'}

/* ============================== Award-Katalog ============================== */
/* k = Emblem, wer = Spieler|Team, takt, krit, quelle: [Stand, Text]; Stand "da" = heute schon im Spielstand, "teil" = Quelle da, Vergabe neu, "neu" = neues Tracking */
var AW=[
 {k:"mvp",n:"MVP der Saison",takt:"Saisonende",krit:"<b>Höchste PP-Summe</b> der Saison über alle Disziplinen, beide Ligen zusammen. Gleichstand: PP je Einsatz.",q:["da","Saison-PP je Spieler"],ein:" PP"},
 {k:"pp",n:"Krone der Konstanz",takt:"Saisonende",krit:"<b>Höchste PP je Einsatz</b> bei mindestens 60 % der Einsätze des fleißigsten Spielers. Belohnt den, der nie einen schlechten Tag hat.",q:["da","PP und Einsätze"],ein:" PP/E"},
 {k:"mip",n:"Most Improved Player",takt:"Saisonende",krit:"<b>Größter Zuwachs im Gesamtwert (OVR)</b> vom ersten bis zum letzten Spieltag, ganze Saison unter Vertrag.",q:["teil","OVR-Start je Saison wird neu gestempelt"],ein:" OVR",bsp:1},
 {k:"allstar",n:"All-Star-Team",takt:"Saisonende",krit:"<b>Drei Achter-Teams</b> der Saison: je Klassenfarbe die zwei PP-Besten. First Team = Gold, Second = Silber, Third = Bronze.",q:["da","Saison-PP und Klassenfarbe"],ein:" PP"},
 {k:"pow",f:0,n:"Bester Power-Spieler",takt:"Saisonende",krit:"PP-Bester unter allen Spielern der <b>Klassenfarbe Power</b> (Berserker, Warlord, Tank).",q:["da","Saison-PP und Klassenfarbe"],ein:" PP"},
 {k:"spe",f:1,n:"Bester Speed-Spieler",takt:"Saisonende",krit:"PP-Bester unter allen Spielern der <b>Klassenfarbe Speed</b> (Sprinter, Rogue, Charger).",q:["da","Saison-PP und Klassenfarbe"],ein:" PP"},
 {k:"men",f:2,n:"Bester Mental-Spieler",takt:"Saisonende",krit:"PP-Bester unter allen Spielern der <b>Klassenfarbe Mental</b> (Mage, Overseer, Templar).",q:["da","Saison-PP und Klassenfarbe"],ein:" PP"},
 {k:"soc",f:3,n:"Bester Social-Spieler",takt:"Saisonende",krit:"PP-Bester unter allen Spielern der <b>Klassenfarbe Social</b> (Bard, Hero, Badass, Tactician).",q:["da","Saison-PP und Klassenfarbe"],ein:" PP"},
 {k:"disziplin",n:"Disziplin-König",takt:"Saisonende · 20 Disziplinen",krit:"Je Disziplin die <b>höchste PP-Summe</b> der Saison (meist zwei Einsätze). 20 Fackeln in Gold, Silber und Bronze.",q:["da","PP je Disziplin und Saison"],ein:" PP"},

    '<div class="pan"><div class="pk"><h2>Ewige Tabelle · Liga '+l+'</h2>'+(BSP?bsp("S1–S"+(AKT-1)+" Beispiel · S"+AKT+" echt"):"")+'<span class="sp"></span><small class="u">'+standText()+'</small>'+ligaUm()+'</div>'+tf.html+
      '<div class="tfuss"><span>Gezählt wird nur, was ein Team <b>in Liga '+l+'</b> gespielt hat. Standard-Sortierung: Ø Punkte je Saison.</span><span class="sp"></span><span class="leg"><span><i class="and" style="padding:0 .2rem;transform:none;width:auto;height:auto">L'+(3-l)+'</i>andere Liga</span><span style="color:var(--gut)">grün = läuft</span></span></div></div>'+
    '<div class="spalte"><div class="pan" style="flex:1.25"><div class="pk"><h2>Vermögen</h2>'+bsp(BSP?"Beispiel":"Gebäude Beispiel")+'<span class="sp"></span><span class="leg"><span><i class="c-kd"></i>Kader</span><span><i class="c-ka"></i>Kasse</span><span><i class="c-ge"></i>Gebäude</span></span></div><div class="pb">'+
        '<div class="kopfz">'+logo(T.c)+'<div style="min-width:0"><h3>'+T.n+'</h3><small>Vermögen heute <b style="color:var(--creme)">'+C(jz.verm)+'</b>'+(AKT>1?' · seit S1 <span class="'+(jz.verm>=er.verm?"plus":"minus")+'">'+vz(jz.verm-er.verm)+' C</span>':"")+'</small></div></div>'+
        '<div class="dreier"><div><small>Kaderwert</small><strong class="t">'+de(jz.mw)+'</strong><em>Summe Marktwerte</em></div><div><small>Kasse</small><strong class="t'+(jz.kasse<0?" minus":"")+'">'+de(jz.kasse)+'</strong><em>Kontostand</em></div><div><small>Gebäude</small><strong class="t">'+de(jz.geb)+'</strong><em>'+de(T.inv)+' C × '+T.zust+' %</em></div></div>'+
        '<div class="stapel">'+stapel+'</div></div></div>'+
      '<div class="pan"><div class="pk"><h2>Weg durch die Ligen</h2><span class="sp"></span><small class="u">oben Liga 1 · unten Liga 2</small></div><div class="pb">'+
        '<div class="dreier" style="grid-template-columns:repeat('+H.length+',1fr);text-align:center">'+marken+'</div>'+fahr+
        '<div class="zeile2" style="margin-top:.4rem"><span>Liga 1: Saisons · Ø Punkte</span><b class="t">'+b1.sz+' · '+(b1.sz?(b1.hoch?"≈ ":"")+de(b1.avg):"–")+'</b></div><div class="zeile2"><span>Liga 2: Saisons · Ø Punkte</span><b class="t">'+b2.sz+' · '+(b2.sz?(b2.hoch?"≈ ":"")+de(b2.avg):"–")+'</b></div></div></div></div>'}

/* ============================== 5. Spieler-Historie ============================== */
function spielerHist(){var p=HELD;
  var rows=AKTIV.filter(function(x){return (Z.farbe<0||x.kf===Z.farbe)&&(!Z.kader||x.team===ICH)});
  var best=AKTIV.slice().sort(function(a,b){return b.ppAll-a.ppAll})[0];
  RAHMEN.kopf('Welt <span>›</span> Historie <span>›</span> Spieler · beide Ligen zusammen',"Spieler-Historie",reiter(),
    RAHMEN.kpi("Spieler",rows.length,"mit Vertrag","zone")+RAHMEN.kpi("Meiste PP aller Zeiten",de(best.ppAll),best.n)+RAHMEN.kpi("Saisons",AKT,BSP?"4 abgeschlossen · Beispiel":"läuft"));
  var cols=[
    {k:"rk",t:"#",w:"1.9rem",html:function(x,i){return '<b class="pl">'+(i+1)+'</b>'}},
    {k:"n",t:"Spieler",w:"minmax(0,1fr)",wert:function(x){return x.n},html:function(x){return '<span class="tn">'+por(x)+'<span class="nm"><b>'+x.n+'</b><small>'+klasse(x)+'<span>'+x.team.n+'</span></small></span></span>'}},
    {k:"sa",t:"Sais.",w:"2.3rem",r:1,tip:"Saisons mit Einsätzen",wert:function(x){return x.S.length},html:function(x){return '<b class="t">'+x.S.length+'</b>'}}];
  for(var s=1;s<=AKT;s++)(function(s){cols.push({k:"s"+s,t:sn(s),w:"3rem",r:1,tip:"Player Points in Saison "+s,wert:function(x){return x.h[s]?x.h[s].pp:-1},
    html:function(x){var h=x.h[s];return h?'<span class="sz'+(h.lauf?" lauf":"")+'"><b class="t">'+de(h.pp)+'</b><small>'+h.eins+' E</small></span>':'<span class="zu">–</span>'}})})(s);
  cols.push(
    {k:"all",t:"All-Time",w:"3.6rem",r:1,tip:"Summe aller Player Points, mit der laufenden Saison",wert:function(x){return x.ppAll},html:function(x){return '<b class="t">'+de(x.ppAll)+'</b>'}},
    {k:"avg",t:"Ø je Saison",w:"5.2rem",r:1,tip:"PP je abgeschlossener Saison. Ohne abgeschlossene Saison: Hochrechnung der laufenden (≈).",wert:function(x){return x.ppAvg},html:function(x){return '<b class="gr t">'+(x.hoch?"≈ ":"")+de(x.ppAvg)+'</b>'}},
    {k:"ppe",t:"PP / Eins.",w:"3.6rem",r:1,wert:function(x){return x.ppeAll},html:function(x){return '<b class="t">'+de(x.ppeAll,2)+'</b>'}},
    {k:"e",t:"Eins.",w:"2.6rem",r:1,wert:function(x){return x.einsAll},html:function(x){return '<b class="t">'+x.einsAll+'</b>'}},
    {k:"tag",t:"Sp. d. Tages",w:"4.4rem",r:1,tip:"Spieler des Spieltags: Platz 1, 2, 3"+(BSP?" (Beispiel)":""),wert:function(x){return x.tag[0]*100+x.tag[1]*10+x.tag[2]},html:function(x){return gsb(x.tag)}},
    {k:"aw",t:"Awards",w:"4.4rem",r:1,tip:"Saison-Awards in Gold, Silber, Bronze (ohne Spieler des Spieltags)",wert:function(x){return (x.g[0]-x.tag[0])*100+(x.g[1]-x.tag[1])*10+x.g[2]-x.tag[2]},html:function(x){return gsb([x.g[0]-x.tag[0],x.g[1]-x.tag[1],x.g[2]-x.tag[2]])}},
    {k:"ov",t:"OVR",w:"4.4rem",r:1,tip:"Gesamtwert heute, klein die Änderung seit der ersten Saison",wert:function(x){return x.ov},html:function(x){var d=x.ov-x.ovStart;return '<span class="zw2"><b class="t">'+de(x.ov)+'</b><small class="'+(d>=1?"plus":d<=-1?"minus":"null")+'">'+vz(d)+'</small></span>'}},
    {k:"mw",t:"Marktwert",w:"3.9rem",r:1,wert:function(x){return x.mw},html:function(x){return '<b class="t">'+de(x.mw)+'</b>'}});
  var tf=tafel({sort:Z.sort||"avg",dir:Z.dir,rows:rows,zeilen:17,blatt:Z.blatt,cols:cols,zeile:function(x){return {cls:"klick"+(x===p?" an":"")+(x.team===ICH&&x!==p?" ich":""),attr:'data-spieler="'+x.s+'"'}}});
  var blaetter=Math.ceil(tf.n/17);
  var mx=Math.max.apply(null,p.S.map(function(s){return p.h[s].pp/(p.h[s].lauf?GEWERTET/ST_SAISON:1)}));
  var awl=p.aw.filter(function(a){return a.k!=="spieltag"}).sort(function(a,b){return a.st-b.st||b.s-a.s}).slice(0,12).map(function(a){return '<span>'+emb(a.k,a.st)+'<b>'+AWK[a.k].n+(a.x?" "+a.x:"")+'</b> '+sn(a.s)+'</span>'}).join("");
  var ovp=p.S.map(function(s){return p.h[s].ov});
  $("s-spieler").innerHTML=
    '<div class="pan"><div class="pk"><h2>Ewige Bestenliste</h2>'+(BSP?bsp("S1–S"+(AKT-1)+" Beispiel · S"+AKT+" echt"):"")+'<span class="sp"></span><span class="fchips">'+
      '<a class="'+(Z.farbe<0&&!Z.kader?"an":"")+'" data-farbe="-1">Alle</a>'+AX.map(function(a,i){return '<a class="'+(Z.farbe===i?"an":"")+'" data-farbe="'+i+'" style="'+(Z.farbe===i?"":"color:"+AXF[i]+"!important")+'">'+a+'</a>'}).join("")+'<a class="'+(Z.kader?"an":"")+'" data-kader="1">Mein Kader</a></span></div>'+tf.html+
      '<div class="tfuss"><span><b>Keine Liga-Trennung:</b> Player Points sind über beide Ligen vergleichbar. Standard-Sortierung: Ø PP je Saison.</span><span class="sp"></span><span>'+tf.n+' Spieler · Blatt '+(Z.blatt+1)+' von '+blaetter+'</span><a class="'+(Z.blatt?"":"aus")+'" data-blatt="-1">‹ zurück</a><a class="'+(Z.blatt<blaetter-1?"":"aus")+'" data-blatt="1">weiter ›</a></div></div>'+
    '<div class="spalte"><div class="pan" style="flex:1.2"><div class="pk"><h2>Laufbahn</h2>'+(BSP?bsp():"")+'<span class="sp"></span><a href="'+RAHMEN.link({ansicht:"schrank",spieler:p.s,sort:null,dir:null})+'">Trophäenschrank ›</a></div><div class="pb">'+
        '<div class="kopfz">'+por(p)+'<div style="min-width:0"><h3>'+p.n+'</h3><small>'+klasse(p)+' · '+p.team.n+'</small></div></div>'+
        '<div class="dreier"><div><small>All-Time-PP</small><strong class="t">'+de(p.ppAll)+'</strong><em>'+p.einsAll+' Einsätze</em></div><div><small>Ø je Saison</small><strong class="t">'+(p.hoch?"≈ ":"")+de(p.ppAvg)+'</strong><em>beste '+de(p.bestS)+'</em></div><div><small>Gesamtwert</small><strong class="t">'+de(p.ov)+'</strong><em class="'+(p.ov>=p.ovStart?"plus":"minus")+'">'+vz(p.ov-p.ovStart)+' seit Start</em></div></div>'+
        '<div class="sbalken">'+p.S.map(function(s){var h=p.h[s],w=h.pp/(h.lauf?GEWERTET/ST_SAISON:1);return '<div class="'+(h.lauf?"lauf":"")+'"><b class="t">'+(h.lauf?"≈ ":"")+de(w)+'</b><i style="height:'+Math.round(w/mx*70)+'%"></i><small>'+logo(h.team.c)+sn(s)+'</small></div>'}).join("")+'</div></div></div>'+
      '<div class="pan"><div class="pk"><h2>Awards</h2><span class="sp"></span>'+gsb(p.g)+'</div><div class="pb"><div class="zeile2" style="border-top:0"><span>Gesamtwert je Saison</span><b style="width:9rem;display:block">'+funke(ovp,"var(--gut)")+'</b></div><div class="zeile2" style="margin-bottom:.4rem"><span>Spieler des Spieltags</span><b>'+gsb(p.tag)+'</b></div>'+
        '<div class="awl">'+(awl||'<span class="zu" style="border:0">Noch keine Awards: die erste Saison läuft.</span>')+'</div></div></div></div>'}

/* ============================== Steuerung ============================== */
function alles(){ANS.forEach(function(a){$("s-"+a[0]).classList.toggle("an",a[0]===Z.ans)});
  ({katalog:katalog,schrank:schrank,medaillen:medaillen,teams:teamHist,spieler:spielerHist})[Z.ans]();
  $("d-ans").innerHTML=ANS.map(function(a){return '<a class="'+(Z.ans===a[0]?"an":"")+'" href="'+RAHMEN.link({ansicht:a[0],sort:null,dir:null})+'">'+a[2]+'</a>'}).join(" ");
  $("d-dat").innerHTML='<a class="'+(BSP?"an":"")+'" href="'+RAHMEN.link({saisons:null,spieler:null})+'">Beispiel: 5 Saisons</a> <a class="'+(BSP?"":"an")+'" href="'+RAHMEN.link({saisons:1,spieler:null,zeit:null})+'">Echt: Saison 1 läuft</a>'}
document.addEventListener("click",function(ev){var t=ev.target,e;
  if(e=t.closest("[data-liga]")){Z.liga=+e.getAttribute("data-liga");Z.blatt=0;return alles()}
  if(e=t.closest("[data-zeit]")){Z.zeit=e.getAttribute("data-zeit");return alles()}
  if(e=t.closest("[data-farbe]")){Z.farbe=+e.getAttribute("data-farbe");Z.kader=false;Z.blatt=0;return alles()}
  if(e=t.closest("[data-kader]")){Z.kader=!Z.kader;Z.farbe=-1;Z.blatt=0;return alles()}
  if(e=t.closest("[data-blatt]")){Z.blatt+=+e.getAttribute("data-blatt");return alles()}
  if(t.closest(".tz.kopf")&&sortKlick(ev,Z,{n:1,r:1}))return alles();
  if(e=t.closest("[data-team]")){Z.team=TC[e.getAttribute("data-team")];return alles()}
  if(e=t.closest("[data-spieler]")){HELD=ALLE[e.getAttribute("data-spieler")];return alles()}
});
alles();
</script>
</body>
</html>
