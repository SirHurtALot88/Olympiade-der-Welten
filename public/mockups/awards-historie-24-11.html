<title>Awards, Medaillen und Historie – modern (Mockup 24.11.)</title>
<!--
  AWARDS, MEDAILLEN UND HISTORIE IM NEUEN STIL (Fable, 24.11.). Erklaerung: docs/design/awards-historie-24-11.md
  RUNDE 2 (24.11.): Spieler-Awards und Team-Auszeichnungen sind getrennte Kataloge; Farb-Awards zaehlen die PP in den fuenf Disziplinen
  der Farbe; Spieler des Spieltags ist ein Zaehler (Tagesbester, Teambester); der Schrank heisst Achievements (eine Ansicht je Spieler);
  Medaillen je Disziplin als feste 20-Zeilen-Tabelle (skaliert ueber beliebig viele Saisons); Team-Historie mit Punkten nach Farbe.
  RUNDE 3 (24.11.): neue Ansicht ?ansicht=disziplinen = Medaillenspiegel je Disziplin ueber alle Saisons. Liga 1 und Liga 2 getrennt gezaehlt,
  Liga-2-Medaillen mit dem Zeichen II (CSS-Marke auf dem vorhandenen Emblem, keine neue Generation), dazu gewichtete Punkte
  (Liga 1 Gold 10 / Silber 6 / Bronze 2, Liga 2 halb = 5 / 3 / 1). ?dis=<slug>|alle waehlt die Disziplin.
  Sechs Ansichten: Spieler-Awards, Team-Awards, Achievements im Spielerprofil, Medaillen und Medaillenspiegel im Teamprofil,
  Team-Historie (je Liga getrennt), Spieler-Historie (ohne Liga-Trennung). Fuehrt historie-modern-18-11.html weiter.
  ECHT (Live-Abbild 24.11., Saison 1, 11 Spieltage gewertet; modern-24-11/daten.js): Teams, Liga, Tabelle, Punkte, Kasse, Kaderwert,
        Player Points und Einsaetze je Spieler, beste Disziplinen je Spieler, Stand der Disziplin-Wertung (Medaillen-Kurs).
  BEISPIEL (im UI markiert): alle abgeschlossenen Saisons (der Live-Stand steht in Saison 1), Gebaeudewert, Entwicklung (OVR),
        Spieler des Spieltags, Aufteilung der Spieler-PP nach Farbe (nur die drei besten Disziplinen je Spieler sind echt). Mit ?saisons=1 zeigt die Seite nur, was heute echt da ist.
  Embleme: public/sprites/awards/ (PixelLab, 14 + 7 Generationen; Silber und Bronze lokal umgefaerbt), Herkunft in quellen.json.
  URL: ?ansicht=katalog|teamawards|achievements|medaillen|disziplinen|teams|spieler  ?dis=<slug>|alle  ?saisons=10|1  ?spann=5|alle  ?zu=1  ?zeig=<Team>|<Saison>  ?liga=1|2  ?team=D-P|…  ?spieler=<slug>
       ?zeit=alle|saison  ?farbe=0..3  ?kader=1  ?sort=<spalte>&dir=-1|1  ?still=1
-->

/* ============================== 4. Medaillen (Teamprofil) ============================== */
function medaillen(){var T=Z.team,l=Z.liga,alle=Z.zeit==="alle";

  /* Medaillen je Disziplin: 20 feste Zeilen, egal wie viele Saisons. Zaehler ueber alle Saisons, die letzten fuenf als Embleme, alle Saisons als Streifen. */
  var letzte=[];for(var s=Math.max(1,AKT-4);s<=AKT;s++)letzte.push(s);

    {k:"d",t:"Disziplin",w:"minmax(0,1fr)",wert:function(x){return x.d},html:function(x){return '<a class="dz a'+DA[x.d]+'" href="'+RAHMEN.link({ansicht:"disziplinen",dis:DN[x.d][1],sort:null,dir:null})+'" title="Medaillenspiegel dieser Disziplin über alle Teams öffnen">'+dIcon(x.d)+'<b>'+x.n+'</b><small class="c'+DA[x.d]+'">'+AX[DA[x.d]]+'</small><u>›</u></a>'}},

    {k:"b",t:"Bronze",w:"3.1rem",r:1,wert:function(x){return x.m[2]},html:function(x){return '<b class="zn g2 t'+(x.m[2]?"":" n0")+'">'+x.m[2]+'</b>'}},
    {k:"sum",t:"Summe",w:"3rem",r:1,wert:function(x){return x.sum},html:function(x){return '<b class="gr t">'+x.sum+'</b>'}},

    {k:"ppe",t:"PP / Eins.",w:"3.6rem",r:1,wert:function(x){return x.ppeAll},html:function(x){return '<b class="t">'+de(x.ppeAll,2)+'</b>'}},
    {k:"e",t:"Eins.",w:"2.6rem",r:1,wert:function(x){return x.einsAll},html:function(x){return '<b class="t">'+x.einsAll+'</b>'}});
  cols.push(
    {k:"tb",t:"Tagesb.",w:"3rem",r:1,tip:"Wie oft bester Spieler eines Spieltags (beide Ligen)"+(BSP?" · Beispiel":""),wert:function(x){return x.tb},html:function(x){return '<b class="zn g0 t'+(x.tb?"":" n0")+'">'+x.tb+'</b>'}},
    {k:"teamb",t:"Teamb.",w:"3rem",r:1,tip:"Wie oft Bester im eigenen Team"+(BSP?" · Beispiel":""),wert:function(x){return x.teamb},html:function(x){return '<b class="zn t'+(x.teamb?"":" n0")+'">'+x.teamb+'</b>'}},
    {k:"aw",t:"Awards",w:"4.4rem",r:1,tip:"Saison-Awards in Gold, Silber, Bronze",wert:function(x){return x.g[0]*1e4+x.g[1]*100+x.g[2]},html:function(x){return gsb(x.g)}});
  if(!weit)cols.push(
    {k:"ov",t:"OVR",w:"4rem",r:1,tip:"Gesamtwert heute, klein die Änderung seit der ersten Saison. Öffentlich, ohne Scouting.",wert:function(x){return x.ov},html:function(x){var d=x.ov-x.ovStart;return '<span class="zw2"><b class="t">'+de(x.ov)+'</b><small class="'+(d>=1?"plus":d<=-1?"minus":"null")+'">'+vz(d)+'</small></span>'}},
    {k:"mw",t:"Marktwert",w:"3.9rem",r:1,wert:function(x){return x.mw},html:function(x){return '<b class="t">'+de(x.mw)+'</b>'}});
  var tf=tafel({sort:Z.sort||"avg",dir:Z.dir,rows:rows,zeilen:17,blatt:Z.blatt,cols:cols,zeile:function(x){return {cls:"klick"+(x===p?" an":"")+(x.team===ICH&&x!==p?" ich":""),attr:'data-spieler="'+x.s+'"'}}});
  var blaetter=Math.ceil(tf.n/17);
  var mx=Math.max.apply(null,p.S.map(function(s){return p.h[s].pp/(p.h[s].lauf?GEWERTET/ST_SAISON:1)}));
  var awl=p.aw.slice().sort(function(a,b){return a.st-b.st||b.s-a.s}).slice(0,10).map(function(a){return '<span title="'+esc(wText(a.k,a.w,a.x,true))+'">'+emb(a.k,a.st)+'<b>'+(AWK[a.k].kurz||AWK[a.k].n)+'</b> '+sn(a.s)+'</span>'}).join("");
  var ovp=p.S.map(function(s){return p.h[s].ov});
  $("s-spieler").innerHTML=
    '<div class="pan"><div class="pk"><h2>Ewige Bestenliste</h2>'+(BSP?bsp("S1–S"+(AKT-1)+" Beispiel · S"+AKT+" echt"):"")+'<span class="sp"></span>'+spannUm()+'<span class="fchips">'+
      '<a class="'+(Z.farbe<0&&!Z.kader?"an":"")+'" data-farbe="-1">Alle</a>'+AX.map(function(a,i){return '<a class="'+(Z.farbe===i?"an":"")+'" data-farbe="'+i+'" title="Klassenfarbe des Spielers" style="'+(Z.farbe===i?"":"color:"+AXF[i]+"!important")+'">'+a+'</a>'}).join("")+'<a class="'+(Z.kader?"an":"")+'" data-kader="1">Mein Kader</a></span></div>'+tf.html+
      '<div class="tfuss"><span><b>Keine Liga-Trennung:</b> Player Points sind über beide Ligen vergleichbar. Standard-Sortierung: Ø PP je Saison.</span><span class="sp"></span><span>'+tf.n+' Spieler · Blatt '+(Z.blatt+1)+' von '+blaetter+'</span><a class="'+(Z.blatt?"":"aus")+'" data-blatt="-1">‹ zurück</a><a class="'+(Z.blatt<blaetter-1?"":"aus")+'" data-blatt="1">weiter ›</a></div></div>'+
    '<div class="spalte"><div class="pan" style="flex:1.2"><div class="pk"><h2>Laufbahn</h2>'+(BSP?bsp():"")+'<span class="sp"></span><a href="'+RAHMEN.link({ansicht:"achievements",spieler:p.s,sort:null,dir:null})+'">Achievements ›</a></div><div class="pb">'+
        '<div class="kopfz">'+por(p)+'<div style="min-width:0"><h3>'+p.n+'</h3><small>'+klasse(p)+' · '+p.team.n+'</small></div></div>'+
        '<div class="dreier"><div><small>All-Time-PP</small><strong class="t">'+de(p.ppAll)+'</strong><em>'+p.einsAll+' Einsätze</em></div><div><small>Ø je Saison</small><strong class="t">'+(p.hoch?"≈ ":"")+de(p.ppAvg)+'</strong><em>beste '+de(p.bestS)+'</em></div><div><small>Gesamtwert</small><strong class="t">'+de(p.ov)+'</strong><em class="'+(p.ov>=p.ovStart?"plus":"minus")+'">'+vz(p.ov-p.ovStart)+' seit Start</em></div></div>'+
        '<div class="stapel">'+p.S.map(function(s){var h=p.h[s],k=h.lauf?GEWERTET/ST_SAISON:1,w=h.pp/k;return '<div data-pax="'+p.s+'|'+s+'"><b class="t">'+(h.lauf?"≈":"")+de(w,0)+'</b><span class="st'+(h.lauf?" lauf":"")+'" style="height:'+Math.round(w/mx*72)+'%">'+[0,1,2,3].map(function(f){return '<i style="flex:'+Math.max(.01,h.ax[f])+';background:'+AXF[f]+'"></i>'}).join("")+'</span><small>'+sn(s)+'</small></div>'}).join("")+'</div></div></div>'+
      '<div class="pan"><div class="pk"><h2>Awards</h2><span class="sp"></span>'+gsb(p.g)+'</div><div class="pb"><div class="zeile2" style="border-top:0"><span>Gesamtwert je Saison</span><b style="width:9rem;display:block">'+funke(ovp,"var(--gut)")+'</b></div><div class="zeile2" style="margin-bottom:.4rem"><span>Tagesbester · Teambester</span><b class="t"><span class="g0">'+p.tb+'×</span> · '+p.teamb+'×</b></div>'+
        '<div class="awl">'+(awl||'<span class="zu" style="border:0">'+(BSP?"Noch kein Award gewonnen.":"Noch keine Awards: die erste Saison läuft.")+'</span>')+'</div></div></div></div>'}

/* ============================== Zeiger-Tafel: Punkte bzw. PP nach Farbe ============================== */
var POP=document.createElement("div");POP.id="pop";document.body.appendChild(POP);
function popZeig(e){var t=e.getAttribute("data-ax"),a=(t||e.getAttribute("data-pax")).split("|"),s=+a[1],h,kopf,unter,nk=0;
  if(t){var T=TC[a[0]];h=T.h[s];kopf=T.n+" · "+sn(s);unter="Liga "+h.liga+" · "+h.rang+". Platz · "+h.pkt+" Punkte"+(h.lauf?" · läuft":"")}
  else{var p=ALLE[a[0]];h=p.h[s];kopf=p.n+" · "+sn(s);unter=h.team.n+" · "+h.eins+" Einsätze · "+de(h.pp)+" PP"+(h.lauf?" · läuft":"");nk=1}
  var mx=Math.max.apply(null,h.ax)||1,sum=h.ax.reduce(add,0)||1;
  POP.innerHTML='<h5>'+kopf+'</h5><small>'+unter+'</small>'+h.ax.map(function(v,f){return '<div><span class="c'+f+'">'+AXN[f]+'</span><i><u style="width:'+(v/mx*100).toFixed(0)+'%;background:'+AXF[f]+'"></u></i><b class="t">'+de(v,nk)+'</b><em>'+Math.round(v/sum*100)+' %</em></div>'}).join("")+'<small class="fu">'+(t?"Punkte nach Farbe der Disziplin":"PP nach Farbe der Disziplin"+(h.lauf?" · Aufteilung im Mockup teils geschätzt":""))+'</small>';
  POP.style.display="block";var r=e.getBoundingClientRect(),w=POP.offsetWidth,hh=POP.offsetHeight,x=kl(r.left+r.width/2-w/2,8,innerWidth-w-8),y=r.bottom+6+hh>innerHeight?r.top-hh-6:r.bottom+6;
  POP.style.left=x+"px";POP.style.top=y+"px"}
document.addEventListener("mouseover",function(ev){var e=ev.target.closest&&ev.target.closest("[data-ax],[data-pax]");if(e)popZeig(e);else POP.style.display="none"});

/* ============================== Steuerung ============================== */
function alles(){POP.style.display="none";ANS.forEach(function(a){$("s-"+a[0]).classList.toggle("an",a[0]===Z.ans)});
  ({katalog:katalog,teamawards:teamAwards,achievements:achievements,medaillen:medaillen,disziplinen:disziplinen,teams:teamHist,spieler:spielerHist})[Z.ans]();
  $("d-ans").innerHTML=ANS.map(function(a){return '<a class="'+(Z.ans===a[0]?"an":"")+'" href="'+RAHMEN.link({ansicht:a[0],sort:null,dir:null})+'">'+a[2]+'</a>'}).join(" ");
  $("d-dat").innerHTML='<a class="'+(BSP?"an":"")+'" href="'+RAHMEN.link({saisons:null,spieler:null})+'">Beispiel: 10 Saisons</a> <a class="'+(BSP?"":"an")+'" href="'+RAHMEN.link({saisons:1,spieler:null,zeit:null})+'">Echt: Saison 1 läuft</a>';
  var pz=q.get("zeig");if(pz){var e=document.querySelector('.seite.an [data-ax="'+pz+'"],.seite.an [data-pax="'+pz+'"]');if(e)popZeig(e)}}
document.addEventListener("click",function(ev){var t=ev.target,e;
  if(e=t.closest("[data-dis]")){Z.dis=+e.getAttribute("data-dis");Z.sort=null;Z.dir=-1;Z.blatt=0;return alles()}
  if(e=t.closest("[data-dsort]")){Z.sort=e.getAttribute("data-dsort");Z.dir=Z.sort==="r"?1:-1;Z.blatt=0;return alles()}
  if(e=t.closest("[data-gsort]")){Z.gsort=e.getAttribute("data-gsort");Z.gdir=Z.gsort==="r"?1:-1;Z.gblatt=0;return alles()}
  if(e=t.closest("[data-gblatt]")){Z.gblatt+=+e.getAttribute("data-gblatt");return alles()}
  if(t.closest(".gtab .tz.kopf")){var G={sort:Z.gsort,dir:Z.gdir};if(sortKlick(ev,G,{n:1,r:1})){Z.gsort=G.sort;Z.gdir=G.dir;Z.gblatt=0;return alles()}return}
  if(e=t.closest("[data-liga]")){Z.liga=+e.getAttribute("data-liga");Z.blatt=0;return alles()}
  if(e=t.closest("[data-zeit]")){Z.zeit=e.getAttribute("data-zeit");return alles()}
  if(e=t.closest("[data-spann]")){Z.spann=e.getAttribute("data-spann");return alles()}
  if(e=t.closest("[data-farbe]")){Z.farbe=+e.getAttribute("data-farbe");Z.kader=false;Z.blatt=0;return alles()}
  if(e=t.closest("[data-kader]")){Z.kader=!Z.kader;Z.farbe=-1;Z.blatt=0;return alles()}
  if(e=t.closest("[data-blatt]")){Z.blatt+=+e.getAttribute("data-blatt");return alles()}
  if(t.closest(".dtab .tz.kopf")){var D={sort:Z.dsort,dir:Z.ddir};if(sortKlick(ev,D,{d:1})){Z.dsort=D.sort;Z.ddir=D.dir;return alles()}return}
  if(t.closest(".tz.kopf")&&sortKlick(ev,Z,{n:1,r:1,d:1}))return alles();
  if(e=t.closest("[data-team]")){var nt=TC[e.getAttribute("data-team")];if(Z.ans==="teams")Z.offen=nt===Z.team?!Z.offen:true;Z.team=nt;return alles()}
  if(e=t.closest("[data-spieler]")){HELD=ALLE[e.getAttribute("data-spieler")];return alles()}
});
alles();
</script>
