<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzen &amp; Sponsoren – modern, 20 Spieltage (Mockup 18.11.)</title>
<!--
  FINANZEN UND SPONSOREN IM BROADCAST-STIL, STAND 18.11.: dieselbe Seite wie finanzen-modern-17-11.html (Chris: "das finanz
  mockup finde ich gut"), umgestellt auf das Finanzkonzept V2 (docs/design/finanzkonzept-v2-18-11.md):
  20 Spieltage statt 10, Heim/Auswaerts (Tickets und Arena-Betrieb nur an Heimspielen, Reise auswaerts, Merch 1,5 / 0,5),
  Sponsor-Sockel in 20 Raten und RANGBONUS AM SAISONENDE (kein Wertungs-Abschlag je Spieltag mehr), Siegpraemie je Duell
  statt Ligageld, Kaderpraemie statt Sparkurs/Einzelbonus, zinsfreier Rahmen statt Dispo (Kredit erst am Kassensturz der
  Folgesaison), vier Ticketpreis-Stufen. Aermel- und Disziplin-Sponsoren sind weiter nur ein Vorschlag (Frage 10 im Konzept).
  Wie die Zahlen im Hintergrund entstehen: finanzen-daten-modern-18-11.html.
  Gleiche Tokens, gleiche Schiene, gleicher Hero-Kopf, gleiche Tafel wie einsatzliste-modern-17-11.html,
  oly-start-modern-17-11.html und saisonstand-modern-17-11.html. Kein App-Code, kein PixelLab (0 Generationen), alles CSS/SVG.
  ECHT: Teamnamen, Wappen, Portraits (Dateien aus public/), Groessenordnungen aus der IST-Analyse des Konzepts
        (Sponsor 55-77 C, Gehalt 42-67 C, Kasse 20-40 C je Saison und Team), Farben der vier Disziplin-Gruppen.
  ERFUNDEN: jede einzelne Buchung, alle Sponsor-Marken, Stimmungswerte, Ergebnisse, Formeln-Parameter (Elastizitaet, Zins je Spieltag).
        Das Rechenmodell unten ist ein Platzhalter, damit jede gezeigte Zahl aus Posten summiert wird ("gezeigt = gebucht").
  NEU 18.11. abends: Reiter "Budgets" (Zwei-Budget-Modell des Vorstands, docs/design/finanzkonzept-v2-budgets-18-11.md):
  ?ansicht=budget &quote=100|85|70|50 &um=<C, + = Transfer ins Gehalt> &vk=<Verkaufserloese im Fenster> &fenster=0|1
  NEU 22.11.: Reiter "Aufschluesselung" (woher kommt das Geld, wohin geht es; docs/design/finanzen-posten-22-11.md):
  ?ansicht=posten &per=bisher|saison &fil=alle|ist|plan|neu &psel=<posten-id>. Einnahmen links, Ausgaben rechts, sortierbar,
  Verlauf als SVG. Marke NEU = Vorschlag 22.11., GEPLANT = Konzept liegt vor, ohne Marke = heute im Code.
  URL: ?ansicht=kasse|auszug|posten|hebel|budget|slots|angebote|bonus|fans|merch  &szen=normal|eng|dispo  &st=1..20  &tag=1..21 (Auszug, 21 = Saisonende)
       &preis=-20|0|20|40  &kader=0|1|2  &notv=1  &an=pow,spe,soc  &sel=<posten>  &ctab=lage|quelle|liga
       &phone=1  &still=1  &blatt=kontext
-->
<style>
@font-face{font-family:"RaniraSeason";src:url("../fonts/ranira-bold-italic.otf") format("opentype");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url("../fonts/barlow-condensed-latin-500-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url("../fonts/barlow-condensed-latin-600-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url("../fonts/barlow-condensed-latin-700-normal.woff2") format("woff2");font-display:swap}
:root{
  --grund:#06080c; --flaeche:rgba(9,12,18,.90); --flaeche-1:#0c1017; --flaeche-2:#121824; --flaeche-3:#1a2231;
  --linie:rgba(244,230,196,.13); --linie-2:rgba(244,230,196,.30);
  --creme:#f4e6c4; --gold:#f0c35a; --tinte:#eef2f8; --leise:#9aa7ba; --stumm:#66738a;
  --heim:#F2A03D; --gast:#45B0C9; --gut:#62d394; --warn:#ff6058; --acht:#f3b54a;
  --p1:#e0637a; --p2:#e89a4c; --p3:#c3cf5e; --p4:#4fc7b2; --p5:#62a0f4; --p6:#ac8af2;
  --haus:"RaniraSeason",Georgia,"Times New Roman",serif;
  --zahl:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --r:10px; --r-s:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020305;color:var(--tinte);font-family:var(--zahl);font-size:16px;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.t{font-variant-numeric:tabular-nums}
.gk{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
img{display:block}
.plus{color:var(--gut)} .minus{color:var(--warn)} .null{color:var(--stumm)}

/* ---------- Mockup-Steuerung (gehoert NICHT zum UI) ---------- */
.demo{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#0d1016;border-bottom:1px solid #222a38;font-size:14px;color:var(--leise);white-space:nowrap;overflow-x:auto}
.demo b{color:var(--creme);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;margin-right:4px}
.demo button{padding:3px 10px;border:1px solid #2b3445;border-radius:999px;color:var(--tinte);font-weight:600}
.demo button:hover{border-color:var(--gold)} .demo button[aria-pressed=true]{background:var(--gold);color:#17120a;border-color:var(--gold)}
.demo .welle{margin-left:auto;color:var(--gold);font-weight:600}
body.still .demo{display:none}

/* ---------- Geruest ---------- */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);height:calc(100vh - 38px);min-height:760px;background:var(--grund)}
body.still .app{height:100vh}
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;background:#080b11;border-right:1px solid var(--linie)}
.rail .logo{width:40px;height:40px;border-radius:9px;overflow:hidden;border:1px solid var(--linie-2);margin-bottom:10px}
.rail .logo img{width:100%;height:100%;object-fit:cover}
.rail a{position:relative;width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font-size:20px;color:var(--stumm)}
.rail a:hover{background:var(--flaeche-2);color:var(--tinte)}
.rail a.an{background:linear-gradient(180deg,rgba(240,195,90,.2),rgba(240,195,90,.06));color:var(--gold)}
.rail a.an::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--gold)}
.rail .zahl{position:absolute;right:3px;top:3px;min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.rail .luecke{flex:1}
main{display:flex;flex-direction:column;min-width:0;min-height:0}

/* Tooltip (ein Muster fuer alles) */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:90;left:50%;top:calc(100% + 7px);transform:translateX(-50%);width:max-content;max-width:320px;white-space:pre-line;
  padding:6px 9px;border-radius:6px;background:#020305;border:1px solid var(--linie-2);color:var(--tinte);font:500 13.5px/1.3 var(--zahl);letter-spacing:0;text-transform:none;text-align:left;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.6)}
[data-tip].tr::after{left:calc(100% + 8px);top:50%;transform:translateY(-50%)}
[data-tip].tl::after{left:auto;right:0;transform:none}
[data-tip].tll::after{left:0;transform:none}
[data-tip].to::after{top:auto;bottom:calc(100% + 7px)}
body.phone [data-tip]::after{display:none}

/* ---------- Hero-Kopf ---------- */
.hero{position:relative;flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch;gap:22px;padding:14px 20px 0;border-bottom:1px solid var(--linie);overflow:hidden;isolation:isolate}
.hero .kul{position:absolute;inset:-30px;z-index:-2;background:url("../szenen/basketball/parkett.jpg") center 40%/cover;filter:blur(14px) saturate(1.15);opacity:.5}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,8,12,.94) 0%,rgba(6,8,12,.72) 38%,rgba(6,8,12,.62) 62%,rgba(6,8,12,.93) 100%),linear-gradient(180deg,transparent 40%,var(--grund) 100%)}
.hk{display:flex;align-items:center;gap:14px;padding-bottom:14px}
.hk .crest{width:62px;height:62px;border-radius:10px;overflow:hidden;border:2px solid var(--heim);box-shadow:0 6px 18px rgba(0,0,0,.5);flex:none}
.hk .crest img{width:100%;height:100%;object-fit:cover}
.hk h1{margin:0;font:400 34px/1 var(--haus);color:#fff;letter-spacing:.01em}
.hk .sub{margin-top:5px;font-size:15px;color:var(--leise);font-weight:500;white-space:nowrap}
.hk .sub b{color:var(--creme);font-weight:600}
.mdw{display:inline-flex;align-items:center;gap:2px;margin-bottom:5px}
.mdw button{width:24px;height:24px;border-radius:5px;border:1px solid var(--linie);display:grid;place-items:center;color:var(--leise)}
.mdw button:hover{border-color:var(--gold);color:var(--gold)} .mdw button[disabled]{opacity:.3;cursor:default}
.mdw span{padding:0 8px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);white-space:nowrap}
.tabs{display:flex;align-items:flex-end;gap:10px;min-width:0}
.dtab{position:relative;flex:1 1 0;min-width:0;max-width:340px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 20px 12px 18px;
  background:rgba(18,24,36,.72);border:1px solid var(--linie);border-bottom:0;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);color:var(--leise);transition:background .15s}
.dtab:hover{background:rgba(26,34,49,.9)}
.dtab.an{background:linear-gradient(180deg,rgba(240,195,90,.2),rgba(18,24,36,.92) 70%);color:var(--tinte)}
.dtab.an::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gold)}
.dtab .ic{width:38px;height:38px;border-radius:8px;overflow:hidden;display:grid;place-items:center;font-size:22px;background:rgba(0,0,0,.35);border:1px solid var(--linie);color:var(--creme)}
.dtab.an .ic{color:var(--gold);border-color:rgba(240,195,90,.5)}
.dtab em{display:block;font-style:normal;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtab b{display:block;font:400 22px/1.1 var(--haus);color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtab .erw{text-align:right}
.dtab .erw strong{display:block;font-size:28px;line-height:1;font-weight:700;color:var(--creme)}
.dtab .erw span{font-size:12px;color:var(--stumm);letter-spacing:.06em;white-space:nowrap}
.dtab .mein{position:absolute;right:20px;top:-1px;height:15px;padding:0 6px;background:var(--warn);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.1em;border-radius:0 0 3px 3px}
.hr{display:flex;align-items:center;gap:16px;padding-bottom:14px}
.frist{text-align:right;white-space:nowrap}
.frist strong{display:block;font-size:22px;line-height:1.1;font-weight:700;color:var(--creme);max-width:250px;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:7px;border:1px solid var(--linie-2);background:var(--flaeche-2);font-weight:600;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.btn:hover{background:var(--flaeche-3);border-color:var(--creme)}
.btn.klein{height:30px;padding:0 10px;font-size:14px}
.btn.ja{background:var(--gold);border-color:var(--gold);color:#17120a} .btn.ja:hover{background:#ffd578}
.btn[disabled]{opacity:.4;cursor:default}

/* ---------- Arbeitsflaeche ---------- */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:12px;padding:12px 14px}
.pan{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);overflow:hidden}
.pk{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--linie);min-height:46px}
.pk h2{margin:0;font:400 19px/1 var(--haus);color:var(--creme);white-space:nowrap}
.pk .sp{flex:1}
.pk .hin{font-size:13.5px;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ktabs{flex:none;display:flex;border-bottom:1px solid var(--linie)}
.ktabs button{flex:1;height:42px;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--stumm);border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:0 10px}
.ktabs button:hover{color:var(--tinte)} .ktabs button.an{color:var(--gold);border-bottom-color:var(--gold)}
.kb{flex:1;overflow-y:auto;min-height:0;padding:12px}
.seg{display:inline-flex;border:1px solid var(--linie-2);border-radius:7px;overflow:hidden;flex:none}
.seg button{text-align:center;height:30px;padding:0 11px;font-weight:600;font-size:14px;color:var(--leise);border-right:1px solid var(--linie);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--flaeche-2);color:var(--tinte)}
.seg button[aria-pressed=true]{background:var(--creme);color:#17120a}
.seg button.prog{color:var(--stumm);font-weight:500}
.marke{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#0b0d12;background:var(--pc,var(--leise));flex:none;white-space:nowrap}
.marke.rot{background:var(--warn);color:#fff} .marke.leer{background:none;border:1px solid var(--linie-2);color:var(--leise)}
.marke.wir{background:var(--heim)} .marke.gold{background:var(--gold)} .marke.gut{background:var(--gut)} .marke.acht{background:var(--acht)}
.kf{flex:none;padding:7px 12px;border-top:1px solid var(--linie);font-size:13px;color:var(--stumm);display:flex;gap:14px;align-items:center;white-space:nowrap;overflow:hidden}
.kf i{display:inline-block;width:4px;height:13px;border-radius:2px;vertical-align:-2px;margin-right:5px}
.kf .sp{flex:1}
.kf b{color:var(--gut);font-weight:600}

/* ---------- Zeilen-Raster (derselbe Baustein wie die Saisontabelle) ---------- */
.tl{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.th,.tz{display:grid;gap:10px;align-items:center;padding:0 14px 0 0;width:100%}
.aus .th,.aus .tz{grid-template-columns:22px minmax(170px,1.05fr) 150px minmax(0,1.7fr) 86px 92px}
.mer .th,.mer .tz{grid-template-columns:22px minmax(190px,1.2fr) 70px 110px 120px minmax(150px,1fr) 80px 86px}
.bon .th,.bon .tz{grid-template-columns:22px minmax(170px,1.1fr) repeat(20,minmax(24px,1fr)) 62px 74px;gap:4px}
.bon .z{font-size:13.5px}
.th{flex:none;height:28px;border-bottom:1px solid var(--linie);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stumm);font-weight:600;position:sticky;top:0;background:var(--flaeche-1);z-index:5;text-align:right}
.th span.li{text-align:left} .th span.mi{text-align:center}
.tz{position:relative;flex:none;min-height:31px;border-bottom:1px solid rgba(244,230,196,.06);font-size:16px;text-align:right}
button.tz:hover{background:var(--flaeche-2)}
.tz.gew{box-shadow:inset 0 0 0 2px var(--gold);background:rgba(240,195,90,.08)}
.tz.su{background:var(--flaeche-2);font-weight:700;min-height:36px} .tz.su strong{font-size:20px;color:var(--creme)}
.tz .fb{width:4px;height:17px;border-radius:2px;background:var(--pc);margin-left:10px}
.tz .fb.hohl{background:none;border:1px solid var(--leise)}
.tz .nm{text-align:left;font-weight:600;color:var(--tinte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;min-width:0}
.tz .nm img{width:24px;height:24px;border-radius:5px;object-fit:cover;flex:none}
.tz .hk2{text-align:left;display:flex;min-width:0} .tz .hk2 .marke{display:block;line-height:15px;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tz .qu{text-align:left;font-size:14px;color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tz .bt{font-weight:700;font-size:17px}
.tz .ks{color:var(--leise)}
.tz.prog .bt,.tz.prog .nm{font-weight:500}
.tz .z{font-size:14.5px;color:var(--tinte);text-align:center} .tz .z.p{color:var(--stumm)} .tz .z.o{color:rgba(255,255,255,.14)}
.lgtr{flex:none;display:flex;align-items:center;gap:10px;height:28px;padding:0 14px 0 12px;background:var(--flaeche-2);border-bottom:1px solid var(--linie)}
.lgtr .sp{flex:1} .lgtr strong{font-size:16px}
.leerh{flex:none;display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--linie);font-size:14.5px;color:var(--leise);background:linear-gradient(90deg,rgba(240,195,90,.12),transparent)}
.leerh.rot{background:linear-gradient(90deg,rgba(255,96,88,.18),transparent)} .leerh.acht{background:linear-gradient(90deg,rgba(243,181,74,.16),transparent)}
.leerh b{color:var(--creme);font-weight:600} .leerh .sp{flex:1}

/* ---------- Kennzahl-Leiste (Baustein .rech der Teamkarte) ---------- */
.rech{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--linie);border:1px solid var(--linie);border-radius:7px;overflow:hidden}
.rech.d3{grid-template-columns:repeat(3,minmax(0,1fr))} .rech.d4{grid-template-columns:repeat(4,minmax(0,1fr))}
.rech div{background:var(--flaeche-1);padding:5px 4px;text-align:center;min-width:0}
.rech small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rech strong{font-size:18px;font-weight:700;white-space:nowrap}
.rech .su{background:var(--flaeche-3)} .rech .su strong{color:var(--gold)}
.rech.gross{margin:12px 12px 0;flex:none} .rech.gross div{padding:8px 6px} .rech.gross strong{font-size:26px;line-height:1.1} .rech.gross small{font-size:11px}

/* ---------- Kassenverlauf ---------- */
.ch{flex:1;min-height:300px;position:relative;margin:10px 12px 4px 50px}
.ch svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ch .ax{position:absolute;left:-46px;width:40px;text-align:right;font-size:12.5px;color:var(--stumm);transform:translateY(-50%);white-space:nowrap}
.ch .lb{position:absolute;right:4px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;transform:translateY(-115%);white-space:nowrap}
.ch .sp2{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-radius:5px;padding-bottom:2px}
.ch .sp2:hover{background:rgba(244,230,196,.06)} .ch .sp2.jetzt{background:linear-gradient(180deg,rgba(240,195,90,.10),rgba(240,195,90,.02))}
.ch .sp2 small{font-size:11.5px;letter-spacing:.1em;font-weight:700;color:var(--stumm);text-transform:uppercase}
.ch .sp2.jetzt small{color:var(--gold)} .ch .sp2.prog small{font-weight:500}
.ch .pt{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--heim);border:2px solid var(--flaeche-1);transform:translate(-50%,-50%);pointer-events:none}
.ch .pt.prog{background:var(--flaeche-1);border-color:var(--creme)}
.ch .wt{position:absolute;transform:translate(-50%,-150%);font-size:14.5px;font-weight:700;color:var(--creme);pointer-events:none;white-space:nowrap;text-shadow:0 0 6px var(--flaeche-1),0 0 6px var(--flaeche-1)}
.ch .wt.prog{color:var(--leise);font-weight:500} .ch .wt.rot{color:var(--warn)}
.ch .nt{position:absolute;transform:translate(-50%,0);font-size:13px;font-weight:600;pointer-events:none;white-space:nowrap}
.leg{flex:none;display:flex;flex-wrap:wrap;gap:4px 14px;padding:2px 14px 8px 50px;font-size:13px;color:var(--leise)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--pc);margin-right:5px;vertical-align:-1px}
.leg i.hohl{background:none;border:1px solid var(--leise)}
.mix{flex:none;margin:0 12px 10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;color:var(--leise)}

  var b=BUD,q=Z.bq,trag=b.sockel+b.rangbonus*FAKTOR+b.tickets+b.merch+b.praemien-b.betrieb-b.reise-b.kaderpr-b.unterhalt-b.kredit;

  var x=q<1?b.puffer[q]*trag:0,schw=q<1?x/(1-q):0,vk=Z.vk,lock=q<1&&vk>=schw-1e-9,qn=lock?(q>=.85?1:q>=.7?.85:.7):q;
  var ohne=t0+q*vk,mit=lock?Math.min(qn*(basis+vk),ohne+vk,basis+vk-x):ohne,t=Math.max(ohne,mit);
  var lim=b.grenze[q]*g0,tFreiVor=t-b.abloesen-b.bau,gFreiVor=g0-b.laufend;
  var umMax=Math.max(0,Math.min(lim,tFreiVor)),umMin=-Math.max(0,Math.min(lim,gFreiVor,.5*(rl+pu)));

          tFrei:t-um-b.abloesen-b.bau,gFrei:g0+um-b.laufend,boden:rl+pu+x,kasse:b.kasse0+vk-b.abloesen-b.bau};
}

  var h="",w=M.warn,nx=M.tage[Z.now];
  if(Z.ctab==="lage"){
    var frei=RAHMEN-Math.max(0,-M.jetzt), offen=N-Z.now;
    h='<div class="geg" style="--pc:var('+w[1]+')"><span class="ic">'+ic(w[2])+'</span><div><b>'+w[0]+'</b><span>'+w[3]+'</span></div></div>'+
      '<div class="rech d3" style="margin-top:8px"><div><small>Kasse</small><strong class="t '+(M.jetzt<0?"minus":"")+'">'+zahl(M.jetzt).replace(/^/,M.jetzt<0?"−":"")+'</strong></div><div><small>Gehaltsraten</small><strong class="t">'+zahl(Math.max(0,M.jetzt)/GEHALT)+'</strong></div><div class="su"><small>Saisonende</small><strong class="t">'+zahl(M.ende).replace(/^/,M.ende<0?"−":"")+'</strong></div></div>'+
      '<div class="ab2"><div class="gk"><span>Zinsfreier Rahmen</span><em>'+C(Math.max(0,frei))+' von '+C(RAHMEN)+' frei</em></div><div class="wb" style="--pc:var(--warn)"><i style="width:'+kl((RAHMEN-frei)/RAHMEN*100,0,100)+'%"></i></div></div>'+
      '<div class="ab2"><div class="gk"><span>'+(nx.ende?"Saisonende":"Nächste Buchung · Spieltag "+nx.t)+'</span><em>Erwartung</em></div>'+
      gruppen(nx)+'<div class="rek"><span><b>Saldo</b><small>Kasse danach '+C(nx.nach)+'</small></span><strong class="t '+vz(nx.netto+nx.bil)+'">'+Cv(nx.netto+nx.bil)+'</strong></div></div>'+
      '<div class="ab2"><div class="gk"><span>Prognose Saisonende</span><em>± 0,3 C je offenem Spieltag</em></div><div class="rek"><span><b>'+C(M.ende-offen*.3)+' bis '+C(M.ende+offen*.3)+'</b><small>Tiefster Stand '+C(M.min)+' '+(M.minT>N?"am Saisonende":"nach Spieltag "+M.minT)+'</small></span><strong class="t">'+C(M.ende)+'</strong></div></div>'+
      '<div class="akt"><button class="btn klein" data-ans="hebel">'+ic("blitz")+'Hebel</button><button class="btn klein" data-ans="auszug" data-tag="'+Z.now+'">Abrechnung</button><button class="btn klein" data-ans="angebote">Angebote</button></div>';
  }else if(Z.ctab==="quelle"&&Z.ans==="posten"){
    h=pQuelle();
  }else if(Z.ctab==="quelle"){
    var T=M.tage[(Z.ans==="auszug"?Z.tag:Z.now)-1],x=T.l.filter(function(p){return p.id===Z.sel})[0]||T.l.filter(function(p){return p.id==="tic"})[0]||T.l[0],v=KAT[x.kat][1]||"--leise";
    h='<div class="geg" style="--pc:var('+v+')"><span class="ic">'+ic(x.guv?"geld":"markt")+'</span><div><b>'+x.n+'</b><span>'+(T.ende?"Saisonende":"Spieltag "+T.t)+' · '+(T.geb?"gebucht":"Prognose")+' · '+KAT[x.kat][0]+'</span></div></div>'+
      '<div class="rech d3" style="margin-top:8px"><div class="su"><small>Betrag</small><strong class="t '+vz(x.b)+'">'+Cv(x.b)+'</strong></div><div><small>Zählt zur GuV</small><strong>'+(x.guv?"Ja":"Nein")+'</strong></div><div><small>Status</small><strong>'+(T.geb?"Gebucht":"Erwartet")+'</strong></div></div>'+
      '<div class="ab2"><div class="gk"><span>So entsteht die Zahl</span></div><div class="formel t">'+esc(x.f)+'</div></div>'+
      '<div class="ab2"><div class="gk"><span>Herkunft</span></div><div class="rek"><span><b>'+x.h+'</b><small>'+x.q+'</small></span><span class="marke leer">'+KAT[x.kat][0].toUpperCase()+'</span></div>'+
      '<div class="rek"><span><b>Eine Zeile im Kontoauszug</b><small>Team · Saison · Spieltag · Kategorie · Betrag · Notiz</small></span><span class="marke gut">'+(T.geb?"GEBUCHT":"OFFEN")+'</span></div></div>'+
      '<div class="ab2"><div class="gk"><span>Gezeigt = gebucht</span></div><div class="txt">Diese Zahl steht genau so in der Kasse, im Kassenverlauf, in der Saison-GuV und im Tooltip des Saisonstands. Es gibt keine zweite Rechnung.</div></div>'+
      '<div class="akt"><button class="btn klein" data-ans="auszug" data-tag="'+T.t+'">Zum Kontoauszug</button></div>';
  }else{
    var ges=0,k;for(k in M.kat)ges+=M.kat[k];var ant=Math.round(M.kat.spo/ges*100);
    var z=LIGA.map(function(L){return {c:L[0],n:L[1],r:L[2],k:L[3],s:L[4],a:L[5]}}).concat([{c:"V-W",n:"Vigilante Wranglers",r:RANG[Z.now],k:M.jetzt,s:M.tage[Z.now-1].stim,a:ant,wir:1}]).sort(function(a,b){return a.r-b.r});
    h='<div class="gk" style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Liga 2 · Kasse und Stimmung</span><span>Kasse · Fans</span></div>'+
      z.map(function(x){return '<div class="kand'+(x.wir?" wir":"")+'"><em>'+x.r+'</em><img src="../team-logos/'+x.c+'.jpg" alt=""><b>'+x.n+'</b><strong class="t '+(x.k<0?"minus":"")+'">'+zahl(x.k).replace(/^/,x.k<0?"−":"")+'</strong><span class="t">'+x.s+'</span></div>'}).join("")+
      '<div class="txt" style="margin-top:8px">Auswahl aus 16 Teams. Heute haben die schlechter Platzierten mehr Geld (Rubberband). Mit Tickets, Merch und Siegprämien soll Erfolg sich leicht auszahlen, aber nie entscheiden.</div>'+
      '<div class="ab2"><div class="gk"><span>Einnahmen-Mix · dein Team</span><em>Sponsoren '+ant+' %</em></div><div class="mixb" style="margin:0 3px">'+["spo","tic","mer","tv","pra","erg"].filter(function(k){return M.kat[k]>0}).map(function(k){return '<i style="flex:'+M.kat[k]+';'+pc(KAT[k][1])+'"></i>'}).join("")+'</div>'+
      '<div style="margin-top:8px">'+["spo","tic","mer","tv","pra","erg"].filter(function(k){return M.kat[k]>0}).map(function(k){return '<div class="rek" style="padding:4px 2px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var('+KAT[k][1]+');margin-right:7px"></i>'+KAT[k][0]+'</span><strong class="t" style="font-size:16px">'+C(M.kat[k])+' · '+Math.round(M.kat[k]/ges*100)+' %</strong></div>'}).join("")+'</div></div>'+
      '<div class="ab2"><div class="gk"><span>Liga-Ziel</span></div><div class="txt">Heute kommen 96 % der Einnahmen vom Sponsor. Ziel der Liga: rund 68 %, der Rest aus Tickets, Merch und Siegprämien.</div></div>';
  }
  document.getElementById("cb").innerHTML=h;
}
function gruppen(T){var g={},o=[];T.l.forEach(function(x){if(!x.b)return;if(!(x.kat in g)){g[x.kat]=0;o.push(x.kat)}g[x.kat]+=x.b});
  return o.map(function(k){return '<div class="rek" style="padding:4px 2px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;'+(KAT[k][1]?"background:var("+KAT[k][1]+")":"border:1px solid var(--leise)")+';margin-right:7px"></i>'+KAT[k][0]+'</span><strong class="t '+vz(g[k])+'" style="font-size:16px">'+Cv(g[k])+'</strong></div>'}).join("")}

/* ================= Bedienung ================= */
function hebelNull(){Z.preis=0;Z.auto=false;Z.spar=0;Z.dispo=0;Z.bonus=0;Z.kader=1;Z.notv=false;Z.ang={pow:"offen",spe:"offen",soc:"offen",men:"laeuft"}}
document.addEventListener("click",function(e){
  var x=e.target.closest("[data-szen],[data-phone],[data-reset],[data-now],[data-ber],[data-ans],[data-tag],[data-sel],[data-ctab],[data-blatt],[data-ang],[data-auto],[data-spar],[data-kader],[data-bonus],[data-wer],[data-notv],[data-toast],[data-bq],[data-fen],[data-um0],[data-pso],[data-pper],[data-pfil],[data-psel]");
  if(!x)return; var d=x.dataset;
  if(x.tagName==="A"&&x.getAttribute("href")==="#")e.preventDefault();
  if(d.szen){Z.szen=d.szen;hebelNull()}
  if(d.phone){phoneFest=!document.body.classList.contains("phone")}
  if(d.reset){hebelNull();toast("Alle Hebel zurückgesetzt")}
  if(d.now){Z.now=kl(Z.now+ +d.now,1,N);Z.tag=Z.now;hebelNull()}
  if(d.ber){Z.ans={kasse:"kasse",spo:"slots",fan:"fans"}[d.ber]}
  if(d.ans){Z.ans=d.ans;if(d.selx)Z.sel=d.selx}
  if(d.tag){Z.tag=+d.tag}
  if(d.sel){Z.sel=d.sel;Z.ctab="quelle";if(d.tagx)Z.tag=+d.tagx;if(phone())document.body.dataset.blatt="kontext"}
  if(d.ctab){Z.ctab=d.ctab}
  if("blatt" in d){if(d.blatt)document.body.dataset.blatt=d.blatt;else delete document.body.dataset.blatt}
  if(d.ang){
    if(d.zu==="an"&&["pow","spe","men","soc"].filter(aktiv).length>=2){toast("Beide Plätze sind belegt. Erst ein Angebot zurücknehmen.");return}
    Z.ang[d.ang]=d.zu;toast(d.zu==="an"?ANG[d.ang].n+" angenommen · zählt ab dem nächsten Spieltag":d.zu==="ab"?ANG[d.ang].n+" abgelehnt · das Angebot verfällt":"Angebot wieder offen")}
  if(d.auto){Z.auto=d.auto==="1"}
  if(d.kader){Z.kader=+d.kader;toast("Kaderprämie: "+KADN[Z.kader])}
  if(d.bonus){Z.bonus=+d.bonus;if(Z.bonus)toast(zahl(Z.bonus)+" C Bonus an "+STARS[Z.bonusWer].n+" · sofort gebucht")}
  if(d.wer){Z.bonusWer=+d.wer}
  if(d.notv){Z.notv=!Z.notv;toast(Z.notv?"Sterling verkauft · +6,4 C sofort gebucht":"Verkauf zurückgenommen")}
  if(d.toast){toast(d.toast)}
  if(d.bq){Z.bq=+d.bq;Z.um=0}
  if(d.fen){Z.fen=d.fen==="1";Z.um=Math.max(0,Z.um)}
  if(d.um0){Z.um=0;toast("Umschichtung zurückgenommen")}
  if(d.pso){var ps=d.pso.split(":"),pc0=ps[1]==="ant"?"ges":ps[1],alt=Z.pso[ps[0]];Z.pso[ps[0]]=alt[0]===pc0?[pc0,-alt[1]]:[pc0,pc0==="n"||pc0==="tp"||pc0==="rg"?1:-1]}
  if(d.pper){Z.pper=d.pper}
  if(d.pfil){Z.pfil=d.pfil}
  if(d.psel){Z.psel=d.psel;Z.ctab="quelle";if(phone())document.body.dataset.blatt="kontext"}
  zeichne();
});
document.addEventListener("input",function(e){
  if(e.target.id==="preis"){Z.preis=+e.target.value;zeichne(e.target)}
  if(e.target.id==="dispo"){Z.dispo=+e.target.value;zeichne(e.target)}
  if(e.target.id==="um"){Z.um=+e.target.value;zeichne(e.target)}
  if(e.target.id==="vk"){Z.vk=+e.target.value;zeichne(e.target)}
});
document.addEventListener("keydown",function(e){
  if(e.target.tagName==="INPUT")return;
  if(e.key==="Escape"){delete document.body.dataset.blatt}
  if(e.key==="ArrowLeft"&&Z.now>1){Z.now--;Z.tag=Z.now;hebelNull();zeichne()}
  if(e.key==="ArrowRight"&&Z.now<N){Z.now++;Z.tag=Z.now;hebelNull();zeichne()}
});
addEventListener("resize",function(){if(document.body.classList.contains("phone")!==phone())zeichne()});
if(q.get("blatt"))document.body.dataset.blatt=q.get("blatt");
zeichne();
</script>
