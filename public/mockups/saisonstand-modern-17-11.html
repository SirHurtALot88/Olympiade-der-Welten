<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saisonstand – modern (Mockup 17.11.)</title>
<!--
  SAISONSTAND IM BROADCAST-STIL (Fable, 17.11.). Drittes Mockup zum Plan docs/design/oly-seiten-modern-17-11.md,
  Entwurfstext: docs/design/saisonstand-modern-17-11.md.
  Gleiche Tokens, gleiche Schiene, gleicher Hero-Kopf, gleiche Tafel wie einsatzliste-modern-17-11.html und oly-start-modern-17-11.html.
  ECHT (Live-Abbild 17.11., Save vom 31.10.): 32 Teams, Wappen, Liga-Zuordnung, Startplaetze, Spielplan (320 Paarungen),
        Disziplin-Plan (20 Spieltage x 2), Kader, Spielernamen, Portraits, Klassen, Disziplinwerte, Marktwert, Gehalt, Cash.
        Sponsoren und GuV aus dem Bild fable-uiux-screenshots-14-11/04 (derselbe Save).
  ERFUNDEN: jedes Ergebnis (der Save steht vor Spieltag 1). Simulation: Kaderstaerke je Disziplin + Rauschen. Daraus Punkte, Bilanz,
        Verhaeltnis, Form, Verlauf, Matchwinner, Rekorde. Eigene Mannschaft = Vigilante Wranglers wie in den beiden anderen Mockups
        (im echten Save ist es Nunchuck Ninjas: ?wir=N-N). "Franky" und "Rivale" sind Beispielmarken.
  Keine externen Skripte, Schriften lokal.
  URL: ?szene=tabelle|teamkarte|liga1|gesamt|verein|matrix|kader|verlauf|punkte|spieltage|ansetzungen|bestenliste|start|ende
       &liga=1|2|0  &st=0..20  &team=X-X  &wir=X-X  &still=1  &phone=1  &blatt=kontext
-->
<style>
@font-face{font-family:"RaniraSeason";src:url("../fonts/ranira-bold-italic.otf") format("opentype");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url("einsatzliste-modern-17-11/barlow-condensed-latin-500-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url("einsatzliste-modern-17-11/barlow-condensed-latin-600-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url("einsatzliste-modern-17-11/barlow-condensed-latin-700-normal.woff2") format("woff2");font-display:swap}
:root{
  --grund:#06080c; --flaeche:rgba(9,12,18,.90); --flaeche-1:#0c1017; --flaeche-2:#121824; --flaeche-3:#1a2231;
  --linie:rgba(244,230,196,.13); --linie-2:rgba(244,230,196,.30);
  --creme:#f4e6c4; --gold:#f0c35a; --tinte:#eef2f8; --leise:#9aa7ba; --stumm:#66738a;
  --heim:#F2A03D; --gast:#45B0C9; --gut:#62d394; --warn:#ff6058; --acht:#f3b54a;
  --p1:#e0637a; --p2:#e89a4c; --p3:#c3cf5e; --p4:#4fc7b2; --p5:#62a0f4; --p6:#ac8af2;
  --haus:"RaniraSeason",Georgia,"Times New Roman",serif;
  --zahl:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --r:10px; --r-s:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020305;color:var(--tinte);font-family:var(--zahl);font-size:16px;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.t{font-variant-numeric:tabular-nums}
.gk{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
img{display:block}
.plus{color:var(--gut)} .minus{color:var(--warn)} .null{color:var(--stumm)}

/* ---------- Mockup-Steuerung (gehoert NICHT zum UI) ---------- */
.demo{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#0d1016;border-bottom:1px solid #222a38;font-size:14px;color:var(--leise);white-space:nowrap;overflow-x:auto}
.demo b{color:var(--creme);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;margin-right:4px}
.demo button{padding:3px 10px;border:1px solid #2b3445;border-radius:999px;color:var(--tinte);font-weight:600}
.demo button:hover{border-color:var(--gold)} .demo button[aria-pressed=true]{background:var(--gold);color:#17120a;border-color:var(--gold)}
.demo a{color:var(--gold);margin-left:auto;font-weight:600}
.demo kbd,.kbd{font:inherit;font-size:12px;border:1px solid #333d50;border-radius:4px;padding:0 5px;color:var(--leise)}
body.still .demo{display:none}

/* ---------- Geruest ---------- */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);height:calc(100vh - 38px);min-height:760px;background:var(--grund)}
body.still .app{height:100vh}
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;background:#080b11;border-right:1px solid var(--linie)}
.rail .logo{width:40px;height:40px;border-radius:9px;overflow:hidden;border:1px solid var(--linie-2);margin-bottom:10px}
.rail .logo img{width:100%;height:100%;object-fit:cover}
.rail a{position:relative;width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font-size:20px;color:var(--stumm)}
.rail a:hover{background:var(--flaeche-2);color:var(--tinte)}
.rail a.an{background:linear-gradient(180deg,rgba(240,195,90,.2),rgba(240,195,90,.06));color:var(--gold)}
.rail a.an::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--gold)}
.rail .zahl{position:absolute;right:3px;top:3px;min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.rail .luecke{flex:1}
main{display:flex;flex-direction:column;min-width:0;min-height:0}

/* Tooltip (ein Muster fuer alles) */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:90;left:50%;top:calc(100% + 7px);transform:translateX(-50%);width:max-content;max-width:280px;white-space:pre-line;
  padding:6px 9px;border-radius:6px;background:#020305;border:1px solid var(--linie-2);color:var(--tinte);font:500 13.5px/1.3 var(--zahl);letter-spacing:0;text-transform:none;text-align:left;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.6)}
[data-tip].tr::after{left:calc(100% + 8px);top:50%;transform:translateY(-50%)}
[data-tip].tl::after{left:auto;right:0;transform:none}
[data-tip].tll::after{left:0;transform:none}
[data-tip].to::after{top:auto;bottom:calc(100% + 7px)}
body.phone [data-tip]::after{display:none}

/* ---------- Hero-Kopf ---------- */
.hero{position:relative;flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch;gap:22px;padding:14px 20px 0;border-bottom:1px solid var(--linie);overflow:hidden;isolation:isolate}
.hero .kul{position:absolute;inset:-30px;z-index:-2;background:url("../szenen/basketball/parkett.jpg") center 40%/cover;filter:blur(14px) saturate(1.15);opacity:.5}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,8,12,.94) 0%,rgba(6,8,12,.72) 38%,rgba(6,8,12,.62) 62%,rgba(6,8,12,.93) 100%),linear-gradient(180deg,transparent 40%,var(--grund) 100%)}
.hk{display:flex;align-items:center;gap:14px;padding-bottom:14px}
.hk .crest{width:62px;height:62px;border-radius:10px;overflow:hidden;border:2px solid var(--heim);box-shadow:0 6px 18px rgba(0,0,0,.5);flex:none}
.hk .crest img{width:100%;height:100%;object-fit:cover}
.hk h1{margin:0;font:400 34px/1 var(--haus);color:#fff;letter-spacing:.01em}
.hk .sub{margin-top:5px;font-size:15px;color:var(--leise);font-weight:500;white-space:nowrap}
.hk .sub b{color:var(--creme);font-weight:600}
.mdw{display:inline-flex;align-items:center;gap:2px;margin-bottom:5px}
.mdw button{width:24px;height:24px;border-radius:5px;border:1px solid var(--linie);display:grid;place-items:center;color:var(--leise)}
.mdw button:hover{border-color:var(--gold);color:var(--gold)} .mdw button[disabled]{opacity:.3;cursor:default}
.mdw span{padding:0 8px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);white-space:nowrap}
/* Liga-Reiter (derselbe Baustein wie die Disziplin-Reiter der Einsatzliste) */
.tabs{display:flex;align-items:flex-end;gap:10px;min-width:0}
.dtab{position:relative;flex:1 1 0;min-width:0;max-width:340px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 20px 12px 18px;
  background:rgba(18,24,36,.72);border:1px solid var(--linie);border-bottom:0;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);color:var(--leise);transition:background .15s}
.dtab:hover{background:rgba(26,34,49,.9)}
.dtab.an{background:linear-gradient(180deg,rgba(240,195,90,.2),rgba(18,24,36,.92) 70%);color:var(--tinte)}
.dtab.an::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gold)}
.dtab .ic{width:38px;height:38px;border-radius:8px;overflow:hidden;display:grid;place-items:center;font-size:22px;background:rgba(0,0,0,.35);border:1px solid var(--linie);color:var(--creme)}
.dtab .ic img{width:100%;height:100%;object-fit:cover}
.dtab.an .ic{color:var(--gold);border-color:rgba(240,195,90,.5)}
.dtab em{display:block;font-style:normal;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtab b{display:block;font:400 22px/1.1 var(--haus);color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtab .erw{text-align:right}
.dtab .erw strong{display:block;font-size:28px;line-height:1;font-weight:700;color:var(--creme)}
.dtab .erw span{font-size:12px;color:var(--stumm);letter-spacing:.06em;white-space:nowrap}
.dtab .mein{position:absolute;right:20px;top:-1px;height:15px;padding:0 6px;background:var(--heim);color:#17120a;font-size:10.5px;font-weight:700;letter-spacing:.1em;border-radius:0 0 3px 3px}
.hr{display:flex;align-items:center;gap:16px;padding-bottom:14px}
.frist{text-align:right;white-space:nowrap}
.frist strong{display:block;font-size:22px;line-height:1.1;font-weight:700;color:var(--creme);max-width:250px;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:7px;border:1px solid var(--linie-2);background:var(--flaeche-2);font-weight:600;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.btn:hover{background:var(--flaeche-3);border-color:var(--creme)}
.btn.klein{height:30px;padding:0 10px;font-size:14px}

/* ---------- Arbeitsflaeche ---------- */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:12px;padding:12px 14px}
.pan{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);overflow:hidden}
.pk{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--linie);min-height:46px}
.pk h2{margin:0;font:400 19px/1 var(--haus);color:var(--creme);white-space:nowrap}
.pk h2 i,.sg h3 i{font:700 19px/1 var(--zahl);font-style:normal}
.pk .sp{flex:1}
.pk .hin{font-size:13.5px;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ktabs{flex:none;display:flex;border-bottom:1px solid var(--linie)}
.ktabs button{flex:1;height:42px;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--stumm);border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:0 10px}
.ktabs button:hover{color:var(--tinte)} .ktabs button.an{color:var(--gold);border-bottom-color:var(--gold)}
.kb{flex:1;overflow-y:auto;min-height:0;padding:12px}
.seg{display:inline-flex;border:1px solid var(--linie-2);border-radius:7px;overflow:hidden;flex:none}
.seg button{text-align:center;height:30px;padding:0 11px;font-weight:600;font-size:14px;color:var(--leise);border-right:1px solid var(--linie);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--flaeche-2);color:var(--tinte)}
.seg button[aria-pressed=true]{background:var(--creme);color:#17120a}
.marke{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#0b0d12;background:var(--pc,var(--leise));flex:none}
.marke.rot{background:var(--warn);color:#fff} .marke.leer{background:none;border:1px solid var(--linie-2);color:var(--leise)}
.marke.wir{background:var(--heim)} .marke.fr{background:var(--gast)} .marke.gold{background:var(--gold)} .marke.gut{background:var(--gut)}
.kf{flex:none;padding:7px 12px;border-top:1px solid var(--linie);font-size:13px;color:var(--stumm);display:flex;gap:14px;align-items:center;white-space:nowrap;overflow:hidden}
.kf i{display:inline-block;width:4px;height:13px;border-radius:2px;vertical-align:-2px;margin-right:5px}
.kf .sp{flex:1}

/* ---------- Tabelle (Raster-Zeilen wie die Kaderliste) ---------- */
.tl{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.th,.tz{display:grid;gap:8px;align-items:center;padding:0 12px 0 0;width:100%}
.sport .th,.sport .tz{grid-template-columns:50px 34px minmax(170px,1fr) 70px 56px 104px 88px 30px 30px 30px 30px 36px 46px 54px}
.verein .th,.verein .tz{grid-template-columns:50px minmax(170px,1fr) 52px 66px 88px 76px 92px 88px 84px 54px}
.th{flex:none;height:28px;border-bottom:1px solid var(--linie);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stumm);font-weight:600;position:sticky;top:0;background:var(--flaeche-1);z-index:5}
.th button{color:inherit;letter-spacing:inherit;text-transform:inherit;font-weight:inherit;text-align:right;white-space:nowrap}
.th button.li{text-align:left} .th button.mi{text-align:center}
.th button.an{color:var(--gold)} .th button:hover{color:var(--tinte)}
.th button:first-child{padding-left:16px;text-align:left}
.tz{position:relative;flex:1 1 0;min-height:33px;max-height:42px;border-bottom:1px solid rgba(244,230,196,.06);font-size:16px;text-align:right}
.tz:hover{background:var(--flaeche-2)}
.tz::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.tz.z-titel::before{background:var(--gold)} .tz.z-auf::before{background:var(--gut)} .tz.z-ab::before{background:var(--warn)}
.tz.g-u{border-bottom:1px dashed var(--zc)} .tz.z-titel{--zc:var(--gold)} .tz.z-auf{--zc:var(--gut)} .tz.g-o{border-top:1px dashed var(--warn);margin-top:-1px}
.tz.wir{background:linear-gradient(90deg,rgba(242,160,61,.22),rgba(242,160,61,.04));color:#fff}
.tz.gew{box-shadow:inset 0 0 0 2px var(--gold);background:rgba(240,195,90,.08)}
.tz .rg{padding-left:16px;text-align:left;font-size:19px;font-weight:700;color:var(--stumm)}
.tz.z-titel .rg{color:var(--gold)} .tz.z-auf .rg{color:var(--gut)} .tz.z-ab .rg{color:var(--warn)} .tz.wir .rg{color:var(--heim)}
.tz .tr{font-size:13.5px;font-weight:700;text-align:left;white-space:nowrap}
.tm{display:flex;align-items:center;gap:9px;min-width:0;text-align:left}
.tm img{width:26px;height:26px;border-radius:5px;object-fit:cover;flex:none}
.tm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tinte)}
.tz.wir .tm b{color:#fff}
.tz .bil{color:var(--leise);letter-spacing:.02em}
.tz .pt strong{font-size:21px;font-weight:700;color:var(--creme)}
.tz .ar{color:var(--stumm);font-size:15px} .tz .ar.top{color:var(--creme);font-weight:700}
.tz .ab{color:var(--leise);font-size:15px}
.tz .nx{display:flex;justify-content:flex-end} .tz .nx img{width:22px;height:22px;border-radius:4px;object-fit:cover;opacity:.9}
.fm{display:flex;gap:3px;justify-content:flex-end}
.fm i{width:13px;height:13px;transform:skewX(-14deg);background:var(--gut);border-radius:1px;flex:none} .fm i.n{background:var(--warn)} .fm i.u{background:var(--stumm)} .fm i.o{background:rgba(255,255,255,.1)}
.tz svg.spk{width:84px;height:22px;display:block;margin-left:auto}
.lgtr{flex:none;display:flex;align-items:center;gap:10px;height:30px;padding:0 16px;background:var(--flaeche-2);border-bottom:1px solid var(--linie);border-top:1px solid var(--linie)}
.leerh{flex:none;display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--linie);font-size:14.5px;color:var(--leise);background:linear-gradient(90deg,rgba(240,195,90,.12),transparent)}
.leerh b{color:var(--creme);font-weight:600}

/* ---------- Disziplin-Matrix ---------- */
.mx{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.mh,.mz{display:grid;grid-template-columns:minmax(196px,1fr) repeat(20,minmax(34px,44px)) 54px;gap:2px;align-items:stretch;padding:0 12px 0 0;width:100%}
.mh{flex:none;position:sticky;top:0;z-index:6;background:var(--flaeche-1)}
.mh.grp{height:24px;padding-top:6px} .mh.grp span{grid-column:span 5;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--pc);border-bottom:2px solid var(--pc);text-align:center;margin:0 1px}
.mh.lab{top:24px;height:30px;border-bottom:1px solid var(--linie)}
.mh.lab button{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--leise);text-align:center;border-radius:4px}
.mh.lab button:hover{color:var(--tinte);background:var(--flaeche-2)} .mh.lab button.an{color:var(--gold)}
.mh.lab button.heute{box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}
.mh.lab button:first-child{text-align:left;padding-left:16px;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--stumm)}
.mz{position:relative;flex:1 1 0;min-height:31px;max-height:40px;margin-top:2px}
.mz::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0 2px 2px 0}
.mz.z-titel::before{background:var(--gold)} .mz.z-auf::before{background:var(--gut)} .mz.z-ab::before{background:var(--warn)}
.mz .tmz{display:flex;align-items:center;gap:8px;padding-left:14px;min-width:0;overflow:hidden;position:sticky;left:0;background:var(--flaeche-1);z-index:2}
.mz .tmz span{width:22px;font-weight:700;color:var(--stumm);font-size:15px;flex:none}
.mz.wir .tmz{background:linear-gradient(90deg,#3a2a14,#191510)} .mz.wir .tmz span{color:var(--heim)}
.mz.gew .tmz{box-shadow:inset 0 0 0 2px var(--gold)}
.mz .c{display:grid;place-items:center;border-radius:3px;font-size:15px;font-weight:700;color:#fff;background:rgba(255,255,255,.05)}
.mz .c.leer{color:var(--stumm);font-weight:500;background:rgba(255,255,255,.025)}
.mz .c:hover{outline:2px solid var(--creme);z-index:3}
.mz .su{display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--creme)}
.mx.spalte .mz .c:not(.sp-an){opacity:.38}
.skala{display:inline-flex;align-items:center;gap:3px} .skala i{width:16px;height:12px;border-radius:2px;margin:0}

/* ---------- Saisonverlauf ---------- */
.vl{flex:1;min-height:320px;position:relative}
.vl svg{position:absolute;inset:0;width:100%;height:100%}
.vl text{font-family:var(--zahl);fill:var(--stumm);font-size:12.5px}
.vl .ln path.s{fill:none;stroke:#5a6679;stroke-width:1.6;opacity:.55;stroke-linejoin:round;stroke-linecap:round}
.vl .ln path.h{fill:none;stroke:transparent;stroke-width:13;cursor:pointer}
.vl .ln text{fill:var(--leise);font-size:14.5px;font-weight:500;cursor:pointer}
.vl .ln:hover path.s{stroke:var(--creme);stroke-width:3;opacity:1} .vl .ln:hover text{fill:#fff}
.vl .ln.zone path.s{opacity:.8}
.vl .ln.wir path.s{stroke:var(--heim);stroke-width:3.6;opacity:1} .vl .ln.wir text{fill:var(--heim);font-weight:700}
.vl .ln.gew path.s{stroke:var(--gast);stroke-width:3.6;opacity:1} .vl .ln.gew text{fill:var(--gast);font-weight:700}
.vl circle{stroke:var(--flaeche-1);stroke-width:2}

/* ---------- Spieltage ---------- */

  ["cols","mat","ver","spt","ctab"].forEach(function(k){var y=t.closest("[data-"+k+"]");if(y){Z[k]=y.dataset[k];treffer=true}});
  if((x=t.closest("[data-blatt]"))){blatt(phone()?x.dataset.blatt:"");treffer=true}
  if(treffer){szene="";alles()}
});
