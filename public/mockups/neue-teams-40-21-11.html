<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neue Teams für 40 – Vorschlag (Mockup 21.11.)</title>
<!--
  NEUE TEAMS FÜR ZWEI 20ER-LIGEN (Fable, 21.11.). Erklaerung: docs/design/neue-teams-40-21-11.md
  Datenvorschlag im Quellformat: docs/design/neue-teams-40-21-11/vorschlag.json (NICHT in data/source eingetragen).
  ECHT: die 32 bestehenden Teams (Ratings aus data/source/team-identities.json, Startbudget aus references/sheets/season-management.csv),
        Durchschnitte und Zeilensummen der Fit-Matrix (data/source/team-fit-matrix.json), Poolgroessen je Rasse/Subklasse und die
        Pool-Passung (2984 Spieler aus data/generated/oly-player-stats.json, gerechnet wie lib/market/transfermarkt-fit.ts: Rasse + Summe Subklassen).
  VORSCHLAG: alles an den 10 neuen Teams (Namen, Lore, Ratings, Fit-Zeilen, Startbudget, Embleme) und die Aufstiegsregel.
  RUNDE 2 (Chris, 21.11.): die heutigen Teams ruecken in Liga 1 auf, ALLE neuen Teams kommen in Liga 2.
        Liga 1 = 16 heutige Liga-1-Teams + 4 Aufsteiger (M-S, D-P, V-V, T-G), Liga 2 = 12 uebrige + 8 neue. Alle zehn auf Liga-2-Niveau.
        Rasse heisst Aqua (Matrix seit PR #1674), Subklasse Behemoth zaehlt als Giant.
  URL: ?ansicht=uebersicht|ligen|team|tabellen|kurz  ?team=L-L  ?fit=rassen|sub  ?tab=ratings|rassen|sub|strategie  ?karte=kompass|geld  ?still=1
-->
<style>
@font-face{font-family:"RaniraSeason";src:url("../fonts/ranira-bold-italic.otf") format("opentype");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url("../fonts/barlow-condensed-latin-500-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url("../fonts/barlow-condensed-latin-600-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url("../fonts/barlow-condensed-latin-700-normal.woff2") format("woff2");font-display:swap}
:root{
  --grund:#06080c; --flaeche-1:#0c1017; --flaeche-2:#121824; --flaeche-3:#1a2231;
  --linie:rgba(244,230,196,.13); --linie-2:rgba(244,230,196,.30);
  --creme:#f4e6c4; --gold:#f0c35a; --tinte:#eef2f8; --leise:#9aa7ba; --stumm:#66738a;
  --heim:#F2A03D; --gast:#45B0C9; --gut:#62d394; --warn:#ff6058; --acht:#f3b54a; --blau:#7fb0ff;
  --pow:#ff7a6e; --spe:#5fd68a; --men:#6fb0ff; --soc:#f3cf5a;
  --haus:"RaniraSeason",Georgia,"Times New Roman",serif;
  --zahl:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --r:.625rem;
}
/* Entwurfsmass 120 x 67,5 rem (= 1920 x 1080 bei 16 px); die Wurzel waechst mit Breite UND Hoehe (2560 x 1440 = 21,3 px). */
html{font-size:clamp(12.5px,min(0.8333vw,1.4815vh),34px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020305;color:var(--tinte);font-family:var(--zahl);-webkit-font-smoothing:antialiased}
body{font-size:1rem;overflow:hidden}
button,a{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,th:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.t{font-variant-numeric:tabular-nums}
.gk{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600;white-space:nowrap}
img{display:block}
.plus{color:var(--gut)} .minus{color:var(--warn)} .null{color:var(--stumm)} .acht{color:var(--acht)}
.sp{flex:1}
.demo{height:2.25rem;display:flex;align-items:center;gap:.7rem;padding:0 .9rem;background:#0d1016;border-bottom:1px solid #222a38;font-size:.875rem;color:var(--leise);white-space:nowrap;overflow:hidden}
.demo b{color:var(--creme);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.75rem}
.demo i.tr{width:1px;height:1.1rem;background:#2a3344;flex:none}
body.still .demo{display:none}
.app{--kopf:2.25rem;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:4.5rem minmax(0,1fr);height:calc(100vh - var(--kopf));background:var(--grund)}
body.still .app{--kopf:0rem}
/* Regieband */
.band{position:relative;z-index:40;display:flex;align-items:center;gap:.9rem;height:4.5rem;padding:0 1rem 0 1.25rem;border-bottom:1px solid var(--linie);white-space:nowrap;background:linear-gradient(90deg,#0a0d13 0%,#101622 45%,#0b0e15 100%)}
.ort{flex:none;min-width:0}
.ort em{display:block;font-style:normal;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);height:1rem}
.ort em span{color:var(--stumm)}
.ort h1{margin:.1rem 0 0;font:400 1.95rem/1.05 var(--haus);color:#fff}
.kpis{display:flex;gap:.45rem;min-width:0}
.kpi{min-width:6.6rem;padding:.38rem 1.05rem .42rem 1.15rem;background:rgba(14,19,29,.82);border:1px solid var(--linie);clip-path:polygon(.7rem 0,100% 0,calc(100% - .7rem) 100%,0 100%);line-height:1.05}
.kpi span{display:block;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
.kpi strong{font-size:1.55rem;font-weight:700;color:var(--creme)}
.kpi strong small{font-size:.8rem;font-weight:500;color:var(--leise)}
.seg{display:inline-flex;border:1px solid var(--linie-2);border-radius:.4rem;overflow:hidden;height:2.2rem;flex:none}
.seg button{padding:0 .95rem;font-size:.95rem;font-weight:600;color:var(--leise);display:flex;align-items:center;gap:.4rem}
.seg button+button{border-left:1px solid var(--linie)}
.seg button.an{background:var(--gold);color:#17120a;font-weight:700}
.seg button:not(.an):hover{background:var(--flaeche-2);color:var(--tinte)}
.seg.kl{height:1.8rem} .seg.kl button{padding:0 .65rem;font-size:.86rem}
/* Panels */
.pan{display:flex;flex-direction:column;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);overflow:hidden;min-width:0;min-height:0}
.pk{display:flex;align-items:center;gap:.6rem;padding:0 .9rem;border-bottom:1px solid var(--linie);height:2.6rem;flex:none}
.pk h2{min-width:0;overflow:hidden;text-overflow:ellipsis;margin:0;font:400 1.19rem/1 var(--haus);color:var(--creme);white-space:nowrap}
.pk .hin{font-size:.82rem;color:var(--leise);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pb{padding:.7rem .9rem;flex:1;min-height:0;display:flex;flex-direction:column}
/* Tabellen (Designsystem-Regel 21.11.: jede Tabelle sortierbar, Klick auf den Kopf, zweiter Klick dreht) */
table.tb{width:100%;border-collapse:collapse;table-layout:fixed}
.tb th{position:sticky;top:0;z-index:2;height:1.9rem;padding:0 .4rem;background:#0f141d;border-bottom:1px solid var(--linie-2);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--leise);text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
.tb th:hover{color:var(--creme)}
.tb th.re,.tb td.re{text-align:right} .tb th.mi,.tb td.mi{text-align:center}
.tb th.so{color:var(--gold)}
.tb th.so::after{content:"▾";margin-left:.2rem;font-size:.8rem;letter-spacing:0}
.tb th.so.auf::after{content:"▴"}
.tb td{padding:0 .4rem;border-bottom:1px solid rgba(244,230,196,.07);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.98rem;height:var(--zh,2rem)}
.tb tbody tr:hover{background:rgba(255,255,255,.035)}
.tb tr.neu{background:linear-gradient(90deg,rgba(240,195,90,.13),rgba(240,195,90,.02))}
.tb tr.res{background:linear-gradient(90deg,rgba(69,176,201,.13),rgba(69,176,201,.02))}
.tb tr.ziel{cursor:pointer}
.tb tr.auf{background:linear-gradient(90deg,rgba(98,211,148,.15),rgba(98,211,148,.02))}
.tbw{flex:1;min-height:0;overflow:auto}
.nm{display:flex;align-items:center;gap:.5rem;min-width:0}
.nm b{font:400 1rem/1.1 var(--haus);color:#fff;overflow:hidden;text-overflow:ellipsis}
.nm small{font-size:.78rem;color:var(--leise)}
.kz{display:inline-block;min-width:2.2rem;padding:0 .3rem;border-radius:.2rem;background:rgba(255,255,255,.07);color:var(--creme);font-weight:700;font-size:.82rem;text-align:center;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:.3rem;height:1.45rem;padding:0 .5rem;border-radius:.3rem;border:1px solid var(--linie-2);font-size:.82rem;font-weight:600;color:var(--tinte);white-space:nowrap}
.chip.l1{border-color:var(--gold);color:var(--gold)} .chip.auf{border-color:var(--gut);color:var(--gut)} .chip.l2{border-color:var(--gast);color:var(--gast)} .chip.rs{border-color:var(--stumm);color:var(--leise);border-style:dashed}
.chip img{width:1.05rem;height:1.05rem;object-fit:contain}
.chip b{font-weight:700}
.chip.gut{border-color:rgba(98,211,148,.55);background:rgba(98,211,148,.1)} .chip.gut b{color:var(--gut)}
.chip.schl{border-color:rgba(255,96,88,.5);background:rgba(255,96,88,.09)} .chip.schl b{color:var(--warn)}
.klt{display:inline-flex;align-items:center;gap:.3rem;height:1.45rem;padding:0 .5rem 0 .25rem;border-radius:.3rem;border:1px solid;font-size:.84rem;font-weight:700;white-space:nowrap}
.klt img{width:1.1rem;height:1.1rem;object-fit:contain}
.klt i{font-style:normal;font-size:.68rem;letter-spacing:.06em;opacity:.85}
.klt.red{color:var(--pow);border-color:var(--pow);background:rgba(229,72,60,.16)} .klt.green{color:var(--spe);border-color:var(--spe);background:rgba(47,176,100,.16)}
.klt.blue{color:var(--men);border-color:var(--men);background:rgba(58,128,230,.18)} .klt.yellow{color:var(--soc);border-color:var(--soc);background:rgba(230,184,40,.16)}
.klt.weg{opacity:.62;border-style:dashed;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
/* Achsenbalken POW SPE MEN SOC (Summe immer 20) */
.axb{display:flex;height:1.25rem;border-radius:.2rem;overflow:hidden;background:#0a0e15;border:1px solid var(--linie)}
.axb i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.8rem;font-weight:700;color:#0b0e14;min-width:0;overflow:hidden}
.axb .p{background:var(--pow)} .axb .s{background:var(--spe)} .axb .m{background:var(--men)} .axb .o{background:var(--soc)}
.axl{display:flex;justify-content:space-between;font-size:.62rem;letter-spacing:.12em;color:var(--stumm);font-weight:700;margin-top:.12rem}
.emb{flex:none;display:block}
/* Rangleiste 40 */
.rl{display:grid;grid-template-columns:repeat(40,minmax(0,1fr));gap:1px;height:.7rem}
.rl i{background:rgba(255,255,255,.08);transform:skewX(-14deg)}
.rl i.o{background:rgba(98,211,148,.2)} .rl i.u{background:rgba(255,96,88,.18)}
.rl i.an{background:var(--gold);box-shadow:0 0 .4rem var(--gold)}
.rl.z20{grid-template-columns:repeat(20,minmax(0,1fr))}
/* Fit-Zelle */
.fz{display:inline-block;min-width:2rem;padding:0 .25rem;border-radius:.2rem;font-weight:700;text-align:center}
.fb{position:relative;height:.8rem;background:rgba(255,255,255,.05);border-radius:.1rem}
.fb::before{content:"";position:absolute;left:80%;top:-.15rem;bottom:-.15rem;width:1px;background:var(--linie-2)}
.fb i{position:absolute;top:0;bottom:0;border-radius:.1rem}

/* ===================== ÜBERSICHT ===================== */
.ub{display:grid;grid-template-columns:minmax(0,1fr) 33rem;gap:.72rem;padding:.8rem 1rem;min-height:0}
.karten{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:.6rem}
.kt{position:relative;display:flex;flex-direction:column;gap:.42rem;padding:.6rem .7rem .55rem;background:var(--flaeche-2);border:1px solid var(--linie);border-radius:.5rem;overflow:hidden;min-height:0;text-align:left;transition:border-color .12s,transform .12s,opacity .12s}
.kt::before{content:"";position:absolute;left:0;top:0;right:0;height:.22rem;background:linear-gradient(90deg,var(--c1),var(--c2))}
.kt:hover{border-color:var(--c1);transform:translateY(-1px)}
.kt.aus{opacity:.28}
.kt .kopf{display:flex;align-items:center;gap:.55rem;min-width:0}
.kt .kopf div{min-width:0;line-height:1.05}
.kt h3{margin:0;font:400 1.1rem/1.05 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt .zeile{display:flex;align-items:center;gap:.3rem;margin-top:.25rem}
.kt .motto{font-size:.86rem;color:var(--c1);font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt p{margin:0;font-size:.86rem;line-height:1.24;color:var(--tinte)}
.kt p.idee{color:var(--leise);border-left:2px solid var(--c1);padding-left:.45rem;font-size:.83rem;line-height:1.22}
.kt .fuss{margin-top:auto;display:flex;flex-direction:column;gap:.35rem}
.kt .rz{display:flex;flex-wrap:wrap;gap:.22rem;align-items:center}
.kt .rz img{width:1.25rem;height:1.25rem;object-fit:contain}
.kt .rz .weg{opacity:.5;filter:grayscale(1);position:relative}
.kt .rz em{font-style:normal;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--stumm);font-weight:700;margin-right:.1rem}
.kt .rz em.m{margin-left:.35rem}
.kt .wt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.2rem}
.kt .wt span{display:block;background:#0a0e15;border:1px solid var(--linie);border-radius:.2rem;padding:.1rem .1rem .12rem;text-align:center;line-height:1.02}
.kt .wt small{display:block;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--stumm);font-weight:700}
.kt .wt b{font-size:1rem;font-weight:700;color:var(--creme)}
.seite-r{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:.72rem;min-height:0}
.kompass{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.kompass svg{width:100%;height:100%;max-height:100%}
.bil{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.2rem 1rem}
.bil .z{display:grid;grid-template-columns:4.6rem minmax(0,1fr) 6.2rem;align-items:center;gap:.4rem;height:1.25rem;font-size:.88rem}
.bil .z b{font-weight:700}
.bil .z .bk{position:relative;height:.55rem;background:rgba(255,255,255,.06);border-radius:.1rem}
.bil .z .bk i{position:absolute;left:0;top:0;bottom:0;border-radius:.1rem;opacity:.45}
.bil .z .bk u{position:absolute;top:0;bottom:0;border-radius:.1rem}
.bil .z span{text-align:right;color:var(--leise)} .bil .z span b{color:var(--creme)}
.lig{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.35rem .9rem;margin-top:.55rem;padding-top:.5rem;border-top:1px solid var(--linie)}
.lig div{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center;min-width:0}
.lig .gk{width:100%}

/* ===================== TEAM ===================== */
.tm{display:grid;grid-template-columns:27rem minmax(0,1fr) 35rem;grid-template-rows:auto minmax(0,1fr);gap:.6rem .72rem;padding:.7rem 1rem .8rem;min-height:0}
.wahl{grid-column:1/4;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.4rem}
.wahl button{display:flex;align-items:center;gap:.45rem;height:2.7rem;padding:0 .5rem;border:1px solid var(--linie);border-radius:.45rem;background:var(--flaeche-1);min-width:0}
.wahl button:hover{border-color:var(--linie-2)}
.wahl button.an{border-color:var(--c1);background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 22%,transparent),transparent)}
.wahl b{font:400 .95rem/1 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wahl small{display:block;font-size:.7rem;color:var(--leise);letter-spacing:.06em}
.wahl div{min-width:0;line-height:1.1}
.steck{gap:.6rem;overflow:hidden}
.steck .kopf{display:flex;gap:.8rem;align-items:center}
.steck h2{margin:0;font:400 1.9rem/1.02 var(--haus);color:#fff}
.steck .motto{color:var(--c1);font-weight:600;font-size:1rem}
.steck .chips{display:flex;flex-wrap:wrap;gap:.3rem}
.steck p{margin:0;font-size:1.02rem;line-height:1.3}
.steck h4{margin:.1rem 0 -.3rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.steck p.l{color:var(--leise)}
.mitte{display:grid;grid-template-rows:auto minmax(0,1fr);gap:.72rem;min-height:0}
#t-rat{--zh:2.2rem}
.pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 1rem;flex:1;min-height:0}
.pick > div{display:flex;flex-direction:column;gap:.34rem;min-width:0}
.pick h3{margin:0;font:400 1.02rem/1 var(--haus)}
.pick .rh{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center}
.pick .gk{margin-top:.1rem}
#t-fit{--zh:2.52rem}
.fuss2{flex:none;display:flex;gap:1rem;align-items:center;padding:.45rem .9rem;border-top:1px solid var(--linie-2);background:#0a0e15;font-size:.9rem;color:var(--leise);white-space:nowrap}
.fuss2 b{color:var(--creme)}

/* ===================== TABELLEN ===================== */
.tv{display:grid;grid-template-columns:minmax(0,1fr);padding:.8rem 1rem;min-height:0}
#t-alle{--zh:1.62rem} #t-alle td{font-size:.94rem}
.heat{--zh:3.9rem} .heat.eng{--zh:1.75rem} .heat:not(.eng) td.hz{font-size:1.08rem}
.heat tfoot td{position:sticky;bottom:0;background:#0f141d;border-top:1px solid var(--linie-2);border-bottom:0;height:1.9rem;color:var(--leise);font-size:.86rem}
.heat tfoot tr:nth-child(1) td{bottom:3.8rem} .heat tfoot tr:nth-child(2) td{bottom:1.9rem}
.heat tfoot td.hz{font-weight:600;font-size:.82rem;border-left:1px solid rgba(6,8,12,.8)}
.heat td.hz{padding:0;text-align:center;font-weight:700;font-size:.9rem;border-left:1px solid rgba(6,8,12,.8)}
.heat th.hoch{height:6.4rem;vertical-align:bottom;padding:0 0 .3rem;text-align:center}
.heat th.hoch span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.06em}
.heat th.hoch.so::after{display:block;margin:0}
.heat th img{width:1.3rem;height:1.3rem;object-fit:contain;margin:0 auto .2rem}

/* ===================== LIGEN ===================== */
.lg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 31.5rem;gap:.72rem;padding:.8rem 1rem;min-height:0}
.lg .rechts{display:grid;grid-template-rows:auto minmax(0,1fr);gap:.72rem;min-height:0}
#t-l1,#t-l2{--zh:2.52rem}
#t-l1 td,#t-l2 td{font-size:1.02rem}
#t-l1 .nm b,#t-l2 .nm b{font-size:.95rem;overflow:visible}
.lg .txt li{font-size:.97rem;line-height:1.27} .lg .txt ul{gap:.34rem} .lg .txt h3{margin:.7rem 0 .35rem}
#t-chk{--zh:1.72rem}
#t-chk td.n{font-weight:700;color:var(--creme)} #t-chk td.v{color:var(--leise)}
#t-chk td.tr,#t-chk th.tr{border-left:1px solid var(--linie-2)}
.lg .fuss2 b{color:var(--creme)}
.stat-auf{color:var(--gut);font-weight:700} .stat-neu{color:var(--acht);font-weight:700}
/* Liga-Listen in der Uebersicht */
.ll{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.2rem 1rem}
.ll .kopf{display:flex;align-items:baseline;gap:.4rem;margin-bottom:.3rem;white-space:nowrap}
.ll .kopf b{font:400 1.05rem/1 var(--haus);color:var(--creme)}
.ll .gitter{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.22rem}
.lk{display:flex;align-items:center;justify-content:center;height:1.5rem;border-radius:.22rem;border:1px solid var(--linie);background:rgba(255,255,255,.04);font-size:.86rem;font-weight:700;color:var(--leise);letter-spacing:.03em}
.lk.auf{border-color:var(--gut);color:var(--gut);background:rgba(98,211,148,.1)}
.lk.neu{border-color:var(--c1);color:#fff;background:color-mix(in srgb,var(--c1) 26%,transparent)}
.ll .ax{margin-top:.35rem;font-size:.8rem;color:var(--leise);white-space:nowrap}
.ll .ax b{font-weight:700}
.legl{display:flex;flex-wrap:wrap;gap:.2rem .8rem;margin-top:.5rem;padding-top:.45rem;border-top:1px solid var(--linie);font-size:.8rem;color:var(--leise)}
.legl i{display:inline-block;width:.7rem;height:.7rem;border-radius:.15rem;margin-right:.3rem;vertical-align:-.05rem;border:1px solid}

/* ===================== KURZ ===================== */

/* ---------- Sortierbare Tabelle ---------- */
const SORT={};
function tabelle(id,spalten,zeilen,opt={}){
  const st=SORT[id]||(SORT[id]={k:opt.sort??null,auf:opt.auf??false});
  let z=[...zeilen];
  if(st.k!=null){const sp=spalten.find(s=>s.k===st.k);if(sp){const w=sp.w||(r=>r[sp.k]);
    z.sort((a,b)=>{const x=w(a),y=w(b);const c=typeof x==="string"?x.localeCompare(y,"de"):(x-y);return st.auf?c:-c})}}
  const cg=`<colgroup>${spalten.map(s=>`<col${s.b?` style="width:${s.b}"`:""}>`).join("")}</colgroup>`;
  const th=spalten.map(s=>`<th tabindex="0" data-k="${s.k}" class="${s.c||""}${st.k===s.k?" so"+(st.auf?" auf":""):""}" title="${esc(s.tip||"Sortieren")}">${s.h||esc(s.t)}</th>`).join("");
  const tr=z.map(r=>`<tr class="${opt.zk?opt.zk(r):""}"${opt.ziel?` data-ziel="${opt.ziel(r)||""}"`:""}>${spalten.map(s=>`<td class="${s.c||""}${s.zc?" "+s.zc:""}"${s.st?` style="${s.st(r)}"`:""}>${s.f?s.f(r):esc(r[s.k])}</td>`).join("")}</tr>`).join("");
  return`<table class="tb ${opt.kl||""}" id="${id}">${cg}<thead><tr>${th}</tr></thead><tbody>${tr}</tbody>${opt.fuss?`<tfoot>${opt.fuss}</tfoot>`:""}</table>`}
document.addEventListener("click",e=>{
  const th=e.target.closest("th[data-k]");
  if(th){const id=th.closest("table").id,st=SORT[id],k=th.dataset.k;if(st.k===k)st.auf=!st.auf;else{st.k=k;st.auf=th.dataset.auf==="1"}zeichne();return}
  const z=e.target.closest("[data-ziel]");if(z&&z.dataset.ziel){Z.team=z.dataset.ziel;Z.ansicht="team";zeichne();return}
  const b=e.target.closest("[data-set]");if(b){const[k,v]=b.dataset.set.split("=");Z[k]=v==="true"?true:v==="false"?false:v;zeichne()}
});

/* Marken ohne Überlappung: jede Marke sucht rund um ihren Punkt den Platz mit der kleinsten Überdeckung
   (gegen alle Punkte und alle schon gesetzten Marken); wer weiter weg muss, bekommt einen Führungsstrich. */
function setzeMarken(pkt,W,fest=[]){
  const ueb=(a,b)=>Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0]))*Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1]));
  const kreise=pkt.map(p=>[p.x-p.r-1.5,p.y-p.r-1.5,p.x+p.r+1.5,p.y+p.r+1.5]),box=[...fest];
  const RI=Array.from({length:16},(_,i)=>{const w=Math.PI/2-i*Math.PI/8;return[Math.cos(w),Math.sin(w)]});
  return pkt.map(p=>{const w=p.t.length*p.fs*.6+4,hh=p.fs*1.05;let best=null;
    for(const s of[0,4,9,15,22,30,40,52,66])for(const[a,b]of RI){
      const cx=p.x+a*(p.r+2+w/2+s),cy=p.y+b*(p.r+1+hh/2+s);
      const r=[cx-w/2,cy-hh/2,cx+w/2,cy+hh/2];
      let k=s*1.2+Math.abs(a)*1.5;
      for(const q of kreise)k+=ueb(r,q)*4;
      for(const q of box)k+=ueb(r,q)*5;
      if(r[0]<2||r[1]<2||r[2]>W-2||r[3]>W-2)k+=5000;
      if(!best||k<best.k)best={k,cx,cy,r,s};
    }
    box.push(best.r);return best});
}
function punkteSvg(liste,W,fest){
  // liste: [{t:Team,x,y}] ; neue Teams zuerst setzen (wichtigste Marken), dann die 32
  const ord=[...liste.filter(p=>p.t.neu),...liste.filter(p=>!p.t.neu)].map(p=>({...p,r:p.t.neu?8.5:3.6,fs:p.t.neu?12.5:9,txt:p.t.id}));
  const m=setzeMarken(ord.map(p=>({x:p.x,y:p.y,r:p.r,fs:p.fs,t:p.txt})),W,fest);
  const teil=ord.map((p,i)=>{const t=p.t,l=m[i],res=t.neu===2;
    const strich=l.s>=9?`<path d="M${p.x} ${p.y}L${l.cx} ${l.cy}" stroke="${t.neu?t.farben[0]:"#66738a"}" stroke-opacity=".55" stroke-width=".8"/>`:"";
    const kreis=t.neu?`<circle cx="${p.x}" cy="${p.y}" r="8.5" fill="${t.farben[0]}" fill-opacity="${res?.25:.95}" stroke="${res?t.farben[0]:"#0b0e14"}" stroke-width="2" ${res?'stroke-dasharray="3 2"':""}/>`
      :`<circle cx="${p.x}" cy="${p.y}" r="3.6" fill="${t.liga===1?"#8a96aa":"#45B0C9"}" fill-opacity=".85" ${t.auf?'stroke="#62d394" stroke-width="2"':""}/>`;
    const marke=`<text x="${l.cx}" y="${l.cy+p.fs*.34}" text-anchor="middle" font-size="${p.fs}" font-weight="${t.neu?700:600}" fill="${t.neu?t.farben[0]:t.auf?"#62d394":t.liga===1?"#8a96aa":"#5fa9bd"}" stroke="#0c1017" stroke-width="${t.neu?3:2.2}" paint-order="stroke">${t.id}</text>`;
    return{neu:t.neu,strich,kreis:`<g ${t.neu?`data-ziel="${t.id}" style="cursor:pointer"`:""}><title>${esc(t.name)} · ${status(t)}, Liga ${t.liga}${p.tip?" · "+p.tip:""}</title>${kreis}${marke}</g>`}});
  // Reihenfolge im Bild: Striche, die 32, dann die neuen obenauf
  return teil.map(x=>x.strich).join("")+teil.filter(x=>!x.neu).map(x=>x.kreis).join("")+teil.filter(x=>x.neu).map(x=>x.kreis).join("")}
function streue(liste){
  // Teams auf demselben Punkt rücken auf einen kleinen Ring, damit jeder Punkt sichtbar bleibt
  const gr={};liste.forEach(p=>{const k=Math.round(p.x)+"|"+Math.round(p.y);(gr[k]=gr[k]||[]).push(p)});
  Object.values(gr).forEach(g=>{if(g.length<2)return;const fest=g.filter(p=>p.t.neu),los=g.filter(p=>!p.t.neu),rad=fest.length?13:5.5;
    fest.forEach((p,i)=>{p.x+=(i-(fest.length-1)/2)*19});
    los.forEach((p,i)=>{const w=Math.PI/2+i*2*Math.PI/los.length;p.x+=Math.cos(w)*rad;p.y-=Math.sin(w)*rad})});
  return liste}
function kompass(){
  // links POW, rechts SPE, oben MEN, unten SOC: x = SPE − POW, y = MEN − SOC (jede Achse 0..20, Summe 20)
  const W=440,M=220,S=9.6,e=20*S;
  const liste=streue(ALLE.map(t=>({t,x:M+(t.spe-t.pow)*S,y:M-(t.men-t.soc)*S,tip:`POW ${t.pow} SPE ${t.spe} MEN ${t.men} SOC ${t.soc}`})));
  return`<svg viewBox="0 0 ${W} ${W}" font-family="Barlow Condensed, Arial Narrow, sans-serif">
    <path d="M${M-e} ${M}L${M} ${M-e}L${M+e} ${M}L${M} ${M+e}z" fill="rgba(255,255,255,.025)" stroke="rgba(244,230,196,.3)"/>
    <path d="M${M-e/2} ${M}L${M} ${M-e/2}L${M+e/2} ${M}L${M} ${M+e/2}z" fill="none" stroke="rgba(244,230,196,.1)"/>
    <path d="M${M-e} ${M}H${M+e}M${M} ${M-e}V${M+e}" stroke="rgba(244,230,196,.13)"/>
    <text x="${M}" y="${M-e-7}" text-anchor="middle" font-size="15" font-weight="700" fill="#6fb0ff">MEN</text>
    <text x="${M}" y="${M+e+17}" text-anchor="middle" font-size="15" font-weight="700" fill="#f3cf5a">SOC</text>
    <text x="${M-e-4}" y="${M-26}" text-anchor="start" font-size="15" font-weight="700" fill="#ff7a6e">POW</text>
    <text x="${M+e+4}" y="${M-26}" text-anchor="end" font-size="15" font-weight="700" fill="#5fd68a">SPE</text>
    ${punkteSvg(liste,W,[[M-17,M-e-21,M+17,M-e-4],[M-17,M+e+3,M+17,M+e+20],[M-e-5,M-40,M-e+28,M-22],[M+e-28,M-40,M+e+5,M-22]])}</svg>`}
function geldkarte(){
  const W=440,L=44,R=14,O=16,U=40,x=v=>L+(v-1)/9*(W-L-R),y=v=>W-U-(v-1)/9*(W-O-U);
  const gitter=[1,2.5,4,5.5,7,8.5,10].map(v=>`<path d="M${x(v)} ${O}V${W-U}M${L} ${y(v)}H${W-R}" stroke="rgba(244,230,196,.08)"/><text x="${x(v)}" y="${W-U+15}" text-anchor="middle" font-size="11" fill="#66738a">${de(v)}</text><text x="${L-7}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#66738a">${de(v)}</text>`).join("");
  const liste=streue(ALLE.map(t=>({t,x:x(t.finances),y:y(t.ambition),tip:`Finanzen ${de(t.finances)} · Ehrgeiz ${de(t.ambition)}`})));
  return`<svg viewBox="0 0 ${W} ${W}" font-family="Barlow Condensed, Arial Narrow, sans-serif">${gitter}
    <text x="${(L+W-R)/2}" y="${W-6}" text-anchor="middle" font-size="13" font-weight="700" fill="#9aa7ba" letter-spacing="1.5">FINANZEN →</text>
    <text transform="translate(13 ${(O+W-U)/2}) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="#9aa7ba" letter-spacing="1.5">EHRGEIZ →</text>${punkteSvg(liste,W-R,[])}</svg>`}

function ligen(){
  const zahl=(k,t,b,tip)=>({k,t,c:"re t",b,tip,f:r=>de(r[k])});
  const spalten=l=>[
    {k:"startrangL",t:"#",c:"re t",b:"2.3rem",f:r=>`<b>${r.startrangL}.</b>`,tip:"Startrang in der Liga (nach Startbudget, 1 = höchstes)"},
    {k:"name",t:"Team",f:r=>`<span class="nm"><span class="kz">${r.id}</span><b>${esc(r.name)}</b></span>`},
    {k:"status",t:"Status",b:"6.3rem",w:r=>r.neu?2:r.auf?1:0,f:r=>r.neu?'<span class="stat-neu">neu</span>':r.auf?'<span class="stat-auf">▲ Aufsteiger</span>':`<span class="null">${l===1?"Bestand":"bleibt"}</span>`,tip:"Aufsteiger = heutige Liga 2, Startbudget-Rang 17–20"},
    {k:"startbudget",t:"Budget",c:"re t",b:"3.9rem",f:r=>`<b>${r.startbudget}</b>`,tip:"Startbudget"},
    {k:"achsen",t:"POW·SPE·MEN·SOC",b:"7rem",w:r=>r.men,f:r=>achsBalken(r),tip:"Achsen (Summe 20) · sortiert nach MEN"},
    zahl("finances","Fin.","2.7rem","Finanzwert 1–10"),zahl("ambition","Ehrg.","3rem","Ehrgeiz 1–10"),

     <ul><li>Achsen-Schnitt je Team, Liga 1 neu: POW ${de(b1.pow.m)}, SPE ${de(b1.spe.m)}, MEN ${de(b1.men.m)}, SOC ${de(b1.soc.m)}. Liga 2 neu: POW ${de(b2.pow.m)}, SPE ${de(b2.spe.m)}, MEN ${de(b2.men.m)}, SOC ${de(b2.soc.m)}. Vorher lag MEN bei ${de(D.lig.l1v.men.m)} gegen ${de(D.lig.l2v.men.m)}.</li>
     <li>Über alle 40 bleibt jede Achse bei genau <b>200</b>. Gruppen C : F: Liga 1 ${b1.C} : ${b1.F}, Liga 2 ${b2.C} : ${b2.F}.</li>
     <li>In der neuen Liga 2 hat <b>jede Rasse und jede Subklasse</b> mindestens ein Team, das sie mit +4 sucht (heute fehlen dort ${D.lueckeR[2].length} Rassen und ${D.lueckeS[2].length} Subklassen).</li>
     <li>Jedes neue Team findet genug Spieler: zwischen ${Math.min(...NEU.map(t=>t.pool[1]))} und ${Math.max(...NEU.map(t=>t.pool[1]))} mit Fit ab 5 (die 32: ${D.poolRef.min[1]} bis ${D.poolRef.max[1]}).</li></ul>
   </div></section>
   <section class="pan"><div class="pk"><h2>Die zehn auf einen Blick</h2><span class="hin">Klick öffnet das Team</span></div><div class="tbw">${tab}</div></section>
   <section class="pan"><div class="pk"><h2>Was sich bei 40 Teams sonst ändert</h2></div><div class="pb txt">
     <h3>Braucht deine Entscheidung</h3>
     <ul><li>Welche acht der zehn, und ob Namen und Kürzel so bleiben.</li>
     <li><b>Aufstiegsregel:</b> Startbudget-Rang 17 bis 20 (Vorschlag) oder eine der Alternativen.</li>
     <li><b>Figuren:</b> acht Teams brauchen Spieler mit Figur. Neue PixelLab-Figuren und Animationen sind gesperrt, bis du sie freigibst.</li>
     <li>Startbudgets: Zwischenwerte der Liga-2-Leiter (z. B. 207), damit M-M Rang 1 und R-R Schlusslicht bleiben. Alternative: die ganze Leiter neu staffeln.</li></ul>
     <h3>Muss mitwachsen (nur Liste)</h3>
     <ul><li>Spielplan: 19 Gegner je Liga statt 15, bei 20 Spieltagen fast eine volle Runde.</li>
     <li>Liga-Größe, Auf- und Abstieg, Ranglisten, Rangleisten und Sponsor-Leiter von 16 auf 20.</li>
     <li>Draft-Reihenfolge und Dauer: 40 Teams, rund 80 Picks mehr.</li>
     <li>Spielerpool: 2984 Spieler reichen für rund 480 Kaderplätze, aber die Spitze wird dünner.</li>
     <li>Beziehungs-Tabelle, Strategieprofile, Themenquoten, Wappen, Sponsoren und Manager für die neuen Teams.</li></ul>
     <h3>Aus Runde 1 erledigt</h3>
     <ul><li><b>Fish = Aqua:</b> die Matrix heißt jetzt selbst Aqua (PR #1674); der Vorschlag und alle Zahlen hier sind umgestellt.</li>
     <li><b>Giant = Behemoth:</b> Behemoth-Spieler (${D.spool.Giant}) werden beim Nachschlagen auf Giant übersetzt; die Giant-Werte greifen damit.</li></ul>
   </div></section></div>`}

function zeichne(){
  $("#kpis").innerHTML=[["Teams","32 <small>→</small> 40"],["Liga 1","16 <small>+ 4 Aufsteiger</small>"],["Liga 2","12 <small>+ 8 neue</small>"],["Vorschläge","8 <small>+ 2 Reserve</small>"]].map(([a,b])=>`<div class="kpi"><span>${a}</span><strong class="t">${b}</strong></div>`).join("");
  $("#tabs").innerHTML=[["uebersicht","Übersicht"],["ligen","Ligen"],["team","Team im Detail"],["tabellen","Tabellen"],["kurz","Kurz zusammengefasst"]].map(([v,t])=>`<button class="${Z.ansicht===v?"an":""}" data-set="ansicht=${v}">${t}</button>`).join("");
  embNr=0;
  $("#seite").innerHTML=({uebersicht,ligen,team,tabellen,kurz}[Z.ansicht]||uebersicht)();
}
zeichne();
</script>
