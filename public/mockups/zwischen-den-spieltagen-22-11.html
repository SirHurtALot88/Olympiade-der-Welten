<title>Zwischen den Spieltagen · Rahmenkonzept (Mockup 22.11.)</title>
<!--
ZWISCHEN DEN SPIELTAGEN: RAHMENKONZEPT (Fable, 22.11.). Zuerst das grosse Bild, die Bausteine nur als Beispiele.
  ?ansicht=rahmen       Schleifen, Saeulen, Kreislauf, Wellen (die Uebersicht des Rahmens)
  ?ansicht=woche        Beispiel 1: die Zwischenphase als EIN Ort ("Die Woche")
  ?ansicht=ausruestung  Beispiel 2: Ausruestung am Spieler, Punkte on top, Haltbarkeit, im Ergebnis sichtbar, Kiste 1 aus 3
  ?ansicht=lage         Beispiel 3: Liga-Lage, ein Ereignis fuer alle 32 Teams, jede*r reagiert
  ?ansicht=liga         Ligaformat 2x16 / 2x20 / 3x16
  ?still=1 ohne Mockup-Leiste. Auf "woche", "ausruestung" und "lage" sind Karten, Kiste und Antworten anklickbar.
VORGABEN VON CHRIS (22.11.): Ausruestung = Punkte on top, nicht matrix-gedeckelt, Ausreisser gewollt; Haltbarkeit vielfaeltig;
  die KI muss alles nutzen; Server 4 GB RAM; Ereignisse ligaweit; kein Pokal, keine Weltmeisterschaft.
ECHT: Schleifen und Systeme, die es gibt (Einsatzliste, Formkarten, Belastung, Pause, Vorstand, Sponsor, Gebaeude, Training,
  Scouting, Delegation, zwei 16er-Ligen), Teams, Logos, Portraits, Kulissen.
NEU: alles mit lila Marke. ERFUNDEN: alle Zahlen, Namen der Gegenstaende, Karten und Lagen (Startwerte zum Diskutieren).
Requisiten sind SVG/CSS-Platzhalter. 0 PixelLab-Generationen, kein App-Code, keine externen Skripte.
Erklaerung: docs/design/zwischen-den-spieltagen-22-11.md
-->
<style>
@font-face{font-family:"RaniraSeason";src:url("../fonts/ranira-bold-italic.otf") format("opentype");font-display:swap}

:root{

}

.t{font-variant-numeric:tabular-nums}

.rail{display:flex;flex-direction:column;gap:.2rem;padding:.6rem;background:#080b11;border-right:1px solid var(--linie)}
.rail .logo{width:2.75rem;height:2.75rem;border-radius:.55rem;overflow:hidden;border:1px solid var(--linie-2);margin-bottom:.5rem}
.rail .logo img{width:100%;height:100%;object-fit:cover}
.rail a{position:relative;height:2.75rem;border-radius:.55rem;display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:var(--stumm)}
.rail a.an{background:linear-gradient(180deg,rgba(240,195,90,.2),rgba(240,195,90,.06));color:var(--gold)}
.rail a.an::before{content:"";position:absolute;left:-.6rem;top:.55rem;bottom:.55rem;width:.19rem;border-radius:2px;background:var(--gold)}
.rail .luecke{flex:1}
main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.hero{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.6rem;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--linie);overflow:hidden;isolation:isolate}
.hero .kul{position:absolute;inset:0;z-index:-2;display:grid;grid-template-columns:1fr 1fr}

.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,8,12,.96) 0%,rgba(6,8,12,.72) 30%,rgba(6,8,12,.5) 55%,rgba(6,8,12,.85) 100%),linear-gradient(180deg,rgba(6,8,12,.2) 30%,var(--grund) 100%)}
.hk{display:flex;align-items:center;gap:1rem}
.crest{width:4.9rem;height:4.9rem;border-radius:.75rem;overflow:hidden;border:2px solid var(--heim);box-shadow:0 .5rem 1.4rem rgba(0,0,0,.5);flex:none}
.crest img{width:100%;height:100%;object-fit:cover}
.hk em{font-style:normal;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold)}

.kpis{display:flex;gap:.5rem;justify-content:center;min-width:0}

.btn.klein{height:1.9rem;padding:0 .8rem;font-size:.85rem;border:1px solid var(--linie-2);border-radius:.3rem;color:var(--creme)}
.btn.klein.g{background:var(--gold);color:#17120a;border-color:var(--gold)}
.cta small{font-size:.82rem;color:var(--leise)}
.pan{display:flex;flex-direction:column;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);overflow:hidden;min-width:0;min-height:0}
.pk{display:flex;align-items:center;gap:.6rem;padding:0 .9rem;border-bottom:1px solid var(--linie);height:2.7rem;flex:none}

/* ============ RAHMEN ============ */
.ra{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));grid-template-rows:auto minmax(0,1.9fr) minmax(0,1fr);gap:.72rem;padding:.7rem 1rem .8rem;min-height:0}

.schl{grid-column:span 5;position:relative;padding:.7rem .9rem .75rem;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);border-top:3px solid var(--f)}

.schl dd b{color:var(--neu);font-weight:600}
.saeu{grid-column:span 4;display:flex;flex-direction:column;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);overflow:hidden;min-height:0}
.saeu header{padding:.6rem .8rem;border-bottom:1px solid var(--linie);background:linear-gradient(180deg,color-mix(in srgb,var(--f) 22%,transparent),transparent);border-top:3px solid var(--f)}
.saeu header small{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--f)}
.saeu h3{margin:.05rem 0 0;font:400 1.4rem/1 var(--haus);color:#fff}
.saeu .st{display:flex;align-items:center;gap:.5rem;margin-top:.35rem;font-size:.82rem;color:var(--leise)}

.saeu .in{padding:.55rem .8rem;flex:1;min-height:0;display:flex;flex-direction:column;gap:.3rem}
.saeu .in p{font-size:1.06rem;color:var(--leise);line-height:1.28} .saeu .in p b{color:var(--creme);font-weight:600}
.saeu .in{gap:.55rem!important} .saeu .in p:first-child{font-size:1.2rem}
.saeu .in .gk{margin-top:.2rem}
.bs{display:flex;flex-direction:column;gap:.3rem;margin-top:auto}
.bst{display:grid;grid-template-columns:1.7rem minmax(0,1fr) auto;gap:.5rem;align-items:center;padding:.42rem .5rem;border-radius:.3rem;background:var(--flaeche-2);border:1px solid var(--linie);font-size:1.04rem;color:var(--tinte)}
.bst i{font-style:normal;font-weight:700;font-size:.74rem;width:1.5rem;height:1.25rem;border-radius:.2rem;display:grid;place-items:center;color:#17120a;background:var(--w)}
.bst small{font-size:.74rem;color:var(--stumm);white-space:nowrap}
.w1{--w:#62d394} .w2{--w:#45B0C9} .w3{--w:#f0c35a} .w4{--w:#b48cff} .w5{--w:#ff8f6b}
.well{grid-column:span 13;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem}
.wk{padding:.55rem .7rem;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);border-left:.3rem solid var(--w)}
.wk em{font-style:normal;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--w)}
.wk h4{margin:.15rem 0 .4rem;font:400 1.3rem/1.05 var(--haus);color:#fff}
.wk{padding:.7rem .8rem!important}
.wk p{font-size:1rem;color:var(--leise);line-height:1.26} .wk p b{color:var(--creme);font-weight:600}
.kreis{grid-column:span 7;padding:.7rem .9rem;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);display:flex;flex-direction:column}

.kreis .rr div{padding:.45rem .35rem;border-radius:.3rem;background:var(--flaeche-2);border:1px solid var(--linie);font-size:.84rem;color:var(--leise);line-height:1.15;text-align:center}
.kreis .rr b{display:block;font-size:1.1rem;color:var(--creme)} .kreis .rr div.n b{color:var(--neu)}
.kreis p{font-size:.98rem;color:var(--leise);margin-top:auto;padding-top:.5rem;line-height:1.28} .kreis p b{color:var(--creme)}

/* ============ WOCHE ============ */
.wo{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto minmax(0,1.45fr) minmax(0,1fr);gap:.72rem;padding:.7rem 1rem .8rem;min-height:0}
.takt{grid-column:1/13;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem}
.takt div{display:flex;align-items:center;gap:.6rem;padding:.5rem .8rem;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);font-size:.95rem;color:var(--leise)}
.takt div b{display:block;color:var(--creme);font-size:1.02rem} .takt .nr{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--linie-2);color:var(--creme);flex:none}

.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;flex:1;min-height:0}
.ak{position:relative;display:flex;flex-direction:column;padding:.6rem .65rem;border-radius:.5rem;background:linear-gradient(180deg,color-mix(in srgb,var(--f) 26%,var(--flaeche-2)),var(--flaeche-2) 55%);border:1px solid color-mix(in srgb,var(--f) 60%,transparent);cursor:pointer;transition:transform .12s}
.ak:hover{transform:translateY(-.25rem)} .ak.gew{outline:2px solid var(--gold);transform:translateY(-.35rem)}
.ak em{font-style:normal;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--f)}
.ak .bild{flex:1;min-height:3.4rem;max-height:11rem;display:grid;place-items:center;font-size:5rem;color:var(--f);margin:.3rem 0;border-radius:.4rem;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--f) 22%,transparent),transparent 70%)}
.ak b{font:400 1.4rem/1.05 var(--haus);color:#fff}
.ak p{font-size:1rem;color:var(--leise);line-height:1.2;margin-top:.3rem} .ak p b{font:600 inherit/inherit var(--zahl);color:var(--creme)}
.ak .fuss{padding-top:.5rem;font-size:.76rem;color:var(--stumm)}
.lagebd{position:relative;flex:none;padding:.7rem .9rem;isolation:isolate;border-bottom:1px solid var(--linie)}
.lagebd::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(255,96,88,.2),transparent 75%)}
.lagebd h3{margin:.1rem 0 .15rem;font:400 1.6rem/1 var(--haus);color:#fff} .lagebd p{font-size:.95rem;color:var(--leise)} .lagebd p b{color:var(--creme)}
.kiste{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.8rem;align-items:center;padding:.5rem .6rem;border-radius:.5rem;background:var(--flaeche-2);border:1px solid rgba(240,195,90,.4);margin-bottom:.5rem}
.kiste svg{width:5.5rem;height:4.4rem} .kiste b{font:400 1.2rem/1.1 var(--haus);color:#fff} .kiste p{font-size:.88rem;color:var(--leise);line-height:1.2;margin:.15rem 0 .35rem}

/* ============ AUSRUESTUNG ============ */
.au{display:grid;grid-template-columns:27rem minmax(0,1fr) 31rem;grid-template-rows:minmax(0,1fr) auto;gap:.72rem;padding:.7rem 1rem .8rem;min-height:0}
.spk{position:relative;height:13.5rem;flex:none;isolation:isolate;overflow:hidden}
.spk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%;z-index:-2}
.spk::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 30%,rgba(6,8,12,.97) 88%)}
.spk div{position:absolute;left:.9rem;right:.9rem;bottom:.6rem}
.spk h3{margin:0;font:400 2rem/1 var(--haus);color:#fff} .spk small{color:var(--leise);font-size:.92rem}
.slot{display:grid;grid-template-columns:3.6rem minmax(0,1fr);gap:.7rem;align-items:center;padding:.55rem .6rem;border-radius:.5rem;background:var(--flaeche-2);border:1px solid var(--linie);margin-bottom:.5rem}
.gi{position:relative;width:3.6rem;height:3.6rem;border-radius:.5rem;display:grid;place-items:center;font-size:1.9rem;color:var(--sf);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--sf) 34%,#0c1017),#0c1017 75%);border:2px solid var(--sf);flex:none}
.gi u{position:absolute;right:-.3rem;top:-.3rem;min-width:1.25rem;height:1.25rem;padding:0 .2rem;border-radius:.65rem;background:#0c1017;border:1px solid var(--sf);color:var(--sf);font:700 .72rem/1.2rem var(--zahl);text-align:center;text-decoration:none}
.slot b{font:400 1.12rem/1.05 var(--haus);color:#fff} .slot small{display:block;font-size:.84rem;color:var(--leise);line-height:1.2}
.slot .bon{font-size:1.5rem;font-weight:700;color:var(--gut)}
.hb{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--leise);margin-top:.2rem} .hb .balk{flex:1}
.heute{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:.15rem .7rem;align-items:baseline;font-size:.98rem;color:var(--leise);margin-top:auto;padding-top:.5rem;border-top:1px solid var(--linie)}
.heute b{color:var(--creme)} .heute strong{font-size:1.35rem;color:var(--creme)} .heute .hh{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--stumm);font-weight:700;text-align:right}
.heute span{text-align:right}
