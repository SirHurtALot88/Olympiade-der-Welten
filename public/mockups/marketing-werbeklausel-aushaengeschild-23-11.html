<!--
  MARKETING RUNDE 4, STAND 23.11.: Werbeklausel (dritter Hebel in jeder Verhandlung und Verlängerung) und Aushängeschild (Wahl auf der
  Marketing-Seite, Mehrspieler). Regeln: docs/design/marketing-22-11.md Abschnitt 4.2/4.3/5, Erklärung: Abschnitt „Runde 4“ ebenda.
  Gleiche Tokens, Schiene, Hero-Kopf und Tafeln wie marketing-22-11.html (Stilblock von dort übernommen). Kein App-Code, kein PixelLab, alles CSS/SVG.
  ECHT: Spielernamen, Klassen, Rassen, Traits, Gehaltsforderung (Kader Hell Raisers, Golden Gladiators und vier Markt-Spieler) aus
        data/generated/oly-player-stats.json, Portraits und Wappen aus public/, Formeln = Konzept (Team-Anteil 40 % + Bausteine, Netz 25 % des Gehalts).
  BEISPIELWERTE: Marketability der Spieler, Moral, Restlaufzeit, aktuelle Klausel, Teamerfolg der Vorsaison, Vorjahres-Gesicht, Ramonas Team.
        Die KI-Wahl rechnet das Skript nach der Regel „höchste Marketability unter den besten sechs“.
  URL: ?view=verh|verl|aush|multi  &team=H-R|G-G  &kauf=<slug>  &sel=<slug>
-->

.haupt{position:relative}
