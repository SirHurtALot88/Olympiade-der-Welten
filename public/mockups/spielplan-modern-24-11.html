<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spielplan – modern (Mockup 24.11.)</title>
<!--
  SPIELPLAN IM NEUEN STIL (Fable, 24.11.): Saison-Leiste, Spieltag mit Paarungen und Vierergruppen, Kalender 16 x 20, Disziplinen.
  Erklaerung: docs/design/spieler-teams-modern-24-11.md (Abschnitt Spielplan)
  Loest app/foundation/ranks-v2/FoundationDiszisNewLook.tsx (View "diszis") ab. Chris: "sehr unuebersichtlich".
  ECHT (Live-Abbild 24.11., Saison 1, Spieltag 12): Paarungen mit Heim/Auswaerts fuer alle 20 Spieltage beider Ligen, Disziplinen und
        Plaetze je Spieltag, Ergebnisse der 11 gewerteten Spieltage (Rohwert und E1-Ergebnis 0 bis 10), Vierergruppen mit Plaetzen, Punkte.
  BEISPIEL: Vierergruppen kuenftiger Spieltage (je zwei Paarungen verschmolzen), Ticket-Einnahmen, Fans. Mutatoren: in diesem Spielstand keine.
  URL: ?ansicht=saison|kalender|disziplinen  ?st=1..20  ?liga=1|2  ?team=<Kuerzel> (Blick auf ein Team)  ?d=0..19 (Disziplin-Filter)
       ?achse=0..3  ?sort=<spalte>&dir=-1|1  ?nebel=aus  ?ich=V-W  ?still=1
-->
<link rel="stylesheet" href="modern-24-11/rahmen.css">
<link rel="stylesheet" href="modern-24-11/bausteine.css">
<style>
.seite.pl1{grid-template-columns:minmax(0,1fr) 29rem;grid-template-rows:auto auto minmax(0,1fr)}
.seite.pl1>#f-leiste,.seite.pl1>#p-band{grid-column:1/3}
.seite.pl2{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.seite.pl3{grid-template-columns:minmax(0,1fr) 24rem;grid-template-rows:auto minmax(0,1fr)}
.seite.pl3>#f-leiste3{grid-column:1/3}
.fbar{display:flex;align-items:center;gap:.6rem;padding:.4rem .8rem;white-space:nowrap;flex-direction:row!important;overflow:hidden}
.fbar .gk{font-size:.62rem}
.fbar .tw{display:flex;gap:.12rem} .fbar .tw a{width:1.75rem;height:1.75rem;border-radius:.25rem;border:1px solid transparent;opacity:.5;cursor:pointer;display:block}
.fbar .tw a img{width:100%;height:100%;object-fit:cover;border-radius:.2rem;display:block} .fbar .tw a:hover{opacity:1} .fbar .tw a.an{opacity:1;border-color:var(--gold);box-shadow:0 0 .5rem rgba(240,195,90,.6)} .fbar .tw a.ich{opacity:.95;outline:1px solid var(--heim)}
.fbar .dw{display:flex;gap:.12rem} .fbar .dw a{height:1.55rem;padding:0 .3rem;display:grid;place-items:center;border-radius:.2rem;font-size:.64rem;font-weight:700;letter-spacing:.03em;background:var(--flaeche-2);border:1px solid var(--linie);color:var(--leise);cursor:pointer}
.fbar .dw a.a0{border-bottom:.14rem solid var(--pow)} .fbar .dw a.a1{border-bottom:.14rem solid var(--spe)} .fbar .dw a.a2{border-bottom:.14rem solid var(--men)} .fbar .dw a.a3{border-bottom:.14rem solid var(--soc)}
.fbar .dw a.an{background:var(--gold);color:#17120a;border-color:var(--gold)}
.fbar .seg{display:inline-flex;border:1px solid var(--linie);border-radius:.4rem;overflow:hidden;flex:none}
.fbar .seg a{height:1.75rem;padding:0 .6rem;display:inline-flex;align-items:center;font-size:.8rem;font-weight:600;color:var(--leise);background:var(--flaeche-2);cursor:pointer}
.fbar .seg a+a{border-left:1px solid var(--linie)} .fbar .seg a.an{background:var(--gold);color:#17120a}
.fbar .sp{flex:1}
/* Saison-Leiste: 20 Spieltage */
.leiste{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:.3rem;padding:.55rem .7rem .6rem;flex-direction:row!important}
.stk{position:relative;display:flex;flex-direction:column;gap:.22rem;padding:.3rem .32rem .35rem;border:1px solid var(--linie);border-radius:.45rem;background:var(--flaeche-2);cursor:pointer;min-width:0}
.stk:hover{border-color:var(--linie-2)}
.stk.gew{background:rgba(255,255,255,.02)}
.stk.heute{border-color:var(--gold);box-shadow:inset 0 .16rem 0 var(--gold)}
.stk.an{background:linear-gradient(180deg,rgba(240,195,90,.24),rgba(240,195,90,.05));border-color:var(--gold)}
.stk.matt{opacity:.33}
.stk .ko{display:flex;align-items:baseline;justify-content:space-between;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--leise);font-weight:700}
.stk .ko b{font-size:1.05rem;letter-spacing:0;color:var(--creme)}
.stk .dz{display:flex;gap:.16rem} .stk .dz .dt{flex:1;justify-content:center;padding:0;font-size:.64rem;height:1.15rem;min-width:0}
.stk .dz .dt.pod{background:rgba(255,255,255,.12)}
.stk .geg{display:flex;align-items:center;gap:.2rem;font-size:.74rem;font-weight:700;color:var(--tinte);white-space:nowrap}
.stk .geg img.wap{width:1.35rem;height:1.35rem}
.stk .ha{font-size:.6rem;letter-spacing:.06em;font-weight:700;padding:0 .22rem;border-radius:.15rem;line-height:1.5}
.ha.h{background:rgba(242,160,61,.22);color:var(--heim)} .ha.a{background:rgba(69,176,201,.16);color:var(--gast)}
.stk .er{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;color:var(--leise);height:1rem;white-space:nowrap}
.stk .er b{font-size:.95rem} .stk .e1{font-size:.7rem;color:var(--leise);white-space:nowrap;text-align:center;font-weight:600} .p4{color:var(--gut)} .p3{color:var(--gut)} .p2{color:var(--leise)} .p1{color:var(--warn)} .p0{color:var(--warn)}
/* Spieltag-Detail */
.dkopf{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;padding:.6rem .7rem 0;flex:none}
.dk{position:relative;display:flex;align-items:center;gap:.7rem;height:4rem;padding:0 .8rem;border-radius:.45rem;overflow:hidden;isolation:isolate;border:1px solid var(--linie-2)}
.dk::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,8,12,.95) 0%,rgba(6,8,12,.72) 55%,rgba(6,8,12,.35) 100%)}
.dk .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center 40%}
.dk img.dic{width:2rem;height:2rem}
.dk b{font:400 1.45rem/1 var(--haus);color:#fff;display:block} .dk small{font-size:.8rem;color:var(--creme);white-space:nowrap}
.dk .sp{flex:1} .dk .tag{background:rgba(6,8,12,.7)}
.dliste{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;padding:.5rem .7rem .6rem;flex:1;min-height:0}
.dsp{display:grid;grid-auto-rows:minmax(0,1fr);gap:.22rem;min-height:0}
.du{display:grid;grid-template-columns:minmax(0,1fr) 9.4rem minmax(0,1fr);gap:.4rem;align-items:center;padding:0 .5rem;border:1px solid var(--linie);border-radius:.4rem;background:var(--flaeche-2);min-height:0;white-space:nowrap}
.du.ich{border-color:var(--heim);background:linear-gradient(90deg,rgba(242,160,61,.16),rgba(242,160,61,.04))}
.du.blick{border-color:var(--gold)}
.du .tm2{display:flex;align-items:center;gap:.4rem;min-width:0} .du .tm2.g{flex-direction:row-reverse;text-align:right}
.du .tm2 b{font:400 .98rem/1.1 var(--haus);color:#fff;overflow:hidden;text-overflow:ellipsis} .du .tm2.verl b{color:var(--leise)}
.du .tm2 img.wap{width:1.7rem;height:1.7rem} .du .tm2 svg{font-size:.8rem;color:var(--heim);flex:none}
.du .mi{text-align:center;line-height:1.05}
.du .mi strong{display:block;font-size:1.3rem;color:var(--creme);letter-spacing:.02em} .du .mi small{display:block;font-size:.68rem;color:var(--stumm);font-weight:600}
.du .mi .pf{font-size:.84rem;color:var(--leise);font-weight:600} .du .mi .pf b{color:var(--tinte)}
.pd{display:grid;grid-template-rows:auto repeat(4,minmax(0,1fr));border:1px solid var(--linie);border-radius:.4rem;background:var(--flaeche-2);min-height:0;overflow:hidden}
.pd.ich{border-color:var(--heim)}
.pd .pko{display:flex;justify-content:space-between;padding:.12rem .5rem;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);font-weight:700;background:rgba(255,255,255,.03)}
.pd .pz{display:grid;grid-template-columns:1.4rem 1.5rem minmax(0,1fr) auto auto;gap:.4rem;align-items:center;padding:0 .5rem;font-size:.9rem;white-space:nowrap;border-top:1px solid rgba(244,230,196,.06);min-height:0}
.pd .pz.ich{background:rgba(242,160,61,.14)} .pd .pz img.wap{width:1.4rem;height:1.4rem}
.pd .pz b.n{font:400 .95rem/1 var(--haus);color:#fff;overflow:hidden;text-overflow:ellipsis} .pd .pz .pl{font-weight:700;color:var(--leise)} .pd .pz .pl.e{color:var(--gold)}
.pd .pz small{font-size:.74rem;color:var(--stumm)} .pd .pz strong{font-size:.95rem;width:2.6rem;text-align:right}
.dsp.pods{grid-template-rows:repeat(4,minmax(0,1fr));gap:.3rem}
/* Rechte Tafel */
.nk{position:relative;height:8.2rem;flex:none;overflow:hidden;isolation:isolate;border-bottom:1px solid var(--linie);display:flex;align-items:center;gap:.9rem;padding:0 1rem}
.nk::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,8,12,.94),rgba(6,8,12,.6))}
.nk .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}
.nk img.wap{width:4.6rem;height:4.6rem;border-radius:.6rem;border:2px solid var(--gast)}
.nk em{font-style:normal;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.nk h3{margin:.1rem 0 .2rem;font:400 1.7rem/1 var(--haus);color:#fff} .nk small{font-size:.86rem;color:var(--creme)}
.pform{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:.5rem;align-items:center;padding:.35rem 0;border-top:1px solid rgba(244,230,196,.07);white-space:nowrap}
.pform .l{text-align:right} .pform b{font-size:1.25rem;color:var(--creme)} .pform b.vorn{color:var(--gut)} .pform b.hint{color:var(--warn)} .pform small{font-size:.74rem;color:var(--leise);display:block}
.pform .m{text-align:center;line-height:1.1} .pform .m small{color:var(--stumm)}
.wk{margin:.7rem 0 .2rem;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600;display:flex;gap:.4rem;align-items:baseline} .wk small{letter-spacing:0;text-transform:none;color:var(--stumm);font-size:.76rem;font-weight:500}
.wz{display:grid;grid-template-columns:2.9rem auto 1.5rem minmax(0,1fr) auto;gap:.45rem;align-items:center;padding:.24rem 0;border-top:1px solid rgba(244,230,196,.07);white-space:nowrap;cursor:pointer;font-size:.9rem} .wz:hover{background:var(--flaeche-2)} .wz img.wap{width:1.5rem;height:1.5rem} .wz .nn{font:400 .98rem/1.1 var(--haus);color:#fff;overflow:hidden;text-overflow:ellipsis} .wz b{color:var(--creme)} .wz .ha{font-size:.62rem;font-weight:700;padding:0 .25rem;border-radius:.15rem;line-height:1.5}
.koepfe{display:flex;gap:.25rem;flex:none} .koepfe img{width:2.1rem;height:2.4rem;border-radius:.25rem;object-fit:cover;object-position:center 18%;border:1px solid var(--linie-2)}
/* Kalender */
.kal{display:grid;grid-template-columns:16.5rem repeat(20,minmax(0,1fr));grid-template-rows:4.4rem repeat(16,minmax(0,1fr));gap:.14rem;flex:1;min-height:0;padding:.5rem .7rem .5rem}
.kal .ek{display:flex;align-items:flex-end;padding:0 .3rem .3rem;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--stumm);font-weight:600}
.kal .sk2{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.14rem;padding-bottom:.25rem;border-radius:.3rem;cursor:pointer;min-width:0}
.kal .sk2 b{font-size:.98rem;color:var(--creme)} .kal .sk2 .dt{font-size:.6rem;height:1rem;padding:0 .2rem;width:92%;justify-content:center}
.kal .sk2.heute{background:rgba(240,195,90,.14);box-shadow:inset 0 .14rem 0 var(--gold)} .kal .sk2.matt{opacity:.3} .kal .sk2:hover b{color:var(--gold)}
.kal .tn{display:flex;align-items:center;gap:.4rem;padding:0 .4rem;font:400 .95rem/1 var(--haus);color:#fff;white-space:nowrap;border-radius:.3rem;cursor:pointer;min-width:0;overflow:hidden}
.kal .tn span.r{font:700 .86rem var(--zahl);color:var(--stumm);width:1.2rem;flex:none} .kal .tn img.wap{width:1.6rem;height:1.6rem} .kal .tn span.nn{overflow:hidden;text-overflow:ellipsis}
.kal .tn.ich{background:rgba(242,160,61,.18);box-shadow:inset .18rem 0 0 var(--heim)} .kal .tn.blick{background:rgba(240,195,90,.2);box-shadow:inset .18rem 0 0 var(--gold)}
.kz2{position:relative;display:flex;align-items:center;justify-content:center;gap:.2rem;border-radius:.25rem;background:rgba(255,255,255,.03);font-size:.78rem;font-weight:700;color:var(--leise);white-space:nowrap;min-width:0;min-height:0;overflow:hidden}
.kz2 i{position:absolute;left:0;top:0;bottom:0;width:.16rem} .kz2.h i{background:var(--heim)} .kz2.a i{background:var(--gast);opacity:.6}
.kz2.q4{background:rgba(98,211,148,.34);color:#fff} .kz2.q3{background:rgba(98,211,148,.18);color:var(--tinte)} .kz2.q2{background:rgba(255,255,255,.07);color:var(--tinte)} .kz2.q1{background:rgba(255,96,88,.16);color:var(--tinte)} .kz2.q0{background:rgba(255,96,88,.32);color:#fff}
.kz2 small{font-size:.64rem;font-weight:600;opacity:.75}
.kz2.zeile{outline:1px solid rgba(242,160,61,.55)} .kz2.zb{outline:1px solid rgba(240,195,90,.7)} .kz2.matt{opacity:.25} .kz2.jetzt{box-shadow:inset 0 0 0 1px rgba(240,195,90,.5)}
.kz2.geg{box-shadow:inset 0 0 0 2px var(--gold)}
/* Disziplinen */
.pbal{display:flex;align-items:center;gap:.4rem;width:100%} .pbal b{width:1rem;flex:none;text-align:right}
.dname{display:flex;align-items:center;gap:.5rem;font:400 1.08rem/1 var(--haus);color:#fff} .dname img.dic{width:1.4rem;height:1.4rem}
.bz2{display:inline-flex;align-items:baseline;gap:.35rem} .bz2 b{font-size:1.02rem} .bz2 small{font-size:.74rem;color:var(--stumm)}
.balk{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:.14rem;align-items:end;height:6rem;flex:none}
.balk div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:.1rem} .balk i{display:block;border-radius:1px}
.balkx{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:.14rem;font-size:.5rem;color:var(--stumm);text-align:center;font-weight:600;margin-top:.15rem;flex:none}
</style>

<body>
<script src="modern-24-11/daten.js"></script>
<script src="modern-24-11/rahmen.js"></script>
<script src="modern-24-11/tabelle.js"></script>
<script>
"use strict";
RAHMEN.bau({seite:"spielplan",demoTitel:"Mockup 24.11. · Spielplan",demo:'<span>Ansicht</span><span id="d-ans"></span><i class="tr"></i><span>Spieltag</span><span id="d-st"></span>',
  demoHinweis:"Paarungen, Heim/Auswärts, Disziplinen, Plätze, Ergebnisse, Gruppen echt (Live-Abbild 24.11.) · künftige Gruppen, Tickets Beispiel."});
var Z={ans:q.get("ansicht")||"saison",st:+(q.get("st")||HEUTE),blick:TC[q.get("team")]||ICH,d:q.get("d")==null?null:+q.get("d"),achse:q.get("achse")==null?null:+q.get("achse"),sort:q.get("sort")||"nr",dir:+(q.get("dir")||1)};
Z.liga=+(q.get("liga")||Z.blick.liga);
$("buehne").innerHTML='<div class="seite pl1" id="s-saison"></div><div class="seite pl2" id="s-kalender"></div><div class="seite pl3" id="s-disziplinen"></div>';

function dis(st){var x=ECHT.DIS[st-1];return [[x[0],x[1]],[x[2],x[3]]]}
function hat(st,d){var x=dis(st);return d==null||x[0][0]===d||x[1][0]===d}
function durchgang(st,d){for(var i=1;i<st;i++)if(hat(i,d))return 2;return 1}
function termine(d){var r=[];for(var i=1;i<=20;i++){var x=dis(i);if(x[0][0]===d)r.push([i,x[0][1]]);if(x[1][0]===d)r.push([i,x[1][1]])}return r}
function gewertet(st){return st<=GEWERTET}
/* Vierergruppen: echt aus den Ergebnissen; kuenftige Spieltage BEISPIEL (je zwei Paarungen des Spieltags verschmelzen, Leitdisziplin D1) */
function gruppen(st,l,seite){var f=ECHT.FIX[st-1][String(l)],G=[],gesehen={};
  if(gewertet(st)){TEAMS.forEach(function(T){if(T.liga!==l||gesehen[T.c])return;var e=erg(T,st,seite);if(!e||!e.pod)return;e.pod.forEach(function(c){gesehen[c]=1});G.push({teams:e.pod.slice(),echt:true})});return G}
  for(var i=0;i<f.length;i+=2)G.push({teams:[f[i][0],f[i][1],f[i+1][0],f[i+1][1]],echt:false});return G}
function ergT(e){if(!e)return "";if(e.pod)return e.pl+". Platz";return e.e?e.e[0]+" : "+e.e[1]:"–"}
function hausS(T){var n=0;for(var i=1;i<=20;i++)if(heim(T,i)[0])n++;return n}

/* ---------- Filterleiste (Saison und Kalender) ---------- */
function fbar(id){var L=TEAMS.filter(function(T){return T.liga===Z.liga});
  return '<section class="pan fbar" id="'+id+'"><span class="gk">Liga</span><span class="seg">'+[1,2].map(function(l){return '<a class="'+(Z.liga===l?"an":"")+'" data-liga="'+l+'">Liga '+l+'</a>'}).join("")+'</span>'+
    '<span class="gk">Blick auf</span><span class="tw">'+L.map(function(T){return '<a class="'+(Z.blick===T?"an ":"")+(T===ICH?"ich":"")+'" data-blick="'+T.c+'" title="'+T.n+(T===ICH?" · dein Team":"")+'"><img src="../team-logos/'+T.c+'.jpg" alt=""></a>'}).join("")+'</span>'+
    '<span class="gk">Disziplin</span><span class="dw">'+DK.map(function(k,i){return '<a class="a'+DA[i]+(Z.d===i?" an":"")+'" data-d="'+i+'" title="'+DN[i][0]+(POD[i]?" · Vierergruppe":"")+'">'+k+'</a>'}).join("")+'</span>'+
    '<span class="sp"></span><span class="seg">'+[["saison","Spieltag"],["kalender","Kalender"],["disziplinen","Disziplinen"]].map(function(a){return '<a class="'+(Z.ans===a[0]?"an":"")+'" data-ans="'+a[0]+'">'+a[1]+'</a>'}).join("")+'</span></section>'}

/* ---------- (1) Saison: Leiste + Spieltag + Blick-Team ---------- */
function kachel(st){var B=Z.blick,h=heim(B,st),x=dis(st),g=gewertet(st),p=g?B.tag[st-1]:null,e1=erg(B,st,0),e2=erg(B,st,1);
  return '<a class="stk '+(st===Z.st?"an ":"")+(st===HEUTE?"heute ":"")+(g?"gew ":"")+(hat(st,Z.d)?"":"matt")+'" data-st="'+st+'" title="Spieltag '+st+': '+DN[x[0][0]][0]+' und '+DN[x[1][0]][0]+'">'+
    '<span class="ko"><span>ST</span><b class="t">'+st+'</b></span>'+
    '<span class="dz">'+x.map(function(d){return '<span class="dt a'+DA[d[0]]+(POD[d[0]]?" pod":"")+'">'+DK[d[0]]+'</span>'}).join("")+'</span>'+
    '<span class="geg">'+logo(h[1].c)+'<span class="ha '+(h[0]?"h":"a")+'">'+(h[0]?"H":"A")+'</span><span class="t">'+h[1].c+'</span></span>'+
    '<span class="er">'+(g?'<span class="fm">'+[e1,e2].map(function(e){return '<i class="'+(e&&e.p>=2?"":e&&e.p===1?"u":"n")+'" title="'+ergT(e)+'"></i>'}).join("")+'</span><b class="t p'+p+'">'+p+' P</b>':st===HEUTE?'<span style="color:var(--gold);font-weight:700">als Nächstes</span>':'<span>offen</span>')+'</span>'+
    '<span class="e1 t">'+(g?[e1,e2].map(function(e){return e?(e.pod?e.pl+". Pl.":e.e?e.e[0]+":"+e.e[1]:"–"):"–"}).join(" · "):"&nbsp;")+'</span></a>'}
function duell(f,st,seite,d){var H=TC[f[0]],G=TC[f[1]],g=gewertet(st),e=g?erg(H,st,seite):null,mein=H===ICH||G===ICH,bl=H===Z.blick||G===Z.blick,mi;
  if(e&&e.e){mi='<strong class="t">'+e.e[0]+' : '+e.e[1]+'</strong><small class="t">'+(e.s?tsd(e.s[0])+' : '+tsd(e.s[1])+' → E1':"")+'</small>'}
  else{var rh=rang(H,d),rg=rang(G,d);mi='<span class="pf t"><b class="'+(rh<rg?"plus":"")+'">'+rh+'.</b> gegen <b class="'+(rg<rh?"plus":"")+'">'+rg+'.</b></span><small>Kaderstärke-Rang '+DK[d]+'</small>'}
  var sieg=e&&e.e?(e.e[0]>e.e[1]?1:e.e[0]<e.e[1]?-1:0):0;

  if(e=t.closest("[data-liga]")){Z.liga=+e.getAttribute("data-liga");if(Z.blick.liga!==Z.liga)Z.blick=Z.liga===ICH.liga?ICH:TEAMS.filter(function(T){return T.liga===Z.liga})[0];return alles()}
  if(e=t.closest("[data-blick]")){Z.blick=TC[e.getAttribute("data-blick")];return alles()}
  if(e=t.closest("[data-ans]")){Z.ans=e.getAttribute("data-ans");if(Z.ans==="disziplinen"){Z.sort="nr";Z.dir=1}return alles()}
  if(e=t.closest("[data-achse]")){var a=e.getAttribute("data-achse");Z.achse=a===""?null:+a;return alles()}
  if(e=t.closest("[data-d]")){var d=+e.getAttribute("data-d");Z.d=Z.d===d?null:d;if(Z.d!=null&&Z.ans==="saison"&&!hat(Z.st,Z.d)){var tt=termine(Z.d),n=tt.filter(function(x){return x[0]>=HEUTE})[0]||tt[0];Z.st=n[0]}return alles()}
});
alles();
