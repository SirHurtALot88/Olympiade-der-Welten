<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Spieler – modern (Mockup 24.11.)</title>
<!--
  SPIELER-LISTE IM NEUEN STIL (Fable, 24.11.): ligaweite Spieler-Datenbank. Erklaerung: docs/design/spieler-teams-modern-24-11.md
  Loest app/foundation/players-table/FoundationPlayersTableNewLook.tsx samt Vergleichs-Overlay, Podium und Query-Chips ab und
  fuehrt die Ansicht "spieler" aus kader-teams-modern-18-11.html weiter (Entscheidungen von Chris vom 18.11. eingearbeitet).
  Rahmen, Tokens, Tabellen: modern-24-11/rahmen.css (unveraendert aus dem Mockup vom 18.11.) + bausteine.css.
  ECHT (Live-Abbild 24.11., Saison 1, Spieltag 12): Spieler, Werte, Eignung, Attribute, Marktwert, Gehalt, Vertrag, Kaufpreis,
        Player Points (C2), Einsaetze, Form mit Verlauf, Moral, Verletzung, Belastung, Teams, Merkliste.
  BEISPIEL: Scouting-Stand, Trainingsvorlieben, Trainingsziel, Entwicklung, Werbewert und Werbegeld.
  URL: ?ansicht=liste|vergleich|streu  ?umfang=liga2|liga1|alle|kader|frei|merk  ?spalten=ueber|leist|eig|geld|train|attr
       ?sort=<spalte>&dir=-1|1  ?d=0..19  ?filter=zu  ?nebel=aus  ?ich=V-W  ?kl=Mage,Bard  ?team=C-C  ?mw=2  ?vt=1  ?zu=verl,formauf  ?eig=60
       ?vgl=slug,slug,slug  ?y=ov|pps|ppe|eig  ?blatt=0..  ?still=1
-->
<link rel="stylesheet" href="modern-24-11/rahmen.css">
<link rel="stylesheet" href="modern-24-11/bausteine.css">
<style>
.seite.spl{grid-template-columns:19rem minmax(0,1fr)}
.seite.spl.fzu{grid-template-columns:minmax(0,1fr)} .seite.spl.fzu #p-filter{display:none}
#p-filter .inh{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#p-filter .pk a{cursor:pointer}
.kli{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:.14rem;padding-bottom:.45rem}
.kli a,.rai a{display:grid;place-items:center;height:1.55rem;border-radius:.25rem;border:1px solid var(--linie);background:var(--flaeche-2);cursor:pointer}
.kli a img,.rai a img{width:1.05rem;height:1.05rem;object-fit:contain;opacity:.75}
.kli a.k0{border-bottom:.14rem solid var(--pow)} .kli a.k1{border-bottom:.14rem solid var(--spe)} .kli a.k2{border-bottom:.14rem solid var(--men)} .kli a.k3{border-bottom:.14rem solid var(--soc)}
.kli a.an,.rai a.an,.tli a.an{background:rgba(240,195,90,.22);border-color:var(--gold)} .kli a.an img,.rai a.an img{opacity:1}
.rai{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.14rem;padding-bottom:.45rem}
.tli{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:.1rem;padding-bottom:.45rem}
.tli a{display:block;border-radius:.2rem;border:1px solid transparent;opacity:.55;cursor:pointer;aspect-ratio:1} .tli a img{width:100%;height:100%;border-radius:.15rem;object-fit:cover;display:block}
.tli a:hover,.tli a.an{opacity:1} .tli a.ich{outline:1px solid var(--heim)}
.dli{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.14rem;padding-bottom:.3rem}
.dli a{display:grid;place-items:center;height:1.4rem;border-radius:.2rem;font-size:.66rem;font-weight:700;letter-spacing:.04em;background:var(--flaeche-2);border:1px solid var(--linie);color:var(--leise);cursor:pointer}
.dli a.a0{border-bottom:.14rem solid var(--pow)} .dli a.a1{border-bottom:.14rem solid var(--spe)} .dli a.a2{border-bottom:.14rem solid var(--men)} .dli a.a3{border-bottom:.14rem solid var(--soc)}
.dli a.an{background:var(--gold);color:#17120a;border-color:var(--gold)}
.hist{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.2rem;height:3.3rem;align-items:end;padding-bottom:.1rem}
.hist a{display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;text-align:center}
.hist a i{display:block;background:var(--stumm);border-radius:1px;min-height:2px} .hist a:hover i{background:var(--creme)} .hist a.an i{background:var(--gold)}
.hist a b{font-size:.72rem;color:var(--leise);font-weight:600;line-height:1.1} .hist a.an b{color:var(--gold)}
.histx{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.2rem;font-size:.62rem;color:var(--stumm);text-align:center;padding-bottom:.45rem;font-weight:600}
.fl{gap:.35rem}
.fl .seg{display:inline-flex;border:1px solid var(--linie);border-radius:.4rem;overflow:hidden;flex:none}
.fl .seg a{height:1.8rem;padding:0 .6rem;display:inline-flex;align-items:center;font-size:.8rem;font-weight:600;color:var(--leise);background:var(--flaeche-2);cursor:pointer}
.fl .seg a+a{border-left:1px solid var(--linie)} .fl .seg a.an{background:var(--gold);color:#17120a}
.fl .akt{display:inline-flex;align-items:center;gap:.3rem;height:1.6rem;padding:0 .3rem 0 .55rem;border-radius:.3rem;border:1px solid rgba(240,195,90,.5);background:rgba(240,195,90,.1);font-size:.78rem;font-weight:600;color:var(--creme);cursor:pointer}
.fl .akt svg{font-size:.8rem;color:var(--gold)}
.fl .knopf{height:1.9rem}
.e20{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:.14rem;width:100%}
.e20 i,.a12 i{font-style:normal;text-align:center;font-size:.86rem;font-weight:600;border-radius:.15rem;padding:.14rem 0;color:var(--tinte);min-width:0;overflow:hidden}
.e20 i.nbz,.a12 i.nbz{font-size:.68rem;color:var(--leise);border:1px dashed rgba(154,167,186,.35);padding:.2rem 0}
.e20 i.gew{outline:1px solid var(--gold)}
.tz.kopf .e20 span,.tz.kopf .a12 span,.tz.kopf .ax4 span{text-align:center;cursor:pointer;letter-spacing:.02em} .tz.kopf .e20 span.gew{color:var(--creme)}
.a12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:.18rem;width:100%}
.spark{width:100%;height:1.5rem;display:block} .spark polyline{fill:none;stroke:var(--creme);stroke-width:1.6;vector-effect:non-scaling-stroke} .spark line{stroke:rgba(255,255,255,.18);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:3 3}
.wb{display:flex;align-items:center;gap:.4rem;width:100%} .wb b{width:1.9rem;text-align:right;flex:none}
.vl{display:inline-flex;gap:.22rem;align-items:center} .vl u{text-decoration:none;font-size:.82rem;line-height:1} .vl u.h{color:#e0637a} .vl u.x{color:var(--stumm)} .vl .dt.un{opacity:.55;text-decoration:line-through}
.dv{display:inline-flex;align-items:baseline;gap:.4rem} .dv b{font-size:1.06rem} .dv small{font-size:.74rem;color:var(--leise)}
.ppr{display:inline-flex;align-items:baseline;gap:.3rem} .ppr b{font-size:1.08rem;color:var(--creme)} .ppr small{font-size:.74rem;color:var(--stumm);font-weight:600}
.tm{display:inline-flex;align-items:center;gap:.35rem;font-size:.84rem;font-weight:600;color:var(--leise)} .tm img.wap{width:1.5rem;height:1.5rem}
/* Vergleich */
.vgl{width:84rem;max-height:63rem;display:flex;flex-direction:column;background:var(--flaeche-1);border:1px solid var(--linie-2);border-radius:var(--r);box-shadow:0 2rem 5rem rgba(0,0,0,.8);overflow:hidden}
.vgl .pk{height:2.8rem} .vgl .pk h2{font-size:1.5rem}
.vr{display:grid;grid-template-columns:11rem repeat(var(--n),minmax(0,1fr));align-items:center;padding:0 1rem;border-top:1px solid rgba(244,230,196,.06);font-size:.94rem;min-height:1.3rem;white-space:nowrap}
.vgl>*{flex:none}
.vr>span:first-child{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);font-weight:600}
.vr>span{padding:0 .6rem;display:flex;align-items:center;gap:.5rem;min-width:0}
.vr>span+span{border-left:1px solid rgba(244,230,196,.06)}
.vr .w{width:3.4rem;text-align:right;flex:none;font-weight:700;font-size:1.05rem}
.vr span.sieg .w{color:var(--gold)} .vr span.sieg .bal i{background:var(--gold)}
.vr.grp{min-height:1.05rem;font-size:.6rem;background:rgba(255,255,255,.025)} .vr.grp>span:first-child{color:var(--gold)}
.vr.kopfz{align-items:stretch;border-top:0;padding-top:.5rem;padding-bottom:.35rem}
.vk{flex-direction:column;align-items:flex-start!important;gap:.15rem!important;position:relative}
.vk .bild{height:5rem;width:100%;display:flex;align-items:flex-end;gap:.6rem}
.vk .bild .fig{height:5rem;width:5rem} .vk .bild .por{height:5rem;width:4rem}
.vk h3{margin:0;font:400 1.3rem/1.05 var(--haus);color:#fff;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vk .zl{display:flex;gap:.5rem;align-items:center;font-size:.8rem;color:var(--leise)}
.vk .raus{position:absolute;right:.5rem;top:0;color:var(--stumm);cursor:pointer;font-size:1rem}
.vr .d20{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:.1rem;height:2.6rem;align-items:end;flex:1}
.vr .d20 i{display:block;border-radius:1px;background:var(--stumm);min-height:2px} .vr .d20 i.nbl{background:repeating-linear-gradient(135deg,rgba(154,167,186,.6) 0 .2rem,rgba(154,167,186,.2) .2rem .4rem)}
.vfuss{display:flex;align-items:center;gap:.8rem;padding:.4rem 1rem;border-top:1px solid var(--linie);font-size:.84rem;color:var(--leise)} .vfuss .sp{flex:1}
/* Streudiagramm */
.streu{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 23rem;gap:0}
.flaeche{position:relative;margin:1.2rem 1.4rem 2.6rem 3.6rem;border-left:1px solid var(--linie-2);border-bottom:1px solid var(--linie-2)}
.flaeche .gx,.flaeche .gy{position:absolute;font-size:.74rem;color:var(--stumm);font-weight:600}
.flaeche .gx{bottom:-1.4rem;transform:translateX(-50%)} .flaeche .gy{left:-2.4rem;transform:translateY(50%);width:2rem;text-align:right}
.flaeche .lx{position:absolute;top:0;bottom:0;width:1px;background:rgba(244,230,196,.05)} .flaeche .ly{position:absolute;left:0;right:0;height:1px;background:rgba(244,230,196,.05)}
.flaeche .ax{position:absolute;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
.flaeche .pt{position:absolute;width:.62rem;height:.62rem;margin:0 0 -.31rem -.31rem;border-radius:50%;opacity:.85;cursor:pointer}
.flaeche .pt:hover{outline:2px solid #fff;z-index:3;opacity:1}
.flaeche .pt.ich{box-shadow:0 0 0 2px var(--grund),0 0 0 3.5px var(--heim);z-index:2;opacity:1}
.flaeche .pt.top{z-index:2;opacity:1} .flaeche .nmz{position:absolute;font:400 .82rem/1 var(--haus);color:#fff;transform:translate(.5rem,50%);white-space:nowrap;text-shadow:0 0 .3rem #000,0 0 .3rem #000;pointer-events:none;z-index:4}
.flaeche .bd{position:absolute;width:.34rem;margin-left:-.17rem;border-radius:.17rem;opacity:.3;border:1px dashed currentColor;background:repeating-linear-gradient(135deg,currentColor 0 .15rem,transparent .15rem .3rem)}
.flaeche .med{position:absolute;left:0;right:0;border-top:1px dashed rgba(240,195,90,.5)} .flaeche .med span{position:absolute;right:.3rem;top:-1.1rem;font-size:.7rem;color:var(--gold);font-weight:600}
.sr{border-left:1px solid var(--linie);padding:.7rem .9rem;display:flex;flex-direction:column;gap:.45rem;min-height:0;overflow:hidden}
.sr h4{margin:0;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
.sr .pl{display:grid;grid-template-columns:1.2rem 2rem minmax(0,1fr) auto;gap:.5rem;align-items:center;padding:.25rem 0;border-top:1px solid rgba(244,230,196,.07);font-size:.9rem;white-space:nowrap}
.sr .pl .por{width:2rem;height:2.2rem} .sr .pl b{font:400 1rem/1.1 var(--haus);color:#fff;display:block;overflow:hidden;text-overflow:ellipsis} .sr .pl small{color:var(--leise);font-size:.76rem}
.sr .pl strong{color:var(--gold);font-size:1.1rem} .sr .pl>span:first-child{color:var(--stumm);font-weight:700}
</style>
</head>
<body>
<script src="modern-24-11/daten.js"></script>
<script src="modern-24-11/rahmen.js"></script>
<script src="modern-24-11/tabelle.js"></script>
<script>
"use strict";
RAHMEN.bau({seite:"spieler",demoTitel:"Mockup 24.11. · Spieler",demo:'<span>Ansicht</span><span id="d-ans"></span><i class="tr"></i><span>Spalten</span><span id="d-spa"></span>',
  demoHinweis:"Spieler, Werte, Verträge, Player Points, Form, Moral, Verletzungen echt (Live-Abbild 24.11.) · Scouting-Stand, Vorlieben, Entwicklung, Werbewert Beispiel."});
$("buehne").innerHTML='<div class="seite spl an" id="s-liste"><section class="pan" id="p-filter"></section><section class="pan" id="p-liste"></section></div><div class="schleier" id="schleier"></div>';

function liste(par){var v=q.get(par);return v?v.split(","):[]}
function menge(par){var o={};liste(par).forEach(function(x){o[x]=1});return o}
var Z={ans:q.get("ansicht")||"liste",umfang:q.get("umfang")||("liga"+ICH.liga),spalten:q.get("spalten")||"ueber",sort:q.get("sort")||"pps",dir:+(q.get("dir")||-1),blatt:+(q.get("blatt")||0),
  d:q.get("d")==null?null:+q.get("d"),such:q.get("such")||"",zeit:q.get("zeit")||"saison",fzu:q.get("filter")==="zu",y:q.get("y")||"pps",
  kl:menge("kl"),ra:menge("ra"),team:menge("team"),mw:q.get("mw")==null?null:+q.get("mw"),vt:q.get("vt")==null?null:+q.get("vt"),zu:menge("zu"),eig:+(q.get("eig")||0),at:menge("at"),
  vgl:liste("vgl")};
if(Z.ans==="vergleich"&&Z.vgl.length<2)Z.vgl=["queen-loriana","brightpaw"].concat(SP.filter(function(p){return p.team&&p.team!==ICH&&p.team.liga===ICH.liga}).sort(function(a,b){return b.pps-a.pps}).slice(0,2).map(function(p){return p.s}));
if(Z.spalten==="eig"&&Z.d!=null&&!q.get("sort"))Z.sort="e"+Z.d;
var ZEILEN=18;
var MWK=[[0,10,"< 10"],[10,20,"10–20"],[20,30,"20–30"],[30,45,"30–45"],[45,60,"45–60"],[60,999,"60 +"]];
var VTK=[[1,"läuft aus"],[2,"+1 Saison"],[3,"+2 Saisons"],[4,"später"]];
var ZUK=[["verl","verletzt"],["fit","einsetzbar"],["formauf","Form ▲"],["formab","Form ▼"],["froh","zufrieden"],["sauer","unzufrieden"],["fig","mit Pixel-Figur"],["wert","Schnäppchen"]];
var ATK=[[4,70],[0,70],[8,75],[9,70],[7,70],[3,70]];
var PRESET={ueber:"Überblick",leist:"Leistung",eig:"Eignung",geld:"Vertrag & Geld",train:"Training & Entwicklung",attr:"Attribute"};

/* ---------- Auswahl: Filter rechnen nur mit dem, was man sieht ---------- */
function stufeAb(v,p,ab){var b=ber(v,p);return b?b[0]>=ab:v>=ab}
function umfang(){var u=Z.umfang;return SP.filter(function(p){return u==="alle"?true:u==="kader"?p.team===ICH:u==="frei"?p.frei:u==="merk"?p.stern:u==="liga1"?p.team&&p.team.liga===1:p.team&&p.team.liga===2})}
function passt(p,ohne){
  if(Z.such){var s=Z.such.toLowerCase();if((p.n+" "+p.kl+" "+p.ra+" "+(p.team?p.team.n:"frei")).toLowerCase().indexOf(s)<0)return false}
  if(ohne!=="kl"&&Object.keys(Z.kl).length&&!Z.kl[p.kl])return false;
  if(ohne!=="ra"&&Object.keys(Z.ra).length&&!Z.ra[p.ra])return false;
  if(ohne!=="team"&&Object.keys(Z.team).length&&!(p.team&&Z.team[p.team.c]))return false;
  if(ohne!=="mw"&&Z.mw!=null&&!(p.mw>=MWK[Z.mw][0]&&p.mw<MWK[Z.mw][1]))return false;
  if(ohne!=="vt"&&Z.vt!=null&&!(p.team&&Math.min(4,p.rest)===Z.vt))return false;
  if(Z.d!=null&&Z.eig&&!stufeAb(p.d[Z.d],p,Z.eig))return false;
  for(var k in Z.at){var a=ATK[+k];if(!stufeAb(p.at[a[0]],p,a[1]))return false}
  if(Z.zu.verl&&!p.verl)return false; if(Z.zu.fit&&p.verl)return false;
  if(Z.zu.formauf&&p.fs<1)return false; if(Z.zu.formab&&p.fs>-1)return false;
  if(Z.zu.froh&&!(moralSort(p)>=60))return false; if(Z.zu.sauer&&!(moralSort(p)>=0&&moralSort(p)<40))return false;
  if(Z.zu.fig&&!p.fig)return false; if(Z.zu.wert&&!(p.eins>=4&&p.pps/Math.max(1,p.mw)>=.55))return false;
  return true}

/* ---------- Spalten ---------- */
function heat(v,max){var t=kl((v-30)/((max||95)-30),0,1);return "background:rgba(240,195,90,"+(t*.42).toFixed(2)+")"+(t>.72?";color:#fff;font-weight:700":"")}
function zelle(v,p,gew){var b=ber(v,p);return b?'<i class="nbz'+(gew?" gew":"")+'" title="Stufe '+b[0]+'–'+b[1]+'">'+b[0]+'+</i>':'<i class="'+(gew?"gew":"")+'" style="'+heat(v)+'">'+v+'</i>'}
function verdeckt(t){return '<span class="zu" title="'+(t||"Erst nach dem Scouting sichtbar")+'">verdeckt</span>'}
function devWort(v){return v>=3?"deutlich besser":v>=1?"etwas besser":v>-1?"etwa gleich":v>-3?"etwas schlechter":"deutlich schlechter"}
function spark(p){var v=p.fv;if(!v||v.length<2)return '<span class="zu">–</span>';var pts=v.map(function(f,i){return (i/(v.length-1)*100).toFixed(1)+","+(30-kl(f,5,95)/100*30).toFixed(1)}).join(" ");
  return '<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><line x1="0" y1="15" x2="100" y2="15"/><polyline points="'+pts+'" style="stroke:'+(p.fs>0?"var(--gut)":p.fs<0?"var(--warn)":"var(--creme)")+'"/></svg>'}
var FEST=[
  {k:"vgl",t:"",w:"1.1rem",tip:"Für den Vergleich wählen (2 bis 4)",html:function(p){return '<span class="wahl '+(Z.vgl.indexOf(p.s)>=0?"an":"")+'" data-vgl="'+p.s+'">✓</span>'}},
  {k:"stern",t:"★",w:"1.1rem",tip:"Merkliste",wert:function(p){return p.stern?1:0},html:function(p){return '<span class="stern '+(p.stern?"an":"")+'" data-stern="'+p.s+'">★</span>'}},
  {k:"bild",t:"",w:"2.3rem",html:function(p){return por(p)}},
  {k:"name",t:"Spieler",w:"minmax(10rem,1.5fr)",wert:function(p){return p.n},html:function(p){return '<span class="nm"><b>'+esc(p.n)+'</b><small>'+klasse(p)+rasse(p,true)+'</small></span>'}},
  {k:"team",t:"Team",w:"4.4rem",wert:function(p){return p.team?p.team.n:"zzz"},html:function(p){return p.team?'<span class="tm" data-team="'+p.team.c+'" title="'+p.team.n+' · Liga '+p.team.liga+'">'+logo(p.team.c)+p.team.c+'</span>':'<span class="tag go">frei</span>'}}];
var S={
  ov:{k:"ov",t:"Gesamt",w:"3.7rem",r:1,nebel:1,tip:"Gesamtwert (OVR)",wert:function(p){return sw(p.ov,p)},html:function(p){return zg(p.ov,p,"gr")}},
  ax:{k:"ax",t:"",w:"8rem",kopf:function(o){return '<span class="ax4">'+AX.map(function(a,i){return '<span data-so="ax'+i+'" class="ac'+i+(o.sort==="ax"+i?" so":"")+'">'+a+(o.sort==="ax"+i?(o.dir<0?"▼":"▲"):"")+'</span>'}).join("")+'</span>'},
    html:function(p){return '<span class="ax4">'+p.ax.map(function(v,i){var b=ber(v,p);return b?'<i class="nbz">'+b[0]+'+</i>':'<i class="'+(i===p.hax?"h a"+i:"")+'">'+v+'</i>'}).join("")+'</span>'}},
  best:{k:"best",t:"Beste Disziplinen",w:"9.1rem",nebel:1,tip:"Die drei Disziplinen mit der höchsten Eignung",wert:function(p){return sw(p.d[p.best],p)},
    html:function(p){if(!exakt(p)&&p.sc===0)return '<span class="zu">unbekannt</span>';if(!exakt(p))return dTag(p.best,' <small>'+zt(p.d[p.best],p)+'</small>');return p.top3.map(function(d){return dTag(d,' <b>'+p.d[d]+'</b>')}).join(" ")}},
  pps:{k:"pps",t:"PP Saison",w:"5rem",r:1,tip:"Player Points dieser Saison, klein der Rang in der Liga des Spielers. Öffentlich.",wert:function(p){return p.pps},html:function(p){return p.eins?'<span class="ppr"><small>'+(ppRang(p)?ppRang(p)+".":"")+'</small><b class="t">'+de(p.pps)+'</b></span>':'<span class="zu">–</span>'}},
