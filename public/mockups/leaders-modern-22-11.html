<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaders – Bestenlisten, Disziplin-Beste und Medaillen (Mockup 22.11.)</title>
<!--
  LEADERS, STAND 22.11. Konzept: docs/design/leaders-modern-22-11.md. Kein App-Code, kein PixelLab, alles CSS/SVG.
  Drei Sichten: Spieler (PP-Bestenliste + Disziplin-Beste), Teams (Punkte, Ergebnis, Team-PP), Medaillen
  (Gold/Silber/Bronze je Disziplin und Liga, Regel docs/design/finanzen-posten-22-11.md Abschnitt g.1).
  ECHT (Live-Abbild, Spielstand new-game-1795114260527-nzr0z9, Saison 1, 11 gebuchte Spieltage): 2766 PP-Buchungen
        (Skala C2), MVP- und Top-10-Zaehler, 704 Team-Ergebnisse (Skala E1), Tabellenpunkte.
  VORSCHLAG: der Medaillenstand ist eine Hochrechnung aus den Ergebnispunkten bis heute; vergeben wird am Saisonende.
        Gleichstand hier: Ergebnispunkte, dann Verhaeltnis, dann PP-Summe (Naeherung an die Regel).
  URL: ?sicht=spieler|teams|medaillen  &zeit=saison|<spieltag>  &liga=eigene|andere|alle  &ber=pow|spe|men|soc  &still=1
-->
<link rel="stylesheet" href="kredite-ranks-leaders-22-11/basis.css">
<style>
.work{grid-template-columns:minmax(0,1.32fr) minmax(0,1fr)}
.hero .kul{background-image:url("../szenen/basketball/streetcourt.jpg")}
.zeit{display:flex;align-items:center;gap:.5em}
.zeit .st{display:inline-flex;align-items:center;border:1px solid var(--linie-2);border-radius:7px;overflow:hidden;height:1.9em;font-size:.88em}
.zeit .st button{width:1.9em;height:100%;display:grid;place-items:center;color:var(--leise)}
.zeit .st button:hover{background:var(--flaeche-2);color:var(--tinte)} .zeit .st button[disabled]{opacity:.3;cursor:default}
.zeit .st span{padding:0 .6em;font-weight:700;white-space:nowrap;min-width:6.4em;text-align:center}
.zeit .st.an{background:var(--creme);color:#17120a} .zeit .st.an button{color:#17120a}
/* Podium */
.pod{flex:none;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:.6em;padding:.65em .75em;border-bottom:1px solid var(--linie)}
.pd1{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.75em;align-items:center;padding:.55em .75em;border-radius:var(--r-s);border:1px solid var(--linie);background:var(--flaeche-2);overflow:hidden;min-width:0}
.pd1.g{border-color:rgba(240,195,90,.6);background:linear-gradient(100deg,rgba(240,195,90,.2),var(--flaeche-2) 65%)}
.pd1 .bild{position:relative;flex:none}
.pd1 .bild img.gr{width:4.2em;height:4.2em;border-radius:.5em;object-fit:cover;border:2px solid var(--kf,var(--linie-2))}
.pd1 .bild .med{position:absolute;left:-.4em;top:-.4em;font-size:.9em;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.pd1 h3{margin:0;font:400 1.3em/1.05 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd1 .u{display:flex;gap:.6em;align-items:center;margin-top:.3em;font-size:.9em;min-width:0}
.pd1 .pp{text-align:right}
.pd1 .pp strong{display:block;font-size:2.1em;line-height:1;font-weight:700;color:var(--creme)}
.pd1 .pp span{font-size:.76em;color:var(--stumm);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
/* Tabellen */
.sl .th,.sl .tz{grid-template-columns:2.8em minmax(8.5em,1.5fr) minmax(6em,.75fr) 3.6em minmax(6.5em,1fr) 2.6em 2.4em repeat(4,2.7em) 2.4em 2.9em 4.2em;gap:.45em}
.sl .tz{flex:none;height:2.3em;max-height:none}
.ppz{display:grid;grid-template-columns:3em minmax(0,1fr);gap:.45em;align-items:center}
.ppz b{text-align:right;font-size:1.12em}
.best{display:flex;align-items:center;gap:.3em;justify-content:flex-end;white-space:nowrap}
.best .dz-ic{width:1.25em;height:1.25em}
.tt .th,.tt .tz{grid-template-columns:2.8em minmax(8.5em,1.4fr) 3.2em 4.4em 3em minmax(6em,.9fr) 2.4em minmax(8.5em,1.1fr) 6em repeat(4,2.3em);gap:.45em}
.sun{white-space:nowrap} .sun i{font-style:normal}
.meds{display:flex;gap:.3em;justify-content:flex-end;align-items:center}
.meds span{display:inline-flex;align-items:center;gap:.15em;font-weight:700}
.meds .med{font-size:.62em}
.mt .th,.mt .tz{grid-template-columns:2.8em minmax(9em,1fr) repeat(3,3.4em) 3.8em 4.6em minmax(10em,1.5fr);gap:.6em}
.mt .mz{font-weight:700;font-size:1.15em}
.dzl{display:flex;gap:.2em;align-items:center;min-width:0;overflow:hidden}
.dzl span{position:relative;flex:none}
.dzl .dz-ic{width:1.45em;height:1.45em}
.dzl i{position:absolute;right:-.1em;bottom:-.1em;width:.6em;height:.6em;border-radius:50%;border:1px solid #0c1017}
/* Disziplin-Karten */
.dg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:.45em;padding:.6em}
.karte{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--linie);border-top:3px solid var(--kc);border-radius:var(--r-s);background:var(--flaeche-2);overflow:hidden}
.karte.mein{box-shadow:inset 0 0 0 1px var(--heim)}
.karte .kk{flex:none;display:flex;align-items:center;gap:.4em;padding:.3em .5em .15em}
.karte .kk b{font:400 1.02em/1 var(--haus);color:var(--creme);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.karte .kk small{font-size:.72em;color:var(--stumm);white-space:nowrap}
.karte .kk .dz-ic{width:1.5em;height:1.5em}
.karte .kl3{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 .5em .25em}
.kz3{display:grid;grid-template-columns:1.15em minmax(0,1fr) auto;gap:.4em;align-items:center;min-width:0}
.kz3 .med{font-size:.62em}
.kz3 .nm{display:flex;align-items:center;gap:.35em;min-width:0}
.kz3 .nm img{width:1.25em;height:1.25em;border-radius:.2em;object-fit:cover;flex:none}
.kz3 .nm b{font-weight:600;font-size:.94em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kz3 .nm.wir b{color:var(--heim)}
.kz3 .w{font-weight:700;font-size:.98em;white-space:nowrap}
.karte .off{flex:1;display:grid;place-items:center;color:var(--stumm);font-size:.86em}
/* Spieltag: zwei grosse Karten */
.tg{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:.6em;padding:.6em}
.tg .karte .kk{padding:.55em .7em .4em;border-bottom:1px solid var(--linie)}
.tg .karte .kk b{font-size:1.35em} .tg .karte .kk .dz-ic{width:2.2em;height:2.2em}
.tg .lz{flex:1;min-height:0;display:flex;flex-direction:column}
.tg .z5{flex:1 1 0;min-height:1.8em;max-height:3em;display:grid;grid-template-columns:1.6em minmax(0,1fr) 2.6em minmax(4em,.9fr) 2.6em;gap:.5em;align-items:center;padding:0 .7em;border-bottom:1px solid rgba(244,230,196,.06)}
.tg .z5.wir{background:linear-gradient(90deg,rgba(242,160,61,.22),transparent)}
.tg .z5 .rg{font-weight:700;color:var(--creme);text-align:center}
.sk5{position:relative;height:.6em;border-radius:99px;background:rgba(255,255,255,.08)}
.sk5 i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--kc)}
.sk5 u{position:absolute;right:0;top:-.2em;bottom:-.2em;width:2px;background:var(--creme)}
.hinw2{flex:none;margin:0 .6em .6em;padding:.45em .65em;border:1px solid var(--linie);border-radius:var(--r-s);background:var(--flaeche-2);font-size:.86em;line-height:1.3;color:var(--leise)}
.hinw2 b{color:var(--creme)}
</style>
</head>
<body>
<div class="demo" id="demo"></div>
<div class="app">
  <nav class="rail" id="rail" aria-label="Hauptnavigation"></nav>
  <main>
    <header class="hero">
      <div class="kul"></div>
      <div class="hk" id="hk"></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Sicht"></div>
      <div class="hr" id="hr"></div>
    </header>
    <div class="work">
      <section class="pan" id="p1" aria-label="Bestenliste"></section>
      <section class="pan" id="p2" aria-label="Disziplinen"></section>
    </div>
  </main>
</div>
<script src="kredite-ranks-leaders-22-11/daten.js"></script>
<script src="kredite-ranks-leaders-22-11/basis.js"></script>
<script>
var KATI={pow:0,spe:1,men:2,soc:3},GEB=O.stand.gebucht;
var DO=DZ.map(function(d,i){return i}).sort(function(a,b){return KATI[DZ[a].kat]-KATI[DZ[b].kat]||a-b});
var GESPIELT=DZ.map(function(){return 0});O.plan.slice(0,GEB).forEach(function(p){GESPIELT[p[0]]++;GESPIELT[p[1]]++});
var zq=Q.get("zeit");
var Z={sicht:["spieler","teams","medaillen"].indexOf(Q.get("sicht"))>=0?Q.get("sicht"):"spieler",zeit:zq&&zq!=="saison"?Math.max(1,Math.min(GEB,+zq)):0,liga:Q.get("liga")||"eigene",ber:AX.indexOf(Q.get("ber"))>=0?Q.get("ber"):null,
       soS:{k:"pp",d:-1},soT:{k:"pkt",d:-1},soM:{k:"med",d:-1}};
function inLiga(l){return Z.liga==="alle"||(Z.liga==="eigene"?l===WIR.liga:l!==WIR.liga)}
function ligaName(){return Z.liga==="alle"?"beide Ligen":"Liga "+(Z.liga==="eigene"?WIR.liga:3-WIR.liga)}
function zeitName(){return Z.zeit?"Spieltag "+Z.zeit:"Saison "+O.stand.saison}
var TIDX={};TEAMS.forEach(function(t,i){TIDX[t.id]=i});
/* Bestwert je Spieler (hoechste Einzelbuchung der Saison) */
var BEST=SP.map(function(){return null});O.pe.forEach(function(e){if(!BEST[e[1]]||e[3]>BEST[e[1]][3])BEST[e[1]]=e});

/* ---------- Spieler-Zeilen fuer den Zeitraum ---------- */
function spielerZeilen(){
  if(!Z.zeit)return SP.map(function(p,i){return {p:p,i:i,pp:p.pp,e:p.e,pa:p.pa,pd:p.pd,mvp:p.mvp,t10:p.t10,best:BEST[i]}});
  var m={};O.pe.forEach(function(e){if(e[0]!==Z.zeit)return;var z=m[e[1]]||(m[e[1]]={p:SP[e[1]],i:e[1],pp:0,e:0,pa:[0,0,0,0],pd:DZ.map(function(){return 0}),mvp:0,t10:0,best:null});
    z.pp+=e[3];z.e++;z.pa[KATI[DZ[e[2]].kat]]+=e[3];z.pd[e[2]]+=e[3];if(e[5])z.mvp++;if(e[4]<=10)z.t10++;if(!z.best||e[3]>z.best[3])z.best=e});
  return Object.keys(m).map(function(k){return m[k]});
}
function ppWert(z){return Z.ber?z.pa[KATI[Z.ber]]:z.pp}
/* ---------- Team-Zeilen ---------- */
function teamZeilen(){
  var sz=spielerZeilen();
  return TEAMS.map(function(t,ti){var sp=sz.filter(function(z){return z.p.t===t.id}),pp=0,e=0;sp.forEach(function(z){pp+=z.pp;e+=z.e});
    var best=sp.slice().sort(function(a,b){return b.pp-a.pp})[0]||null;
    var tr=O.tr.filter(function(x){return x[1]===ti&&(!Z.zeit||x[0]===Z.zeit)}),pkt=0,s=0,u=0,n=0,ef=0,eg=0,pa=[0,0,0,0];
    tr.forEach(function(x){pkt+=x[3];x[3]===2?s++:x[3]===1?u++:n++;ef+=x[4];pa[KATI[DZ[x[2]].kat]]+=x[3]});
    return {t:t,pkt:pkt,s:s,u:u,n:n,ef:ef,eg:eg,pp:pp,ppe:e?pp/e:0,best:best,pa:pa,tr:tr}});
}
/* ---------- Medaillen (Hochrechnung): je Liga und Disziplin die ersten drei nach Ergebnispunkten ---------- */
var PRAEMIE={1:[.5,.3,.2],2:[.3,.2,.1]};
function medaillen(){
  var M={};TEAMS.forEach(function(t){M[t.id]={g:0,s:0,b:0,c:0,dz:[]}});var jeD={};
  [1,2].forEach(function(l){var lt=TEAMS.filter(function(t){return t.liga===l});
    DZ.forEach(function(d,i){if(!GESPIELT[i])return;
      var ppD={};lt.forEach(function(t){ppD[t.id]=0});SP.forEach(function(p){if(ppD[p.t]!=null)ppD[p.t]+=p.pd[i]});
      var s=lt.slice().sort(function(a,b){return b.e1[i]-a.e1[i]||b.vh[i]-a.vh[i]||ppD[b.id]-ppD[a.id]}).slice(0,3);
      jeD[l+":"+i]=s;s.forEach(function(t,k){var m=M[t.id];k===0?m.g++:k===1?m.s++:m.b++;m.c+=PRAEMIE[l][k];m.dz.push([i,k])})})});
  return {M:M,jeD:jeD};
}
var MED=medaillen();

/* ---------- Kopf ---------- */
function baueKopf(){
  document.getElementById("rail").innerHTML=rail("pokal");
  document.getElementById("hk").innerHTML='<div class="crest"><img src="../'+logo(ICH)+'" alt=""></div><div><h1>Leaders</h1><div class="sub"><b>'+zeitName()+'</b> · '+ligaName()+' · nach Spieltag '+GEB+' von 20</div></div>';
  var m=MED.M[ICH],topSp=SP.slice().sort(function(a,b){return b.pp-a.pp})[0],ligaT=TEAMS.filter(function(t){return t.liga===WIR.liga}).sort(function(a,b){return a.rang-b.rang})[0];
  var tabs=[["spieler","spieler","PP-Bestenliste","Spieler",z1(topSp.pp),topSp.n],["teams","team","Punkte und Team-PP","Teams",String(ligaT.pkt),ligaT.id+" führt Liga "+WIR.liga],["medaillen","med","Gold · Silber · Bronze","Medaillen",(m.g+m.s+m.b)+"",m.g+" Gold für "+ICH]];
  document.getElementById("tabs").innerHTML=tabs.map(function(t){return '<button type="button" class="dtab'+(Z.sicht===t[0]?' an':'')+'" role="tab" aria-selected="'+(Z.sicht===t[0])+'" data-sicht="'+t[0]+'"><span class="ic">'+ic(t[1])+'</span><span><em>'+t[2]+'</em><b>'+t[3]+'</b></span><span class="erw"><strong class="t">'+t[4]+'</strong><span>'+esc(t[5])+'</span></span></button>'}).join("");
  var med=Z.sicht==="medaillen";
  document.getElementById("hr").innerHTML='<div class="zeit"><div class="seg"><button type="button" data-zeit="0" aria-pressed="'+(!Z.zeit)+'">Saison</button></div><div class="st'+(Z.zeit?' an':'')+'"'+(med?' style="opacity:.35" data-tip="Medaillen gibt es nur für die ganze Saison"':'')+'><button type="button" data-zs="-1"'+(med||(Z.zeit||GEB+1)<=1?' disabled':'')+' aria-label="Spieltag zurück">'+ic("l")+'</button><span class="t">'+(Z.zeit?'Spieltag '+Z.zeit:'Spieltag')+'</span><button type="button" data-zs="1"'+(med||(Z.zeit&&Z.zeit>=GEB)?' disabled':'')+' aria-label="Spieltag vor">'+ic("r")+'</button></div>'+
    '<div class="seg" role="group" aria-label="Liga"><button type="button" data-liga="eigene" aria-pressed="'+(Z.liga==="eigene")+'">Liga '+WIR.liga+'</button><button type="button" data-liga="andere" aria-pressed="'+(Z.liga==="andere")+'">Liga '+(3-WIR.liga)+'</button><button type="button" data-liga="alle" aria-pressed="'+(Z.liga==="alle")+'">Beide</button></div></div>';
}

/* ---------- Sicht Spieler ---------- */
function baueSpieler(){
  var alle=spielerZeilen(),pool=alle.filter(function(z){return inLiga(TB[z.p.t].liga)}),so=Z.soS;
  var rg=raenge(pool,ppWert,true),rgA=raenge(alle,ppWert,true);
  var W={name:function(z){return z.p.n},kl:function(z){return z.p.k},team:function(z){return z.p.t},pp:ppWert,e:function(z){return z.e},ppe:function(z){return z.e?z.pp/z.e:0},a0:function(z){return z.pa[0]},a1:function(z){return z.pa[1]},a2:function(z){return z.pa[2]},a3:function(z){return z.pa[3]},mvp:function(z){return z.mvp},t10:function(z){return z.t10},best:function(z){return z.best?z.best[3]:0}};
  var sort=sortiere(pool,W[so.k],so.d,function(z){return z.p.n}),top=sortiere(pool,ppWert,-1,function(z){return z.p.n}),max=top.length?ppWert(top[0]):1;
  var h='<div class="pk"><h2>PP-Bestenliste</h2><span class="hin">'+zeitName()+' · '+ligaName()+'</span><span class="sp"></span><div class="seg" role="group" aria-label="Bereich"><button type="button" data-ber="" aria-pressed="'+(!Z.ber)+'">Alle PP</button>'+AX.map(function(a,i){return '<button type="button" data-ber="'+a+'" aria-pressed="'+(Z.ber===a)+'" style="'+(Z.ber===a?'background:var(--'+a+')':'color:var(--'+a+')')+'">'+AXN[i]+'</button>'}).join("")+'</div></div>';
  h+='<div class="pod">'+top.slice(0,3).map(function(z,k){var p=z.p;return '<div class="pd1'+(k===0?' g':'')+'" style="--kf:var(--'+KLF[p.k]+')"><span class="bild">'+(p.s?'<img class="gr" src="../portraits/'+p.s+'.jpg" alt="">':'')+'<span class="med '+"gsb"[k]+'">'+(k+1)+'</span></span><span style="min-width:0"><h3>'+esc(p.n)+'</h3><span class="u">'+klasse(p.k)+teamZ(p.t,false)+'</span></span><span class="pp"><strong class="t">'+z1(ppWert(z))+'</strong><span>PP'+(Z.ber?' '+Z.ber.toUpperCase():'')+' · '+z.e+' Eins.</span></span></div>'}).join("")+'</div>';
  h+='<div class="tl sl"><div class="th">'+kopf("pp","#",so,"m tipll","Rang nach PP in "+ligaName()+", klein unter allen Spielern")+kopf("name","Spieler",so)+kopf("kl","Klasse",so)+kopf("team","Team",so)+kopf("pp","PP"+(Z.ber?" "+Z.ber.toUpperCase():""),so)+kopf("e","Eins.",so,"r","Einsätze")+kopf("ppe","Ø",so,"r","PP je Einsatz. Skala: der Tagesbeste einer Disziplin liegt um 5.")+AX.map(function(a,i){return kopf("a"+i,'<span style="color:var(--'+a+')">'+AXN[i]+'</span>',so,"r")}).join("")+kopf("mvp","MVP",so,"r","Spieler des Spieltags")+kopf("t10","Top 10",so,"r tipl","So oft unter den zehn Besten einer Disziplin")+kopf("best","Bestwert",so,"r tipl","Höchste Einzelwertung und ihre Disziplin")+'</div>';
  sort.slice(0,100).forEach(function(z){var p=z.p,v=ppWert(z);
    h+='<div class="tz'+(p.t===ICH?' wir':'')+'"><span class="rg m t">'+rg.get(z)+(Z.liga!=="alle"?'<small>'+rgA.get(z)+'/'+alle.length+'</small>':'')+'</span><span class="sp-z">'+portrait(p)+'<b>'+esc(p.n)+'</b>'+(p.v?'<span class="marke rot" data-tip="Verletzt: nicht einsetzbar">verl.</span>':'')+'</span>'+klasse(p.k)+teamZ(p.t,false)+
      '<span class="ppz"><b class="t">'+z1(v)+'</b><span class="bk" style="height:.55em"><i style="width:'+(max?v/max*100:0)+'%;--bf:var(--'+(Z.ber||'gold')+')"></i></span></span><span class="r t leise">'+z.e+'</span><span class="r t">'+(z.e?z1(z.pp/z.e):'–')+'</span>'+
      [0,1,2,3].map(function(i){return '<span class="r t'+(z.pa[i]?'':' null')+'" style="'+(Z.ber===AX[i]?'font-weight:700;color:var(--'+AX[i]+')':'')+'">'+(z.pa[i]?z1(z.pa[i]):'–')+'</span>'}).join("")+
      '<span class="r t'+(z.mvp?' gold':' null')+'"><b>'+(z.mvp||'–')+'</b></span><span class="r t'+(z.t10?'':' null')+'">'+(z.t10||'–')+'</span><span class="best t">'+(z.best?'<b>'+z1(z.best[3])+'</b>'+dzIcon(z.best[2]):'–')+'</span></div>'});
  h+='</div><div class="kf"><span><b>'+pool.length+' Spieler</b> mit Einsatz'+(sort.length>100?' · die ersten 100':'')+'</span><span class="sp"></span><span>PP-Skala C2: der Tagesbeste einer Disziplin liegt um 5 PP. PP sind öffentlich, kein Nebel.</span></div>';
  document.getElementById("p1").innerHTML=h;
}
function ew(t,i){var v=t.e1[i];return DZ[i].pod?(v>0?'+':v<0?'−':'±')+Math.abs(v):String(v)}
function karteKopf(i,rechts){return '<div class="kk">'+dzIcon(i)+'<b>'+esc(DZ[i].name)+'</b><small>'+rechts+'</small></div>'}
function baueSpielerRechts(){
  var alle=spielerZeilen(),pool=alle.filter(function(z){return inLiga(TB[z.p.t].liga)}),h;
  if(Z.zeit){
    var ds=O.plan[Z.zeit-1],klump=[];
    h='<div class="pk"><h2>Tagesbeste</h2><span class="hin">Spieltag '+Z.zeit+' · '+ligaName()+'</span><span class="sp"></span><span class="hin">Skala 0 bis 5 PP</span></div><div class="tg">';
    ds.forEach(function(i){var l=pool.filter(function(z){return z.pd[i]>0}).sort(function(a,b){return b.pd[i]-a.pd[i]||a.p.n.localeCompare(b.p.n)}),rg=raenge(l,function(z){return z.pd[i]},true);
      klump.push(l.filter(function(z){return z.pd[i]>=4.99}).length);

      h+='</div></div>'});
    h+='</div><div class="hinw2"><b>Skala C2:</b> der Strich rechts ist die 5. Heute stehen '+klump[0]+' und '+klump[1]+' Spieler genau auf 5,0. <b>Ab der nächsten Saison</b> verteilt der Tagesanker neu (Mittel der besten drei = 5,5, weiche Kappe ab 4): der Tagesbeste liegt dann bei 4,8 bis 5,0 und steht allein vorn.</div>';
  }else{
    h='<div class="pk"><h2>Disziplin-Beste</h2><span class="hin">Saison · PP je Disziplin · '+ligaName()+'</span><span class="sp"></span><span class="hin">gespielt von 2</span></div><div class="dg">';

/* ---------- Sicht Teams ---------- */

  var rk=so.k==="team"?"pkt":so.k,rg=raenge(pool,W[rk],true),rgA=raenge(alle,W[rk],true);

  sort.forEach(function(z){var t=z.t;
    h+='<div class="tz'+(t.id===ICH?' wir':'')+'"><span class="rg m t">'+rg.get(z)+(Z.liga!=="alle"?'<small>'+rgA.get(z)+'/32</small>':'')+'</span>'+teamZ(t.id)+'<span class="r z t"><b>'+z.pkt+'</b></span><span class="m t sun"><i class="plus">'+z.s+'</i>-<i class="leise">'+z.u+'</i>-<i class="minus">'+z.n+'</i></span><span class="r t '+(z.ef>0?'plus':z.ef<0?'minus':'null')+'">'+(z.ef>0?'+':z.ef<0?'−':'')+Math.abs(z.ef)+'</span>'+
      '<span class="ppz"><b class="t">'+z1(z.pp)+'</b><span class="bk" style="height:.55em"><i style="width:'+z.pp/maxPP*100+'%"></i></span></span><span class="r t">'+z1(z.ppe)+'</span><span class="sp-z">'+(z.best?portrait(z.best.p)+'<b>'+esc(z.best.p.n)+'</b><span class="t leise" style="margin-left:auto">'+z1(z.best.pp)+'</span>':'–')+'</span>'+medZ(MED.M[t.id])+
      [0,1,2,3].map(function(i){return '<span class="r t'+(z.pa[i]?'':' null')+'">'+z.pa[i]+'</span>'}).join("")+'</div>'});
  h+='</div><div class="kf"><span><b>Punkte</b> zählen für die Tabelle, <b>Team-PP</b> zeigen die Leistung der Spieler</span><span class="sp"></span><span>Medaillen: Stand heute'+(Z.zeit?' (ganze Saison)':'')+'</span></div>';
  document.getElementById("p1").innerHTML=h;
}

      h+=l.length?'<div class="kl3">'+l.map(function(z,k){return '<div class="kz3"><span class="med '+"gsb"[k]+'">'+(k+1)+'</span><span class="nm'+(z.t.id===ICH?' wir':'')+'"><img src="../'+logo(z.t.id)+'" alt=""><b>'+esc(z.t.name)+'</b></span><span class="w t">'+ew(z.t,i)+'</span></div>'}).join("")+'</div>':'<div class="off">noch nicht gespielt</div>';
      h+='</div>'});

  }

/* ---------- Sicht Medaillen ---------- */

  var pool=TEAMS.filter(function(t){return inLiga(t.liga)}).map(function(t){var m=MED.M[t.id];return {t:t,m:m,sum:m.g+m.s+m.b}}),so=Z.soM;

  var rk=so.k==="team"?"med":so.k,rg=raenge(pool,W[rk],true),rgA=raenge(TEAMS.map(function(t){var m=MED.M[t.id];return {t:t,m:m,sum:m.g+m.s+m.b}}),W[rk],true),rgAby={};rgA.forEach(function(v,k){rgAby[k.t.id]=v});

  sort.forEach(function(z){var t=z.t,m=z.m;
    h+='<div class="tz'+(t.id===ICH?' wir':'')+'"><span class="rg m t">'+rg.get(z)+(Z.liga!=="alle"?'<small>'+rgAby[t.id]+'/32</small>':'')+'</span>'+teamZ(t.id)+'<span class="m mz t'+(m.g?' gold':' null')+'">'+m.g+'</span><span class="m mz t'+(m.s?'':' null')+'" style="'+(m.s?'color:var(--silber)':'')+'">'+m.s+'</span><span class="m mz t'+(m.b?'':' null')+'" style="'+(m.b?'color:var(--bronze)':'')+'">'+m.b+'</span><span class="r z t">'+z.sum+'</span><span class="r t'+(m.c?' plus':' null')+'">'+(m.c?'+'+z1(m.c)+' C':'–')+'</span>'+
      '<span class="dzl">'+m.dz.slice().sort(function(a,b){return a[1]-b[1]}).map(function(d){return '<span data-tip="'+esc(DZ[d[0]].name)+': '+["Gold","Silber","Bronze"][d[1]]+'">'+dzIcon(d[0])+'<i style="background:var(--'+["gold","silber","bronze"][d[1]]+')"></i></span>'}).join("")+'</span></div>'});
  h+='</div><div class="kf"><span>Wertung: Summe der <b>Ergebnispunkte</b> je Disziplin, jede Disziplin kommt zweimal dran</span><span class="sp"></span><span>Geld ist klein mit Absicht · Moral +6 / +4 / +2 für Ehrgeiz-Traits</span></div>';
  document.getElementById("p1").innerHTML=h;
}

    h+=s.length?'<div class="kl3">'+s.map(function(t,k){return '<div class="kz3"><span class="med '+"gsb"[k]+'">'+(k+1)+'</span><span class="nm'+(t.id===ICH?' wir':'')+'"><img src="../'+logo(t.id)+'" alt=""><b>'+esc(t.name)+'</b></span><span class="w t">'+ew(t,i)+'</span></div>'}).join("")+'</div>':'<div class="off">noch nicht gespielt</div>';

function alles(){baueDemo();baueKopf();if(Z.sicht==="spieler"){baueSpieler();baueSpielerRechts()}else if(Z.sicht==="teams"){baueTeams();baueTeamsRechts()}else{baueMedaillen();baueMedaillenRechts()}}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-sicht]");if(b){Z.sicht=b.dataset.sicht;if(Z.sicht==="medaillen")Z.zeit=0;setzeUrl("sicht",Z.sicht);alles();return}

});
