<title>Sponsoren – Liga-Topf und Saisonfaktor (Mockup 22.11.)</title>
<!--
  SPONSOREN NEU, MOCKUP 22.11. Konzept: docs/design/sponsoren-rework-22-11.md.
  Chris 22.11.: "kannst du die Sponsoren bzw. deren Finanzberechnung vllt noch mal reworken bzw. einen Mockup-Vorschlag machen ...
  so dass manche Teams im + sind und manche im - und wir sowas wie den Season-Faktor haben, dass wenn alle Teams ihren aktuellen
  Rang erreichen, wir bei 1 ungefaehr keine Aenderung in der GuV der Liga im Schnitt haben."
  Gleiche Tokens, Schriften, Schiene, Hero-Kopf und Karten wie finanzen-modern-18-11.html und budget-gespraech-22-11.html.
  Kein App-Code, kein PixelLab (0 Generationen): die drei Wappen stammen aus public/sprites/sponsoren/ (Icon-Probe 22.11.).
  ECHT (Live-Abbild origin/live-save, Spielstand new-game-1795114260527-nzr0z9, Stand Spieltag 11 von 20, nur gelesen):
        Teams, Liga, Tabellenplatz und Platzverlauf je Spieltag, Startrang des laufenden Sponsorvertrags (hier als Erwartungsrang
        genutzt), Jahresgehalt, Kaderwert, Beliebtheit, Farb-Punkte je Team, Name und Seltenheit des laufenden Hauptsponsors,
        heutige Sponsor-Hochrechnung und Vertragsanker, gebuchte Sponsor-Ereignisse.
  GERECHNET (mit den Formeln des Vorschlags aus den echten Werten, nicht gebucht): Liga-Topf, Grundbetrag, Leistungsteil,
        Farb-Partner, Ergebnis je Team.
  BEISPIEL: die drei Angebote fuer Saison 2, Vertragsart und Farb-Wahl der Teams (nach der vorgeschlagenen KI-Regel), der
        Sponsorentermin, das Ziel "Entwicklung", Vorab-Zusage.
  URL: ?ansicht=vertrag|angebote|liga|rechnung &f=0.95|1|1.05 &liga=1|2 &art=fest|leistung|praemie &lz=1|2|3 &still=1
-->

    ts.forEach(function(t){var ki=FARBEN.slice().sort(function(a,b){return rangIn[t.id][a]-rangIn[t.id][b]}).slice(0,2);if(t.id===ICH&&!Z.farben)Z.farben=ki.slice();wahl[t.id]=t.id===ICH?Z.farben.slice():ki});
    var liste={};

    FARBEN.forEach(function(f,i){
      var unt=ts.filter(function(t){return wahl[t.id].indexOf(f)>=0}).sort(function(a,b){return b.fp[i]-a.fp[i]||a.r-b.r});
      var ant=P.farbAnteile.slice(0,unt.length), s=summe(ant)||1;
      unt.forEach(function(t,j){farb[t.id][f]={platz:j+1,von:unt.length,c:j<ant.length?F*P.farbTopf[l]*ant[j]/s:0}});
      liste[f]=unt.slice(0,3).map(function(t){return t.id+" "+t.fp[i]});
    });
    var roh=ts.map(function(t){var h=P.hebel[artVon(t)];return F*P.s1Satz*P.praemie[l]*h*(t.e-t.r)});

      var uebrig=t.bo, sumNeu=grund+leist+fc;
      res.zeilen[t.id]={t:t,art:artVon(t),grund:grund,roh:rohGrund(t),wSkala:wSkala,basis:jeTeam*P.ligaAnteil[l]/norm,popM:popM,leist:leist,leistRoh:roh[i],ausgleich:ausgleich,liste:liste,farb:farb[t.id],farbC:fc,wahl:wahl[t.id],rangIn:rangIn[t.id],

        erwNeu:grund+fc+uebrig-t.geh,erwHeute:t.ank+uebrig-t.geh};
    });
  });
  return res;
}

function zeichneVerlauf(t,p){

  for(var g=1;g<=tief;g++){if(tief>9&&g!==1&&g%4!==0)continue;s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="rgba(244,230,196,.09)"/><text x="'+(l-8*k)+'" y="'+(y(g)+4*k)+'" text-anchor="end">Platz '+g+'</text>'}

  s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y(t.e)+'" y2="'+y(t.e)+'" stroke="#f0c35a" stroke-width="'+2*k+'" stroke-dasharray="7 5"/><text x="'+(W-r-4*k)+'" y="'+(y(t.e)-7*k)+'" text-anchor="end" fill="#f0c35a">Erwartung '+t.e+'</text>';
  s+='<polyline points="'+t.v.map(function(v,i){return x(i)+","+y(v)}).join(" ")+'" fill="none" stroke="#F2A03D" stroke-width="'+3*k+'"/>';
  t.v.forEach(function(v,i){s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="'+5*k+'" fill="#F2A03D"/><text x="'+x(i)+'" y="'+(y(v)-10*k)+'" text-anchor="middle" fill="#eef2f8">'+v+'</text>'});

  s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+b0+'" y2="'+b0+'" stroke="rgba(244,230,196,.3)"/><text x="'+(l-8*k)+'" y="'+(b0+4*k)+'" text-anchor="end">Abschlag</text>';

    } else s+='<rect x="'+(x(i)-pw*.3)+'" y="'+(b0-2*k)+'" width="'+pw*.6+'" height="'+4*k+'" rx="2" fill="#333d50"/>';

  box.innerHTML=s+'</svg>';
}

    '<div class="stufe"><span class="gk">Farb-Partner: zwei aus vier</span><div class="chips">'+FARBEN.map(function(f){return '<button class="chip f '+f+'" data-farbe="'+f+'" aria-pressed="'+(Z.farben.indexOf(f)>=0)+'">'+f.toUpperCase()+' · Liga-Rang '+zw.rangIn[f]+'</button>'}).join("")+'</div>'+
    '<small class="leise">Liga-Rang nach Farb-Punkten dieser Saison <span class="marke echt">echt</span>. Geld gibt es nur in den zwei unterschriebenen Farben.</small></div>'+
    '<div class="stufe"><span class="gk">Ziel gegen die eigene Ausgangslage</span><div class="chips">'+["Entwicklung","Kaderpflege","Ausbau","Solidität"].map(function(z,i){return '<button class="chip" aria-pressed="'+(i===0)+'">'+z+'</button>'}).join("")+'</div>'+
    '<small class="leise">Auszahlung = Einsatz × (2 × Erfüllung − 1). Im Mittel 0, wie die Achsen heute.</small></div>'+
    '<div class="kachel"><span class="gk">Nachfordern, einmal je Angebot <span class="marke bsp">Beispiel</span></span><small>Chance 46 % aus Beliebtheit 8,3 und Vorstandsvertrauen 5,7. Gelingt es, zählt das Ziel nach oben voll und nach unten halb. Scheitert es, zieht '+esc(a.n)+' zurück und es bleiben zwei Angebote.</small></div>'+
    '<div class="zl" style="margin-top:auto">'+
    '<div class="z"><span>Grundbetrag</span><b class="t">'+zahl(w.grund)+' C</b></div>'+
    '<div class="z"><span>Farb-Partner <small>Stand heute</small></span><b class="t plus">'+vz(zw.farbC)+' C</b></div>'+
    '<div class="z"><span>Treuebonus über die Laufzeit</span><b class="t">'+(Z.lz===1?"—":"+"+zahl(Z.lz===2?1:3,0)+" C")+'</b></div>'+
    '<div class="z sum"><span>Bei Erwartungsrang, Saison 2</span><b class="t">'+zahl(w.grund+zw.farbC)+' C</b></div></div>'+
    '</div><div class="fuss"><button class="btn klein" title="Einmal je Angebot. Chance nach Beliebtheit und Vorstandsvertrauen. Scheitert es, zieht die Marke zurück.">Nachfordern</button><span class="sp"></span><button class="btn klein">KI wählen lassen</button><button class="btn ja">Unterschreiben</button></div></section>';
  el("work").innerHTML=links+karten+rechts;
  ANGEBOTE.forEach(function(a,i){var w=angebotWerte(R,a), box=document.querySelector('[data-kurve="'+i+'"]'), m=mass(box), W=m.W, H=m.H, k=m.k;
    var l=8*k,r=8*k,o=22*k,u=22*k; var vals=[];for(var j=1;j<=16;j++)vals.push(w.grund+w.satz*(w.e-j));
    var all=[];ANGEBOTE.forEach(function(b){var x=angebotWerte(R,b);all.push(x.grund+x.satz*(x.e-1),x.grund+x.satz*(x.e-16))});
    var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);
    function X(j){return l+(W-l-r)*(j-1)/15} function Y(v){return o+(H-o-u)*(1-(v-mn)/(mx-mn||1))}
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Auszahlung nach Endrang">';
    s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(w.grund)+'" y2="'+Y(w.grund)+'" stroke="rgba(244,230,196,.25)" stroke-dasharray="4 4"/>';
    s+='<polyline fill="none" stroke="#f0c35a" stroke-width="'+2.5*k+'" points="'+vals.map(function(v,j){return X(j+1)+","+Y(v)}).join(" ")+'"/>';
    s+='<circle cx="'+X(w.e)+'" cy="'+Y(w.grund)+'" r="'+5*k+'" fill="#F2A03D"/>';
    s+='<text x="'+l+'" y="'+(H-5*k)+'">Platz 1</text><text x="'+(W-r)+'" y="'+(H-5*k)+'" text-anchor="end">Platz 16</text><text x="'+(X(w.e)+10*k)+'" y="'+(Y(w.grund)-8*k)+'" fill="#F2A03D">Erwartung · '+zahl(w.grund,0)+' C</text><text x="'+(W-r-16*k)+'" y="'+(Y(vals[15])+3*k)+'" text-anchor="end">'+zahl(vals[15],0)+' C</text>';
    box.innerHTML=s+'</svg>';
  });
}

/* ---------- Ansicht 3: Liga-Vergleich ---------- */
var SPALTEN=[["rg","#",3,"m"],["n","Team",15,"l"],["sp","Hauptsponsor",17,"l"],["art","Vertragsart",9,"l"],["e","Erwartung",6,"m"],["r","Platz",5,"m"],
  ["grund","Grundbetrag",7,""],["leist","Leistung",7,""],["farbC","Farb-Partner",9,""],["sumNeu","Summe neu",7,""],["heute","heute",6,""],["geh","Gehalt",6,""],["ergNeu","Ergebnis neu",8,""],["bal","",10,"m"],["ergHeute","Ergebnis heute",8,""]];
function ansLiga(R){
  var zs=liga(Z.liga).map(function(t){return R.zeilen[t.id]});
  // Rang 1 = hoechste Summe
  zs.slice().sort(function(a,b){return b.sumNeu-a.sumNeu}).forEach(function(z,i){z.rg=i+1});
  function wert(z,k){return k==="n"?z.t.n:k==="sp"?z.t.sp:k==="e"?z.t.e:k==="r"?z.t.r:k==="geh"?z.t.geh:k==="art"?ARTNAME[z.art]:k==="bal"?z.ergNeu:z[k]}
  var k=Z.sort.k,dd=Z.sort.d;
  zs.sort(function(a,b){var x=wert(a,k),y=wert(b,k);return (typeof x==="string"?x.localeCompare(y,"de"):x-y)*dd});
  var mx=Math.max.apply(null,zs.map(function(z){return Math.max(Math.abs(z.ergNeu),Math.abs(z.ergHeute))}));
  var kopfz=SPALTEN.map(function(s){var as=Z.sort.k===s[0]?' aria-sort="'+(Z.sort.d>0?"ascending":"descending")+'"':"";return '<th class="'+s[3]+'" style="width:'+s[2]+'%" data-sort="'+s[0]+'"'+as+'>'+s[1]+'</th>'}).join("");
  var rows=zs.map(function(z){var t=z.t, w=Math.min(50,Math.abs(z.ergNeu)/mx*50);
    return '<tr class="'+(t.id===ICH?"ich":"")+'"><td class="m t">'+z.rg+'</td><td class="l"><span class="tm"><img src="../team-logos/'+t.id+'.jpg" alt=""><span class="h">'+esc(t.n)+'</span></span></td>'+
    '<td class="l"><span class="tm">'+wappen(t.sid,t.sp,true)+'<span>'+esc(t.sp)+'</span><span class="marke r-'+t.rar+'">'+t.rar.slice(0,3)+'</span></span></td>'+
    '<td class="l leise">'+ARTNAME[z.art].replace("vertrag","")+'</td><td class="m t gold">'+t.e+'</td><td class="m t">'+t.r+'</td>'+
    '<td class="t">'+zahl(z.grund)+'</td><td class="t '+kl(z.leist)+'">'+vz(z.leist)+'</td>'+
    '<td class="t"><span class="tm" style="justify-content:flex-end">'+z.wahl.map(function(f){return '<span class="fb '+f+'">'+f.toUpperCase()+'</span>'}).join("")+'<span class="'+(z.farbC>0?"plus":"leise")+'" style="min-width:2.6rem;text-align:right">'+zahl(z.farbC)+'</span></span></td>'+
    '<td class="t gold">'+zahl(z.sumNeu)+'</td><td class="t leise">'+zahl(z.heute)+'</td><td class="t">'+zahl(t.geh)+'</td>'+
    '<td class="t '+kl(z.ergNeu)+'">'+vz(z.ergNeu)+'</td><td><div class="bal"><i style="background:'+(z.ergNeu>=0?"var(--gut)":"var(--warn)")+';'+(z.ergNeu>=0?"left:50%":"right:50%")+';width:'+w+'%"></i></div></td>'+
    '<td class="t '+kl(z.ergHeute)+'">'+vz(z.ergHeute)+'</td></tr>'}).join("");
  var neu=zs.map(function(z){return z.ergNeu}), alt=zs.map(function(z){return z.ergHeute});
  var sn=zs.map(function(z){return z.sumNeu}), sa=zs.map(function(z){return z.heute});
  el("work").innerHTML='<section class="pan"><div class="pk"><h2>Liga '+Z.liga+': wer bekommt was</h2><span class="marke echt">Teams, Plätze, Gehälter, Marken echt</span><span class="marke bsp">Vertragsart und Farb-Wahl nach KI-Regel</span><span class="sp"></span>'+
    '<span class="hin">Rang 1 = höchste Summe · alle Spalten sortierbar · Beträge in C je Saison, Hochrechnung mit dem Tabellenstand von Spieltag 11</span></div>'+
    '<div class="tw"><table><thead><tr>'+kopfz+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="fuss"><span>Ergebnis neu: Mittel <b class="'+kl(mittel(neu))+'">'+vz(mittel(neu))+' C</b> · im Plus <b class="creme">'+neu.filter(function(v){return v>=0}).length+' von 16</b></span>'+
    '<span>Ergebnis heute: Mittel <b class="'+kl(mittel(alt))+'">'+vz(mittel(alt))+' C</b> · im Plus <b class="creme">'+alt.filter(function(v){return v>=0}).length+' von 16</b></span><span class="sp"></span>'+
    '<span>Größter zu kleinstem Vertrag: neu <b class="creme">'+zahl(Math.max.apply(null,sn)/Math.min.apply(null,sn),2)+'</b> · heute <b class="creme">'+zahl(Math.max.apply(null,sa)/Math.min.apply(null,sa),2)+'</b></span></div></section>';
}

/* ---------- Ansicht 4: So rechnet der Saisonfaktor ---------- */
function ansRechnung(R){
  var n=TEAMS.length, zs=TEAMS.map(function(t){return R.zeilen[t.id]});
  var neu=zs.map(function(z){return z.erwNeu}), alt=zs.map(function(z){return z.erwHeute});
  function grad(werte,l){var ts=zs.filter(function(z){return z.t.l===l});var o=ts.filter(function(z){return z.t.e<=4}),u=ts.filter(function(z){return z.t.e>=13});
    return mittel(o.map(function(z){return z[werte]}))-mittel(u.map(function(z){return z[werte]}))}
  var links='<section class="pan"><div class="pk"><h2>So rechnet der Saisonfaktor</h2><span class="sp"></span><span class="marke echt">Live-Zahlen</span></div><div class="kb">'+
    '<div class="schritt"><span class="n">1</span><span><b>Was kostet die Liga?</b><small>Jahresgehälter aller 32 Kader am Stichtag, dazu Unterhalt und Zinsen</small></span><strong class="t">'+zahl(R.kosten,0)+' C</strong></div>'+
    '<div class="schritt"><span class="n">2</span><span><b>Was kommt ohnehin herein?</b><small>Planwert der übrigen Einnahmen: heute Vorstandsziele, später Karten, Marketing, Medaillen</small></span><strong class="t">−'+zahl(R.plan,0)+' C</strong></div>'+
    '<div class="schritt"><span class="n">3</span><span><b>Liga-Topf = Rest × Saisonfaktor</b><small>'+zahl(R.k,0)+' C × '+zahl(Z.f,2)+' · der Topf darf je Saison höchstens 15 % wandern</small></span><strong class="t gold">'+zahl(R.topf,0)+' C</strong></div>'+
    '<div class="schritt"><span class="n">4</span><span><b>Verteilen: Grundbetrag, Leistung, Farbe</b><small>Grundbetrag nach Erwartungsrang und Beliebtheit · Leistung: Summe je Liga 0 · Farb-Partner '+zahl(R.farbSumme,0)+' C</small></span><strong class="t">'+zahl(R.topf/n)+' <small style="display:inline;font-size:.9rem;color:var(--leise)">je Team</small></strong></div>'+
    '<div class="formel">Auszahlung = <em>Grundbetrag</em>(Erwartungsrang, Beliebtheit) + <em>Satz</em> × Hebel × (Erwartungsrang − Endrang) − Liga-Ausgleich + <em>Farb-Partner</em> + Ziel</div>'+
    (function(){var d=R.zeilen[ICH],t=d.t;return '<table class="mini zwei"><thead><tr><th class="l">Beispiel Death Peaches: Grundbetrag</th><th></th></tr></thead><tbody>'+
      '<tr><td class="l">Anteil am Topf, Liga 2 (0,89 von 1,00)</td><td class="t">'+zahl(d.basis)+'</td></tr>'+
      '<tr><td class="l">Erwartungsrang '+t.e+': (8,5 − '+t.e+') × '+zahl(P.steig[t.l])+' C</td><td class="t plus">'+vz(Z.f*P.steig[t.l]*(8.5-t.e))+'</td></tr>'+
      '<tr><td class="l">Beliebtheit '+zahl(t.pop)+' gegen Liga-Mittel '+zahl(d.popM)+'</td><td class="t '+kl(t.pop-d.popM)+'">'+vz(P.markt*(t.pop-d.popM))+'</td></tr>'+
      '<tr><td class="l">Prestige '+t.rar+', in der Liga-Summe neutral</td><td class="t '+kl(d.grund-d.roh)+'">'+vz(d.grund-d.roh)+'</td></tr>'+
      '<tr class="erw"><td class="l">Grundbetrag</td><td class="t">'+zahl(d.grund)+' C</td></tr></tbody></table>'})()+
    '<div class="stufe"><span class="gk">Saisonfaktor verschieben: '+zahl(Z.f,2)+'</span><input type="range" min="0.9" max="1.1" step="0.01" value="'+Z.f+'" id="regler" aria-label="Saisonfaktor">'+
    '<small class="leise">Jedes Hundertstel bewegt die Liga um '+zahl(R.k/100,0)+' C, das sind '+zahl(R.k/100/n,2)+' C je Team. Vorschlag: Grundwert 1,00 im Spielstand, Konjunktur je Saison nur noch 0,95 bis 1,05 (heute 0,82 bis 1,24).</small></div>'+
    '<div class="hinweis" style="margin-top:auto"><b>Empfehlung ab Saison 2:</b> eine Zeile mehr im Topf, der Kader-Ersatz (10 % des Kaderwerts). Gemessen zahlt die Liga je Saison rund 20 C je Team netto an den Markt. Ohne diese Zeile steht die Betriebsrechnung bei 0, aber die Kassen laufen leer. Frage 1 im Konzept.</div>'+
    '</div></section>';
  var mitte='<section class="pan"><div class="pk"><h2>Wenn alle genau ihren Erwartungsrang erreichen</h2><span class="sp"></span><span class="hin">Ergebnis je Team in C, sortiert nach Erwartungsrang · links Liga 1, rechts Liga 2</span></div><div class="kb">'+
    '<div class="dia" id="diaErw"></div>'+
    '<div class="leg"><span><i style="background:var(--stumm)"></i>heute: Vertragsanker minus Gehalt <span class="marke echt">echt</span></span><span><i style="background:var(--gut)"></i>neu im Plus</span><span><i style="background:var(--warn)"></i>neu im Minus</span><span><i style="background:var(--heim)"></i>Death Peaches</span></div>'+
    '</div><div class="fuss"><span>Heute hängt das Ergebnis am Startrang: wer oben erwartet wird, verdient schon ohne Überraschung. Neu hängt es an der Gehaltspolitik: wer für seinen Erwartungsrang teuer ist, liegt im Minus.</span></div></section>';
  var rechts='<div class="spalte"><section class="pan" style="flex:1"><div class="pk"><h2>Liga-Bilanz</h2><span class="sp"></span><span class="hin">alle auf Erwartungsrang</span></div><div class="kb">'+
    '<div class="kachel"><span class="gk">Liga-Mittel neu</span><strong class="t '+kl(mittel(neu))+'">'+vz(mittel(neu))+' C</strong><small>heute '+vz(mittel(alt))+' C je Team (Faktor 0,94 im Live-Spielstand)</small></div>'+
    '<div class="kachel"><span class="gk">Teams im Plus · im Minus</span><strong class="t">'+neu.filter(function(v){return v>=0}).length+' · '+neu.filter(function(v){return v<0}).length+'</strong><small>heute '+alt.filter(function(v){return v>=0}).length+' · '+alt.filter(function(v){return v<0}).length+'</small></div>'+
    '<div class="kachel"><span class="gk">Gefälle oben gegen unten, Liga 1</span><strong class="t">'+vz(grad("erwNeu",1))+' C</strong><small>Erwartungsrang 1 bis 4 gegen 13 bis 16 · heute '+vz(grad("erwHeute",1))+' C</small></div>'+
    '<div class="kachel"><span class="gk">Gefälle oben gegen unten, Liga 2</span><strong class="t">'+vz(grad("erwNeu",2))+' C</strong><small>heute '+vz(grad("erwHeute",2))+' C</small></div>'+
    '<div class="kachel"><span class="gk">Größter zu kleinstem Vertrag</span><strong class="t">'+zahl(Math.max.apply(null,zs.map(function(z){return z.sumNeu}))/Math.min.apply(null,zs.map(function(z){return z.sumNeu})),2)+'</strong><small>heute '+zahl(Math.max.apply(null,TEAMS.map(function(t){return t.ist}))/Math.min.apply(null,TEAMS.map(function(t){return t.ist})),2)+' · beim Tabellenstand von Spieltag 11</small></div>'+
    '<div class="kachel"><span class="gk">Sponsorgeld Liga 1 zu Liga 2</span><strong class="t">'+zahl(mittel(liga(1).map(function(t){return R.zeilen[t.id].sumNeu}))/mittel(liga(2).map(function(t){return R.zeilen[t.id].sumNeu})),2)+'</strong><small>heute '+zahl(mittel(liga(1).map(function(t){return t.ist}))/mittel(liga(2).map(function(t){return t.ist})),2)+' · Gehälter '+zahl(mittel(liga(1).map(function(t){return t.geh}))/mittel(liga(2).map(function(t){return t.geh})),2)+'</small></div>'+
    '</div></section></div>';
  el("work").innerHTML=links+mitte+rechts;
  // Diagramm
  var ord=liga(1).slice().sort(function(a,b){return a.e-b.e}).concat(liga(2).slice().sort(function(a,b){return a.e-b.e}));
  var box=el("diaErw"),m=mass(box),W=m.W,H=m.H,k=m.k,l=46*k,r=10*k,o=30*k,u=50*k,luecke=26*k,bw=(W-l-r-luecke)/32;
  var all=ord.map(function(t){return R.zeilen[t.id].erwNeu}).concat(ord.map(function(t){return R.zeilen[t.id].erwHeute}));
  var mx=Math.ceil(Math.max(Math.max.apply(null,all),10)/10)*10, mn=Math.floor(Math.min(Math.min.apply(null,all),-10)/10)*10;
  function Y(v){return o+(H-o-u)*(1-(v-mn)/(mx-mn))}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ergebnis je Team bei Erwartungsrang, heute und neu">';
  for(var g=mn;g<=mx;g+=10){s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="rgba(244,230,196,'+(g===0?.45:.08)+')"/><text x="'+(l-6*k)+'" y="'+(Y(g)+4*k)+'" text-anchor="end">'+(g>0?"+":"")+g+'</text>'}
  ord.forEach(function(t,i){var z=R.zeilen[t.id], x=l+i*bw+(i>=16?luecke:0);
    var a=z.erwHeute,b=z.erwNeu;
    s+='<rect x="'+(x+bw*.12)+'" y="'+Math.min(Y(a),Y(0))+'" width="'+bw*.34+'" height="'+Math.max(1.5,Math.abs(Y(a)-Y(0)))+'" fill="#66738a"><title>'+esc(t.n)+' heute '+vz(a)+' C</title></rect>';
    s+='<rect x="'+(x+bw*.5)+'" y="'+Math.min(Y(b),Y(0))+'" width="'+bw*.38+'" height="'+Math.max(1.5,Math.abs(Y(b)-Y(0)))+'" fill="'+(t.id===ICH?"#F2A03D":b>=0?"#62d394":"#ff6058")+'"><title>'+esc(t.n)+' neu '+vz(b)+' C</title></rect>';
    s+='<text x="'+(x+bw*.5)+'" y="'+(H-u+18*k)+'" text-anchor="middle"'+(t.id===ICH?' fill="#F2A03D"':'')+'>'+t.id+'</text><text x="'+(x+bw*.5)+'" y="'+(H-u+36*k)+'" text-anchor="middle" fill="#66738a">'+t.e+'</text>';
  });
  s+='<text x="'+(l+8*bw)+'" y="'+18*k+'" text-anchor="middle" fill="#f4e6c4">Liga 1</text><text x="'+(l+24*bw+luecke)+'" y="'+18*k+'" text-anchor="middle" fill="#f4e6c4">Liga 2</text>';
  s+='<text x="'+(l-6*k)+'" y="'+(H-u+36*k)+'" text-anchor="end" fill="#66738a">Erw.</text>';
  box.innerHTML=s+'</svg>';
  el("regler").addEventListener("input",function(e){Z.f=parseFloat(e.target.value);zeichne(true)});
}

/* ---------- Steuerung ---------- */
function zeichne(reglerBleibt){
  var R=rechne(Z.f);
  demo();kopf(R);
  var w=el("work");w.className="work v-"+Z.ansicht;
  var fok=reglerBleibt&&document.activeElement&&document.activeElement.id==="regler";
  if(Z.ansicht==="angebote")ansAngebote(R);else if(Z.ansicht==="liga")ansLiga(R);else if(Z.ansicht==="rechnung")ansRechnung(R);else ansVertrag(R);
  if(fok)el("regler").focus();
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-k]");
  if(b){var k=b.dataset.k,v=b.dataset.v;Z[k]=(k==="f"?parseFloat(v):k==="liga"?parseInt(v,10):v);zeichne();return}
  b=e.target.closest("[data-ansicht]");if(b){Z.ansicht=b.dataset.ansicht;zeichne();return}
  b=e.target.closest("[data-sort]");if(b){var s=b.dataset.sort;if(Z.sort.k===s)Z.sort.d=-Z.sort.d;else Z.sort={k:s,d:(s==="n"||s==="sp"||s==="art"||s==="rg"||s==="e"||s==="r")?1:-1};zeichne();return}
  b=e.target.closest("[data-ang]");if(b){Z.ang=parseInt(b.dataset.ang,10);Z.art=ANGEBOTE[Z.ang].art;zeichne();return}
  b=e.target.closest("[data-lz]");if(b){Z.lz=parseInt(b.dataset.lz,10);zeichne();return}
  b=e.target.closest("[data-farbe]");if(b){var f=b.dataset.farbe,i=Z.farben.indexOf(f);if(i>=0){if(Z.farben.length>1)Z.farben.splice(i,1)}else{Z.farben.push(f);if(Z.farben.length>2)Z.farben.shift()}zeichne();return}
});
(function(){var i=["fest","leistung","praemie"].indexOf(Z.art);if(i>=0)Z.ang=i;else Z.art="leistung"})();
zeichne();
var rz=null;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){zeichne()},120)});
</script>
