<script src="modern-24-11/daten.js"></script>

<script>
"use strict";
RAHMEN.bau({seite:"teams",demoTitel:"Mockup 24.11. · Teams",demo:'<span>Ansicht</span><span id="d-ans"></span><i class="tr"></i><span>Team</span><span id="d-team"></span>',
  demoHinweis:"Teams, Tabelle, Kasse, Identität, GM, Vorstand, Sponsor, Kader, Verträge, Transfers echt (Live-Abbild 24.11.) · Fans, Arena, Tickets, Beziehungen, Scouting Beispiel."});
var Z={ans:q.get("ansicht")||"liga",team:TC[q.get("team")]||ICH,liga:q.get("liga")||"beide",sort:q.get("sort"),dir:+(q.get("dir")||0)};
var STD={liga:["rang",1],kader:["pps",-1],vertrag:["geh",-1],transfers:["st",1]};
if(!Z.sort){Z.sort=STD[Z.ans]?STD[Z.ans][0]:"rang";Z.dir=STD[Z.ans]?STD[Z.ans][1]:1}else if(!Z.dir)Z.dir=-1;
var AUF={rang:1,name:1,sponsor:1,gm:1,st:1,vt:1};
$("buehne").innerHTML='<div class="seite" id="s-liga"></div><div class="seite td" id="s-kader"></div><div class="seite td" id="s-vertrag"></div><div class="seite td" id="s-transfers"></div><div class="seite tp" id="s-profil"></div>';

function fremd(T){return T!==ICH}
function spKurz(n){if(n.length<=13)return n;var w=n.split(" "),z=w[0]+" "+(w[1]||"");return (w[0]==="Deutsche"||w[0]==="General"||w[0]==="Hannover"||w[0]==="Dr.")&&z.length<=14?z:w[0]}
function kasseStufe(T){if(teamExakt(T)||!fremd(T))return null;var lo=Math.floor(T.cash/10)*10;return [lo,lo+10]}
function kasseT(T){var b=kasseStufe(T);return b?'<span class="nb t" title="Fremdes Team: Kasse nur als 10er-Stufe">'+b[0]+'–'+b[1]+'</span>':'<b class="t '+(T.cash<0?"minus":"")+'">'+de(T.cash)+'</b>'}
function kasseS(T){var b=kasseStufe(T);return b?(b[0]+b[1])/2:T.cash}
function freigabe(v){return v>=7.5?100:v>=5?90:v>=3?80:v>=1.5?70:50}
function vertrauenT(T){return fremd(T)&&!NEBEL_AUS?(T.board>=6.5?"hoch":T.board>=4?"mittel":"niedrig"):de(T.board)}
function gmName(T){return (GM[T.gm]||[T.gm])[0]}
function wer(T){return T.mensch?'<span class="mk">'+(T===ICH?"du · ":"")+werIst(T)+'</span>':'<span class="mk ki">KI</span>'}
function teamLink(T,ans){return RAHMEN.link({ansicht:ans||"kader",team:T.c,sort:null,dir:null})}

/* ---------- (a) Liga-Uebersicht ---------- */
function ligaCols(breit){
  var c=[
    {k:"rang",t:"#",w:"1.7rem",tip:"Tabellenplatz in der Liga. Rang 1 ist der beste.",wert:function(T){return T.st.rank},html:function(T){var d=T.st.start-T.st.rank;return '<span class="pl '+(T.st.rank<=4?"auf":T.st.rank>=13?"ab":"")+'" title="Startplatz '+T.st.start+'">'+T.st.rank+'</span>'}},
    {k:"wap",t:"",w:"2.1rem",html:function(T){return logo(T.c)}},
    {k:"name",t:"Team · Manager",w:"minmax(8.6rem,1.4fr)",wert:function(T){return T.n},html:function(T){return '<span class="nm"><b>'+T.n+'</b><small>'+wer(T)+'<span>'+gmName(T)+'</span></small></span>'}},
    {k:"pkt",t:"Pkt",w:"2.2rem",r:1,tip:"Punkte nach "+GEWERTET+" Spieltagen",wert:function(T){return T.st.pts},html:function(T){return '<b class="pkt t">'+T.st.pts+'</b>'}},
    {k:"trend",t:"Trend",w:"6.3rem",tip:"Punkte der letzten fünf Spieltage (je höchstens 4) und Platz gegen den Startplatz",wert:function(T){return T.tag.slice(-5).reduce(function(a,b){return a+b},0)},html:function(T){var d=T.st.start-T.st.rank;return trend(T)+' <span class="'+(d>0?"plus":d<0?"minus":"null")+' t" style="font-size:.8rem;font-weight:700">'+(d>0?"▲"+d:d<0?"▼"+(-d):"–")+'</span>'}},
    {k:"stk",t:"Kaderstärke",w:"6.3rem",tip:"Schnitt der besten sechs über alle 20 Disziplinen. Rang exakt (klein: unter allen 32), Wert fremder Teams als grobe Stufe.",wert:function(T){return -rangGes(T)},html:function(T){return '<span class="stz"><b class="rgz t">'+rangGes(T)+'.</b><small>'+rang32(T)+'/32</small>'+stkT(T,T.ges)+'</span>'}},
    {k:"cash",t:"Kasse",w:"3.9rem",r:1,tip:"Kasse in C. Fremde Teams: 10er-Stufe.",wert:kasseS,html:kasseT},
    {k:"fw",t:"Finanzw.",w:"3.4rem",tip:"Finanzwert der Team-Matrix, 1 bis 10. Öffentlich. Bestimmt die Rücklage.",wert:function(T){return T.id.finances},html:function(T){return '<span class="fwz"><b class="t">'+de(T.id.finances)+'</b><span class="bal"><i style="width:'+T.id.finances*10+'%"></i></span></span>'}},
    {k:"fans",t:"Fans",w:"3.9rem",r:1,tip:"Fanbasis und Stimmung 0 bis 100 (Beispielwerte)",wert:function(T){return T.fans},html:function(T){return '<span class="zw"><b class="t">'+tsd(T.fans)+'</b><small style="color:'+moralFarbe(T.stimmung)+'">Stimmung '+T.stimmung+'</small></span>'}},
    {k:"arena",t:"Arena",w:"3.9rem",r:1,tip:"Plätze und Auslastung der Heimspiele (Beispielwerte)",wert:function(T){return T.plaetze},html:function(T){return '<span class="zw"><b class="t">'+tsd(T.plaetze)+'</b><small>'+T.auslast+' % voll</small></span>'}},
    {k:"sponsor",t:"Sponsor",w:breit?"10rem":"5.7rem",tip:"Sponsor und Seltenheit. Beträge nur beim eigenen Team.",wert:function(T){return T.sp.n||"zzz"},html:function(T){return '<span class="spo" title="'+esc(T.sp.n)+' · '+T.sp.rar+'"><i style="background:'+(RAR[T.sp.rar]||"#9aa7ba")+'"></i><span>'+esc(breit?T.sp.n:spKurz(T.sp.n))+'</span></span>'}}];
  if(breit)c.splice(4,0,
    {k:"sun",t:"S-U-N",w:"4.2rem",tip:"Siege, Unentschieden, Niederlagen über alle Disziplin-Begegnungen",wert:function(T){return T.suN[0]*2+T.suN[1]},html:function(T){return '<span class="t">'+T.suN.join("-")+'</span>'}},
    {k:"verh",t:"Verh.",w:"3rem",r:1,tip:"Verhältnis (Tabellen-Zweitkriterium)",wert:function(T){return T.st.verh||0},html:function(T){return '<span class="t '+(T.st.verh>0?"plus":T.st.verh<0?"minus":"")+'">'+(T.st.verh>0?"+":"")+(T.st.verh||0)+'</span>'}});
  if(breit)c.push(
    {k:"kader",t:"Kader",w:"4.4rem",r:1,tip:"Spieler im Kader, davon verletzt",wert:function(T){return T.K.length},html:function(T){return '<span class="zw"><b class="t">'+T.K.length+'</b><small class="'+(T.verletzt?"minus":"")+'">'+(T.verletzt?T.verletzt+" verletzt":"alle fit")+'</small></span>'}},
    {k:"moral",t:"Ø Moral",w:"4rem",tip:"Mittlere Moral des Kaders. Fremde Teams: nur das Gesicht.",wert:function(T){return fremd(T)&&!NEBEL_AUS?Math.floor(T.moral/20)*20:T.moral},html:function(T){return '<span class="mo" style="color:'+moralFarbe(T.moral)+'">'+gesicht(T.moral)+(fremd(T)&&!NEBEL_AUS?"":'<b class="t">'+T.moral+'</b>')+'</span>'}},
    {k:"geh",t:"Gehälter / Saison",w:"6rem",r:1,tip:"Gehaltssumme je Saison, klein je Spieltag. Fremde Teams: Stufe.",wert:function(T){return fremd(T)&&!teamExakt(T)?Math.floor(T.gehalt/20)*20+10:T.gehalt},html:function(T){if(fremd(T)&&!teamExakt(T)){var lo=Math.floor(T.gehalt/20)*20;return '<span class="nb t">'+lo+'–'+(lo+20)+'</span>'}return '<span class="gh"><b class="t">'+de(T.gehalt)+'</b><small>'+de(T.gehalt/ST_SAISON,2)+' je ST</small></span>'}},
    {k:"mw",t:"Marktwert Kader",w:"5.6rem",r:1,tip:"Summe der Marktwerte. Marktwert ist immer exakt sichtbar.",wert:function(T){return T.mwsum},html:function(T){return '<b class="t">'+de(T.mwsum,0)+'</b>'}},
    {k:"vor",t:"Vorstand",w:"4.4rem",tip:"Vertrauen des Vorstands. Fremde Teams: Stufe.",wert:function(T){return fremd(T)&&!NEBEL_AUS?(T.board>=6.5?3:T.board>=4?2:1):T.board},html:function(T){return fremd(T)&&!NEBEL_AUS?'<span class="tag '+(T.board>=6.5?"g":T.board>=4?"":"w")+'">'+vertrauenT(T)+'</span>':'<b class="t">'+de(T.board)+'</b>'}},
    {k:"bez",t:"Beziehung",w:"6.6rem",tip:"Beziehung zu deinem Team (Beispielwerte)",wert:function(T){return T===ICH?99:bez(ICH,T)},html:function(T){return T===ICH?'<span class="tag go">dein Team</span>':bezTag(bez(ICH,T))}});
