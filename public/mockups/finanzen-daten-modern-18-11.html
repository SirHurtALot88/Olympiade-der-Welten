<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzen – Datenfluss (Mockup 18.11.)</title>
<!--
  FINANZEN: WIE DIE DATEN IM HINTERGRUND LAUFEN (Fable, 18.11.). Mockup zum Konzept docs/design/finanzkonzept-v2-18-11.md.
  Gleiche Tokens, Schiene, Hero-Kopf und Tafeln wie finanzen-modern-17-11.html / einsatzliste-modern-17-11.html.
  Kein App-Code, kein PixelLab (0 Generationen), alles CSS/SVG.
  ECHT:    32 Teams (Namen, Wappen), je Team Budget, Finanz-/Ambitionswert, Sponsor-Anker, Start-/Endrang aus den Messlaeufen;
           Ruecklage, Gehaltsdeckel, Gehalt, Sockel, Rangbonus aus scripts/rechne-finanzkonzept-v2-18-11.mjs (Lauf C, Faktor 1,0);
           Liga-Bilanz = Mittel der Laeufe A/B/C. Alle Formeln und Startwerte wie im Konzept.
  ERFUNDEN: Ergebnisse je Spieltag (gesaet, Summe = Siege der Rechnung), Gegner, Heim/Auswaerts-Folge, Rangverlauf,
           Abloesen/Verkaeufe/Liga-Topf-Anteil der Folgesaison (Groessenordnung aus der Messung). Die Stimmung laeuft hier
           je Spieltag nach den Regeln aus Abschnitt 4; Saisonsummen weichen deshalb um wenige C von Abschnitt 2.5 ab.
  NEU 18.11. abends: Abschnitt 6 "Budgets" (Zwei-Budget-Modell, docs/design/finanzkonzept-v2-budgets-18-11.md), gleiche Formeln wie
  scripts/rechne-vorstands-budgets-18-11.mjs Teil 1. ?ansicht=budget &quote=s1|v (Saison 1 = 100 % | nach Startvertrauen) &vk=1 (Lockerungsschwelle erreicht)
  URL: ?ansicht=tag|ende|kauf|ki|liga|budget &team=G-G &f=0.82|1|1.24 &st=1..20 &sel=<posten> &preis=ki|0|1|2|3 &kauf=<C> &bau=0|1
-->
<style>
@font-face{font-family:"RaniraSeason";src:url("../fonts/ranira-bold-italic.otf") format("opentype");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url("../fonts/barlow-condensed-latin-500-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url("../fonts/barlow-condensed-latin-600-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url("../fonts/barlow-condensed-latin-700-normal.woff2") format("woff2");font-display:swap}
:root{
  --grund:#06080c; --flaeche-1:#0c1017; --flaeche-2:#121824; --flaeche-3:#1a2231;
  --linie:rgba(244,230,196,.13); --linie-2:rgba(244,230,196,.30);
  --creme:#f4e6c4; --gold:#f0c35a; --tinte:#eef2f8; --leise:#9aa7ba; --stumm:#66738a;
  --heim:#F2A03D; --gast:#45B0C9; --gut:#62d394; --warn:#ff6058; --acht:#f3b54a;
  --p1:#e0637a; --p2:#e89a4c; --p3:#c3cf5e; --p4:#4fc7b2; --p5:#62a0f4; --p6:#ac8af2;
  --haus:"RaniraSeason",Georgia,"Times New Roman",serif;
  --zahl:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --r:.625rem; --r-s:.375rem;
}
/* Eine Groesse fuer alles: 16 px bei 1920 breit, 21,3 px bei 2560, 14,25 px bei 1710. */
html{font-size:clamp(12.5px,.8333vw,26px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020305;color:var(--tinte);font-family:var(--zahl);-webkit-font-smoothing:antialiased;overflow:hidden}
body{font-size:1rem}
button,a,select{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.t{font-variant-numeric:tabular-nums}
.gk{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
.plus{color:var(--gut)} .minus{color:var(--warn)} .null{color:var(--stumm)}
img{display:block}

.app{display:grid;grid-template-columns:4rem minmax(0,1fr);height:100vh;background:var(--grund)}
.rail{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.625rem 0;background:#080b11;border-right:1px solid var(--linie)}
.rail .logo{width:2.5rem;height:2.5rem;border-radius:.56rem;overflow:hidden;border:1px solid var(--linie-2);margin-bottom:.625rem}
.rail .logo img{width:100%;height:100%;object-fit:cover}
.rail a{position:relative;width:2.75rem;height:2.75rem;border-radius:.56rem;display:grid;place-items:center;font-size:1.25rem;color:var(--stumm)}
.rail a:hover{background:var(--flaeche-2);color:var(--tinte)}
.rail a.an{background:linear-gradient(180deg,rgba(240,195,90,.2),rgba(240,195,90,.06));color:var(--gold)}
.rail a.an::before{content:"";position:absolute;left:-.625rem;top:.56rem;bottom:.56rem;width:3px;border-radius:2px;background:var(--gold)}
.rail .luecke{flex:1}
main{display:flex;flex-direction:column;min-width:0;min-height:0}

/* ---------- Hero-Kopf ---------- */
.hero{position:relative;flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch;gap:1rem;padding:.8rem 1.25rem 0;border-bottom:1px solid var(--linie);overflow:hidden;isolation:isolate}
.hero .kul{position:absolute;inset:-2rem;z-index:-2;background:url("../szenen/basketball/parkett.jpg") center 40%/cover;filter:blur(14px) saturate(1.15);opacity:.5}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,8,12,.94) 0%,rgba(6,8,12,.72) 38%,rgba(6,8,12,.62) 62%,rgba(6,8,12,.93) 100%),linear-gradient(180deg,transparent 40%,var(--grund) 100%)}
.hk{display:flex;align-items:center;gap:.875rem;padding-bottom:.8rem}
.hk .crest{width:3.6rem;height:3.6rem;border-radius:.625rem;overflow:hidden;border:2px solid var(--heim);box-shadow:0 6px 18px rgba(0,0,0,.5);flex:none}
.hk .crest img{width:100%;height:100%;object-fit:cover}
.hk h1{margin:0;font:400 1.7rem/1 var(--haus);color:#fff;white-space:nowrap}
.hk .sub{margin-top:.3rem;font-size:.94rem;color:var(--leise);font-weight:500;white-space:nowrap}
.hk .sub b{color:var(--creme);font-weight:600}
.tabs{display:flex;align-items:flex-end;gap:.5rem;min-width:0}
.dtab{position:relative;flex:1 1 0;min-width:0;max-width:19rem;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.55rem;padding:.6rem 1rem .7rem .95rem;
  background:rgba(18,24,36,.72);border:1px solid var(--linie);border-bottom:0;clip-path:polygon(.875rem 0,100% 0,calc(100% - .875rem) 100%,0 100%);color:var(--leise);transition:background .15s}
.dtab:hover{background:rgba(26,34,49,.9)}
.dtab.an{background:linear-gradient(180deg,rgba(240,195,90,.2),rgba(18,24,36,.92) 70%);color:var(--tinte)}
.dtab.an::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gold)}
.dtab .nr{width:2.1rem;height:2.1rem;border-radius:.5rem;display:grid;place-items:center;font-size:1.25rem;font-weight:700;background:rgba(0,0,0,.35);border:1px solid var(--linie);color:var(--creme)}
.dtab.an .nr{color:var(--gold);border-color:rgba(240,195,90,.5)}
.dtab em{display:block;font-style:normal;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtab b{display:block;font:400 1.18rem/1.1 var(--haus);color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{display:flex;align-items:center;gap:1rem;padding-bottom:.8rem}
/* sechs Reiter seit dem Abschnitt Budgets: etwas enger */
.tabs{gap:.3rem} .dtab{padding:.6rem .5rem .7rem .5rem;gap:.4rem} .dtab .nr{width:1.75rem;height:1.75rem;font-size:1.05rem} .dtab b{font-size:1.05rem}
.wahl{display:flex;flex-direction:column;gap:.2rem}
.wahl select{height:2.25rem;padding:0 .6rem;border-radius:.44rem;border:1px solid var(--linie-2);background:var(--flaeche-2);font-weight:600;font-size:1rem;width:13.5rem}
.wahl select option{background:#121824;color:#eef2f8}
.seg{display:inline-flex;border:1px solid var(--linie-2);border-radius:.44rem;overflow:hidden;height:2.25rem}
.seg button{padding:0 .7rem;font-weight:600;font-size:1rem;color:var(--leise);border-right:1px solid var(--linie);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--flaeche-3);color:var(--tinte)}
.seg button[aria-pressed=true]{background:var(--gold);color:#17120a}
.seg.klein{height:1.9rem} .seg.klein button{font-size:.9rem;padding:0 .55rem}

/* ---------- Arbeitsflaeche ---------- */
.work{flex:1;min-height:0;display:grid;gap:.75rem;padding:.75rem .875rem}
.pan{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);overflow:hidden}
.pk{flex:none;display:flex;align-items:center;gap:.6rem;padding:.5rem .75rem;border-bottom:1px solid var(--linie);min-height:2.8rem}
.pk h2{margin:0;font:400 1.2rem/1 var(--haus);color:var(--creme);white-space:nowrap}
.pk .sp{flex:1}
.pk .hin{font-size:.86rem;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{flex:1;min-height:0;padding:.7rem .75rem;display:flex;flex-direction:column;gap:.6rem}
.marke{display:inline-flex;align-items:center;gap:.3rem;height:1.4rem;padding:0 .5rem;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.marke.h{background:rgba(242,160,61,.18);color:var(--heim);border:1px solid rgba(242,160,61,.5)}
.marke.a{background:rgba(69,176,201,.16);color:var(--gast);border:1px solid rgba(69,176,201,.5)}
.marke.k{background:rgba(244,230,196,.08);color:var(--creme);border:1px solid var(--linie-2)}
.marke.w{background:rgba(255,96,88,.14);color:var(--warn);border:1px solid rgba(255,96,88,.5)}
.marke.g{background:rgba(98,211,148,.14);color:var(--gut);border:1px solid rgba(98,211,148,.45)}

/* Buchungsliste */
.bl{flex:1;min-height:0;display:flex;flex-direction:column}
.bz{flex:1 1 0;min-height:1.7rem;display:grid;grid-template-columns:.3rem minmax(0,1fr) auto 5.2rem;align-items:center;gap:.6rem;padding:0 .75rem 0 0;border-bottom:1px solid rgba(244,230,196,.06);width:100%}
.bz:hover{background:var(--flaeche-2)}
.bz.an{background:linear-gradient(90deg,rgba(240,195,90,.16),rgba(240,195,90,.03))}
.bz .fb{align-self:stretch;background:var(--pc,var(--stumm))}
.bz b{font-weight:600;font-size:1.18rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bz small{font-size:.9rem;color:var(--stumm);white-space:nowrap}
.bz strong{font-size:1.32rem;font-weight:700;text-align:right}
.bz.aus b,.bz.aus strong{color:var(--stumm)}
.bsum{flex:none;display:grid;grid-template-columns:1fr auto;align-items:center;padding:.5rem .75rem;border-top:1px solid var(--linie-2);background:var(--flaeche-2)}
.bsum span{font-size:.86rem;color:var(--leise)} .bsum strong{font-size:1.5rem;font-weight:700}

/* Datenfluss */
.fluss{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.4rem}
.st{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;gap:.5rem;padding:.75rem .85rem;border-radius:var(--r-s);background:var(--flaeche-2);border:1px solid var(--linie)}
.st:not(:last-child)::after{content:"";position:absolute;right:-1.05rem;top:50%;width:.7rem;height:.7rem;border-top:2px solid var(--gold);border-right:2px solid var(--gold);transform:translateY(-50%) rotate(45deg)}
.st .nr{display:flex;align-items:center;gap:.45rem}
.st .nr i{font-style:normal;width:1.4rem;height:1.4rem;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#17120a;font-weight:700;font-size:.9rem}
.st h3{margin:0;font:400 1.3rem/1.1 var(--haus);color:var(--creme)}
.st p{margin:0;font-size:1.12rem;line-height:1.28;color:var(--tinte);font-weight:500}
.st p.l{color:var(--leise);font-size:.95rem}
.st code{display:block;font:500 1.04rem/1.4 var(--zahl);color:var(--creme);background:rgba(0,0,0,.35);border:1px solid var(--linie);border-radius:.3rem;padding:.35rem .45rem;white-space:pre-wrap}
.st .erg{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;padding-top:.35rem;border-top:1px dashed var(--linie)}
.st .erg strong{font-size:2.1rem;font-weight:700;line-height:1}
.st .erg span{font-size:.92rem;color:var(--stumm)}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{height:1.5rem;padding:0 .55rem;border-radius:999px;border:1px solid var(--linie-2);font-size:.9rem;font-weight:600;color:var(--creme);display:inline-flex;align-items:center;white-space:nowrap}
.chip.g{border-color:rgba(240,195,90,.6);color:var(--gold)}
.unten{flex:none;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:.75rem}
.kachel{padding:.55rem .7rem;border-radius:var(--r-s);background:var(--flaeche-2);border:1px solid var(--linie);min-width:0}
.kachel h4{margin:0 0 .35rem;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
.ha{display:grid;grid-template-columns:4.6rem minmax(0,1fr) 3.6rem;align-items:center;gap:.5rem;font-size:.95rem;font-weight:600;height:1.5rem}
.ha .bk{position:relative;height:.7rem;background:rgba(0,0,0,.4);border-radius:.2rem}
.ha .bk i{position:absolute;top:0;bottom:0;border-radius:.2rem}
.ha .bk u{position:absolute;top:-.2rem;bottom:-.2rem;width:1px;background:var(--linie-2)}
.sr{display:grid;grid-template-columns:minmax(0,1fr) 3.2rem;font-size:.95rem;font-weight:500;line-height:1.35}
.sr span:last-child{text-align:right;font-weight:700}

/* Kassenkurve */
.kurve{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 23rem;gap:.75rem;padding:.6rem .75rem}
.kv{min-width:0;min-height:0;display:flex;flex-direction:column}
.kvs{flex:1;min-height:0;position:relative} .kvs svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.kv input[type=range]{width:calc((100% - 4.2rem) * 19 / 21 + 1rem);margin:.2rem 0 0 calc(2.6rem + (100% - 4.2rem) / 21 - .5rem);accent-color:var(--gold);height:1.1rem}
.kpis{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:.5rem;min-height:0}
.kpi{display:flex;flex-direction:column;justify-content:center;padding:.4rem .65rem;border-radius:var(--r-s);background:var(--flaeche-2);border:1px solid var(--linie);min-height:0}
.kpi:hover{border-color:var(--gold)} .kpi.an{border-color:var(--gold);background:linear-gradient(180deg,rgba(240,195,90,.14),var(--flaeche-2))}
.kpi strong{font-size:1.9rem;line-height:1;font-weight:700}
.kpi small{font-size:.8rem;color:var(--stumm);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Wasserfall / Tabellen */
.wf{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:.3rem}
.wz{display:grid;grid-template-columns:13rem minmax(0,1fr) 5.4rem;align-items:center;gap:.75rem}
.wz b{font-size:1.08rem;font-weight:600} .wz small{display:block;font-size:.84rem;color:var(--stumm);font-weight:500;line-height:1.2}
.wz .bk{position:relative;height:1.7rem;background:rgba(0,0,0,.35);border-radius:.25rem}
.wz .bk i{position:absolute;top:0;bottom:0;border-radius:.25rem}
.wz .bk u{position:absolute;top:-.3rem;bottom:-.3rem;width:1px;background:var(--linie-2)}
.wz strong{font-size:1.45rem;font-weight:700;text-align:right}
.wz.sum{padding-top:.4rem;border-top:1px solid var(--linie-2)}
table.tb{width:100%;border-collapse:collapse;font-size:1.02rem}
table.tb th{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);font-weight:600;text-align:right;padding:.3rem .5rem;border-bottom:1px solid var(--linie-2);white-space:nowrap}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb td{padding:.24rem .5rem;border-bottom:1px solid rgba(244,230,196,.06);text-align:right;font-weight:600;white-space:nowrap}
table.tb td small{color:var(--stumm);font-weight:500;font-size:.84rem;margin-left:.35rem}
table.tb tr.sum td{border-top:1px solid var(--linie-2);font-size:1.15rem;font-weight:700;background:var(--flaeche-2)}
table.tb td.akt,table.tb th.akt{background:rgba(240,195,90,.1)}
table.tb.gross{font-size:1.15rem} table.tb.gross td{padding:.42rem .6rem} table.tb.gross tr.sum td{font-size:1.3rem}
table.tb tr.gr td{color:var(--leise);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;padding-top:.5rem}
.fbp{display:inline-block;width:.6rem;height:.6rem;border-radius:2px;background:var(--pc);margin-right:.45rem}

/* Schrittkette Kauf */
.kette{flex:1;min-height:0;display:flex;flex-direction:column}
.kz{flex:1 1 0;min-height:2rem;max-height:6rem;display:grid;grid-template-columns:1.7rem minmax(0,1fr) 5rem 6rem;align-items:center;gap:.7rem;border-bottom:1px solid rgba(244,230,196,.06)}
.kz i{font-style:normal;width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;background:var(--flaeche-3);border:1px solid var(--linie-2);font-weight:700;font-size:.86rem;color:var(--creme)}
.kz b{font-size:1.25rem;font-weight:600} .kz small{display:block;font-size:.95rem;color:var(--stumm);font-weight:500;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kz strong{text-align:right;font-size:1.35rem;font-weight:700}
.kz em{text-align:right;font-style:normal;font-size:1.55rem;font-weight:700;color:var(--creme)}
.kz.ltopf{background:rgba(240,195,90,.07)} .kz.ltopf b{color:var(--gold)} .kz.ltopf i{background:var(--gold);color:#17120a;border-color:var(--gold)}
.kz.sturz{background:var(--flaeche-2);border-top:1px solid var(--linie-2)}
.regler{display:grid;grid-template-columns:auto minmax(0,1fr) 4.5rem;align-items:center;gap:.7rem;font-weight:600}
.regler input{accent-color:var(--gold);width:100%}
.urteil{padding:.75rem .85rem;border-radius:var(--r-s);border:1px solid var(--linie-2);background:var(--flaeche-2)}
.urteil.ok{border-color:rgba(98,211,148,.55);background:linear-gradient(180deg,rgba(98,211,148,.12),var(--flaeche-2))}
.urteil.kr{border-color:rgba(243,181,74,.6);background:linear-gradient(180deg,rgba(243,181,74,.13),var(--flaeche-2))}
.urteil.zw{border-color:rgba(255,96,88,.6);background:linear-gradient(180deg,rgba(255,96,88,.13),var(--flaeche-2))}
.urteil h3{margin:0 0 .3rem;font:400 1.5rem/1.1 var(--haus);color:#fff}
.urteil p{margin:0;font-size:1rem;line-height:1.3;color:var(--tinte);font-weight:500}
.zr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;font-size:1.08rem;font-weight:500;padding:.3rem 0;border-bottom:1px solid rgba(244,230,196,.06)}
.zr span:last-child{font-weight:700}
.zr small{color:var(--stumm);font-size:.84rem;margin-left:.3rem}

/* KI */
.tg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:.3rem}
.tk{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.4rem;padding:.15rem .35rem;border-radius:.35rem;border:1px solid var(--linie);background:var(--flaeche-2);min-height:0;border-left:3px solid var(--pc)}
.tk:hover{border-color:var(--gold)} .tk.an{background:rgba(240,195,90,.16);border-color:var(--gold)}
.tk img{height:1.7rem;width:1.7rem;border-radius:.25rem;object-fit:cover}
.tk b{font-size:1rem;font-weight:700;line-height:1.1} .tk small{display:block;font-size:.8rem;color:var(--stumm);line-height:1.1;white-space:nowrap}
.kk{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:.6rem}
.ks{min-height:0;display:flex;flex-direction:column;gap:.5rem;padding:.75rem .85rem;border-radius:var(--r-s);background:var(--flaeche-2);border:1px solid var(--linie)}

      '<button class="kpi'+(sel==="tic"?" an":"")+'" data-sel="tic"><span class="gk">Auslastung</span><strong class="t">'+(b.heim?pz(b.ausl):"—")+'</strong><small>'+(b.heim?"Preis "+PREIS[b.p][0]+" · Nachfrage "+pz(b.nachfrage):"Auswärtsspiel")+'</small></button>'+

   '<div class="wz"><span><b>Vorstandsziele</b><small>Prämie oder Strafe, 3 % des Gehalts je Ziel</small></span>'+bar(e.k20+e.rb,e.kEnde,e.vor<0?"--warn":"--gut")+'<strong class="t '+vz(e.vor)+'">'+Cv(e.vor)+'</strong></div>'+
   '<div class="wz sum"><span><b>Kasse nach der Abrechnung</b><small>geht in den Saisonwechsel</small></span>'+bar(0,e.kEnde,"--gold")+'<strong class="t '+(e.kEnde<0?"minus":"")+'">'+C(e.kEnde)+'</strong></div>';
  var fz=[.82,1,1.24].map(function(f){var r=saison(T,f,Z.preis);return '<td class="t'+(f===Z.f?" akt":"")+'">'+C(r.ende.rb)+'</td><td class="t '+(f===Z.f?"akt ":"")+vz(r.guv)+'">'+Cv(r.guv)+'</td>'}).join("");
  var ein=s.soc+s.tic+s.mer+s.pra+e.rb+Math.max(0,e.vor);
  function zeile(k,lab,far,takt,v){return '<tr><td><span class="fbp" style="--pc:var('+far+')"></span>'+lab+'<small>'+takt+'</small></td><td class="t '+vz(v)+'">'+Cv(v)+'</td><td class="t">'+(v>0?Math.round(v/ein*100)+" %":"")+'</td></tr>'}
  return '<div class="pan"><div class="pk"><h2>Saisonende-Abrechnung</h2><span class="hin">ein Buchungslauf nach Spieltag 20</span></div><div class="pb"><div class="wf">'+wf+'</div>'+
     '<div class="kachel"><h4>Was der Saison-Faktor ändert (nur der Rangbonus hängt daran)</h4><table class="tb"><tr><th></th><th colspan="2"'+(Z.f===.82?' class="akt"':'')+'>Faktor 0,82</th><th colspan="2"'+(Z.f===1?' class="akt"':'')+'>Faktor 1,00</th><th colspan="2"'+(Z.f===1.24?' class="akt"':'')+'>Faktor 1,24</th></tr><tr><td>Rangbonus · GuV der Saison</td>'+fz+'</tr></table></div></div></div>'+
   '<div class="pan"><div class="pk"><h2>GuV der Saison</h2><span class="hin">Summe aller Buchungen, eine Zahl überall</span></div><div class="pb"><table class="tb"><tr><th>Posten</th><th>Saison</th><th>Anteil</th></tr>'+
     '<tr class="gr"><td colspan="3">Einnahmen</td></tr>'+zeile("soc","Sponsor-Sockel","--gold","20 Raten",s.soc)+zeile("rb","Sponsor-Rangbonus","--gold","Saisonende",e.rb)+zeile("tic","Tickets","--p5","10 Heimspiele",s.tic)+zeile("mer","Merch","--p6","20 Spieltage",s.mer)+zeile("pra","Siegprämien","--p3","je Duell-Sieg",s.pra)+zeile("vor","Vorstandsziele","--creme","Saisonende",e.vor)+

     '<div class="pan" style="flex:1;border-radius:var(--r-s)"><div class="pk" style="min-height:2.3rem"><span class="gk">Kassenverlauf mit Saisonende</span><span class="sp"></span>'+legende()+'</div><div class="kurve" style="grid-template-columns:1fr"><div class="kv">'+kurve(T,R,true)+'</div></div></div></div></div>';

function ansKauf(T,R){
  var e=R.ende,P=plan(T),abl=Math.round(T.budget*.17*10)/10,verk=Math.round(T.budget*.09*10)/10;
  var dV=kl((erwRang(T)-T.endRang)*.25,-2,2)+(e.kEnde>=0?.25:-.5)+(R.guv<-.1*T.gehalt&&T.endRang>erwRang(T)?-.5:0),ver=kl(T.vertrauen+dV,0,10);
  var topf=Math.round(14*(.5+.5*ver/5.5)*10)/10,vor=e.kEnde+abl+verk+topf,rueck=T.start,frei=Math.max(0,vor-rueck);
  var kiKauf=Math.max(0,Math.floor(frei-(Z.bau?10:0))),maxK=Math.round(vor+60),kauf=Z.kauf===null?kiKauf:kl(Z.kauf,0,maxK),bau=Z.bau?10:0;
  var nach=vor-kauf-bau,kredit=nach<0?-nach+.1*T.gehalt:0,ann=kredit*.12/(1-Math.pow(1.12,-2)),rate=ann/20,dienst=ann/P.ein,ueber=dienst>.2;
  var lauf=e.kEnde;
  function z(nr,lab,sub,betrag,cls){lauf+=betrag;return '<div class="kz '+(cls||"")+'"><i>'+nr+'</i><span><b>'+lab+'</b><small>'+sub+'</small></span><strong class="t '+vz(betrag)+'">'+(betrag===0?"":Cv(betrag))+'</strong><em class="t'+(lauf<0?" minus":"")+'">'+C(lauf)+'</em></div>'}
  var kette='<div class="kz"><i>0</i><span><b>Kasse nach der Saisonabrechnung</b><small>aus Abschnitt 2 · Faktor '+n(Z.f,2)+'</small></span><strong></strong><em class="t'+(e.kEnde<0?" minus":"")+'">'+C(e.kEnde)+'</em></div>'+
    z(1,"Ablöse auslaufender Verträge","Verkaufspreis an den Klub · „ein Vertragsende ist ein Verkauf“",abl)+
    z(2,"Verkäufe","Nettoerlös nach Abschlag · der Abschlag geht in den Liga-Topf",verk)+
    z(3,"Liga-Topf: Saisonstart-Budget","50 % gleich, 50 % nach Vorstandsvertrauen ("+n(ver,1)+" von 10)",topf,"ltopf")+
    z(4,"Sponsorwahl","Vertrag vor dem Kauf · bestimmt Planeinnahmen und Gehaltsdeckel",0)+
    z(5,"Spielerkäufe","Regler rechts · KI-Regel: freie Kasse über der Rücklage",-kauf)+
    z(6,"Gebäude",Z.bau?"Fan Shop Stufe 1 · nur aus freier Kasse":"kein Bau in dieser Kaufphase",-bau)+
    '<div class="kz sturz"><i>7</i><span><b>Kassensturz</b><small>Schluss des Kauffensters · Apron-Linien frieren ein</small></span><strong></strong><em class="t'+(nach<0?" minus":"")+'">'+C(nach)+'</em></div>';
  var urteil=nach>=0?
    '<div class="urteil ok"><h3>Kein Kredit nötig</h3><p>Kasse nach den Käufen '+C(nach)+'. '+(nach>=rueck-.05?"Die Rücklage von "+C(rueck)+" bleibt stehen.":"Die Rücklage von "+C(rueck)+" ist um "+C(rueck-nach)+" angegriffen: der Vorstand wertet das am Saisonende.")+'</p></div>':
    '<div class="urteil '+(ueber?"zw":"kr")+'"><h3>'+(ueber?"Erst verkaufen, dann Kredit":"Pflichtkredit "+C(kredit))+'</h3><p>'+(ueber?"Der Schuldendienst läge bei "+pz(dienst)+" der Planeinnahmen (Grenze 20 %). Der Vorstand verkauft Spieler, bis der Kredit im Rahmen ist; der Mensch bekommt denselben Schritt als Dialog.":"Fehlbetrag "+C(-nach)+" + 10 % des Jahresgehalts ("+C(.1*T.gehalt)+") als Puffer. Die Rate läuft ab Spieltag 1 der neuen Saison.")+'</p></div>';
  var det=nach<0?
    '<div class="zr"><span>Fehlbetrag am Kassensturz</span><span class="t minus">'+C(nach)+'</span></div><div class="zr"><span>Puffer 10 % des Jahresgehalts</span><span class="t">'+C(.1*T.gehalt)+'</span></div><div class="zr"><span>Kredit<small>2 Saisons · 12 % je Saison</small></span><span class="t">'+C(kredit)+'</span></div><div class="zr"><span>Rate je Spieltag<small>40 Raten, Zins → Liga-Topf</small></span><span class="t minus">'+C(-rate,2)+'</span></div><div class="zr"><span>Schuldendienst ÷ Planeinnahmen<small>'+C(ann)+' ÷ '+C(P.ein)+' · Grenze 20 %</small></span><span class="t '+(ueber?"minus":"plus")+'">'+pz(dienst)+'</span></div><div class="zr"><span>Kasse nach Auszahlung</span><span class="t plus">'+C(nach+kredit)+'</span></div>':
    '<div class="zr"><span>Kasse am Kassensturz</span><span class="t plus">'+C(nach)+'</span></div><div class="zr"><span>Neue Rücklage (Finanzwert '+n(T.fin)+')</span><span class="t">'+C(rueck)+'</span></div><div class="zr"><span>Freie Kasse vor dem Kauf</span><span class="t">'+C(frei)+'</span></div><div class="zr"><span>Davon gekauft und gebaut</span><span class="t">'+C(kauf+bau)+'</span></div><div class="zr"><span>Planeinnahmen der neuen Saison</span><span class="t">'+C(P.ein)+'</span></div><div class="zr"><span>Offene Kredite</span><span class="t">keine</span></div>';
  return '<div class="pan"><div class="pk"><h2>Saisonwechsel: woher das Kaufbudget kommt</h2><span class="hin">Kapital, steht neben der GuV</span><span class="sp"></span><span class="gk">Buchung</span><span class="gk" style="width:6rem;text-align:right">Kasse</span></div><div class="pb" style="padding-top:.2rem"><div class="kette">'+kette+'</div>'+
     '<div class="hinw">Ablöse und Verkäufe sind in diesem Mockup Beispielwerte (17 % und 9 % des Budgets, gemessene Spanne der Liga: Ø 39 bis 56 C und 21 bis 31 C je Team).</div></div></div>'+
   '<div class="pan"><div class="pk"><h2>Kreditprüfung am Kassensturz</h2><span class="hin">erst nach den Käufen</span></div><div class="pb">'+
     '<div class="regler"><span class="gk">Spielerkäufe</span><input type="range" id="kaufregler" min="0" max="'+maxK+'" step="1" value="'+Math.round(kauf)+'" aria-label="Kaufsumme"><strong class="t" style="text-align:right;font-size:1.3rem">'+C(kauf,0)+'</strong></div>'+
     '<div style="display:flex;gap:.6rem;align-items:center"><div class="seg klein"><button data-kauf="ki" aria-pressed="'+(Z.kauf===null)+'">KI-Regel ('+kiKauf+' C)</button><button data-kauf="'+Math.round(vor+25)+'" aria-pressed="false">Überziehen</button><button data-kauf="'+maxK+'" aria-pressed="false">Stark überziehen</button></div><div class="seg klein"><button data-bau="0" aria-pressed="'+(!Z.bau)+'">kein Gebäude</button><button data-bau="1" aria-pressed="'+Z.bau+'">Fan Shop 10 C</button></div></div>'+
     urteil+'<div>'+det+'</div><span class="sp" style="flex:1"></span>'+
     '<div class="drei"><div class="'+(nach>=0?"an":"")+'"><b>Kasse ≥ 0</b><span>Kein Kredit. Eine unterschrittene Rücklage wertet der Vorstand.</span></div><div class="'+(nach<0&&!ueber?"an":"")+'"><b>Kasse unter 0</b><span>Pflichtkredit: Fehlbetrag + 10 % Gehalt, 2 Saisons, 12 %.</span></div><div class="'+(nach<0&&ueber?"an":"")+'"><b>Schuldendienst über 20 %</b><span>Erst Verkauf durch den Vorstand, dann Kredit.</span></div></div>'+
     '<div class="kachel"><h4>Regel</h4><div class="hinw" style="color:var(--tinte);font-size:.95rem">In der Saison darf die Kasse ins Minus (zinsfrei bis zum erwarteten Rangbonus). Geprüft wird einmal: am Schluss des Kauffensters der Folgesaison. Wer dann unter 0 steht, bekommt den Pflichtkredit. Kein Geld wird erschummelt, nichts auf 0 gesetzt.</div></div></div></div>';
}

function ansKi(T,R){

     '<div style="display:flex;gap:.4rem;flex-wrap:wrap"><span class="chip" style="border-color:var(--p5);color:var(--p5)">vorsichtig 8</span><span class="chip">normal 15</span><span class="chip" style="border-color:var(--p1);color:var(--p1)">aggressiv 9</span></div></div></div>'+
   '<div class="pan"><div class="pk"><h2>Warum '+esc(T.name)+' so kauft</h2><span class="hin">Reihenfolge der Kaufphase</span><span class="sp"></span><span class="marke '+(T.typ==="aggressiv"?"w":T.typ==="vorsichtig"?"a":"k")+'">'+T.typ+'</span></div><div class="pb"><div class="kk">'+

     '<div class="ks"><h3><i>2</i>Rücklage</h3><code>q = 5 % + 20 % × ('+n(T.fin)+' − 1) ÷ 9 = '+n(T.quote)+' %\nmax( '+n(T.quote)+' % × '+T.budget+' , 0,35 × Zielgehalt )\n= max( '+n(T.quote/100*T.budget)+' , '+n(rGeh)+' )</code><p>'+(T.gekappt?"Der Deckel aus Schritt 4 lässt zusätzlich Geld liegen.":"Heute bleiben nach dem Draft nur "+C(T.cashIst)+" ("+n(T.cashIst/T.budget*100)+" %).")+'</p><div class="erg"><span>bleibt als Cash · '+n(T.start/T.budget*100)+' % des Budgets</span><strong class="t">'+C(T.start)+'</strong></div></div>'+
     '<div class="ks"><h3><i>3</i>Sponsor → Planeinnahmen</h3><code>0,92 × Anker '+n(T.anker)+' × 0,73 ÷ 1,1 = '+n(P.sponsor)+'\n+ Tickets '+n(P.ticket)+' + Merch '+n(P.merch)+' + Prämien '+n(P.prae)+'\n− Fixkosten '+n(P.fix)+'</code><p>Der Sponsor ist vor dem Kauf unterschrieben. Der Planer bekommt ihn jetzt (heute rechnet er mit 0).</p><div class="erg"><span>tragbares Gehalt</span><strong class="t">'+C(T.tragbar)+'</strong></div></div>'+
     '<div class="ks"><h3><i>4</i>Gehaltsdeckel<button class="marke w" data-ans="budget" style="margin-left:auto">ersetzt → 6 Budgets</button></h3><code>k × tragbar + freie Kasse ÷ 3\n'+n(k,2)+' × '+n(T.tragbar)+' + '+n(Math.max(0,T.deckel-k*T.tragbar))+' = '+n(T.deckel)+' C</code>'+vb("heute",T.gehaltIst,"--stumm",T.deckel)+vb("neu",T.gehalt,T.gekappt?"--acht":"--gut",T.deckel)+'<div class="erg"><span>'+(T.gekappt?"am Deckel gekappt":"unter dem Deckel")+' · weiße Marke = Deckel</span><strong class="t">'+C(T.gehalt)+'</strong></div></div>'+

var BGRENZE={1:.25,.85:.2,.7:.15,.5:.1}, BANTEIL={vorsichtig:0,normal:.5,aggressiv:1}, BPUFFER={.85:.1,.7:.2,.5:.3};
function bQuote(v){return v>=6?1:v>=4?.85:v>=2.5?.7:.5}
function budgets(T){
  var q=Z.bq==="v"?bQuote(T.vertrauen):1,rl=T.quote/100*T.budget,g0=q*T.tragbar,pu=Math.max(0,.35*g0-rl),basis=Math.max(0,T.budget-rl-pu),t0=q*basis;
  var x=q<1?BPUFFER[q]*T.tragbar:0,schw=q<1?x/(1-q):0,vk=Z.bv&&q<1?schw:0,qn=vk?(q>=.85?1:q>=.7?.85:.7):q;
  var ohne=t0+q*vk,t=vk?Math.max(ohne,Math.min(qn*(basis+vk),ohne+vk,basis+vk-x)):ohne;
  var istT=T.budget-T.cashIst,rho=T.gehaltIst/istT,lim=BGRENZE[q]*BANTEIL[T.typ]*g0,gb=rho*t>g0,um;
  if(gb)um=Math.min((rho*t-g0)/(1+rho),lim,t);else um=-Math.min((g0-rho*t)/(1+rho),lim,.5*(rl+pu));
  var t2=t-um,g2=g0+um,aus=Math.min(istT,t2,g2/rho);
  return {q:q,qn:qn,rl:rl,pu:pu,basis:basis,t0:t0,g0:g0,x:x,schw:schw,vk:vk,t:t,mehr:t-ohne,gesp:basis-t0,rho:rho,lim:lim,grenze:BGRENZE[q]*g0,gb:gb,um:um,t2:t2,g2:g2,istT:istT,
          aus:aus,geh:rho*aus,kasse:T.budget+vk-aus,bindet:aus>=istT-1e-6?"nichts":t2<=g2/rho?"Transfer":"Gehalt"};
}

    '<p>Eine Quote für beide Töpfe. Das Geld bleibt auf dem Konto, nur das Ausgeben ist begrenzt.</p><div class="erg"><span>Freigabe des Vorstands</span><strong class="t'+(q<.6?" minus":"")+'">'+pzq+' %</strong></div></div>';

    '<p>'+(B.gb?"Mit dem ganzen Transfertopf kämen "+C(B.rho*B.t)+" Gehalt zusammen: <b>das Gehalt bindet</b>.":"Der Gehaltstopf trüge Käufe für "+C(B.g0/B.rho)+": <b>der Transfertopf bindet</b>.")+' '+(Math.abs(B.um)>.05?(B.um>0?"Schiebt "+C(B.um)+" vom Transfer ins Gehalt.":"Schiebt "+C(-B.um)+" vom Gehalt in den Transfer."):"Schiebt nichts um.")+'</p>'+
    '<div class="erg"><span>Transfer '+C(B.t2)+' · Gehalt</span><strong class="t">'+C(B.g2)+'</strong></div></div>';
  var fehlt=B.schw,nq=q>=.85?100:q>=.7?85:70;
  return '<div class="pan"><div class="pk"><h2>32 Teams</h2><span class="hin">Budget · V Vertrauen</span></div><div class="pb"><div class="tg">'+liste+'</div>'+
