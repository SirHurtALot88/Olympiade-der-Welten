<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arena-Vorstellung – Rework (Mockup 22.11.)</title>
<!--
  REWORK DES VORSTELLUNGS-SCREENS DER ARENA (Fable, 22.11.). Erklaerung: docs/design/arena-vorstellung-rework-22-11.md
  Kernidee: EINE ZEILE = EIN SLOT. Wer denselben Slot der Einsatzliste besetzt, steht auf allen Seiten auf derselben Hoehe.
  Duell: links eigenes Team, rechts Gegner, in der Mitte die Slot-Spalte. Vierergruppe: Zeilen = Slots, Spalten = Teams.
  ECHT: Teamnamen, Wappen, Spielernamen, Klassen, Rassen, Portraits, PixelLab-Figuren, Kulissen, Slot-Namen/-Texte/-Schluesselattribute
        (lib/lineups/matchday-slot-roles.ts), Punkteschema, Nebel-Stufen (10er / 5er / exakt), Form-Stufen, Moral-Stufen.
  ERFUNDEN: jede Zahl, wer in welchem Slot steht, Liga-Raenge, Scouting-Stufe je Spieler, Feldpositionen im Mini-Feldplan.
  Kein App-Code, keine externen Skripte, Schriften lokal, 0 PixelLab-Generationen.
  URL: ?v=hockey|fechten|battlefield|staffel   ?nebel=0 (Fog of War aus)   ?slot=<nr> (Zeile gewaehlt)   ?still=1 (ohne Mockup-Leiste)
-->
<style>
@font-face{font-family:"RaniraSeason";src:url("../fonts/ranira-bold-italic.otf") format("opentype");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url("../fonts/barlow-condensed-latin-500-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url("../fonts/barlow-condensed-latin-600-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url("../fonts/barlow-condensed-latin-700-normal.woff2") format("woff2");font-display:swap}
:root{
  --grund:#06080c; --flaeche-1:#0c1017; --flaeche-2:#121824; --flaeche-3:#1a2231;
  --linie:rgba(244,230,196,.13); --linie-2:rgba(244,230,196,.30);
  --creme:#f4e6c4; --gold:#f0c35a; --tinte:#eef2f8; --leise:#9aa7ba; --stumm:#66738a;
  --heim:#F2A03D; --gast:#45B0C9; --drei:#B58BE8; --vier:#EC7AA6; --gut:#62d394; --warn:#ff6058; --acht:#f3b54a;
  --k-red:#ea6a5c; --k-green:#5fcf86; --k-blue:#62a8f2; --k-yellow:#f0c35a;
  --haus:"RaniraSeason",Georgia,"Times New Roman",serif;
  --zahl:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --glas:rgba(8,11,17,.84);
}
/* VOLLE FLAECHE: Entwurfsmass 120 x 67,5 rem (= 1920 x 1080 bei 16 px); alles in rem, waechst bis 4K mit. */
html{font-size:clamp(11px,min(0.8333vw,1.4815vh),34px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020305;color:var(--tinte);font-family:var(--zahl);-webkit-font-smoothing:antialiased}
body{font-size:1rem;overflow:hidden}
button,a{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;border-radius:4px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.t{font-variant-numeric:tabular-nums}
.gk{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
img{display:block}
kbd{font:600 .7rem/1 var(--zahl);padding:.15rem .3rem;border:1px solid var(--linie-2);border-radius:.2rem;color:var(--leise)}
.sp{flex:1}

/* Mockup-Leiste */
.demo{height:2.25rem;display:flex;align-items:center;gap:.5rem;padding:0 .9rem;background:#0d1016;border-bottom:1px solid #222a38;font-size:.875rem;color:var(--leise);white-space:nowrap;overflow-x:auto}
.demo b{color:var(--creme);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.75rem;margin:0 .3rem 0 .6rem}
.demo b:first-child{margin-left:0}
.demo a{color:var(--leise);padding:.1rem .6rem;border:1px solid var(--linie);border-radius:1rem}
.demo a.an{color:#17120a;background:var(--gold);border-color:var(--gold);font-weight:700}
body.still .demo{display:none}

.buehne{--kopf:2.25rem;position:relative;height:calc(100vh - var(--kopf));background:var(--grund);overflow:hidden;
  display:grid;grid-template-rows:3.5rem auto minmax(0,1fr) 4.6rem;isolation:isolate}
body.still .buehne{--kopf:0rem}
.bild{position:absolute;inset:0;z-index:-2;background:var(--bild) center/cover;image-rendering:pixelated}
.bild::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,12,.86),rgba(6,8,12,.9) 35%,rgba(6,8,12,.95))}

/* REGIELEISTE (wie arena-spieltag-modern-18-11) */
.reg{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:1rem;padding:0 .9rem;background:rgba(6,8,12,.92);border-bottom:1px solid var(--linie)}
.reg .l,.reg .r{display:flex;align-items:center;gap:.6rem;min-width:0} .reg .r{justify-content:flex-end}
.hk2{display:inline-flex;align-items:center;gap:.5rem;height:2.4rem;padding:0 .8rem;background:var(--glas);border:1px solid var(--linie-2);border-radius:.5rem;font-size:.92rem;font-weight:600;white-space:nowrap}
.reg .ort{font-size:.95rem;color:var(--leise);white-space:nowrap} .reg .ort b{color:var(--creme);font-weight:600}
.weg{display:flex;align-items:center;gap:.3rem}
.weg a{display:flex;align-items:center;gap:.5rem;height:2.4rem;padding:0 1rem 0 .7rem;font-size:.95rem;color:var(--stumm);white-space:nowrap;border-bottom:2px solid transparent}
.weg a u{text-decoration:none;display:grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:50%;border:1px solid currentColor;font-size:.78rem;font-weight:700}
.weg a b{font:400 1.1rem/1 var(--haus)}
.weg a.ok{color:var(--gut)} .weg a.ok u{background:var(--gut);color:#06140c;border-color:var(--gut)}
.weg a.an{color:var(--gold);border-bottom-color:var(--gold)} .weg a.an b{color:#fff} .weg a.an u{background:var(--gold);color:#17120a;border-color:var(--gold)}
.weg span{width:1.6rem;height:1px;background:var(--linie-2)}
.ich{display:flex;align-items:center;gap:.5rem;height:2.4rem;padding:0 .8rem 0 .3rem;border:1px solid var(--heim);border-radius:.5rem;background:rgba(242,160,61,.12);white-space:nowrap}
.ich img{width:1.8rem;height:1.8rem;border-radius:.3rem;object-fit:cover}
.ich small{display:block;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--heim);font-weight:700;line-height:1}
.ich b{display:block;font:400 1.02rem/1.05 var(--haus);color:#fff}

/* KOPF: Disziplin, Spielart, Punkteschema */
.kopf{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:1.5rem;padding:.7rem 1.2rem .6rem}
.kopf .dz{display:flex;align-items:center;gap:.9rem;min-width:0}
.kopf .dz img{width:3.4rem;height:3.4rem;object-fit:contain;filter:drop-shadow(0 0 .5rem rgba(240,195,90,.35))}
.kopf h1{margin:0;font:400 2.7rem/1 var(--haus);color:#fff;letter-spacing:.01em}
.schema{display:flex;gap:.4rem}
.schema div{min-width:5.2rem;padding:.3rem .8rem;border:1px solid var(--linie);border-radius:.4rem;background:var(--glas);text-align:center}
.schema small{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);font-weight:600}
.schema b{font-size:1.35rem;font-weight:700}
.kopf .re{display:flex;justify-content:flex-end;align-items:center;gap:.5rem;flex-wrap:wrap}
.marke{display:inline-flex;align-items:center;gap:.4rem;height:1.9rem;padding:0 .7rem;border-radius:1rem;border:1px solid var(--linie-2);background:var(--glas);font-size:.88rem;color:var(--creme);white-space:nowrap}
.marke.gold{border-color:var(--gold);color:var(--gold);background:rgba(240,195,90,.1);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.marke.zu{color:var(--leise)}

/* TAFEL: eine Zeile = ein Slot */
.tafel{display:grid;grid-template-rows:auto minmax(0,1fr);gap:.5rem;padding:0 1.2rem;min-height:0}
.tafel.duell{--sp:minmax(0,1fr) 18rem minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-columns:19rem minmax(0,1fr) 19rem;gap:.6rem;padding-bottom:.6rem}
.tafel.pod{--sp:12.5rem repeat(4,minmax(0,1fr))}
.kz,.zeile{display:grid;grid-template-columns:var(--sp);gap:.5rem}
.zeilen{display:grid;grid-auto-rows:minmax(0,1fr);gap:.4rem;min-height:0;align-self:center;height:100%;max-height:calc(var(--k) * 15rem)}
.tafel.pod .zeilen{padding-bottom:.6rem}
.zeile{position:relative;min-height:0;border-radius:.55rem;cursor:pointer}
.zeile::before{content:"";position:absolute;inset:0;border-radius:.55rem;background:rgba(255,255,255,.028);border:1px solid transparent;pointer-events:none}
.zeile:hover::before{background:rgba(255,255,255,.055)}
.zeile.wahl{outline:2px solid var(--gold);outline-offset:1px}

/* Teamkopf */
.tk{--tf:var(--gast);display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem .8rem;align-items:center;padding:.55rem .8rem;border-radius:.55rem;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tf) 16%,rgba(8,11,17,.9)),rgba(8,11,17,.88));border:1px solid color-mix(in srgb,var(--tf) 55%,transparent);border-top:.22rem solid var(--tf);min-width:0}
.tk.eigen{border-color:var(--heim);box-shadow:0 0 0 1px var(--heim) inset}
.tk>img{width:3.6rem;height:3.6rem;border-radius:.45rem;object-fit:cover;grid-row:span 2}
.tk .nm{display:flex;align-items:baseline;gap:.5rem;min-width:0}
.tk h2{margin:0;font:400 1.55rem/1.05 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.du{padding:.08rem .45rem;border-radius:.25rem;background:var(--heim);color:#17120a;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.mg{padding:.05rem .45rem;border-radius:1rem;border:1px solid var(--linie-2);font-size:.74rem;color:var(--creme);white-space:nowrap}
.mg.ki{color:var(--stumm);border-color:var(--linie)}
.tk dl{display:flex;gap:1.1rem;margin:0;min-width:0}
.tk dl div{min-width:0} .tk dt{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);font-weight:600;white-space:nowrap}
.tk dd{margin:0;font-size:1.3rem;font-weight:700;line-height:1.1;white-space:nowrap} .tk dd small{font-size:.74rem;font-weight:500;color:var(--leise);margin-left:.25rem}
.tk .zus{grid-column:1/-1;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-top:.15rem}
.tafel.duell .tk.r{grid-template-columns:minmax(0,1fr) auto;text-align:right}
.tafel.duell .tk.r>img{grid-column:2;grid-row:1/span 2} .tafel.duell .tk.r .nm,.tafel.duell .tk.r dl,.tafel.duell .tk.r .zus{justify-content:flex-end;grid-column:1}
.tafel.duell .tk.r .nm{grid-row:1} .tafel.duell .tk.r dl{grid-row:2} .tafel.duell .tk.r .zus{grid-column:1/-1}
.tafel.pod .tk>img{width:2.9rem;height:2.9rem} .tafel.pod .tk h2{font-size:1.25rem} .tafel.pod .tk dl{gap:.8rem} .tafel.pod .tk dd{font-size:1.12rem}
.balken{display:inline-flex;gap:.15rem;vertical-align:.1em} .balken i{width:.85rem;height:.42rem;border-radius:.1rem;background:var(--tf)} .balken i.o{opacity:.22}
.chip{display:inline-flex;align-items:center;gap:.3rem;height:1.5rem;padding:0 .5rem;border-radius:.3rem;border:1px solid var(--linie);background:rgba(8,11,17,.6);font-size:.8rem;color:var(--creme);white-space:nowrap}
.chip.karte{border-color:var(--kf);color:var(--kf);font-weight:700}
.chip.zu{color:var(--stumm)} .chip.aus{border-color:rgba(255,96,88,.5);color:var(--warn)}
.mitte-kopf{display:grid;place-items:center;align-content:center;gap:.2rem;text-align:center}
.mitte-kopf b{font:400 2rem/1 var(--haus);color:var(--gold)}
.slot-kopf{display:flex;flex-direction:column;justify-content:flex-end;padding:.4rem .6rem}
.slot-kopf b{font:400 1.2rem/1.1 var(--haus);color:var(--creme)}

/* Slot-Spalte */
.slot{position:relative;display:grid;align-content:center;justify-items:center;gap:.25rem;padding:.3rem .5rem;text-align:center;min-width:0;
  background:rgba(8,11,17,.82);border:1px solid var(--linie-2);border-radius:.45rem}
.tafel.pod .slot{justify-items:start;text-align:left;padding:.4rem .7rem}
.slot .nr{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.slot b{font:400 1.3rem/1.02 var(--haus);color:#fff}
.attr{display:flex;gap:.25rem;flex-wrap:wrap;justify-content:inherit}
.tafel.duell .attr{justify-content:center}
.attr i{font-style:normal;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:.05rem .35rem;border-radius:.2rem;background:rgba(244,230,196,.1);color:var(--creme)}
.vgl{display:flex;align-items:center;gap:.3rem;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--stumm)}
.vgl.vorn{color:var(--heim)} .vgl.hinten{color:var(--gast)}
.feld{width:6.4rem;height:2.5rem;flex:none}
.unten{display:flex;align-items:center;justify-content:center;gap:.6rem}

/* Spielerzelle */
.spz{--kl:var(--stumm);--tf:var(--gast);position:relative;display:grid;align-items:center;gap:.6rem;min-width:0;min-height:0;padding:.3rem .7rem;
  background:linear-gradient(90deg,color-mix(in srgb,var(--tf) 9%,rgba(8,11,17,.82)),rgba(8,11,17,.82));border:1px solid var(--linie);border-radius:.45rem;overflow:hidden}
.spz.eigen{border-color:color-mix(in srgb,var(--heim) 60%,transparent)}
.spz::before{content:"";position:absolute;top:0;bottom:0;left:0;width:.28rem;background:var(--kl)}
.tafel.duell .spz.l{grid-template-columns:minmax(0,1fr) auto auto;text-align:right}
.tafel.duell .spz.l::before{left:0}
.tafel.duell .spz.r{grid-template-columns:auto auto minmax(0,1fr);background:linear-gradient(270deg,color-mix(in srgb,var(--tf) 9%,rgba(8,11,17,.82)),rgba(8,11,17,.82))}
.tafel.duell .spz.r::before{left:auto;right:0}
.tafel.duell .spz.r .info{order:3} .tafel.duell .spz.r .fg{order:2} .tafel.duell .spz.r .wert{order:1}
.tafel.pod .spz{grid-template-columns:auto minmax(0,1fr) auto;padding-left:.8rem}
.spz.leer{display:grid;place-items:center;grid-template-columns:1fr!important;border-style:dashed;color:var(--stumm);font-size:.95rem;background:rgba(8,11,17,.5)}
.spz.leer::before{display:none}
.info{min-width:0;display:grid;gap:.22rem}
.info .n{font:400 1.55rem/1.1 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .2em}
.tafel.pod .info .n,.tafel.duell .spz.r .info .n{padding-left:0}.tafel.duell .spz.l .info .n{padding-right:.2em}
.tafel.pod .info .n{font-size:1.2rem}
.kl{display:flex;align-items:center;gap:.35rem;font-size:.92rem;font-weight:600;color:var(--kl);white-space:nowrap}
.kl img{width:1.15rem;height:1.15rem;object-fit:contain}
.kl small{font-size:.8rem;font-weight:500;color:var(--stumm)}
.tafel.duell .spz.l .kl,.tafel.duell .spz.l .chips{justify-content:flex-end}
.chips{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center}
.cap{display:inline-grid;place-items:center;width:1.45rem;height:1.45rem;border-radius:50%;background:var(--gold);color:#17120a;font-weight:700;font-size:.82rem}
.form{display:inline-flex;align-items:center;gap:.2rem;font-size:.82rem;font-weight:600}
.moral{display:inline-flex;align-items:center;gap:.2rem;font-size:.86rem;font-weight:700} .moral svg{width:1.25rem;height:1.25rem}
.fg{position:relative;height:100%;aspect-ratio:1;max-height:10.5rem;min-height:3.2rem;display:grid;place-items:end center}
.tafel.pod .fg{max-height:5.4rem}
.fg::after{content:"";position:absolute;left:12%;right:12%;bottom:4%;height:16%;border-radius:50%;background:color-mix(in srgb,var(--tf) 45%,transparent);filter:blur(.25rem);z-index:0}
.fg img.f{position:relative;z-index:1;height:100%;width:100%;object-fit:contain;image-rendering:pixelated}
.fg img.p{position:relative;z-index:1;width:74%;height:74%;margin-bottom:10%;border-radius:50%;object-fit:cover;border:2px dashed var(--tf)}
.wert{display:grid;justify-items:center;min-width:4.6rem}
.wert small{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);font-weight:600;white-space:nowrap}
.wert b{font-size:2.8rem;font-weight:700;line-height:.95}
.wert b.sp2{font-size:1.75rem;color:var(--creme)} .wert u{text-decoration:none;font-size:.74rem;color:var(--stumm);white-space:nowrap}
.tafel.pod .wert{min-width:3.8rem} .tafel.pod .wert b{font-size:1.95rem} .tafel.pod .wert b.sp2{font-size:1.4rem}
.spz.eigen .wert b{color:var(--heim)}

/* Teamtafel am Rand (Duell): nutzt die Breite, die Zeilen bekommen die ganze Hoehe */
.tp{--tf:var(--gast);display:flex;flex-direction:column;gap:.7rem;padding:.9rem .9rem 1rem;min-height:0;overflow:hidden;border-radius:.55rem;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tf) 18%,rgba(8,11,17,.9)),rgba(8,11,17,.88) 45%);border:1px solid color-mix(in srgb,var(--tf) 55%,transparent);border-top:.25rem solid var(--tf)}
.tp.eigen{border-color:var(--heim);box-shadow:0 0 0 1px var(--heim) inset}
.tp .wp{display:flex;align-items:center;gap:.7rem} .tp .wp img{width:4.6rem;height:4.6rem;border-radius:.5rem;object-fit:cover;flex:none}
.tp h2{margin:.15rem 0 .2rem;font:400 1.6rem/1.05 var(--haus);color:#fff}
.tp dl{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .8rem;margin:0;padding:.7rem 0;border-top:1px solid var(--linie);border-bottom:1px solid var(--linie)}
.tp dt{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);font-weight:600;white-space:nowrap}
.tp dd{margin:0;font-size:1.7rem;font-weight:700;line-height:1.05} .tp dd small{display:block;font-size:.78rem;font-weight:500;color:var(--leise);line-height:1.2}
.tp dd .balken i{width:1.1rem;height:.5rem}
.fk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.7rem;align-items:center}
.fk .k{--kf:var(--stumm);width:3.6rem;height:4.9rem;border-radius:.4rem;display:grid;place-items:center;align-content:center;border:2px solid var(--kf);background:linear-gradient(160deg,color-mix(in srgb,var(--kf) 38%,#0c1017),#0c1017);color:#fff;font-size:1.7rem;font-weight:700;line-height:1}
.fk .k small{font-size:.62rem;letter-spacing:.12em;color:var(--kf);font-weight:700}
.fk .k.zu{background:repeating-linear-gradient(135deg,#161d29 0 .35rem,#0f141d .35rem .7rem);color:var(--stumm);font-size:1.3rem}
.fk p{margin:0;font-size:.9rem;line-height:1.25;color:var(--leise)} .fk p b{display:block;color:var(--creme);font-weight:600;font-size:1rem}
.tp .lst{display:grid;gap:.3rem} .tp .lst .chip{height:auto;min-height:1.6rem;white-space:normal;padding:.2rem .5rem;line-height:1.2}
.tp .fussn{margin-top:auto;font-size:.82rem;color:var(--stumm);line-height:1.3}

.tp h3{margin:.2rem 0 0;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);font-weight:600}
.bank{display:grid;gap:.3rem} .bank div{display:flex;align-items:center;gap:.5rem;font-size:.95rem;color:var(--creme)} .bank img{width:1.9rem;height:1.9rem;border-radius:50%;object-fit:cover}
.bank small{margin-left:auto;white-space:nowrap;font-size:.78rem;color:var(--stumm)} .bank .v{color:var(--warn)} .bank .v img{filter:grayscale(1);opacity:.6}
.sct{display:flex;height:.6rem;border-radius:.3rem;overflow:hidden;gap:2px} .sct i{display:block;background:var(--tf)} .sct i.b{opacity:.55} .sct i.u{opacity:.2}
.sctl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--leise)}

/* FUSS */
.fuss{display:flex;align-items:center;gap:1rem;padding:0 1.2rem;background:rgba(6,8,12,.92);border-top:1px solid var(--linie)}
.fuss .hin{font-size:1rem;color:var(--leise);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fuss .hin b{color:var(--creme);font-weight:600}
.leg{display:flex;gap:.8rem;font-size:.82rem;color:var(--leise);white-space:nowrap}
.leg span{display:inline-flex;align-items:center;gap:.3rem} .leg i{width:.6rem;height:.6rem;border-radius:.12rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font-weight:700;white-space:nowrap}
.btn.haupt{height:3.1rem;padding:0 1.8rem;font-size:1.12rem;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#17120a;clip-path:polygon(.6rem 0,100% 0,calc(100% - .6rem) 100%,0 100%)}
.btn.neben{height:3.1rem;padding:0 1.3rem;font-size:1rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--linie-2);background:var(--glas);color:var(--creme);clip-path:polygon(.6rem 0,100% 0,calc(100% - .6rem) 100%,0 100%)}
.btn:hover{filter:brightness(1.1)}
.toast{position:absolute;left:50%;bottom:5.6rem;transform:translateX(-50%);padding:.5rem 1rem;border-radius:.4rem;background:var(--gold);color:#17120a;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.an{opacity:1}

/* Schmale Fenster (Nebenprobe Phone): Tafel darf dort scrollen, Zeilen bleiben ausgerichtet */
@media (max-width:900px){
  html{font-size:13px} body{overflow:auto} .buehne{height:auto;min-height:100vh;grid-template-rows:auto auto auto auto}

}

    '<circle cx="'+(x*.62+2)+'" cy="'+(y*.48+1)+'" r="4.2" fill="#F2A03D"/><circle cx="'+(126-x*.62)+'" cy="'+(49-y*.48)+'" r="4.2" fill="#45B0C9"/></svg>'}

function duell(){var a=CODES[0],b=CODES[1],z="";
  for(var i=0;i<K;i++){var sb=D.teams[b][i],sp=spanne(eig(sb,i),stufe(sb)),st=stand(eig(D.teams[a][i],i),sp);
    var vgl=st==="vorn"?'<span class="vgl vorn">'+ico("l")+'vorn</span>':st==="hinten"?'<span class="vgl hinten">vorn'+ico("r")+'</span>':'<span class="vgl">'+ico("gleich")+'offen</span>';
    z+='<div class="zeile'+(Z.slot===i+1?" wahl":"")+'" data-slot="'+(i+1)+'" tabindex="0">'+zelle(a,i,"l")+
      '<div class="slot"><span class="nr">'+D.zeile+' '+(i+1)+'</span><b>'+SL[i][0]+'</b>'+attr(i)+'<div class="unten">'+feldplan(i)+vgl+'</div></div>'+zelle(b,i,"r")+'</div>'}
  return '<div class="tafel duell">'+teamtafel(a)+'<div class="zeilen" style="--k:'+K+'">'+z+'</div>'+teamtafel(b)+'</div>'}
function pod(){var z="";
  for(var i=0;i<K;i++){var e=eig(D.teams[ICH][i],i),vorn=0,ges=0;
    CODES.forEach(function(c){if(c===ICH)return;var s=D.teams[c][i];if(!s)return;ges++;if(stand(e,spanne(eig(s,i),stufe(s)))==="vorn")vorn++});
    z+='<div class="zeile'+(Z.slot===i+1?" wahl":"")+'" data-slot="'+(i+1)+'" tabindex="0"><div class="slot"><span class="nr">'+D.zeile+' '+(i+1)+'</span><b>'+SL[i][0]+'</b>'+attr(i)+
      '<span class="vgl'+(vorn?" vorn":"")+'">Du: vorn gegen '+vorn+' von '+ges+'</span></div>'+CODES.map(function(c){return zelle(c,i,"")}).join("")+'</div>'}
  return '<div class="tafel pod"><div class="kz"><div class="slot-kopf"><span class="gk">'+K+' Slots</span><b>Zeile = Slot<br>Spalte = Team</b></div>'+CODES.map(function(c){return teamkopf(c,"")}).join("")+'</div><div class="zeilen" style="--k:'+K+'">'+z+'</div></div>'}

function schema(){var s=D.art==="pod"?[["Platz 1",2],["Platz 2",1],["Platz 3",0],["Platz 4",0]]:[["Sieg",2],["Remis",1],["Niederlage",0]];
  return '<div class="schema">'+s.map(function(x){return '<div><small>'+x[0]+'</small><b class="t">'+x[1]+' Pkt</b></div>'}).join("")+'</div>'}
function reg(){return '<div class="reg"><div class="l"><a class="hk2">'+ico("haus")+'Büro</a><span class="ort"><b>Spieltag 12</b> · Liga 2 · Saison 1</span></div>'+
  '<div class="weg"><a class="ok"><u>✓</u><b>Laden</b></a><span></span><a class="an"><u>2</u><b>Vorstellung</b></a><span></span><a><u>3</u><b>Live</b></a><span></span><a><u>4</u><b>Ergebnis</b></a></div>'+
  '<div class="r"><div class="ich"><img src="../team-logos/'+ICH+'.jpg" alt=""><div><small>Du steuerst</small><b>'+T[ICH]+'</b></div></div></div></div>'}
function hinweis(){
  if(Z.slot&&SL[Z.slot-1])return '<b>'+D.zeile+' '+Z.slot+' · '+SL[Z.slot-1][0]+':</b> '+SL[Z.slot-1][1];
  return D.art==="pod"?'<b>Gleiche Zeile = gleicher Slot</b> in allen vier Teams. Klick auf eine Zeile erklärt die Rolle.'
    :Z.v==="fechten"?'<b>Gleiche Zeile = gleiches Gefecht:</b> Slot 1 ficht gegen Slot 1. Klick auf eine Zeile erklärt die Rolle.'
    :'<b>Gleiche Zeile = gleicher Slot</b> auf beiden Seiten. Klick auf eine Zeile erklärt die Rolle.'}
function zeichne(){
  D=V[Z.v];SL=SLOTS[Z.v];K=SL.length;CODES=Object.keys(D.teams);
  document.getElementById("demo").innerHTML='<b>Variante</b>'+[["hockey","Duell · Feldspiel (Hockey, 6 Slots)"],["fechten","Duell · Bühne (Fechten, 3 Slots)"],["battlefield","Vierergruppe (Battlefield, 5 Slots)"],["staffel","Vierergruppe · Bahn (Staffel, 4 Slots)"]]
    .map(function(x){return '<a data-v="'+x[0]+'"'+(Z.v===x[0]?' class="an"':'')+'>'+x[1]+'</a>'}).join("")+
    '<b>Fog of War</b><a data-nebel="1"'+(Z.nebel?' class="an"':'')+'>an</a><a data-nebel="0"'+(Z.nebel?'':' class="an"')+'>aus (Einstellung)</a><span class="sp"></span><span>Tasten 1–4 · N · Mockup 22.11. · Zahlen erfunden</span>';
  document.getElementById("b").innerHTML='<div class="bild" style="--bild:url(../sprites/kulissen/'+D.kul[0]+'/'+D.kul[1]+'.jpg)"></div>'+reg()+
   '<div class="kopf"><div class="dz"><img src="../discipline-icons/'+D.icon+'.png" alt=""><div><div class="gk">Disziplin '+D.nr+' von 2 · '+(D.art==="pod"?"Vierergruppe · jeder gegen jeden":"Duell")+' · '+D.typ+'</div><h1>'+D.n+'</h1></div></div>'+
   schema()+'<div class="re">'+(D.art==="pod"?'<span class="marke gold">4 Teams · Pod</span>':'')+'<span class="marke">'+ico("ort")+D.kul[2]+'</span><span class="marke zu">'+ico("schloss")+'Einsatzlisten gesperrt</span></div></div>'+
   (D.art==="pod"?pod():duell())+
   '<div class="fuss"><span class="hin">'+hinweis()+'</span><span class="sp"></span>'+
   '<div class="leg"><span><i style="background:var(--k-red)"></i>POW</span><span><i style="background:var(--k-green)"></i>SPE</span><span><i style="background:var(--k-blue)"></i>MEN</span><span><i style="background:var(--k-yellow)"></i>SOC</span><span>'+ico("nebel")+'Gegnerwerte nach Scouting-Stufe</span></div>'+
   '<a class="btn neben" data-tu="Quick-Sim: derselbe Verlauf, nur schneller">'+ico("vor")+'Quick-Sim</a><a class="btn haupt" data-tu="Zur Arena: startet den Motor">'+ico("play")+'Zur Arena <kbd style="color:#17120a;border-color:#17120a">↵</kbd></a></div><div class="toast" id="toast"></div>';
  var u=new URLSearchParams();u.set("v",Z.v);if(!Z.nebel)u.set("nebel","0");if(Z.slot)u.set("slot",Z.slot);if(q.get("still"))u.set("still","1");
  history.replaceState(null,"","?"+u.toString());
}
document.addEventListener("click",function(e){
  var a=e.target.closest("[data-v]");if(a){Z.v=a.dataset.v;Z.slot=null;return zeichne()}
  a=e.target.closest("[data-nebel]");if(a){Z.nebel=a.dataset.nebel==="1";return zeichne()}
  a=e.target.closest("[data-tu]");if(a){var t=document.getElementById("toast");t.textContent="Im Mockup ohne Funktion · "+a.dataset.tu;t.classList.add("an");return setTimeout(function(){t.classList.remove("an")},1600)}
  a=e.target.closest(".zeile");if(a){var n=+a.dataset.slot;Z.slot=Z.slot===n?null:n;zeichne()}
});
document.addEventListener("keydown",function(e){
  var v=["hockey","fechten","battlefield","staffel"][+e.key-1];if(v){Z.v=v;Z.slot=null;return zeichne()}
  if(e.key==="n"||e.key==="N"){Z.nebel=!Z.nebel;return zeichne()}
  if(e.key==="Enter"&&document.activeElement&&document.activeElement.classList.contains("zeile")){Z.slot=+document.activeElement.dataset.slot;zeichne()}
});
zeichne();
})();
</script>
</body>
</html>
