<title>Deine Entscheidungen · Rennen · Halbzeit · Manager-Leiste (Mockup 22.11.)</title>
<!--
DREI VORSCHLAEGE AUS DER GAMEPLAY-REVIEW VOM 22.11. (Fable, 22.11.), von Chris freigegeben ("ja"):
  1 "Deine Entscheidungen" in Nach dem Spieltag      ?ansicht=entscheidungen
  2 Rennen je Liga + Halbzeitbericht in der Pause     ?ansicht=rennen | ?ansicht=halbzeit
    (Runde 2: Rennen neu als Geschichte mit Verlauf, Restprogramm, Wenn-dann und Direktvergleich; Gegnerspalte im Wasserfall)
  3 Manager-Leiste + Derby-Marke auf der Startseite   ?ansicht=manager
  ?still=1 blendet die Mockup-Leiste aus.
ECHT (Groessen, die es im Spiel gibt): Duellpunkte 2/1/0, hoechstens 4 je Spieltag, 20 Spieltage, zwei 16er-Ligen,
  3 Auf-/Absteiger (lib/season/league-split.ts), Ergebnisskala E1 (87 : 79 -> 7 : 4), Formkarten-Zerlegung "alle + Farbtraeger"
  (lib/lineups/formkarten-farbregel.ts), Einsatzstufen Schonen/Normal/Vollgas (lib/lineups/legacy-lineup-modifiers.ts),
  Captain x1,5 (lib/lineups/legacy-score-engine.ts), Erschoepfung und Pause nach Spieltag 10 (lib/fatigue/belastung-regel.ts),
  Form/Moral, Vorstands-Freigabe, Delegation Voll selbst / Halbautomatik / Voll KI, Teams, Logos, Portraits, Kulissen.
NEU (lila Marke "neu"): alles, was diese Seite zeigt und es heute nicht gibt.
ERFUNDEN: alle Staende, Zahlen, Serien, Betraege, die Zuordnung Franky = V-W und Ramona = R-C.
Kein App-Code, keine externen Skripte, Schriften lokal, 0 PixelLab-Generationen.
Erklaerung: docs/design/spieltag-entscheidungen-rennen-22-11.md
-->

.hk{display:flex;align-items:center;gap:1rem}

/* ============ 1 ENTSCHEIDUNGEN ============ */

/* ============ 2 RENNEN ============ */

.rk{display:grid;grid-template-rows:repeat(3,minmax(0,1fr)) auto;gap:.72rem;min-height:0}
.rkarte .pb{gap:.45rem}
.rkarte .zeile{display:flex;align-items:center;gap:.5rem;font-size:.97rem;color:var(--leise)} .rkarte .zeile b{color:var(--creme)}
.rkarte .mz{margin-left:auto;text-align:right} .rkarte .mz strong{display:block;font-size:2rem;line-height:1;color:var(--creme)} .rkarte .mz small{font-size:.76rem;color:var(--leise)}
.rkarte .satz{margin-top:auto;font-size:.95rem;color:var(--tinte);padding:.4rem .6rem;border-left:3px solid var(--gold);background:var(--flaeche-2);border-radius:.3rem}
.lgs{display:flex;gap:.25rem} .lgs img{width:1.9rem;height:1.9rem;border-radius:.3rem;object-fit:cover;border:1px solid var(--linie-2)} .lgs img.ich{border:2px solid var(--heim)} .lgs img.aus{opacity:.3;filter:grayscale(1)}
.l1{display:grid;grid-template-columns:1fr 1fr;gap:.72rem;padding:.6rem .9rem}
.l1 div{font-size:.92rem;color:var(--leise)} .l1 b{color:var(--creme)}

/* RENNEN NEU (Runde 2): Geschichte, Restprogramm, Szenarien, Direktvergleich */
.n-raster{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);grid-template-rows:minmax(0,1.12fr) minmax(0,1fr);gap:.72rem;padding:.6rem 1rem .8rem;min-height:0}
.gesch{font-size:1.02rem;color:var(--leise);line-height:1.3;flex:none;margin-top:.4rem;padding:.5rem .7rem;border-left:3px solid var(--gold);background:var(--flaeche-2);border-radius:.3rem} .gesch b{color:var(--creme)}
.leg{display:flex;gap:.9rem;font-size:.84rem;color:var(--leise);flex:none;margin-bottom:.2rem} .leg i{display:inline-block;width:1.1rem;height:.22rem;vertical-align:middle;margin-right:.3rem;border-radius:2px}
.rp{display:grid;grid-template-columns:16.5rem repeat(4,minmax(0,1fr)) 5rem;gap:.35rem;flex:1;min-height:0;grid-auto-rows:minmax(0,1fr);align-items:stretch}

.rp .ze{display:flex;align-items:center;gap:.45rem;padding:0 .5rem;border-radius:.35rem;border:1px solid var(--linie);background:var(--flaeche-2);font-size:.8rem;color:var(--leise);line-height:1.15;overflow:hidden;white-space:nowrap}
.rp .ze.l{border-left:.25rem solid var(--gut)} .rp .ze.m{border-left:.25rem solid var(--acht)} .rp .ze.s{border-left:.25rem solid var(--warn)} .rp .ze.dd{background:linear-gradient(90deg,rgba(240,195,90,.22),var(--flaeche-2));border-color:var(--gold)}
.rp .ze b{display:block;color:var(--creme);font-size:.86rem} .rp .su{align-self:center;text-align:right;font-size:.86rem;color:var(--leise)} .rp .su b{display:block;font-size:1.15rem;color:var(--creme)}
