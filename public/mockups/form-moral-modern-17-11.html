<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Form, Moral, Formkarten – modern (Mockup 17.11.)</title>
<!--
  FORM, MORAL UND FORMKARTEN IM BROADCAST-STIL, klickbarer Prototyp (Fable, 17.11.).
  Erklaerung: docs/design/form-moral-anzeige-17-11.md · Regelwerk: docs/design/form-moral-17-11.md (Branch claude/form-moral-17-11)
  - Reines HTML/CSS/Inline-JS/SVG, keine externen Skripte, keine Netzwerkzugriffe. Tokens, Bausteine und Schriften sind die der
    Einsatzliste (public/mockups/einsatzliste-modern-17-11.html bzw. components/foundation/broadcast/broadcast.css).
  - ECHT: Spielernamen, Portraits, Klassen, Voelker, Attribute, Disziplinwerte, Rollennamen, Wappen, Klassenfarben
    (CLASS_COLOR_MAP), die Rechenregeln fuer Form, Moralwirkung und Formkarten (aus form-moral-17-11.md nachgebaut).
  - ERFUNDEN: ALLE ZAHLEN zu Form, Moral, Erschoepfung, Einsaetzen, Erwartung/Leistung, Formkarten-Hand, Spieltagen, Ergebnissen.
  - URL-Schalter: ?ansicht=liste|profil|nachher  &d=basketball|spurt  &karten=k1,k6  &spieler=Kati  &warum=Kati  &tab=karten|form
                  &blatt=kader|kontext  &ein=0..n  &still=1  &phone=1
-->
<style>
@font-face{font-family:"RaniraSeason";src:url("../fonts/ranira-bold-italic.otf") format("opentype");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url("../fonts/barlow-condensed-latin-500-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url("../fonts/barlow-condensed-latin-600-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url("../fonts/barlow-condensed-latin-700-normal.woff2") format("woff2");font-display:swap}
:root{
  --grund:#06080c; --flaeche:rgba(9,12,18,.90); --flaeche-1:#0c1017; --flaeche-2:#121824; --flaeche-3:#1a2231;
  --linie:rgba(244,230,196,.13); --linie-2:rgba(244,230,196,.30);
  --creme:#f4e6c4; --gold:#f0c35a; --tinte:#eef2f8; --leise:#9aa7ba; --stumm:#7a869c;
  --heim:#F2A03D; --gast:#45B0C9; --gut:#62d394; --warn:#ff6058; --acht:#f3b54a;
  --p1:#e0637a; --p2:#e89a4c; --p3:#c3cf5e; --p4:#4fc7b2; --p5:#62a0f4; --p6:#ac8af2;
  /* Klassen-/Kartenfarben: FORM_HEX aus EinsatzlisteModern.tsx (red, green, blue, yellow) */
  --k-POW:#ff8b86; --k-SPE:#a8e7aa; --k-MEN:#a9ccff; --k-SOC:#ffd987;
  --haus:"RaniraSeason",Georgia,"Times New Roman",serif;
  --zahl:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --r:10px; --r-s:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020305;color:var(--tinte);font-family:var(--zahl);font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.t{font-variant-numeric:tabular-nums}
.gk{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
img{display:block}
.plus{color:var(--gut)} .minus{color:var(--warn)} .null{color:var(--stumm)}

/* ---------- Mockup-Steuerung (gehoert NICHT zum UI) ---------- */
.demo{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#0d1016;border-bottom:1px solid #222a38;font-size:14px;color:var(--leise);white-space:nowrap;overflow-x:auto}
.demo b{color:var(--creme);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;margin-right:4px}
.demo button{padding:3px 10px;border:1px solid #2b3445;border-radius:999px;color:var(--tinte);font-weight:600}
.demo button:hover{border-color:var(--gold)} .demo button[aria-pressed=true]{background:var(--gold);color:#17120a;border-color:var(--gold)}
.demo em{font-style:normal;color:var(--acht);margin-left:auto;font-weight:600}
body.still .demo{display:none}

/* ---------- Geruest ---------- */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);height:calc(100vh - 38px);min-height:760px;background:var(--grund)}
body.still .app{height:100vh}
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;background:#080b11;border-right:1px solid var(--linie)}
.rail .logo{width:40px;height:40px;border-radius:9px;overflow:hidden;border:1px solid var(--linie-2);margin-bottom:10px}
.rail .logo img{width:100%;height:100%;object-fit:cover}
.rail button{position:relative;width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font-size:20px;color:var(--stumm)}
.rail button:hover{background:var(--flaeche-2);color:var(--tinte)}
.rail button.an{background:linear-gradient(180deg,rgba(240,195,90,.2),rgba(240,195,90,.06));color:var(--gold)}
.rail button.an::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--gold)}
.rail .zahl{position:absolute;right:3px;top:3px;min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.rail .luecke{flex:1}
main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}

/* Tooltip (ein Muster fuer alles) */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:90;left:50%;top:calc(100% + 7px);transform:translateX(-50%);width:max-content;max-width:260px;white-space:normal;
  padding:6px 9px;border-radius:6px;background:#020305;border:1px solid var(--linie-2);color:var(--tinte);font:500 13.5px/1.3 var(--zahl);letter-spacing:0;text-transform:none;text-align:left;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.6)}
[data-tip].tr::after{left:calc(100% + 8px);top:50%;transform:translateY(-50%)}
[data-tip].tl::after{left:auto;right:0;transform:none}
[data-tip].to::after{top:auto;bottom:calc(100% + 7px)}
body.phone [data-tip]::after{display:none}

/* ---------- Hero-Kopf ---------- */
.hero{position:relative;flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch;gap:22px;padding:14px 20px 0;border-bottom:1px solid var(--linie);overflow:hidden;isolation:isolate}
.hero .kul{position:absolute;inset:-30px;z-index:-2;background-size:cover;background-position:center 40%;filter:blur(14px) saturate(1.15);opacity:.5}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,8,12,.94) 0%,rgba(6,8,12,.72) 38%,rgba(6,8,12,.62) 62%,rgba(6,8,12,.93) 100%),linear-gradient(180deg,transparent 40%,var(--grund) 100%)}
.hk{display:flex;align-items:center;gap:14px;padding-bottom:14px;min-width:0}
.hk .crest{width:62px;height:62px;flex:none;border-radius:10px;overflow:hidden;border:2px solid var(--heim);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.hk .crest img{width:100%;height:100%;object-fit:cover}
.hk h1{margin:0;font:400 34px/1 var(--haus);color:#fff;letter-spacing:.01em;white-space:nowrap}
.hk .sub{margin-top:5px;font-size:15px;color:var(--leise);font-weight:500;white-space:nowrap}
.hk .sub b{color:var(--creme);font-weight:600}
.mdw{display:inline-flex;align-items:center;gap:2px;margin-bottom:5px}
.mdw button{width:24px;height:24px;border-radius:5px;border:1px solid var(--linie);display:grid;place-items:center;color:var(--leise)}
.mdw button:hover{border-color:var(--gold);color:var(--gold)}
.mdw span{padding:0 8px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.mdw button+span{padding-left:8px} .mdw span:first-child{padding-left:0}
.tabs{display:flex;align-items:flex-end;gap:10px;min-width:0}
.dtab{position:relative;flex:1 1 0;min-width:0;max-width:340px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 20px 12px 18px;
  background:rgba(18,24,36,.72);border:1px solid var(--linie);border-bottom:0;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);color:var(--leise);transition:background .15s}
.dtab:hover{background:rgba(26,34,49,.9)}
.dtab.an{background:linear-gradient(180deg,rgba(240,195,90,.2),rgba(18,24,36,.92) 70%);color:var(--tinte)}
.dtab.an::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gold)}
.dtab .ic{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:22px;background:rgba(0,0,0,.35);border:1px solid var(--linie);color:var(--creme);overflow:hidden}
.dtab .ic img{width:100%;height:100%;object-fit:cover}
.dtab.an .ic{color:var(--gold);border-color:rgba(240,195,90,.5)}
.dtab em{display:block;font-style:normal;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtab b{display:block;font:400 22px/1.1 var(--haus);color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtab .erw{text-align:right}
.dtab .erw strong{display:block;font-size:28px;line-height:1;font-weight:700;color:var(--creme)}
.dtab .erw span{font-size:12px;color:var(--stumm);letter-spacing:.06em;white-space:nowrap}
.hr{display:flex;align-items:center;gap:16px;padding-bottom:14px}
.frist{text-align:right;white-space:nowrap}
.frist strong{display:block;font-size:26px;line-height:1;font-weight:700;color:var(--creme)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:7px;border:1px solid var(--linie-2);background:var(--flaeche-2);font-weight:600;font-size:15px;letter-spacing:.02em;white-space:nowrap;flex:none}
.btn:hover{background:var(--flaeche-3);border-color:var(--creme)}
.btn.haupt{height:46px;padding:0 20px;font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--gold);border-color:var(--gold);color:#17120a;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);border-radius:0}
.btn.haupt:hover{filter:brightness(1.08)}
.btn.klein{height:30px;padding:0 10px;font-size:14px}

/* ---------- Arbeitsflaeche ---------- */
.work{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr) 356px;gap:12px;padding:12px 14px}
.work.zwei{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.pan{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);overflow:hidden}
.pk{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--linie);min-height:46px}
.pk h2{margin:0;font:400 19px/1 var(--haus);color:var(--creme);white-space:nowrap}
.pk .sp{flex:1}
.pk .hin{font-size:13.5px;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kf{flex:none;padding:7px 12px;border-top:1px solid var(--linie);font-size:13px;color:var(--stumm);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.marke{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#0b0d12;background:var(--pc,var(--leise));flex:none;white-space:nowrap}
.marke.rot{background:var(--warn);color:#fff} .marke.gelb{background:var(--acht)} .marke.leer{background:none;border:1px solid var(--linie-2);color:var(--leise)}

/* Form-Pfeil (Baustein .form der Einsatzliste) und Moral-Marke (neu, gleiche Tokens) */
.form{font-size:17px;display:inline-grid;place-items:center} .form.f2,.form.f1{color:var(--gut)} .form.f0{color:var(--stumm)} .form.f-1,.form.f-2{color:var(--warn)}
.form.kast{width:22px;height:22px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid var(--linie)}
.form.kast.f2{background:rgba(98,211,148,.18);border-color:rgba(98,211,148,.55)} .form.kast.f-2{background:rgba(255,96,88,.16);border-color:rgba(255,96,88,.5)}
.mor{display:inline-flex;align-items:center;gap:3px;font-size:14px;font-weight:700;line-height:1;color:var(--leise)}
.mor svg{font-size:12px}
.mor.h{color:var(--gut)} .mor.n{color:var(--warn)}
.wz{cursor:help;display:inline-flex;align-items:center;gap:5px;border-radius:5px}
.wz:hover{background:rgba(244,230,196,.08);box-shadow:0 0 0 3px rgba(244,230,196,.08)}
.last{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.last i{display:block;height:100%;background:var(--gut)} .last.m i{background:var(--acht)} .last.h i{background:var(--warn)}
.fpkt{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--pc);flex:none}

/* Kader */
.kh,.kz{display:grid;grid-template-columns:40px minmax(0,1fr) 46px 24px 34px 40px;gap:6px;align-items:center;padding:0 12px}
.kh{flex:none;height:26px;border-bottom:1px solid var(--linie);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stumm);font-weight:600;text-align:right}
.kh span:nth-child(2){text-align:left} .kh span:nth-child(4){text-align:center}
.kl{flex:1;overflow-y:auto;min-height:0}
.kz{width:100%;height:54px;border-bottom:1px solid rgba(244,230,196,.06);position:relative}
.kz:hover{background:var(--flaeche-2)}
.kz.im{background:linear-gradient(90deg,rgba(255,255,255,.03),transparent)}
.kz.gew{box-shadow:inset 0 0 0 2px var(--gold);background:rgba(240,195,90,.08)}
.kz.aus{opacity:.5}
.kz .por{width:40px;height:40px;border-radius:7px;overflow:hidden;border:2px solid #2a3344;background:#111;position:relative}
.kz .por img{width:100%;height:100%;object-fit:cover}
.kz .nm{min-width:0}
.kz .nm b{display:block;font:400 16px/1.15 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kz .nm span{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--stumm);white-space:nowrap;overflow:hidden}
.kz .sw{text-align:right;line-height:1}
.kz .sw strong{font-size:20px;font-weight:700;color:var(--creme)}
.kz .sw small{display:block;font-size:12px;font-weight:600;color:var(--stumm)}
.kz .kw{text-align:right;font-size:16px;font-weight:700}
.kz .kw.aus{opacity:.45;font-weight:600}

/* Feld */
.fk{flex:none;display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--linie);min-height:58px}
.waage{flex:1;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.waage .z{font-size:30px;font-weight:700;line-height:1;color:var(--heim)} .waage .z.g{color:var(--gast)}
.waage .z small{display:block;font-size:11px;letter-spacing:.14em;color:var(--stumm);font-weight:600;text-transform:uppercase}
.waage .z.g small{text-align:right}
.wb{position:relative;height:12px;background:var(--gast);transform:skewX(-14deg);overflow:hidden;border-radius:2px}
.wb i{position:absolute;left:0;top:0;bottom:0;background:var(--heim);transition:width .3s}
.wb u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.45) 0 3px,transparent 3px 6px)}
.wt{margin-top:4px;display:flex;justify-content:space-between;font-size:13px;color:var(--leise);gap:8px;white-space:nowrap}
.wt b{color:var(--creme);font-weight:600}
.vor{color:var(--gold);font-weight:700}
.pitchw{flex:1;min-height:0;padding:10px 12px;display:flex}
.pitch{position:relative;flex:1;min-height:280px;border-radius:8px;overflow:hidden;border:1px solid var(--linie);background:#10151d}
.pitch>svg{position:absolute;inset:0;width:100%;height:100%}
.pitch .hinw{position:absolute;left:10px;bottom:8px;font-size:12.5px;color:rgba(238,242,248,.62);max-width:60%;text-shadow:0 1px 2px #000}
.slot{position:absolute;transform:translate(-50%,-50%);width:22.5%;min-width:160px;display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:7px;row-gap:1px;align-items:center;padding:0 7px 6px 9px;border-radius:8px;
  background:rgba(8,11,16,.9);border:1px solid var(--linie-2);box-shadow:0 6px 16px rgba(0,0,0,.5);--pc:var(--p1);transition:box-shadow .15s,border-color .15s}
.slot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:8px 0 0 8px;background:var(--pc)}
.slot:hover{border-color:var(--creme)}
.slot.gew{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(240,195,90,.35);z-index:3}
.slot.trg{box-shadow:0 0 0 2px var(--kf),0 0 22px color-mix(in srgb,var(--kf) 40%,transparent)}
.slot .por{grid-column:1;grid-row:2/4;width:40px;height:40px;border-radius:7px;overflow:hidden;border:2px solid var(--pc);background:#111}
.slot .por img{width:100%;height:100%;object-fit:cover}
.slot .in{display:contents}
.slot .ro{grid-column:1/-1;display:flex;align-items:center;gap:6px;height:24px;margin:0 -7px 5px -5px;padding:0 7px 0 5px;border-bottom:1px solid var(--linie);background:color-mix(in srgb,var(--pc) 16%,transparent);border-radius:0 8px 0 0;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinte);font-weight:600;white-space:nowrap;overflow:hidden}
.slot .ro .fpkt{margin-left:auto}
.slot .nm{grid-column:2;min-width:0;font:400 15px/1.2 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .ze{grid-column:2;min-width:0;display:flex;align-items:center;gap:5px;line-height:1}
.slot .ze .wz{gap:4px}
.slot .ze strong{font-size:20px;font-weight:700;color:var(--creme)}
.slot .lf{position:absolute;left:8px;top:-11px;padding:0 5px;height:16px;border-radius:3px;background:var(--creme);color:#17120a;font-size:11px;font-weight:700;letter-spacing:.06em}
/* Karten-Marke am Platz: was dieser Spieler von den gelegten Karten bekommt */
.kc{position:absolute;right:8px;bottom:-16px;height:21px;display:inline-flex;align-items:stretch;border-radius:4px;overflow:hidden;font-size:14px;font-weight:700;line-height:21px;color:#0b0d12;box-shadow:0 3px 8px rgba(0,0,0,.6);border:1px solid #0b0d12}
.kc b{padding:0 6px;background:var(--creme);font-weight:700}
.kc i{font-style:normal;padding:0 5px;background:var(--kf)}
.kc u{text-decoration:none;padding:0 5px;background:var(--gut)}
.kc.neg b{background:var(--warn);color:#fff}
.kc.vor{outline:1px dashed var(--gold);outline-offset:1px;opacity:.9}
.typ-track .slot{width:22%}
.balken{position:absolute;height:14px;transform:translateY(-50%) skewX(-14deg);border-radius:2px;background:linear-gradient(90deg,rgba(242,160,61,.25),var(--heim));transition:width .3s}
.bz{position:absolute;transform:translate(6px,-50%);font-size:15px;font-weight:700;color:var(--heim);white-space:nowrap}
.geist{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;padding:3px 8px 3px 3px;border-radius:999px;background:rgba(8,11,16,.72);border:1px dashed rgba(69,176,201,.6);font-size:13px;color:var(--leise);white-space:nowrap}
.geist img{width:28px;height:28px;border-radius:50%;object-fit:cover;filter:grayscale(.5) brightness(.85)}
.geist b{color:var(--gast);font-weight:600}

/* Taktik-Leiste mit Formkarten-Hand */
.tak{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:9px 12px 11px;border-top:1px solid var(--linie);align-items:end}
.tak .gk{display:flex;gap:8px;margin-bottom:6px;white-space:nowrap}
.tak .gk b{color:var(--kf);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--linie-2);border-radius:7px;overflow:hidden}
.seg button{text-align:center;height:34px;padding:0 12px;font-weight:600;font-size:15px;color:var(--leise);border-right:1px solid var(--linie)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--flaeche-2);color:var(--tinte)}
.seg button[aria-pressed=true]{background:var(--creme);color:#17120a}
.hand{display:flex;gap:8px;min-width:0;overflow-x:auto;padding:3px 3px 4px}
.hka{position:relative;flex:1 1 0;min-width:84px;max-width:124px;height:84px;display:grid;grid-template-rows:17px 15px 1fr 18px;border-radius:7px;border:1px solid var(--linie-2);background:var(--flaeche-2);overflow:hidden;text-align:center;transition:transform .12s}
.hka:hover{border-color:var(--creme);transform:translateY(-2px)}
.hka .fa{background:var(--kf);color:#0b0d12;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:17px}
.hka strong{grid-row:3;font-size:30px;font-weight:700;line-height:1;align-self:center;color:var(--creme)}
.hka .vo{grid-row:4}
.hka.neg strong{color:var(--warn)}
.hka .vo{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--leise);white-space:nowrap;overflow:hidden;border-top:1px solid var(--linie);background:rgba(0,0,0,.25)}
.hka .vo img{width:14px;height:14px;border-radius:3px;object-fit:cover}
.hka .pa{grid-row:2;align-self:end;font-size:10.5px;line-height:1;letter-spacing:.08em;font-weight:700;text-transform:uppercase;color:var(--stumm)}
.hka.passt .pa{color:var(--gold)}
.hka .nr{position:absolute;right:4px;top:22px;width:17px;height:17px;border-radius:50%;background:var(--gold);color:#17120a;font-size:12px;font-weight:700;line-height:17px;display:none}
.hka.gew{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(240,195,90,.3);background:linear-gradient(180deg,rgba(240,195,90,.14),var(--flaeche-2))}
.hka.gew .nr{display:block}
.hka.weg{opacity:.42}
.hka.weg .pa{color:var(--leise)}
.ksum{text-align:right;white-space:nowrap;min-width:108px}
.ksum strong{display:block;font-size:34px;font-weight:700;line-height:1;color:var(--creme)}
.ksum small{display:block;font-size:12.5px;color:var(--stumm);margin-top:3px}

/* Kontext */
.ktabs{flex:none;display:flex;border-bottom:1px solid var(--linie)}
.ktabs button{flex:1;height:42px;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--stumm);border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.ktabs button:hover{color:var(--tinte)} .ktabs button.an{color:var(--gold);border-bottom-color:var(--gold)}
.kb{flex:1;overflow-y:auto;min-height:0;padding:12px}
.rk{border-radius:8px;padding:11px 12px;background:linear-gradient(100deg,color-mix(in srgb,var(--pc) 26%,transparent),transparent 70%);border:1px solid var(--linie);border-left:3px solid var(--pc)}
.rk h3{margin:3px 0 4px;font:400 23px/1 var(--haus);color:#fff}
.rk p{margin:0;font-size:14.5px;line-height:1.3;color:var(--leise)}
.rk p b{color:var(--creme);font-weight:600}
.rk+.rk{margin-top:8px}
.ab{margin-top:12px}
.ab>.gk{display:flex;justify-content:space-between;margin-bottom:6px}
.rech{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:8px;background:var(--linie);border:1px solid var(--linie);border-radius:7px;overflow:hidden}
.rech.d3{grid-template-columns:repeat(3,minmax(0,1fr))} .rech.d5{grid-template-columns:repeat(5,minmax(0,1fr))}
.rech div{background:var(--flaeche-1);padding:5px 4px;text-align:center;min-width:0}
.rech small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rech strong{font-size:18px;font-weight:700;white-space:nowrap}
.rech .su{background:var(--flaeche-3)} .rech .su strong{color:var(--gold)}
.rech.gross{margin:12px 12px 0;flex:none} .rech.gross div{padding:8px 6px} .rech.gross strong{font-size:26px;line-height:1.1;display:inline-flex;align-items:center;gap:6px} .rech.gross small{font-size:11px}
/* Wirkungs-Tabelle der Karten */
.wh,.wr{display:grid;grid-template-columns:4px 26px minmax(0,1fr) 20px 38px 38px 38px 46px;gap:6px;align-items:center}
.wh{height:24px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--stumm);font-weight:600;text-align:right;border-bottom:1px solid var(--linie)}
.wr{position:relative;height:40px;border-bottom:1px solid rgba(244,230,196,.06);font-size:16px;text-align:right;width:100%}
button.wr:hover{background:var(--flaeche-2)}
.wr .fb{width:4px;height:24px;border-radius:2px;background:var(--pc)}
.wr img{width:26px;height:26px;border-radius:5px;object-fit:cover}
.wr .nm{text-align:left;font:400 15.5px/1.1 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr .zf{color:var(--kf);font-weight:700} .wr .zv{color:var(--gut);font-weight:700}
.wr strong{font-size:19px;color:var(--creme)}
.wr .st{position:absolute;left:36px;right:0;bottom:2px;height:3px;display:flex;gap:1px;border-radius:2px;overflow:hidden}
.wr .st i{background:var(--creme);opacity:.75} .wr .st i.f{background:var(--kf);opacity:1} .wr .st i.v{background:var(--gut);opacity:1} .wr .st i.n{background:var(--warn);opacity:1}
.wr.su{background:var(--flaeche-2);height:44px;border-radius:0 0 7px 7px;border-bottom:0} .wr.su strong{font-size:24px;color:var(--gold)} .wr.su .nm{font:700 13px/1 var(--zahl);letter-spacing:.12em;text-transform:uppercase;color:var(--creme)}
.rang{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;height:32px;padding:0 6px;border-radius:6px;font-size:15px}
.rang:hover{background:var(--flaeche-2)}
.rang.an{background:rgba(240,195,90,.1)}
.rang .mk{display:inline-flex;align-items:center;gap:5px;font-weight:700;white-space:nowrap;min-width:92px}
.rang .bn{height:8px;transform:skewX(-14deg);background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.rang .bn i{display:block;height:100%;background:var(--kf)} .rang.neg .bn i{background:var(--warn)}
.rang strong{font-size:17px;min-width:52px;text-align:right}
.hinweis{margin-top:10px;display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:9px 10px;border-radius:7px;border:1px solid var(--linie);background:var(--flaeche-2);font-size:14.5px;line-height:1.3;color:var(--leise)}
.hinweis b{color:var(--creme);font-weight:600}
.hinweis svg{font-size:18px;color:var(--gold);margin-top:1px}
.regel{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 1fr;gap:1px;background:var(--linie);border:1px solid var(--linie);border-radius:7px;overflow:hidden;margin-top:8px;font-size:14.5px}
.regel span{background:var(--flaeche-1);padding:6px 8px;text-align:center;font-weight:700}
.regel span.l{text-align:left;font-weight:500;color:var(--leise)} .regel span.k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--stumm);font-weight:600}
/* Warum-Block (Kontext, Popover, Profil) */
.bes{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px;border-radius:8px;background:var(--flaeche-2);border:1px solid var(--linie)}
.bes .por{width:64px;height:64px;border-radius:8px;overflow:hidden;border:2px solid var(--pc)}
.bes .por img{width:100%;height:100%;object-fit:cover}
.bes b{display:block;font:400 21px/1.05 var(--haus);color:#fff}
.bes span{font-size:13.5px;color:var(--leise)}
.ez{display:grid;grid-template-columns:30px minmax(0,1fr) 84px 36px;gap:8px;align-items:center;height:30px;font-size:14.5px;border-bottom:1px solid rgba(244,230,196,.06)}
.ez .st{font-weight:700;color:var(--stumm);font-size:13px;letter-spacing:.06em}
.ez .dn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tinte)}
.ez .dn small{color:var(--stumm);font-size:13px}
.ez .el{position:relative;height:10px;background:rgba(255,255,255,.07);border-radius:2px}
.ez .el i{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--gut)} .ez .el.m i{background:var(--warn)}
.ez .el u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--creme)}
.ez .df{text-align:right;font-weight:700}
.ez.leer .dn{color:var(--stumm)}
.zl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;min-height:26px;font-size:14.5px;color:var(--leise)}
.zl b{font-weight:700;font-size:16px} .zl span b{font-size:inherit;color:var(--creme);font-weight:600}
.zl.su{margin-top:6px;padding-top:6px;border-top:1px solid var(--linie);color:var(--tinte)} .zl.su b{font-size:20px;color:var(--gold)}
/* Ursachen-Balken (Moral) */
.ur{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 38px;gap:8px;align-items:center;min-height:30px;font-size:15px;border-bottom:1px solid rgba(244,230,196,.06)}
.ur .ul{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tinte)}
.ur .ub{position:relative;height:10px}
.ur .ub::before{content:"";position:absolute;left:50%;top:-5px;bottom:-5px;width:1px;background:var(--linie-2)}
.ur .ub i{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--gut)} .ur .ub i.m{background:var(--warn)}
.ur b{text-align:right;font-weight:700;font-size:16px}
.ur.su{border-bottom:0;background:var(--flaeche-2);margin:6px -6px 0;padding:0 6px;border-radius:6px;min-height:36px} .ur.su b{font-size:20px;color:var(--gold)} .ur.su .ul{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--creme)}
.ur.gr .ul{color:var(--stumm)} .ur.gr b{color:var(--stumm)}

/* Warum-Popover */
#warum{position:fixed;z-index:96;width:318px;padding:11px 12px 12px;border-radius:9px;background:#05070b;border:1px solid var(--linie-2);box-shadow:0 18px 44px rgba(0,0,0,.7);display:none}
#warum.an{display:block}
#warum h4{margin:0;font:400 20px/1 var(--haus);color:#fff;display:flex;align-items:center;gap:8px}
#warum h4 img{width:30px;height:30px;border-radius:6px;object-fit:cover}
#warum h4 span{margin-left:auto;font:600 13px var(--zahl);color:var(--gold);white-space:nowrap}
#warum .gk{display:flex;justify-content:space-between;margin:10px 0 3px}
#warum .gk b{font-weight:700;letter-spacing:.04em;font-size:13px}
#warum .zu{position:absolute;right:6px;top:6px;width:26px;height:26px;display:none;place-items:center;color:var(--leise)}

/* ---------- Spielerprofil ---------- */
.fv{flex:1;min-height:210px;position:relative;margin:14px 16px 0 54px}
.fv>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fv .bd{position:absolute;left:0;right:0}
.fv .bd.o{background:linear-gradient(180deg,rgba(98,211,148,.13),rgba(98,211,148,.03))} .fv .bd.u{background:linear-gradient(0deg,rgba(255,96,88,.13),rgba(255,96,88,.03))}
.fv .ax{position:absolute;left:-48px;width:42px;transform:translateY(-50%);display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12.5px;color:var(--stumm)}
.fv .sp2{position:absolute;top:0;bottom:0;border-radius:5px}
.fv .sp2.jetzt{background:linear-gradient(180deg,rgba(240,195,90,.12),rgba(240,195,90,.03));border-left:1px solid rgba(240,195,90,.4);border-right:1px solid rgba(240,195,90,.4)}
.fv .sp2.zuk{background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 6px,transparent 6px 12px)}
.fv .pt{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--heim);border:2px solid var(--flaeche-1);transform:translate(-50%,-50%)}
.fv .pt.ohne{background:var(--flaeche-1);border-color:var(--leise)}
.fv .pt.pro{width:8px;height:8px;background:var(--flaeche-1);border-color:var(--stumm)}
.fv .wt2{position:absolute;transform:translate(-50%,-165%);font-size:14.5px;font-weight:700;color:var(--creme);white-space:nowrap;text-shadow:0 0 6px var(--flaeche-1),0 0 6px var(--flaeche-1)}
.fv .lb{position:absolute;right:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--stumm);transform:translateY(-120%)}
.rs{flex:none;position:relative;height:96px;margin:6px 16px 0 54px;border-top:1px solid var(--linie)}
.rs::before{content:"";position:absolute;left:0;right:0;top:30px;height:1px;background:var(--linie-2)}
.rs .ax{position:absolute;left:-52px;top:30px;width:46px;transform:translateY(-50%);font-size:10.5px;line-height:1.1;letter-spacing:.06em;text-transform:uppercase;color:var(--stumm);text-align:right}
.rs .sb{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:center}
.rs .sb i{position:absolute;left:28%;right:28%;border-radius:2px;background:var(--gut);transform:skewX(-10deg)} .rs .sb i.m{background:var(--warn)}
.rs .sb small{position:absolute;bottom:0;left:-4px;right:-4px;text-align:center;font-size:12px;line-height:1.05;color:var(--stumm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs .sb small b{display:block;font-size:11px;letter-spacing:.1em;color:var(--leise);font-weight:700}
.rs .sb.jetzt small b{color:var(--gold)}
.rs .sb .br{position:absolute;top:2px;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--acht);white-space:nowrap}
.leg{flex:none;display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 16px 10px 54px;font-size:13px;color:var(--leise)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--heim);margin-right:5px;vertical-align:-1px}
.leg i.ohne{background:none;border:2px solid var(--leise)} .leg i.bk{border-radius:2px;background:var(--gut)} .leg i.bm{border-radius:2px;background:var(--warn)}
.pkb{flex:1;min-height:0;overflow-y:auto;padding:12px}
.spw{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--linie);flex:none}
.chip{height:28px;padding:0 9px 0 3px;border-radius:999px;border:1px solid var(--linie);font-size:14px;font-weight:600;color:var(--leise);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.chip:hover{border-color:var(--linie-2);color:var(--tinte)}
.chip[aria-pressed=true]{background:var(--creme);border-color:var(--creme);color:#17120a}
.chip[aria-pressed=true] .form{color:#17120a}

/* ---------- Nach dem Spieltag ---------- */
.mz{display:grid;grid-template-columns:40px minmax(0,150px) 92px 50px minmax(0,1fr);gap:10px;align-items:center;width:100%;min-height:50px;padding:4px 12px;border-bottom:1px solid rgba(244,230,196,.06);font-size:15px}
.mz:hover{background:var(--flaeche-2)}
.mz.an{background:rgba(240,195,90,.08);box-shadow:inset 3px 0 0 var(--gold)}
.mz img{width:40px;height:40px;border-radius:7px;object-fit:cover}
.mz .nm b{display:block;font:400 16px/1.15 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mz .nm span{font-size:12.5px;color:var(--stumm);white-space:nowrap}
.mz .ww{display:flex;align-items:center;gap:5px;color:var(--stumm)}
.mz .dz{font-size:19px;font-weight:700;text-align:right}
.mz .gr{color:var(--leise);line-height:1.25}
.mz .gr b{color:var(--creme);font-weight:600}
.mh{display:grid;grid-template-columns:40px minmax(0,150px) 92px 50px minmax(0,1fr);gap:10px;padding:0 12px;height:26px;align-items:center;border-bottom:1px solid var(--linie);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stumm);font-weight:600;flex:none}
/* Einblendung (Bauchbinde) */
.einbl{position:absolute;z-index:40;left:50%;bottom:22px;transform:translateX(-50%);width:min(860px,calc(100% - 40px));display:grid;grid-template-columns:86px minmax(0,1fr) auto;align-items:stretch;background:#05070b;border:1px solid var(--linie-2);box-shadow:0 20px 50px rgba(0,0,0,.75);clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.einbl::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--ef)}
.einbl .por{position:relative;overflow:hidden}
.einbl .por img{width:100%;height:100%;object-fit:cover}
.einbl .tx{padding:11px 14px 12px;min-width:0}
.einbl .tx em{display:flex;align-items:center;gap:8px;font-style:normal;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ef)}
.einbl .tx b{display:block;margin:2px 0 3px;font:400 27px/1.05 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.einbl .tx p{margin:0;font-size:15.5px;line-height:1.25;color:var(--leise)}
.einbl .tx p b{display:inline;font:inherit;font-weight:600;color:var(--creme);margin:0}
.einbl .re{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:6px;padding:8px 30px 8px 12px;border-left:1px solid var(--linie);background:var(--flaeche-1)}
.einbl .re .pf{display:flex;align-items:center;gap:6px;font-size:26px;color:var(--stumm)}
.einbl .re .pf .form{font-size:30px}
.einbl .re .nv{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--stumm)}
.einbl .re .nv button{width:26px;height:26px;border-radius:5px;border:1px solid var(--linie-2);display:grid;place-items:center;color:var(--tinte)}
.einbl .re .nv button:hover{border-color:var(--gold);color:var(--gold)}
.nachher .kl{padding-bottom:128px}
.erg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* Dock */
.dock{flex:none;display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--linie);background:#080b11;min-height:62px}
.stat{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.stat .lamp{width:12px;height:12px;border-radius:50%;background:var(--gut);box-shadow:0 0 10px var(--gut);flex:none}
.stat b{font-size:17px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.stat span{font-size:14.5px;color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ges{text-align:right;white-space:nowrap;padding-right:6px}
.ges strong{font-size:26px;font-weight:700;color:var(--creme);line-height:1}
.ges small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stumm);font-weight:600}
#toast{position:fixed;z-index:95;left:50%;bottom:84px;transform:translate(-50%,20px);padding:9px 16px;border-radius:8px;background:#020305;border:1px solid var(--linie-2);font-size:15.5px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:90vw}
#toast.an{opacity:1;transform:translate(-50%,0)}
.nurphone{display:none}
#schleier{display:none}
.ziehgriff{display:none}

@media (max-width:1380px){.work{grid-template-columns:316px minmax(0,1fr) 344px}.hk h1{font-size:28px}.frist{display:none}}

/* ---------- Phone ---------- */
body.phone{background:var(--grund)}
body.phone .app{display:block;height:auto;min-height:100vh;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
body.phone .rail{display:none}
body.phone main{display:block}
body.phone .hero{position:sticky;top:0;z-index:30;grid-template-columns:minmax(0,1fr);gap:8px;padding:8px 10px 0;background:var(--grund)}
body.phone .hk{padding:0;gap:10px} body.phone .hk .crest{width:40px;height:40px;border-width:1px}
body.phone .hk>div{display:flex;flex-wrap:wrap;align-items:center;gap:1px 8px;flex:1;min-width:0}
body.phone .hk h1{font-size:20px;order:-1} body.phone .hk .sub{font-size:13px;margin:0;overflow:hidden;text-overflow:ellipsis;width:100%}
body.phone .mdw{margin:0 0 0 auto} body.phone .mdw span{padding:0 5px;font-size:11.5px;letter-spacing:.1em} body.phone .mdw .sai{display:none}
body.phone .hr{display:none}
body.phone .tabs{gap:4px}
body.phone .dtab{padding:6px 12px 7px 12px;gap:7px;grid-template-columns:minmax(0,1fr) auto;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
body.phone .dtab .ic{display:none} body.phone .dtab b{font-size:16px} body.phone .dtab em{font-size:10px}
body.phone .dtab .erw strong{font-size:20px} body.phone .dtab .erw span{display:none}
body.phone .work,body.phone .work.zwei{display:block;padding:8px}
body.phone .work.zwei .pan{margin-bottom:8px}

function formVerlauf(name){var f=50,r=[50];H[name].forEach(function(e){if(e&&e!=="V"){var z=kl(50+50*((e[2]-e[1])/100)/.22,0,100)-bremse(e[3]||0);f+=.3*(kl(z,0,100)-f)}else f+=.15*(50-f);r.push(f)});return r}
function stufeC(f){return kl((f-50)/15,-2,2)}
function stufe(f){return Math.round(stufeC(f))}
function formPct(f){return stufeC(f)*DOSIS}

    '<div class="ab"><span class="gk"><span>Letzte drei Einsätze · daraus entsteht die Form</span><span>Abstand</span></span>'+letzteEinsaetze(p,JETZT-1,3,phone())+'</div>'+
    '<div class="hinweis">'+ic("info")+'<span>'+profilSatz(p)+'</span></div>'+
    '<div class="rk" style="--pc:var(--k-'+p.farbe+');margin-top:10px"><span class="gk">Formkarten · '+FARBE[p.farbe].n+'-Träger</span><p>Von einer <b>'+FARBE[p.farbe].n+'-Karte +8</b> bekommt '+esc(p.n)+' den Grundwert und <b>+4 Farbträger-Zusatz</b>'+(s>0?', in der jetzigen Form noch <b>'+vzk(4*.125*s)+'</b> obendrauf.':'. Die Form-Verstärkung gibt es erst ab ▲.')+'</p></div></div></section></div>';
  return h;
}
function profilSatz(p){var s=stufe(p.form),br=bremse(p.fat),t;
  if(s>=1)t='<b>'+esc(p.n)+'</b> spielt seit mehreren Einsätzen <b>über Erwartung</b>, deshalb '+STN[s+2]+'. Bleibt der Einsatz aus, fällt die Form je Spieltag um 15 % zur Mitte zurück.';
  else if(s<=-1)t='<b>'+esc(p.n)+'</b> blieb zuletzt <b>unter Erwartung</b>'+(br?' und ist erschöpft (Bremse −'+zahl(br,0)+')':'')+'. '+(br?'Eine Pause senkt die Erschöpfung und lässt die Form zur Mitte zurückkehren.':'Ohne Einsatz erholt sich die Form langsam zur Mitte.');
  else t='<b>'+esc(p.n)+'</b> spielt etwa wie erwartet'+(br?', die Erschöpfung ('+p.fat+') drückt aber auf den nächsten Einsatz':'')+'.';
  return t+' Form wirkt höchstens ±2 %, Moral höchstens ±0,7 %.'}

// ---------- Ansicht 4: Nach dem Spieltag ----------
function meldung(p){
  var e=H[p.n][JETZT-1],a=stufe(p.form),b=stufe(p.formN),df=p.formN-p.form,g,kurz;
  if(e==="V"){g="Verletzt: kein Einsatz, die Form wandert zur Mitte.";kurz="verletzt"}
  else if(!e){g="Kein Einsatz: die Form fällt um 15 % der Distanz zur Mitte zurück.";kurz="kein Einsatz"}
  else{var d=e[2]-e[1],br=bremse(e[3]||0);
    g='<b>'+e[0]+':</b> Leistung <b>'+e[2]+'</b> gegen erwartete <b>'+e[1]+'</b>, '+(d>=5?"klar über Erwartung":d>0?"knapp über Erwartung":d>-5?"knapp unter Erwartung":"klar unter Erwartung")+'.'+(br?' <b style="color:var(--acht)">Erschöpfung '+e[3]+'</b> bremst zusätzlich (−'+zahl(br,0)+').':"")+(a>=1&&df<-2&&d>-10?" Wer heiß ist, muss klar über Erwartung bleiben, sonst kühlt die Form ab.":"");kurz=e[0]+" "+vz(d,0)}
  var kopf=b>a?"Form gestiegen":b<a?"Form gefallen":df>1?"Form leicht gestiegen":df<-1?"Form leicht gefallen":"Form unverändert";
  return {p:p,a:a,b:b,df:df,g:g,kopf:kopf,kurz:kurz,titel:b===a?esc(p.n)+" bleibt "+STN[b+2]:esc(p.n)+": von "+STN[a+2]+" auf "+STN[b+2]}
}
function nachherHTML(){
  var l=SP.map(meldung).sort(function(x,y){return Math.abs(y.b-y.a)-Math.abs(x.b-x.a)||(y.b-y.a)-(x.b-x.a)||Math.abs(y.df)-Math.abs(x.df)});
  var top=l.slice(0,5),m=top[kl(Z.ein,0,top.length-1)],ef=m.df>=0?"var(--gut)":"var(--warn)";
  var h='<header class="hero"><div class="kul" style="background-image:url(\'../szenen/basketball/parkett.jpg\')"></div><div class="hk"><span class="crest"><img src="../team-logos/V-W.jpg" alt=""></span><div style="min-width:0">'+
    '<div class="mdw"><span class="t">Spieltag '+JETZT+' · abgeschlossen</span></div><h1>Nach dem Spieltag</h1><div class="sub"><b>Vigilante Wranglers</b> · was der Spieltag mit Form und Moral gemacht hat</div></div></div>'+
    '<div class="tabs"><div class="dtab an"><span class="ic">'+ic("d-basketball")+'</span><span style="min-width:0"><em>D1 · gegen Armageddon Aftermath</em><b>Basketball</b></span><span class="erw t"><strong class="plus">Sieg</strong><span>412 : 396</span></span></div>'+
    '<div class="dtab"><span class="ic">'+ic("d-spurt")+'</span><span style="min-width:0"><em>D2 · vier Teams</em><b>Spurt</b></span><span class="erw t"><strong>Platz 3</strong><span>von 4</span></span></div></div><div class="hr"></div></header>'+
    '<div class="work zwei nachher"><section class="pan"><div class="pk"><h2>Form-Meldungen</h2><span class="sp"></span><span class="hin">vorher → nachher · größte Bewegung zuerst</span></div>'+
    '<div class="mh"><span></span><span>Spieler</span><span>Form</span><span style="text-align:right">Wert</span><span>Warum</span></div><div class="kl">'+
    l.map(function(x){var p=x.p;return '<button class="mz'+(x===m?" an":"")+'" data-profil="'+esc(p.n)+'"><img src="'+por(p)+'" alt=""><span class="nm"><b>'+esc(p.n)+'</b><span>'+x.kurz+'</span></span>'+
      '<span class="ww">'+fIc(x.a,1)+ic("pfeil")+fIc(x.b,1)+'</span><span class="dz t '+kls(Math.round(x.df))+'">'+vz(x.df,0)+'</span><span class="gr">'+x.g+'</span></button>'}).join("")+'</div></section>'+
    '<section class="pan"><div class="pk"><h2>Moral</h2><span class="sp"></span><span class="hin">nur wer sich bewegt hat</span></div><div class="pkb">'+
    SP.filter(function(p){return MN[p.n][0]}).sort(function(a,b){return MN[b.n][0]-MN[a.n][0]}).map(function(p){var x=MN[p.n];return '<div class="ur" style="grid-template-columns:28px minmax(0,1fr) auto 38px"><img src="'+por(p)+'" alt="" style="width:28px;height:28px;border-radius:5px;object-fit:cover"><span class="ul">'+esc(p.n)+' <span style="color:var(--stumm);font-size:13.5px">· '+x[1]+'</span></span>'+
      '<span class="t" style="color:var(--stumm);font-size:14px">'+p.moral+' → '+p.moralN+'</span><b class="t '+kls(x[0])+'">'+vz(x[0],0)+'</b></div>'}).join("")+
    '<div class="hinweis">'+ic("info")+'<span><b>Was jetzt zu tun ist:</b> Karthogg und Krolach sind erschöpft und rutschen ab, eine Pause hilft doppelt. Gram verliert Moral, weil die Starter-Zusage nicht eingelöst wird.</span></div>'+
    '<div class="ab erg"><div class="rk" style="--pc:var(--gut)"><span class="gk">Heiß in Spieltag 8</span><h3>Kati, Aerin</h3><p>Beide <b>Social</b>: eine gelbe Formkarte bringt ihnen den Zusatz plus Form-Verstärkung.</p></div>'+
    '<div class="rk" style="--pc:var(--warn)"><span class="gk">Kalt</span><h3>Gram, Karthogg</h3><p>Karthogg schonen. Gram braucht Einsätze, die er <b>über Erwartung</b> beendet.</p></div></div></div></section></div>'+
    '<div class="einbl" style="--ef:'+ef+'"><span class="por"><img src="'+por(m.p)+'" alt=""></span><div class="tx"><em>'+m.kopf+' · Spieltag '+JETZT+'</em><b>'+m.titel+'</b><p>'+m.g+'</p></div>'+
    '<div class="re"><span class="pf">'+fIc(m.a)+ic("pfeil")+fIc(m.b)+'<span class="t '+kls(m.df)+'" style="font-weight:700;font-size:.8em">'+vz(m.df,0)+'</span></span><span class="nv t"><button data-ein="-1" aria-label="Vorige Meldung">'+ic("l")+'</button>'+(kl(Z.ein,0,top.length-1)+1)+' von '+top.length+'<button data-ein="1" aria-label="Nächste Meldung">'+ic("r")+'</button></span></div></div>';
  return h;
}

// ---------- Ansichten und Ereignisse ----------
function zeige(){
  zuWarum();delete document.body.dataset.blatt;
  var m=$("#main");
  if(Z.an==="liste"){m.innerHTML=listeHTML();zListe()}else if(Z.an==="profil")m.innerHTML=profilHTML();else m.innerHTML=nachherHTML();
  document.querySelectorAll("#demo button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.an===Z.an)});
  [["rListe","liste"],["rProfil","profil"],["rNach","nachher"]].forEach(function(x){$("#"+x[0]).classList.toggle("an",Z.an===x[1])});
  scrollTo(0,0);
}
function blatt(n){if(n)document.body.dataset.blatt=n;else delete document.body.dataset.blatt}
document.addEventListener("click",function(ev){
  var t=ev.target,e;
  if((e=t.closest("[data-wzu]"))||t.id==="schleier"){zuWarum();blatt("");return}
  if((e=t.closest("[data-warum]"))){ev.stopPropagation();var w=$("#warum");if(w.classList.contains("an")&&w.dataset.fest&&w.dataset.wer===e.dataset.warum){zuWarum();return}zeigeWarum(e.dataset.warum,e,true);w.dataset.wer=e.dataset.warum;return}
  if(!t.closest("#warum"))zuWarum();
  if((e=t.closest("[data-an]"))){Z.an=e.dataset.an;zeige();return}
  if((e=t.closest("[data-profil]"))){Z.prof=e.dataset.profil;Z.an="profil";zeige();return}
  if((e=t.closest("[data-ein]"))){Z.ein=(Z.ein+parseInt(e.dataset.ein,10)+5)%5;zeige();return}
  if((e=t.closest("[data-k]"))){legeKarte(e.dataset.k);return}
  if((e=t.closest("[data-d]"))){Z.d=e.dataset.d;Z.vor=null;Z.sel=null;zListe();return}
  if((e=t.closest("[data-blatt]"))){if(e.dataset.tab){Z.tab=e.dataset.tab;zKontext()}blatt(e.dataset.blatt);return}
  if((e=t.closest("[data-tab]"))){Z.tab=e.dataset.tab;zKontext();return}
  if((e=t.closest("[data-sp]"))){Z.sel=Z.sel===e.dataset.sp?null:e.dataset.sp;Z.tab=Z.sel?"form":Z.tab;zFeld();zKader();zKontext();if(Z.sel&&phone())blatt("kontext");return}
  if(t.closest("#bAb")){sag("Im Mockup wird nichts abgegeben.");return}
});
document.addEventListener("mouseover",function(ev){if(phone())return;var e=ev.target.closest("[data-warum]"),w=$("#warum");
  if(e){if(!(w.classList.contains("an")&&w.dataset.fest)){zeigeWarum(e.dataset.warum,e,false)}return}
  var k=ev.target.closest(".hka");if(k&&Z.an==="liste"&&Z.vor!==k.dataset.k&&!woKarte(k.dataset.k)){Z.vor=k.dataset.k;zListe("vor")}});
document.addEventListener("mouseout",function(ev){if(phone())return;var e=ev.target.closest("[data-warum]"),w=$("#warum");
  if(e&&!w.dataset.fest&&!(ev.relatedTarget&&ev.relatedTarget.closest&&ev.relatedTarget.closest("[data-warum]")===e))zuWarum();
  var k=ev.target.closest(".hka");if(k&&Z.vor&&!(ev.relatedTarget&&ev.relatedTarget.closest&&ev.relatedTarget.closest(".hka")===k)){Z.vor=null;if(Z.an==="liste")zListe("vor")}});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"){zuWarum();blatt("")}});
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get("still"))document.body.classList.add("still");
  function ph(){document.body.classList.toggle("phone",!!q.get("phone")||innerWidth<760)}
  ph();addEventListener("resize",function(){var v=phone();ph();if(v!==phone())zeige()});
  if(q.get("ansicht"))Z.an=q.get("ansicht");
  if(q.get("d"))Z.d=q.get("d");
  if(q.get("karten"))q.get("karten").split(",").forEach(function(x){var p=x.split("@");if(karte(p[0]))Z.kart[p[1]||Z.d].push(p[0])});
  if(q.get("spieler")){Z.prof=q.get("spieler");Z.sel=q.get("spieler")}
  if(q.get("tab"))Z.tab=q.get("tab");else if(Z.sel)Z.tab="form";
  if(q.get("ein"))Z.ein=parseInt(q.get("ein"),10)||0;
  zeige();
  if(q.get("blatt"))blatt(q.get("blatt"));
  if(q.get("warum")){var el=document.querySelector('.slot [data-warum="'+q.get("warum")+'"]')||document.querySelector('[data-warum="'+q.get("warum")+'"]');if(el){zeigeWarum(q.get("warum"),el,true);$("#warum").dataset.wer=q.get("warum")}}
})();
</script>
