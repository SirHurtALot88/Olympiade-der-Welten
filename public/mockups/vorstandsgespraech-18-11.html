<title>Vorstandsgespräch – Budgetfreigabe verhandeln (Mockup 18.11.)</title>
<!--
  VORSTANDSGESPRAECH, STAND 18.11.: der Manager verhandelt mit seinem Vorstand ueber die Budgetfreigabe der Saison.
  Erklaerung, Regeln und offene Fragen: docs/design/vorstandsgespraech-18-11.md
  Uebersetzt die Hebel aus lib/finance/vorstand-budgetfreigabe.ts (PR #1618) in ein Gespraech:
  Stufe anheben (Lockerung), Sonderbudget (Umschichten/Vorbehalt), Ruecklage anzapfen, Alles auf eine Karte,
  dazu der Notfall-Antrag in der Saison (Notruecklage vor Kredit; Notverkauf gibt es nur im Fenster).
  EIN gemeinsames Transferfenster vor Spieltag 1 (Kaufen und Verkaufen zugleich, Chris 18.11.): Verkaufserloese sind
  sofort zu 100 % frei. Am Saisonende nur Abrechnung und Verlaengerungen, in der Saison kein Handel.
  HOECHSTENS ZWEI GESPRAECHE JE SAISON (Chris 18.11.), das zweite auch in der Saison; der Notfall-Antrag zaehlt nicht mit.
  Gleiche Tokens, gleiche Schiene, gleicher Hero-Kopf, gleiche Tafel wie finanzen-modern-18-11.html und
  einsatzliste-modern-17-11.html. Kein App-Code, kein PixelLab (0 Generationen), keine neue Figur: alles CSS/SVG.
  ECHT: Teamnamen, Wappen, Finanzwert, Ambition, Start-Vertrauen (data/source/team-identities.json),
        Freigabe-Stufen 100/90/80/70/50, Gehalts-Untergrenze 75 %, Anzapfen bis 50 % und -0,25 Vertrauen je Viertel,
        Alles auf eine Karte ab Vertrauen 4 mit 5 % Puffer.
  VORSCHLAG (wird gemessen): Sparneigung = Finanzwert - max(0, Ambition - 5), Ruecklage 10 bis 75 % des Jahresgehalts.
  ERFUNDEN: Kasse, Gehaelter, erwarteter Ueberschuss, Saisonziel, die Punkte der Waage, die Notlagen, der Kreditrahmen.
        Der Gehaltspuffer (7 Spieltage) der echten Rechnung fehlt hier, damit der Balken drei Teile hat.
  URL: ?team=M-M|C-C|W-W  &ansicht=gespraech|notfall  &anliegen=stufe|sonder|ruecklage|alles  &betrag=<C>  &viertel=1|2
       &topf=transfer|gehalt  &biete=ziel,rueck,deckel,vertrauen  &antwort=1 (Antrag gleich stellen)  &annehmen=1
       &not=klein|gross|wunsch  &vk=<C, Verkaufserloes im Fenster>  &zeit=fenster|saison (2. Gespraech vor Spieltag 11)  &ctab=toepfe|vorstand|regeln  &phone=1  &still=1  &blatt=kontext
-->

.tabs{display:flex;align-items:flex-end;gap:10px;min-width:0}

.waage .kopf div:last-child{text-align:right}
.waage .urteil{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--flaeche-3);color:var(--leise);margin-bottom:3px;white-space:nowrap}

.waage .bar .a{background:var(--heim)} .waage .bar .b{background:var(--gut)} .waage .bar .c{background:rgba(255,96,88,.55);margin-left:auto}
.waage .teile{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13.5px;color:var(--leise)}
.waage .teile i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--pc)}
.waage .teile b{color:var(--tinte);font-weight:600}

/* Dock */
.dock{flex:none;display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 14px;border-top:1px solid var(--linie);background:var(--flaeche-2)}
.dock .pkt2{width:10px;height:10px;border-radius:50%;background:var(--acht);box-shadow:0 0 0 4px rgba(243,181,74,.18);flex:none}
.dock.ok .pkt2{background:var(--gut);box-shadow:0 0 0 4px rgba(98,211,148,.18)} .dock.nein .pkt2{background:var(--warn);box-shadow:0 0 0 4px rgba(255,96,88,.18)}
.dock .st{min-width:0;flex:1}
.dock .st b{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--creme)}
.dock .st span{display:block;font-size:14.5px;color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .sum{text-align:right;white-space:nowrap}
.dock .sum small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--stumm);font-weight:600}

.ab2{margin-top:14px} .ab2:first-child{margin-top:0}

    w:{ziel:5,rueck:5,deckel:4,vertrauen:3},rf:1,
    auf:"Ein gutes Geschäft hat zwei Seiten. Sag, was du brauchst und was du dafür gibst."},
  kassenwart:{name:"Der Kassenwart",kurz:"Schützt die Kasse. Will planbare Rückflüsse.",farbe:"var(--gast)",ic:"i-schild",
    w:{ziel:2,rueck:8,deckel:6,vertrauen:3},rf:1.6,
    auf:"Die Kasse ist unser Schutz. Was hinausgeht, soll planbar zurückkommen. Dann können wir reden."}
};
const ANL={
  stufe:{name:"Freigabe anheben",ic:"i-hoch",kosten:14},
  sonder:{name:"Sonderbudget",ic:"i-sack"},
  ruecklage:{name:"Notrücklage anzapfen",ic:"i-schild"},
  alles:{name:"Alles auf eine Karte",ic:"i-karte",kosten:20}
};
const OFF={
  ziel:{name:"Höheres Saisonziel",ic:"i-ziel"},
  rueck:{name:"Rückzahlung aus Verkäufen",ic:"i-rueck"},
  deckel:{name:"Gehaltsdeckel",ic:"i-deckel"},
  vertrauen:{name:"Vertrauen einsetzen",ic:"i-herz"}
};
const REIHE=["ziel","rueck","deckel","vertrauen"];

/* ============================== Zustand ============================== */
const P=new URLSearchParams(location.search);
const S={
  team:TEAMS[P.get("team")]?P.get("team"):"M-M",
  ans:P.get("ansicht")==="notfall"?"notfall":"gespraech",
  anl:ANL[P.get("anliegen")]?P.get("anliegen"):"stufe",
  betrag:+P.get("betrag")||0, viertel:P.get("viertel")==="2"?2:1, topf:P.get("topf")==="gehalt"?"gehalt":"transfer",
  biete:new Set((P.get("biete")||"").split(",").filter(k=>OFF[k])),
  vk:Math.max(0,+P.get("vk")||0), zeit:P.get("zeit")==="saison"?"saison":"fenster",
  phase:"entwurf", runde:1, antwort:null, vertrag:null,
  not:["klein","gross","wunsch"].includes(P.get("not"))?P.get("not"):"klein", notPhase:"entwurf",
  ctab:["toepfe","vorstand","regeln"].includes(P.get("ctab"))?P.get("ctab"):"toepfe"
};
if(P.get("phone")==="1")document.body.classList.add("phone");
if(P.get("still")==="1")document.body.classList.add("still");
if(P.get("blatt"))document.body.dataset.blatt=P.get("blatt");

/* ============================== Rechnung ============================== */
const $=id=>document.getElementById(id);
const f1=x=>(Math.round(x*10)/10).toFixed(1).replace(".",",");
const c=x=>f1(x)+" C";
const vz=x=>(x>0.04?"+":x<-0.04?"−":"±")+f1(Math.abs(x));
const pz=q=>Math.round(q*100)+" %";
const ic=n=>'<svg class="i"><use href="#'+n+'"/></svg>';
const klemm=(x,a,b)=>Math.max(a,Math.min(b,x));
const inSaison=()=>S.zeit==="saison";          /* zweites Gespraech, vor Spieltag 11: kein Handel */
const INV=()=>inSaison()?"Gebäude":"Ablösen";
function stufeVon(v){return STUFEN.find(s=>v>=s.ab)}
function naechste(q){const r=[.5,.7,.8,.9,1];return r.find(x=>x>q+1e-9)||1}

function basis(id){
  const t=TEAMS[id];
  const spar=t.fin-Math.max(0,t.amb-5);                 /* Sparneigung (Vorschlag) */
  const sparQ=.10+klemm(spar,0,10)/10*.65;              /* 10 bis 75 % des Jahresgehalts */
  const R=sparQ*t.jahr;                                 /* Ziel der Notruecklage */
  const gesp=Math.max(0,R-t.ueber);                     /* im Fenster gesperrt: nur was die Einnahmen nicht decken */
  const st=stufeVon(t.v);
  const ch=spar>=7?"kassenwart":spar>=3.5?"kaufmann":"antreiber";
  return {t,id,spar,sparQ,R,gesp,q:st.q,stufe:st.n,ch,C:CHAR[ch],verf:t.kasse-gesp,K0:Math.round(t.v*2)};
}
/* deal = {anl,betrag,viertel,topf,biete:Set} oder null (Stand ohne Gespraech) */
function toepfe(id,deal){
  const b=basis(id),t=b.t;
  let q=b.q,gesp=b.gesp,ang=0,sT=0,sG=0,alles=false;
  const hat=k=>deal&&deal.biete.has(k)&&frei(deal,k);
  if(deal){
    if(deal.anl==="stufe")q=naechste(q);
    if(deal.anl==="sonder"){if(deal.topf==="gehalt")sG=deal.betrag;else sT=deal.betrag}
    if(deal.anl==="ruecklage"){ang=Math.min(deal.viertel*.25*b.R,gesp);gesp-=ang}
    if(deal.anl==="alles")alles=true;
  }
  let transfer,vorb,gq,gehaltTopf;const vk=inSaison()?0:S.vk;   /* Verkaufserloes dieses Fensters: sofort zu 100 % frei */
  if(alles){q=1;gesp=0;transfer=t.kasse*.95+vk;vorb=t.kasse*.05;gq=1;gehaltTopf=t.tragbar}
  else{
    transfer=q*(b.verf+ang)+sT+vk;
    vorb=t.kasse+vk-gesp-transfer-sG;
    gq=q>=1?1:Math.max(.75,q);
    if(hat("deckel"))gq=b.q>=1?1:Math.max(.75,b.q);
    gehaltTopf=gq*t.tragbar+sG;
  }
  const v=t.v-(deal&&deal.anl==="ruecklage"?.25*deal.viertel:0)-(hat("vertrauen")?.25:0);
  const ziel=Math.max(1,t.ziel-(alles?2:0)-(hat("ziel")?1:0));
  return {q,gesp,ang,transfer,vorb,sG,gq,gehaltTopf,gehaltFrei:gehaltTopf-t.gehaltIst,v,ziel,alles,kasse:t.kasse+vk,vk};
}
/* Welche Gegenleistung passt zu welchem Anliegen */
function frei(deal,k){
  if(inSaison()&&k==="rueck")return false;                 /* in der Saison wird nicht verkauft */
  if(deal.anl==="alles"&&(k==="ziel"||k==="deckel"))return false;
  if(deal.anl==="sonder"&&deal.topf==="gehalt"&&k==="deckel")return false;
  return true;
}
function maxSonder(id){return Math.max(1,Math.floor(toepfe(id,null).vorb))}   /* der Vorbehalt haengt nicht an Verkaeufen */
function kostenVon(id,deal){
  const b=basis(id);
  if(deal.anl==="sonder")return 4+10*deal.betrag/maxSonder(id);
  if(deal.anl==="ruecklage")return deal.viertel*5*b.C.rf;
  return ANL[deal.anl].kosten;
}
function bewerte(id,deal){
  const b=basis(id),w=b.C.w;
  const teile=[{n:"Vertrauen "+f1(b.t.v),p:b.K0,f:"var(--heim)"}];
  let gewicht=b.K0;
  REIHE.forEach(k=>{if(deal.biete.has(k)&&frei(deal,k)){gewicht+=w[k];teile.push({n:OFF[k].name,p:w[k],f:"var(--gut)"})}});
  const kosten=kostenVon(id,deal);
  const score=gewicht-kosten;
  let hart=null;
  if(deal.anl==="stufe"&&b.q>=1)hart="Du hast schon die volle Freigabe. Mehr als 100 % gibt es nur mit „Alles auf eine Karte“.";
  if(deal.anl==="alles"&&inSaison())hart="„Alles auf eine Karte“ gibt es nur im Transferfenster. In der Saison kannst du um ein Sonderbudget oder eine Stufe bitten.";
  else if(deal.anl==="alles"&&b.t.v<4)hart="„Alles auf eine Karte“ gibt es erst ab Vertrauen 4,0. Du stehst bei "+f1(b.t.v)+". Erfülle erst ein Saisonziel, dann reden wir.";
  if(deal.anl==="ruecklage"&&b.gesp<=0)hart="Die Rücklage ist in diesem Fenster gar nicht gesperrt, die erwarteten Einnahmen decken sie.";
  let art=hart?"nein":score>=-1e-9?"ok":score>=-10?"gegen":"nein";
  /* Gegenangebot: die liebsten fehlenden Gegenleistungen dieses Vorstands, bis es reicht */
  const fordert=[];let altBetrag=0;
  if(art==="gegen"){
    let rest=-score;
    REIHE.filter(k=>!deal.biete.has(k)&&frei(deal,k)).sort((a,z)=>w[z]-w[a]).forEach(k=>{if(rest>1e-9){fordert.push(k);rest-=w[k]}});
    if(rest>1e-9){art="nein"}
    if(deal.anl==="sonder"){altBetrag=Math.floor((gewicht-4)/10*maxSonder(id));if(altBetrag<1||altBetrag>=deal.betrag)altBetrag=0}
  }
  return {b,teile,gewicht,kosten,score,art,hart,fordert,altBetrag};
}
function deal(){return {anl:S.anl,betrag:S.betrag,viertel:S.viertel,topf:S.topf,biete:new Set(S.biete)}}
function mehrFrei(id,d){const a=toepfe(id,null),n=toepfe(id,d);return {tr:n.transfer-a.transfer,ge:n.gehaltFrei-a.gehaltFrei,ang:n.ang}}

/* ============================== Texte ============================== */
function antragSatz(id,d){
  const b=basis(id),n=toepfe(id,d),m=mehrFrei(id,d);
  let s="";
  if(d.anl==="stufe")s="Ich bitte um eine Stufe mehr Freigabe: <b>"+pz(b.q)+" → "+pz(n.q)+"</b>. Das macht <b>"+c(m.tr)+"</b> mehr für "+INV()+""+(m.ge>0.05?" und <b>"+c(m.ge)+"</b> mehr Gehaltsbudget":"")+".";
  if(d.anl==="sonder")s="Ich bitte um ein Sonderbudget von <b>"+c(d.betrag)+"</b> aus dem Vorbehalt, für "+(d.topf==="gehalt"?"<b>Gehälter</b>"+(inSaison()?" (Verlängerungen am Saisonende)":""):inSaison()?"<b>Gebäude</b>":"<b>Ablösen und Gebäude</b>")+". Die Stufe bleibt bei "+pz(b.q)+".";
  if(d.anl==="ruecklage")s="Ich möchte <b>"+(d.viertel*25)+" %</b> der Notrücklage anzapfen (<b>"+c(n.ang)+"</b>). Davon werden zur Quote <b>"+c(m.tr)+"</b> frei. Mir ist klar, dass das <b>"+f1(d.viertel*.25)+" Vertrauen</b> kostet.";
  if(d.anl==="alles")s="Ich will <b>alles auf eine Karte</b> setzen: 100 % Freigabe, die Rücklage wird frei, nur 5 % bleiben als Puffer. Dafür gilt das Ziel <b>Platz "+n.ziel+"</b>.";
  const o=REIHE.filter(k=>d.biete.has(k)&&frei(d,k)).map(k=>OFF[k].name);
  if(o.length)s+=" Dafür biete ich: <b>"+o.join("</b>, <b>")+"</b>.";
  return s;
}
function offText(id,d,k){
  const b=basis(id),m=mehrFrei(id,d),t=b.t;
  const x=Math.max(m.tr,m.ang,d.anl==="sonder"?d.betrag:0);
  if(k==="ziel")return "Saisonziel Platz "+t.ziel+" → Platz "+(t.ziel-1)+". Verfehlt: −0,5 Vertrauen.";
  if(k==="rueck")return "Verkaufst du in diesem Fenster, geht die Hälfte des Erlöses zurück in den Vorbehalt, bis "+c(x)+" zurück sind.";
  if(k==="deckel")return "Das Gehaltsbudget wächst diese Saison nicht mit ("+c(toepfe(id,null).gehaltTopf)+" bleiben).";
  return "Sofort −0,25 Vertrauen. Wirkt bei der nächsten Festlegung der Stufe.";
}
function antwortText(id,d,r){
  const b=r.b,ch=b.ch;
  if(r.hart)return "<p>"+r.hart+"</p>";
  if(r.art==="ok"){
    const s={antreiber:"Abgemacht. Hol uns damit nach vorn.",kaufmann:"Einverstanden. Das ist für beide Seiten sauber.",kassenwart:"Gut. So bleibt die Kasse geschützt, und du bekommst deinen Spielraum."}[ch];
    return "<p>"+s+"</p>";
  }
  if(r.art==="gegen"){
    const s={antreiber:"So viel Geld ohne mehr Anspruch? Nicht mit mir.",kaufmann:"Fast. Mir fehlt noch etwas auf deiner Seite.",kassenwart:"Ich sehe noch nicht, wie das Geld zurückkommt."}[ch];
    return "<p>"+s+" Ich gehe mit, wenn du dazu Folgendes zusagst:</p><ul>"+r.fordert.map(k=>"<li>"+ic(OFF[k].ic)+"<span><b>"+OFF[k].name+"</b> · "+offText(id,d,k)+"</span></li>").join("")+"</ul>"+
      (r.altBetrag?"<p>Oder ohne weitere Bedingung: <b>"+c(r.altBetrag)+"</b> statt "+c(d.betrag)+".</p>":"");
  }
  const s={antreiber:"Das ist mir bei deinem Stand zu viel auf einmal.",kaufmann:"Das liegt zu weit auseinander, da hilft auch kein Gegenangebot.",kassenwart:d.anl==="ruecklage"?"Die halbe Rücklage für einen Wunsch gebe ich nicht her.":"Das ist mir zu viel Risiko für die Kasse."}[ch];
  return "<p>"+s+" Dir fehlen <b>"+Math.ceil(-r.score)+" Punkte</b>, und mehr als das hier kannst du mir nicht anbieten.</p>"+
    (d.anl==="ruecklage"?"<p>Ein Viertel ist verhandelbar. Und in einer echten <b>Notlage</b> bekommst du die Rücklage ohne Abzug.</p>":"<p>Bitte um weniger, oder komm mit mehr Vertrauen wieder.</p>");
}

/* ============================== Zeichnen ============================== */
function zeichne(){
  const id=S.team,b=basis(id),t=b.t,a=toepfe(id,null);
  if(S.anl==="sonder"){const mx=maxSonder(id);if(!S.betrag)S.betrag=Math.min(mx,Math.max(1,Math.round(mx*.65)));S.betrag=klemm(S.betrag,1,mx)}
  $("raillogo").src="../team-logos/"+id+".jpg";
  /* Mockup-Leiste */
  const db=(l,on,fn)=>'<button aria-pressed="'+on+'" data-d="'+fn+'">'+l+'</button>';
  $("demo").innerHTML="<b>Mockup</b>"+Object.keys(TEAMS).map(k=>db(TEAMS[k].name+" · "+CHAR[basis(k).ch].name.replace("Der ",""),k===id,"team:"+k)).join("")+"<i></i>"+
    db("2. Gespräch · Spieltag 11",inSaison(),"zeit")+"<i></i>"+
    db("Zustimmung",false,"fall:ok")+db("Gegenangebot",false,"fall:gegen")+db("Ablehnung",false,"fall:nein")+"<i></i>"+
    db("Notfall klein",false,"not:klein")+db("Notfall groß",false,"not:gross")+db("Nur ein Wunsch",false,"not:wunsch")+"<i></i>"+
    db("Phone",document.body.classList.contains("phone"),"phone");
  /* Kopf */
  $("hk").innerHTML='<div class="crest"><img src="../team-logos/'+id+'.jpg" alt=""></div><div><div class="mdw"><span>Saison 3 · '+(S.ans==="notfall"?"Spieltag 11 von 20":inSaison()?"Vor Spieltag 11 von 20":"Transferfenster vor Spieltag 1")+'</span></div><h1>Vorstandsgespräch</h1><div class="sub"><b>'+t.name+'</b> · Finanzwert '+f1(t.fin)+' · Ambition '+f1(t.amb)+'</div></div>';
  $("tabs").innerHTML=
    '<button class="dtab'+(S.ans==="gespraech"?" an":"")+'" role="tab" data-a="ans:gespraech"><span class="ic">'+ic("i-hand")+'</span><span><em>'+(inSaison()?"In der Saison":"Transferfenster")+' · Gespräch '+(inSaison()?2:1)+' von 2</em><b>Budget verhandeln</b></span><span class="erw"><strong class="t">'+pz(a.q)+'</strong><span>FREIGABE</span></span></button>'+
    '<button class="dtab'+(S.ans==="notfall"?" an":"")+'" role="tab" data-a="ans:notfall"><span class="ic">'+ic("i-schild")+'</span><span><em>Jederzeit · zählt nicht als Gespräch</em><b>Notfall-Antrag</b></span><span class="erw"><strong class="t">'+f1(b.R)+'</strong><span>RÜCKLAGE C</span></span></button>';
  $("hr").innerHTML='<div class="frist"><span class="gk">Vertrauen</span><strong class="t">'+f1(t.v)+' · Stufe '+b.stufe+'</strong></div><a class="btn" href="finanzen-modern-18-11.html?ansicht=budget">'+ic("i-geld")+' Zur Finanzseite</a>';
  $("haupt").innerHTML=S.ans==="notfall"?notfall(id):gespraech(id);
  kontext(id);
  const gc=document.querySelector(".gc");if(gc&&S.phase!=="entwurf")gc.scrollTop=gc.scrollHeight;
}

function blase(wer,html,kl){
  const id=S.team,b=basis(id);
  if(wer==="ich")return '<div class="bl ich '+(kl||"")+'"><div class="tx"><div class="wer"><span>Du · Manager</span></div>'+html+'</div><div class="av ich">'+ic("i-ich")+'</div></div>';
  return '<div class="bl '+(kl||"")+'"><div class="av"><img src="../team-logos/'+id+'.jpg" alt=""></div><div class="tx"><div class="wer"><span>Vorstand · '+b.C.name+'</span><span class="sp"></span>'+
    (kl==="ok"?'<span class="marke gut gross">ZUSTIMMUNG</span>':kl==="gegen"?'<span class="marke acht gross">GEGENANGEBOT</span>':kl==="nein"?'<span class="marke rot gross">ABLEHNUNG</span>':"")+'</div>'+html+'</div></div>';
}
function waage(r,fest){
  const ges=Math.max(r.gewicht,r.kosten,1);
  const u=r.hart?["nein","geht nicht"]:r.art==="ok"?["ok","reicht"]:r.art==="gegen"?["gegen","fehlt "+Math.ceil(-r.score)]:["nein","fehlt "+Math.ceil(-r.score)];
  return '<div class="waage"><div class="kopf"><div><small>Dein Gewicht</small><strong class="t">'+f1(r.gewicht)+'</strong></div><span class="urteil '+u[0]+'">'+(fest?"":"Einschätzung · ")+u[1]+'</span><div><small>Verlangt für dieses Anliegen</small><strong class="t">'+f1(r.kosten)+'</strong></div></div>'+
    '<div class="bar">'+r.teile.map((x,i)=>'<i class="'+(i?"b":"a")+'" style="width:'+(x.p/ges*100)+'%"></i>').join("")+(r.score<0?'<i class="c" style="width:'+(-r.score/ges*100)+'%"></i>':"")+'</div>'+
    '<div class="teile">'+r.teile.map(x=>'<span><i style="--pc:'+x.f+'"></i>'+x.n+' <b class="t">'+f1(x.p)+'</b></span>').join("")+(r.score<0?'<span><i style="--pc:rgba(255,96,88,.55)"></i>fehlt <b class="t">'+f1(-r.score)+'</b></span>':"")+'</div></div>';
}

function gespraech(id){
  const b=basis(id),t=b.t,d=deal(),r=bewerte(id,d),a=toepfe(id,null),m=mehrFrei(id,d),w=b.C.w;
  const zu=S.phase!=="entwurf";
  /* 1 Anliegen */
  const kurz={
    stufe:b.q>=1?"Schon bei 100 %.":"Eine Stufe mehr: "+pz(b.q)+" → "+pz(naechste(b.q))+". Gilt für die ganze Saison.",
    sonder:"Einmaliger Betrag aus dem Vorbehalt (bis "+c(maxSonder(id))+"). Die Stufe bleibt.",
    ruecklage:"Bis 50 % des Ziels. Kostet 0,25 Vertrauen je Viertel.",
    alles:inSaison()?"Nur im Transferfenster.":t.v<4?"Erst ab Vertrauen 4,0.":"100 %, Rücklage frei, Ziel zwei Plätze höher. Einmal je Saison."
  };
  const anl=Object.keys(ANL).map(k=>'<button class="anl'+(S.anl===k?" an":"")+((k==="alles"&&(t.v<4||inSaison()))||(k==="stufe"&&b.q>=1)?" zu":"")+'" data-a="anl:'+k+'"><span class="ic">'+ic(ANL[k].ic)+'</span><span><b>'+ANL[k].name+'</b><span>'+kurz[k]+'</span></span></button>').join("");
  let stell="";
  if(S.anl==="sonder"){const mx=maxSonder(id);
    stell='<div class="stell"><strong class="t">'+c(S.betrag)+'</strong><input type="range" min="1" max="'+mx+'" step="1" value="'+S.betrag+'" data-i="betrag" aria-label="Betrag"'+(zu?" disabled":"")+'><span class="seg"><button aria-pressed="'+(S.topf==="transfer")+'" data-a="topf:transfer">'+INV()+'</button><button aria-pressed="'+(S.topf==="gehalt")+'" data-a="topf:gehalt">Gehalt</button></span></div>';}
  else if(S.anl==="ruecklage")
    stell='<div class="stell"><strong class="t">'+c(toepfe(id,d).ang)+'</strong><span class="seg"><button aria-pressed="'+(S.viertel===1)+'" data-a="viertel:1">ein Viertel</button><button aria-pressed="'+(S.viertel===2)+'" data-a="viertel:2">die Hälfte</button></span><span class="sp"></span><span>von '+c(b.gesp)+' gesperrt · Ziel '+c(b.R)+'</span></div>';
  else if(S.anl==="stufe")
    stell='<div class="stell"><strong class="t">'+pz(naechste(b.q))+'</strong><span>'+INV()+' <b class="plus t">'+vz(m.tr)+' C</b> · Gehaltsbudget <b class="'+(m.ge>0.05?"plus":"null")+' t">'+vz(m.ge)+' C</b></span><span class="sp"></span><span>'+(inSaison()?"Gilt bis zur nächsten Festlegung der Stufe":"Verkaufserlöse sind ohnehin sofort zu 100 % frei")+'</span></div>';
  else
    stell='<div class="stell"><strong class="t">100 %</strong><span>Ablösen <b class="plus t">'+vz(m.tr)+' C</b> · nur 5 % Puffer · Ziel <b>Platz '+toepfe(id,d).ziel+'</b></span><span class="sp"></span><span>Treffer +0,75 · verfehlt −1,0 Vertrauen</span></div>';
  /* 2 Gegenleistungen */
  const offs=REIHE.map(k=>{const ok=frei(d,k),an=S.biete.has(k)&&ok;
    return '<button class="off'+(an?" an":"")+'" data-a="biete:'+k+'"'+(ok?"":" disabled")+' aria-pressed="'+an+'"><span class="hk3">'+ic("i-ok")+'</span><span class="ic">'+ic(OFF[k].ic)+'</span><span><b>'+OFF[k].name+'</b><span>'+(ok?offText(id,d,k):inSaison()&&k==="rueck"?"In der Saison wird nicht verkauft.":"Passt nicht zu diesem Anliegen.")+'</span></span><span class="gew"><strong class="t">+'+w[k]+'</strong><span class="pkt">'+[1,2,3,4].map(i=>'<i class="'+(w[k]>=i*2?"v":"")+'"></i>').join("")+'</span></span></button>'}).join("");
  /* 3 Gespraech */

    chat+=blase("vorstand",antwortText(id,A.d,A.r)+akt,A.r.art);
    if(S.phase==="vereinbart"){
      const V=S.vertrag,n=toepfe(id,V),mv=mehrFrei(id,V);

      const auf=REIHE.filter(k=>V.biete.has(k)&&frei(V,k)).map(k=>"<li>"+ic(OFF[k].ic)+"<span><b>"+OFF[k].name+"</b> · "+offText(id,V,k)+"</span></li>").join("");
      chat+=blase("vorstand","<p><b>Vereinbart und im Protokoll.</b> Die Töpfe sind angepasst, die Kaufsperre rechnet ab sofort damit.</p><ul>"+pos.map(x=>'<li class="gut">'+ic("i-ok")+"<span>"+x+"</span></li>").join("")+auf+
        (V.anl==="ruecklage"?'<li class="rot">'+ic("i-herz")+"<span><b>Vertrauen −"+f1(V.viertel*.25)+"</b> · wirkt bei der nächsten Festlegung</span></li>":"")+"</ul>","ok");
    }
    if(S.phase==="beendet")chat+=blase("vorstand","<p>Dann bleibt es bei <b>"+pz(b.q)+"</b>. Vertrauen kostet das nicht, aber das Gespräch ist verbraucht. "+(inSaison()?"Das war das zweite. Das nächste gibt es in der neuen Saison.":"Eines hast du diese Saison noch, auch mitten in der Saison.")+" Der Notfall-Antrag bleibt immer offen.</p>");
  }
  /* Dock */

  }else if(S.phase==="antwort"){

/* ---------- Notfall ---------- */
function notlage(id){
  const b=basis(id),t=b.t;
  const stand=b.gesp+(b.R-b.gesp)*11/20;                         /* bis Spieltag 11 angespart */
  const L={
    klein:{name:"Sponsor-Rate fällt aus",txt:"Der Hauptsponsor zahlt die Rate für Spieltag 11 nicht. Nach der Gehaltsbuchung wäre die Kasse im Minus.",fehl:Math.round(stand*.65),krit:[true,false]},
    gross:{name:"Einnahmen brechen ein",txt:"Niederlagenserie, leere Ränge, dazu ein Schaden an der Arena. Die Gehälter bis zum Saisonende sind nicht mehr gedeckt.",fehl:Math.round(stand+8),krit:[true,true]},
    wunsch:{name:"Trainingszentrum ausbauen",txt:"Der Ausbau wäre jetzt günstig zu haben. Im Investitionstopf fehlen 14 C.",fehl:14,krit:[false,false]}
  };
  const l=L[S.not],ist=l.krit.some(Boolean);
  /* In der Saison gibt es keinen Handel: die Leiter endet beim Kredit. Erst der zinsfreie Rahmen, dann ein Kredit. */
  const s1=ist?Math.min(l.fehl,stand):0,s2=ist?l.fehl-s1:0,s3=0;
  return {b,t,L,l,ist,stand,s1,s2,s3};
}
function notfall(id){

  const kn=["Die Kasse fällt nach der Spieltagsbuchung unter 0","Die Gehälter bis zum Saisonende sind nicht gedeckt"];
  const pruef=kn.map((x,i)=>'<div class="'+(l.krit[i]?"ja":"")+'">'+ic(l.krit[i]?"i-ok":"i-x")+'<span>'+x+'</span></div>').join("");
  const st=(nr,kl,name,txt,wert,max,sub)=>'<div class="stufe '+kl+(wert>0.04?"":" aus")+'"><span class="nr">'+nr+'</span><div><b>'+name+'</b><span>'+txt+'</span></div><div class="bt"><strong class="t">'+(wert>0.04?c(wert):"0 C")+'</strong><small>'+sub+'</small></div><div class="fort"><i style="width:'+(max>0?klemm(wert/max*100,0,100):0)+'%"></i></div></div>';
  const leiter='<div class="leiter">'+
    st(1,"s1","Notrücklage","Der Vorstand gibt sie frei. Kein Vertrauensverlust, keine Gegenforderung.",N.s1,N.stand,"von "+c(N.stand))+
    st(2,"s2","Kredit","Erst der zinsfreie Rahmen, dann ein Kredit. Nur für den Rest.",N.s2,Math.max(N.t.rahmen,N.s2),"Rahmen "+c(N.t.rahmen))+
    st(3,"s3","Notverkauf","In der Saison gibt es keinen Handel. Verkauft wird frühestens im nächsten Transferfenster.",0,l.fehl,"nur im Fenster")+'</div>';
  const auf={antreiber:"Dafür ist die Rücklage da. Nimm sie und bleib im Rennen.",kaufmann:"Genau für diesen Fall liegt das Geld bereit.",kassenwart:"Dafür haben wir gespart. Lieber die Rücklage als ein Kredit."}[b.ch];
  let chat=blase("vorstand","<p>"+(N.ist?auf:"Erzähl. Aber ich sage gleich: die Notrücklage ist für Geldnotlagen da, nicht für Gelegenheiten.")+"</p>");
  let dock;
  if(!zu){
    chat+=blase("ich","<p><b>Notfall-Antrag:</b> "+l.txt+" Es fehlen <b>"+c(l.fehl)+"</b>.</p>","entw");
    dock=['Notfall-Antrag im Entwurf',N.ist?"Anerkannte Notlage. Der Vorstand muss freigeben.":"Keine anerkannte Notlage. Der Vorstand wird ablehnen.",N.ist?"ok":"nein",'<button class="btn nurphone" data-a="blatt">'+ic("i-geld")+' Töpfe</button><button class="btn ja" data-a="notstellen">'+ic("i-blitz")+' Notfall-Antrag stellen</button>'];
  }else{
    chat+=blase("ich","<p><b>Notfall-Antrag:</b> "+l.txt+" Es fehlen <b>"+c(l.fehl)+"</b>.</p>");
    if(N.ist){
      chat+=blase("vorstand","<p><b>Freigegeben.</b> "+(N.s2>0.04?"Die Rücklage reicht nicht ganz, den Rest decken wir über den Rahmen.":"Die Rücklage deckt alles. Kein Kredit.")+"</p><ul>"+
        '<li class="gut">'+ic("i-schild")+"<span><b>"+c(N.s1)+"</b> aus der Notrücklage, sofort auf dem Konto</span></li>"+
        (N.s2>0.04?"<li>"+ic("i-kredit")+"<span><b>"+c(N.s2)+"</b> aus dem zinsfreien Rahmen</span></li>":"")+
        '<li class="gut">'+ic("i-herz")+"<span>Vertrauen bleibt bei <b>"+f1(N.t.v)+"</b>, Stufe bleibt "+pz(b.q)+"</span></li>"+
        "<li>"+ic("i-rueck")+"<span>Die Rücklage wird ab jetzt wieder angespart. Bis sie zur Hälfte steht, gibt es keine Lockerung.</span></li></ul>","ok");
      dock=["Freigegeben","Notrücklage "+c(N.s1)+(N.s2>0.04?", Rahmen "+c(N.s2):"")+". Die Stufe bleibt.","ok",'<button class="btn" data-a="notneu" data-tip="Nur im Mockup: zurücksetzen">Neu beginnen</button>'];
    }else{
      chat+=blase("vorstand","<p>Das ist <b>keine Notlage</b>. Die Kasse ist im Plus, die Gehälter sind gedeckt. Die Rücklage bleibt zu.</p><p>Im nächsten Transferfenster kannst du sie regulär anzapfen: bis zur Hälfte, für 0,25 Vertrauen je Viertel. Oder du verkaufst dort jemanden, der Erlös ist sofort voll frei.</p>","nein");
      dock=["Abgelehnt","Keine anerkannte Notlage. Kein Vertrauensverlust.","nein",'<button class="btn" data-a="notneu" data-tip="Nur im Mockup: zurücksetzen">Neu beginnen</button>'];

    '<div class="gs"><div class="gl'+(zu?" gesperrt":"")+'">'+
      '<div class="ab"><div class="gk"><span><b>1</b>Was ist passiert</span><em>im Mockup wählbar</em></div><div class="lagen">'+lagen+'</div></div>'+
      '<div class="ab"><div class="gk"><span><b>2</b>Ist das eine Notlage</span><em>Geldnotlage · eine der zwei reicht</em></div><div class="pruef">'+pruef+'</div></div>'+
      '<div class="ab"><div class="gk"><span><b>3</b>Wer zahlt die '+c(l.fehl)+'</span><em>von oben nach unten</em></div>'+leiter+'</div>'+
    '</div><div class="gc">'+chat+'</div></div>'+
    '<div class="dock '+dock[2]+'"><span class="pkt2"></span><div class="st"><b>'+dock[0]+'</b><span>'+dock[1]+'</span></div><div class="sum"><small>Fehlbetrag</small><strong class="t" style="color:var(--warn)">'+c(l.fehl)+'</strong></div><div class="sum"><small>Aus der Rücklage</small><strong class="t" style="color:var(--ruec)">'+c(N.s1)+'</strong></div>'+dock[3]+'</div>';
}

/* ---------- Kontext ---------- */
function kbar(titel,x,vor){
  const seg=(k,w,l)=>w>0.04?'<i class="'+k+'" style="flex:0 0 '+(w/x.kasse*100)+'%" data-tip="'+l+' '+c(w)+'">'+(w/x.kasse>.09?f1(w):"")+'</i>':"";
  return '<div class="kbar'+(vor?" vor":"")+'"><div class="ti"><span>'+titel+'</span><b class="t">Kasse '+c(x.kasse)+'</b></div><div class="ba">'+seg("f",Math.min(x.transfer,x.kasse),"Frei für Ablösen und Gebäude")+seg("g",x.sG,"Für Gehälter vorgemerkt")+seg("v",Math.max(0,x.vorb),"Vorbehalt des Vorstands")+seg("r",x.gesp,"Notrücklage, gesperrt")+'</div></div>';
}

        '<div class="lg"><span><i style="--pc:var(--frei)"></i>frei</span><span><i style="--pc:var(--vorb)"></i>Vorbehalt</span><span><i style="--pc:var(--ruec)"></i>Notrücklage</span></div></div>'+
        '<div class="ab2"><div class="gk"><span>Stand der Notrücklage</span></div><div class="rech"><div><small>Ziel</small><strong class="t">'+f1(b.R)+'</strong></div><div><small>angespart</small><strong class="t">'+f1(N.stand)+'</strong></div><div class="su"><small>nach Antrag</small><strong class="t">'+f1(N.stand-(an?N.s1:0))+'</strong></div></div></div>'+
        '<div class="hinw" style="--pc:var(--ruec)"><b>Kein Vertrauensverlust.</b> Eine anerkannte Notlage kostet nichts und braucht keine Gegenleistung. Der Vorstand hat hier kein Ermessen.</div>';

    h=(inSaison()?'<div class="hinw" style="--pc:var(--gold);margin:0 0 14px"><b>Gespräch 2 von 2, vor Spieltag 11.</b> Kein Handel in der Saison: mehr Freigabe wirkt jetzt auf Gebäude und auf das Gehaltsbudget der Verlängerungen am Saisonende.</div>':"")+'<div class="ab2"'+(inSaison()?' style="display:none"':"")+'><div class="gk"><span>Verkauft in diesem Fenster</span><em>im Mockup wählbar</em></div><div class="stell" style="margin:0;min-height:44px"><span class="seg"><button aria-pressed="'+(S.vk===0)+'" data-a="vk:0">nichts</button><button aria-pressed="'+(S.vk===12)+'" data-a="vk:12">ein Spieler · 12 C</button></span><span class="sp"></span><span>Erlös sofort <b class="plus">zu 100 % frei</b></span></div></div>'+
      '<div class="ab2"><div class="gk"><span>Vorschau der Töpfe</span><em>'+titel+'</em></div>'+kbar("Heute",a,true)+kbar(titel,n,false)+
      '<div class="lg"><span><i style="--pc:var(--frei)"></i>frei für '+INV()+'</span>'+(n.sG>0?'<span><i style="--pc:var(--gehv)"></i>Gehalt vorgemerkt</span>':"")+'<span><i style="--pc:var(--vorb)"></i>Vorbehalt</span><span><i style="--pc:var(--ruec)"></i>Notrücklage</span></div></div>'+
      '<div class="ab2"><div class="vn kopf"><span>Was sich ändert</span><span>heute</span><span>danach</span><span>Δ</span></div>'+
        z("Freigabe",a.q,n.q,pz,true)+z("Transfertopf frei",a.transfer,n.transfer,f1,true)+z("Gehaltsbudget frei",a.gehaltFrei,n.gehaltFrei,f1,true)+
        z("Vorbehalt",a.vorb,n.vorb,f1,false)+z("Notrücklage gesperrt",a.gesp,n.gesp,f1,true)+z("Vertrauen",a.v,n.v,f1,true)+
        '<div class="vn"><span>Saisonziel</span><span class="vo t">Platz '+a.ziel+'</span><span class="na t">Platz '+n.ziel+'</span><span class="de t '+(n.ziel<a.ziel?"minus":"null")+'">'+(n.ziel<a.ziel?"härter":"·")+'</span></div></div>';
    const sn=stufeVon(n.v);
    if(sn.q<b.q)h+='<div class="hinw" style="--pc:var(--warn)"><b>Achtung, nächste Saison.</b> Mit Vertrauen '+f1(n.v)+' fällst du bei der nächsten Festlegung auf Stufe '+sn.n+' ('+pz(sn.q)+'). Diese Saison bleibt die Stufe.</div>';

  }else if(S.ctab==="vorstand"){
    const w=b.C.w;
    h='<div class="geg" style="--pc:'+b.C.farbe+'"><span class="ic">'+ic(b.C.ic)+'</span><div><b>'+b.C.name+'</b><span>'+b.C.kurz+'</span></div></div>'+
      '<div class="ab2"><div class="gk"><span>Sparneigung</span><em>Vorschlag, wird gemessen</em></div><div class="formel">Finanzwert '+f1(t.fin)+' − max(0, Ambition '+f1(t.amb)+' − 5) = <b>'+f1(b.spar)+'</b>\nRücklage '+pz(b.sparQ)+' von '+c(t.jahr)+' Jahresgehalt = <b>'+c(b.R)+'</b>\n<em>davon decken erwartete Einnahmen '+c(Math.min(t.ueber,b.R))+', gesperrt im Fenster</em> <b>'+c(b.gesp)+'</b></div></div>'+
      '<div class="ab2"><div class="gk"><span>Freigabe nach Vertrauen</span><em>Vertrauen '+f1(t.v)+'</em></div><div class="stl">'+STUFEN.slice().reverse().map(s=>'<div class="'+(s.q===b.q?"an":"")+'"><strong class="t">'+Math.round(s.q*100)+'</strong><small>'+(s.ab<0?"unter 1,5":"ab "+f1(s.ab))+'</small></div>').join("")+'</div></div>'+
      '<div class="ab2"><div class="gk"><span>Was ihm eine Zusage wert ist</span><em>Punkte auf der Waage</em></div>'+REIHE.map(k=>'<div class="wz"><span>'+OFF[k].name+'</span><span class="bk"><i style="width:'+(w[k]/8*100)+'%"></i></span><strong class="t">'+w[k]+'</strong></div>').join("")+
      '<div class="wz"><span>Dein Vertrauen × 2</span><span class="bk"><i style="width:'+klemm(b.K0/20*100,0,100)+'%;background:var(--heim)"></i></span><strong class="t">'+b.K0+'</strong></div></div>'+
      '<div class="hinw" style="--pc:'+b.C.farbe+'"><b>Kein Würfel.</b> Die Antwort steht fest, sobald Anliegen und Angebot stehen. Du siehst sie vor dem Antrag als Einschätzung.</div>';
  }else{
    const kl=(nr,k,name,txt)=>'<div class="stufe klein '+k+'"><span class="nr">'+nr+'</span><div><b>'+name+'</b><span>'+txt+'</span></div></div>';
    h='<div class="ab2"><div class="gk"><span>In der Not gilt diese Reihenfolge</span><em>Saison: nur 1 und 2</em></div><div class="leiter">'+
      kl(1,"s1","Notrücklage","Der Vorstand gibt sie frei, ohne Abzug und ohne Verhandlung.")+
      kl(2,"s2","Kredit","Zinsfreier Rahmen, dann Kredit. Nur für den Rest.")+
      kl(3,"s3","Notverkauf","Nur im Transferfenster, und erst wenn 1 und 2 nicht reichen. In der Saison gibt es ihn nicht.")+'</div></div>'+
      '<div class="ab2"><div class="gk"><span>Was der Vorstand nie darf</span></div><div class="pruef">'+
      ["Geld vom Konto nehmen. Gesperrt heißt nur: nicht ausgebbar.","Einen Kauf sperren, der den Kader auf 8 bringt.","Das Gehaltsbudget unter 75 % kürzen.","Eine Notlage ablehnen oder dafür Vertrauen abziehen.","Einen Verkauf verlangen, solange Rücklage oder Kredit reichen."].map(x=>'<div class="ja">'+ic("i-schild")+'<span>'+x+'</span></div>').join("")+'</div></div>'+
      '<div class="ab2"><div class="gk"><span>Regeln des Gesprächs</span></div><div class="formel">Höchstens zwei Gespräche je Saison: im Transferfenster oder in der Saison.\nJe Gespräch ein Anliegen und höchstens zwei Runden.\nDer Notfall-Antrag zählt nicht mit.\nVerkäufe im selben Fenster sind sofort zu 100 % frei.\nEin gestellter Antrag verbraucht das Gespräch, kostet aber kein Vertrauen.\nNur Zusagen binden: Ziel, Rückzahlung, Deckel, Vertrauen.\nSaison 1: alles ist frei, es gibt nichts zu verhandeln.</div></div>';
  }
  $("cb").innerHTML=h;
}

/* ============================== Bedienung ============================== */
function toast(x){const e=$("toast");e.textContent=x;e.classList.add("an");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("an"),2600)}
function neu(){S.phase="entwurf";S.runde=1;S.antwort=null;S.vertrag=null}
function stellen(){
  const d=deal(),r=bewerte(S.team,d);S.antwort={d,r};
  if(r.art==="ok"){S.phase="vereinbart";S.vertrag=d;toast("Der Vorstand stimmt zu.")}
  else{S.phase="antwort";toast(r.art==="gegen"?"Der Vorstand macht ein Gegenangebot.":"Der Vorstand lehnt ab.")}
}
function aktion(a){
  const [k,w]=a.split(":");
  if(k==="ans"){S.ans=w}
  else if(k==="ctab"){S.ctab=w}
  else if(k==="anl"){S.anl=w;if(w==="sonder")S.betrag=0}
  else if(k==="topf"){S.topf=w}
  else if(k==="viertel"){S.viertel=+w}
  else if(k==="vk"){S.vk=+w}
  else if(k==="biete"){S.biete.has(w)?S.biete.delete(w):S.biete.add(w)}
  else if(k==="leeren"){S.biete.clear()}
  else if(k==="stellen"){stellen()}
  else if(k==="annehmen"){const d=S.antwort.d;S.antwort.r.fordert.forEach(x=>d.biete.add(x));S.vertrag=d;S.biete=new Set(d.biete);S.phase="vereinbart";toast("Vereinbart. Die Töpfe sind angepasst.")}
  else if(k==="alt"){const d=S.antwort.d;d.betrag=S.antwort.r.altBetrag;S.betrag=d.betrag;S.vertrag=d;S.phase="vereinbart";toast("Vereinbart: "+c(d.betrag)+" ohne weitere Bedingung.")}
  else if(k==="nachbessern"){S.phase="entwurf";S.runde=2}
  else if(k==="zurueck"){S.phase="beendet"}
  else if(k==="neu"){neu()}
  else if(k==="not"){S.not=w;S.notPhase="entwurf"}
  else if(k==="notstellen"){S.notPhase="antwort";toast(notlage(S.team).ist?"Der Vorstand gibt die Notrücklage frei.":"Der Vorstand lehnt ab: keine Notlage.")}
  else if(k==="notneu"){S.notPhase="entwurf"}
  else if(k==="blatt"){document.body.dataset.blatt="kontext"}
  else if(k==="blattzu"){delete document.body.dataset.blatt}
  zeichne();
}
function demo(a){
  const [k,w]=a.split(":");
  if(k==="team"){S.team=w;S.betrag=0;neu();S.notPhase="entwurf"}
  else if(k==="phone"){document.body.classList.toggle("phone")}
  else if(k==="zeit"){S.zeit=inSaison()?"fenster":"saison";S.ans="gespraech";S.biete.delete("rueck");if(S.anl==="alles")S.anl="sonder";S.betrag=0;neu()}
  else if(k==="not"){S.ans="notfall";S.not=w;S.notPhase="antwort"}
  else if(k==="fall"){
    /* je Team ein vorbereiteter Fall, damit jeder Ausgang mit einem Klick zu sehen ist */
    const F={
      "M-M":{ok:["stufe",["ziel"]],gegen:["stufe",[]],nein:["alles",[]]},
      "C-C":{ok:["ruecklage",["rueck"],1],gegen:["stufe",["rueck"]],nein:["ruecklage",[],2]},
      "W-W":{ok:["stufe",["rueck"]],gegen:["alles",[]],nein:["alles",[]]}
    }[S.team][w];
    neu();S.zeit="fenster";S.ans="gespraech";S.anl=F[0];S.biete=new Set(F[1]);S.viertel=F[2]||1;S.betrag=0;stellen();
    if(S.team==="W-W"&&w==="nein")toast("Bei Vertrauen 6,5 lehnt dieser Vorstand kaum etwas ab. Gezeigt ist sein Gegenangebot.");
  }
  zeichne();
}
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-d]");if(d){demo(d.dataset.d);return}
  const a=e.target.closest("[data-a]");if(a&&!a.disabled){if(a.tagName==="A"&&a.getAttribute("href")==="#")e.preventDefault();aktion(a.dataset.a)}
});
document.addEventListener("input",e=>{if(e.target.dataset.i==="betrag"){S.betrag=+e.target.value;e.target.previousElementSibling.textContent=c(S.betrag)}});
document.addEventListener("change",e=>{if(e.target.dataset.i==="betrag"){S.betrag=+e.target.value;zeichne();const r=document.querySelector('[data-i=betrag]');if(r)r.focus()}});
$("schleier").addEventListener("click",()=>{delete document.body.dataset.blatt});
document.querySelectorAll('.rail a[href="#"]').forEach(a=>a.addEventListener("click",e=>e.preventDefault()));

/* Start: Zustand aus der Adresse */
if(P.get("antwort")==="1"){
  if(S.ans==="notfall")S.notPhase="antwort";
  else{if(S.anl==="sonder"&&!S.betrag){const mx=maxSonder(S.team);S.betrag=Math.max(1,Math.round(mx*.65))}stellen();if(P.get("annehmen")==="1"&&S.phase==="antwort"&&S.antwort.r.art==="gegen"){const d=S.antwort.d;S.antwort.r.fordert.forEach(x=>d.biete.add(x));S.vertrag=d;S.biete=new Set(d.biete);S.phase="vereinbart"}}
}
zeichne();
</script>
</body>
