<title>Inbox – modern (Mockup 18.11.)</title>
<!--
  INBOX IM NEUEN STIL (Fable, 18.11.). Zwei Reiter wie heute: Entscheidungen und Chronik.
  ECHT: die Titel und Texte der Eintraege (lib/foundation/game-inbox-service.ts), die Dringlichkeitsgruppen Kritisch / Heute sinnvoll /
        Kann warten / Berichte und Momente (inbox-urgency-groups.ts), die Kategorien (InboxV2NewLook.tsx), das Buendel
        "Spieltag vorbereiten" (inbox-bundling.ts), Schnellaktionen anwenden / hinspringen / ausblenden (inbox-quick-action-service.ts),
        "loest sich automatisch", "Empfohlen", Spieler und Portraits der Vigilante Wranglers, Teams und Logos.
  ERFUNDEN: welche Eintraege gerade offen sind, alle Zahlen darin, die Chronik-Ereignisse, die Sitzverteilung Chris / Franky / Ramona.
  NEU GEGENUEBER HEUTE: Detailspalte rechts (Entscheiden ohne Seitenwechsel), "haelt den Spieltag auf" als eigene Kennzeichnung,
        "Am Tisch" (wer von den Menschen noch dran ist), Posteingang ueber alle eigenen Teams.
  URL: ?ansicht=entscheidungen|chronik  ?gruppe=offen|kritisch|heute|spaeter|erledigt  ?eintrag=<id>  ?leer=1  ?still=1 (ohne Mockup-Leiste)
  Steht IM App-Rahmen aus app-rahmen-modern-18-11.html (Schiene, Regieband, Taktgeber: CSS unveraendert uebernommen,
  wie in training-modern-18-11.html). Kein App-Code, keine externen Skripte, Schriften lokal, 0 PixelLab-Generationen.
  Erklaerung und offene Fragen: docs/design/fehlende-seiten-mockups-18-11.md
-->

<style>
@font-face{font-family:"RaniraSeason";src:url("../fonts/ranira-bold-italic.otf") format("opentype");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url("../fonts/barlow-condensed-latin-500-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url("../fonts/barlow-condensed-latin-600-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url("../fonts/barlow-condensed-latin-700-normal.woff2") format("woff2");font-display:swap}
:root{
  --grund:#06080c; --flaeche-1:#0c1017; --flaeche-2:#121824; --flaeche-3:#1a2231;
  --linie:rgba(244,230,196,.13); --linie-2:rgba(244,230,196,.30);
  --creme:#f4e6c4; --gold:#f0c35a; --tinte:#eef2f8; --leise:#9aa7ba; --stumm:#66738a;
  --heim:#F2A03D; --gast:#45B0C9; --gut:#62d394; --warn:#ff6058; --acht:#f3b54a;
  --haus:"RaniraSeason",Georgia,"Times New Roman",serif;
  --zahl:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --r:.625rem;
}
/* VOLLE FLAECHE: Entwurfsmass 120 x 67,5 rem (= 1920 x 1080 bei 16 px). Die Wurzelgroesse waechst mit Breite UND Hoehe. */
html{font-size:clamp(12.5px,min(0.8333vw,1.4815vh),34px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020305;color:var(--tinte);font-family:var(--zahl);-webkit-font-smoothing:antialiased}
body{font-size:1rem;overflow:hidden}
button,a{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.t{font-variant-numeric:tabular-nums}
.gk{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:600}
img{display:block}
.plus{color:var(--gut)} .minus{color:var(--warn)} .null{color:var(--stumm)} .acht{color:var(--acht)}
.demo{height:2.25rem;display:flex;align-items:center;gap:.9rem;padding:0 .9rem 0 5rem;background:#0d1016;border-bottom:1px solid #222a38;font-size:.875rem;color:var(--leise);white-space:nowrap;overflow-x:auto}
.demo b{color:var(--creme);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.75rem}
.demo a{color:var(--leise);padding:.1rem .55rem;border:1px solid var(--linie);border-radius:1rem}
.demo a.an{color:#17120a;background:var(--gold);border-color:var(--gold);font-weight:700}
body.still .demo{display:none}

.app{--kopf:2.25rem;display:grid;grid-template-columns:4rem minmax(0,1fr);height:calc(100vh - var(--kopf));background:var(--grund)}
body.still .app{--kopf:0rem}
/* ICON-SCHIENE: kompakt 4 rem, klappt bei Hover als Ueberlagerung aus (wie PR #1576) */
.railplatz{position:relative;z-index:60}
.rail{position:absolute;left:0;top:0;bottom:0;width:4rem;display:flex;flex-direction:column;gap:.2rem;padding:.6rem .6rem;background:#080b11;border-right:1px solid var(--linie);overflow:hidden;transition:width .16s ease,box-shadow .16s ease}
.rail:hover,body.navauf .rail{width:15rem;box-shadow:1.2rem 0 2.5rem rgba(0,0,0,.6);border-right-color:var(--linie-2)}
.rail .logo{width:2.75rem;height:2.75rem;border-radius:.55rem;overflow:hidden;border:1px solid var(--linie-2);margin-bottom:.5rem;flex:none}
.rail .logo img{width:100%;height:100%;object-fit:cover}
.rail .grp{height:1.1rem;padding-left:.2rem;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--stumm);font-weight:700;white-space:nowrap;opacity:0;transition:opacity .16s}
.rail:hover .grp,body.navauf .rail .grp{opacity:1}
.rail a{position:relative;height:2.75rem;border-radius:.55rem;display:flex;align-items:center;gap:.85rem;padding-left:.72rem;font-size:1.25rem;color:var(--stumm);white-space:nowrap;flex:none}
.rail a span.n{font:400 1.06rem/1 var(--haus);color:inherit;opacity:0;transition:opacity .16s}
.rail:hover a span.n,body.navauf .rail a span.n{opacity:1}
.rail a:hover{background:var(--flaeche-2);color:var(--tinte)}
.rail a.an{background:linear-gradient(180deg,rgba(240,195,90,.2),rgba(240,195,90,.06));color:var(--gold)}
.rail a.an::before{content:"";position:absolute;left:-.6rem;top:.55rem;bottom:.55rem;width:.19rem;border-radius:2px;background:var(--gold)}
.rail .zahl{position:absolute;left:1.7rem;top:.2rem;min-width:1rem;height:1rem;border-radius:.5rem;background:var(--warn);color:#fff;font:700 .69rem/1rem var(--zahl);text-align:center;padding:0 .2rem}
.rail .luecke{flex:1}

main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
/* HERO mit geteilter Disziplin-Kulisse */
.hero{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.6rem;align-items:center;padding:1.05rem 1.5rem 1rem;border-bottom:1px solid var(--linie);overflow:hidden;isolation:isolate}
.hero .kul{position:absolute;inset:0;z-index:-2;display:grid;grid-template-columns:1fr 1fr}
.hero .kul i{background-position:center 42%;background-size:cover;filter:saturate(1.1);opacity:.62}
.hero .kul i:first-child{-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent);mask-image:linear-gradient(90deg,#000 70%,transparent);margin-right:-12%}
.hero .kul i:last-child{-webkit-mask-image:linear-gradient(270deg,#000 70%,transparent);mask-image:linear-gradient(270deg,#000 70%,transparent);margin-left:-12%}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,8,12,.96) 0%,rgba(6,8,12,.72) 30%,rgba(6,8,12,.5) 55%,rgba(6,8,12,.82) 100%),linear-gradient(180deg,rgba(6,8,12,.2) 30%,var(--grund) 100%)}
.hk{display:flex;align-items:center;gap:1rem}
.hk .crest{width:5.25rem;height:5.25rem;border-radius:.75rem;overflow:hidden;border:2px solid var(--heim);box-shadow:0 .5rem 1.4rem rgba(0,0,0,.5);flex:none}
.hk .crest img{width:100%;height:100%;object-fit:cover}
.hk em{font-style:normal;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.hk h1{margin:.12rem 0 .25rem;font:400 2.5rem/1 var(--haus);color:#fff;white-space:nowrap}
.hk span.lage{font-size:.97rem;color:var(--leise)} .hk span.lage b{color:var(--creme);font-weight:600}
.kpis{display:flex;gap:.5rem;justify-content:center;min-width:0}
.kpi{min-width:7.2rem;padding:.55rem 1.15rem .62rem 1.25rem;background:rgba(14,19,29,.82);border:1px solid var(--linie);clip-path:polygon(.75rem 0,100% 0,calc(100% - .75rem) 100%,0 100%)}
.kpi strong{display:flex;align-items:center;gap:.4rem;font-size:2rem;line-height:1;font-weight:700;color:var(--creme);white-space:nowrap;height:2rem}
.kpi small{font-size:.82rem;color:var(--leise);white-space:nowrap}
.kpi.zone{border-top:2px solid var(--gut)}
.fm{display:inline-flex;gap:.18rem}
.fm i{width:.82rem;height:.82rem;transform:skewX(-14deg);background:var(--gut);border-radius:1px;flex:none} .fm i.n{background:var(--warn)} .fm i.u{background:var(--stumm)} .fm i.x{background:rgba(255,255,255,.1)}
.kpi .fm i{width:1rem;height:1rem}
.cta{display:flex;flex-direction:column;align-items:flex-end;gap:.4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font-weight:700;white-space:nowrap}
.btn.haupt{height:3.1rem;padding:0 1.5rem;font-size:1.12rem;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#17120a;clip-path:polygon(.6rem 0,100% 0,calc(100% - .6rem) 100%,0 100%)}
.btn.haupt:hover{filter:brightness(1.08)}
.cta small{font-size:.82rem;color:var(--leise)}

/* RASTER: fuellt die Resthoehe, nichts scrollt */
.raster{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:minmax(0,1.12fr) minmax(0,1fr) auto auto;gap:.72rem;padding:.8rem 1rem .8rem;min-height:0}
.pan{display:flex;flex-direction:column;background:var(--flaeche-1);border:1px solid var(--linie);border-radius:var(--r);overflow:hidden;min-width:0;min-height:0}
#p-tag{grid-column:1/6;grid-row:1} #p-kad{grid-column:1/6;grid-row:2}
#p-tab{grid-column:6/10;grid-row:1/3}
#p-ent{grid-column:10/13;grid-row:1} #p-fin{grid-column:10/13;grid-row:2}
#p-dis{grid-column:1/13;grid-row:3} .ticker{grid-column:1/13;grid-row:4}
.pk{display:flex;align-items:center;gap:.6rem;padding:0 .9rem;border-bottom:1px solid var(--linie);height:2.7rem;flex:none}
.pk h2{min-width:0;overflow:hidden;text-overflow:ellipsis;margin:0;font:400 1.19rem/1 var(--haus);color:var(--creme);white-space:nowrap}
.pk .sp{flex:1} .pk a{font-size:.85rem;font-weight:600;color:var(--gold);white-space:nowrap}
.pk .marke{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:.12rem .5rem;border-radius:.2rem;background:rgba(242,160,61,.18);color:var(--heim);border:1px solid rgba(242,160,61,.5)}
.pk .marke.g{background:rgba(69,176,201,.14);color:var(--gast);border-color:rgba(69,176,201,.5)}
.pb{padding:.75rem .9rem;flex:1;min-height:0;display:flex;flex-direction:column}

/* KADER MIT FORM & MORAL */
.tfk{display:flex;align-items:center;gap:1.1rem;font-size:.88rem;color:var(--leise);white-space:nowrap;flex:none;margin-bottom:.6rem;overflow:hidden}
.tfk .zz{display:inline-flex;align-items:center;gap:.7rem;padding:.25rem .7rem;border-radius:.4rem;background:var(--flaeche-2);border:1px solid var(--linie)}
.tfk .zz span{display:inline-flex;align-items:baseline;gap:.25rem} .tfk .zz b{font-size:1.05rem;color:var(--tinte)}
.pfeil{font-weight:700;letter-spacing:-.12em;font-size:.82em;padding-right:.12em}
.pfeil.s2,.pfeil.s1{color:var(--gut)} .pfeil.s0{color:var(--stumm);letter-spacing:0} .pfeil.s-1,.pfeil.s-2{color:var(--warn)}
svg.ges{width:1.25em;height:1.25em;flex:none;vertical-align:-.25em}
.kk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.55rem;flex:1;min-height:0}
.sk{position:relative;border-radius:.55rem;overflow:hidden;border:1px solid var(--linie-2);background:#111;display:block;min-height:0}
.sk:hover{border-color:var(--gold)}
.sk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,rgba(4,6,10,.97) 80%)}
.sk .rg{position:absolute;z-index:1;left:0;top:.5rem;padding:.05rem .6rem .05rem .5rem;background:var(--gold);color:#17120a;font-weight:700;font-size:.88rem;clip-path:polygon(0 0,100% 0,calc(100% - .45rem) 100%,0 100%)}
.sk .un{position:absolute;z-index:1;left:.5rem;right:.5rem;bottom:.45rem}
.sk b{display:block;font:400 1.1rem/1.05 var(--haus);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk small{font-size:.78rem;color:var(--leise);white-space:nowrap}
.sk .ov{display:flex;align-items:center;gap:.22rem;margin-top:.2rem;font-size:.88rem} .sk .ov strong{font-size:1.3rem;line-height:1;color:var(--creme);margin-right:auto}
.sk .ov .mo{display:inline-flex;align-items:center;gap:.12rem;font-weight:700}

/* KASSE */
.kas{display:flex;align-items:flex-end;gap:.9rem;flex:none}
.kas strong{font-size:2.3rem;line-height:.95;color:var(--creme)} .kas small{font-size:.85rem;color:var(--leise);padding-bottom:.15rem}
.kurve{flex:1;min-height:1.6rem;margin:.35rem 0 .1rem;position:relative}
.kurve svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.kx{display:flex;justify-content:space-between;font-size:.7rem;color:var(--stumm);letter-spacing:.08em;flex:none;margin-bottom:.3rem}
.zeile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:baseline;padding:.2rem 0;border-top:1px solid rgba(244,230,196,.07);font-size:.94rem;flex:none;white-space:nowrap}
.zeile span{overflow:hidden;text-overflow:ellipsis} .zeile small{color:var(--leise);font-size:.8rem;margin-left:.35rem}
.zeile strong{font-size:1.1rem}
.zeile.next small{display:block;margin:0}
.zeile.next{align-items:center;margin-top:.25rem;padding:.3rem .55rem;border:1px solid var(--linie-2);border-radius:.4rem;background:var(--flaeche-2)}
.apr{flex:none;margin-top:.45rem;font-size:.85rem;color:var(--leise)}
.apr .kopfz{display:flex;justify-content:space-between} .apr b{color:var(--tinte)}
.apr .bn{position:relative;height:.5rem;background:rgba(255,255,255,.08);margin-top:.25rem;transform:skewX(-14deg)}
.apr .bn i{display:block;height:100%;background:var(--gut)} .apr .bn u{position:absolute;top:-.2rem;bottom:-.2rem;width:2px;background:var(--acht)} .apr .bn u+u{background:var(--warn)}
/* ===================== RAHMEN ===================== */
.demo{padding-left:.9rem;position:relative;z-index:90}
.demo i.tr{width:1px;height:1.1rem;background:#2a3344;flex:none}
.demo a{cursor:pointer}
.app{grid-template-rows:minmax(0,1fr);transition:grid-template-columns .22s ease}
body.pin .app{grid-template-columns:15rem minmax(0,1fr)}
body.arena:not(.rahmen) .app{grid-template-columns:0rem minmax(0,1fr)}

/* --- Schiene --- */
.rail{gap:.12rem;transition:width .16s ease,box-shadow .16s ease,transform .25s ease}
body.pin .rail{width:15rem;box-shadow:none}
body.pin .rail .grp,body.pin .rail a span.n,body.pin .rail .wer{opacity:1}
.rail .kopf{display:flex;align-items:center;gap:.7rem;margin-bottom:.35rem;flex:none;white-space:nowrap}
.rail .logo{margin:0;border-color:var(--heim);position:relative;overflow:visible}
.rail .logo img{border-radius:.5rem}
.rail .wer{opacity:0;transition:opacity .16s;line-height:1.1}
.rail:hover .wer,body.navauf .rail .wer{opacity:1}
.rail .wer b{display:block;font:400 1.05rem/1.1 var(--haus);color:#fff}
.rail .wer small{font-size:.8rem;color:var(--leise)}
.rail .grp{height:1rem;margin-top:.25rem}
.rail a{height:2.55rem;transition:color .12s,background .12s}
.rail a.an{background:linear-gradient(90deg,rgba(240,195,90,.2),rgba(240,195,90,.04))}
.rail a.an::before{display:none}
.rail .marker{position:absolute;left:0;width:.19rem;height:1.5rem;border-radius:0 2px 2px 0;background:var(--gold);box-shadow:0 0 .7rem rgba(240,195,90,.7);transition:top .26s cubic-bezier(.3,1.3,.5,1)}
.rail .zahl{top:.1rem}
.rail a.pinan{color:var(--gold)}
body.arena:not(.rahmen) .rail{transform:translateX(-100%);box-shadow:none}
body.arena:not(.rahmen) .railplatz:hover .rail,body.arena.griffauf .rail{transform:none;width:15rem;box-shadow:1.2rem 0 2.5rem rgba(0,0,0,.7)}
body.arena:not(.rahmen) .railplatz:hover .rail .grp,body.arena:not(.rahmen) .railplatz:hover .rail a span.n,body.arena:not(.rahmen) .railplatz:hover .rail .wer{opacity:1}
/* Griff: der einzige Rest des Rahmens im Arena-Vollbild */
.griff{display:none;position:absolute;left:0;top:50%;width:.95rem;height:5.5rem;margin-top:-2.75rem;border-radius:0 .5rem .5rem 0;background:rgba(8,11,17,.78);border:1px solid var(--linie-2);border-left:0;place-items:center;color:var(--creme);font-size:.8rem}
.griff u{position:absolute;right:-.3rem;top:-.3rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--warn);display:none}
body.arena:not(.rahmen) .griff{display:grid}
body.arena:not(.rahmen) .railplatz{width:.95rem}
body.arena:not(.rahmen) .railplatz:hover .griff{display:none}
body.arena.wartet .griff u{display:block}

.rechts{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:4.5rem minmax(0,1fr);min-width:0;min-height:0;position:relative;transition:grid-template-rows .28s ease}
body.arena .rechts{grid-template-rows:0rem minmax(0,1fr)}

/* --- Regieband: EINE Zeile fuer Ort, Unterreiter, Seiten-Slot, Saison, Kasse, Suche, Inbox, Weiter --- */
.band{position:relative;z-index:40;display:flex;align-items:center;gap:.9rem;height:4.5rem;padding:0 1rem 0 1.25rem;border-bottom:1px solid var(--linie);isolation:isolate;white-space:nowrap;transition:transform .28s ease,opacity .2s}
body.arena .band{transform:translateY(-100%);opacity:0;pointer-events:none}
.band .bkul{position:absolute;inset:0;z-index:-2;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.band .bkul i{background-position:center 36%;background-size:cover;opacity:.5;transition:background-image .4s}
.band .bkul i:first-child{-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent);mask-image:linear-gradient(90deg,#000 70%,transparent);margin-right:-12%}
.band .bkul i:last-child{-webkit-mask-image:linear-gradient(270deg,#000 70%,transparent);mask-image:linear-gradient(270deg,#000 70%,transparent);margin-left:-12%}
.band::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,8,12,.97) 0%,rgba(6,8,12,.8) 28%,rgba(6,8,12,.62) 55%,rgba(6,8,12,.9) 100%)}
.ort{flex:none;min-width:0}
.ort em{display:block;font-style:normal;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);height:1rem}
.ort em span{color:var(--stumm)}
.ort h1{margin:.1rem 0 0;font:400 1.95rem/1.05 var(--haus);color:#fff}
.ort.neu em,.ort.neu h1{animation:hoch .3s both} .ort.neu h1{animation-delay:.04s}
@keyframes hoch{from{opacity:0;transform:translateY(.5rem)}to{opacity:1;transform:none}}
.reiter{display:flex;align-self:stretch;gap:.1rem;flex:none}
.reiter a{position:relative;display:flex;align-items:flex-end;padding:0 .62rem .85rem;font-size:.9rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--leise)}
.reiter a:hover{color:var(--tinte)}
.reiter a.an{color:var(--creme)}
.reiter a.an::after{content:"";position:absolute;left:.5rem;right:.5rem;bottom:-1px;height:.19rem;background:var(--gold);transform:skewX(-14deg)}
.slot{flex:1;min-width:0;display:flex;justify-content:center;gap:.45rem;overflow:hidden}
.slot.neu>*{animation:hoch .3s both} .slot.neu>:nth-child(2){animation-delay:.04s} .slot.neu>:nth-child(3){animation-delay:.08s} .slot.neu>:nth-child(4){animation-delay:.12s}
.kpi.k{min-width:0;padding:.38rem 1.05rem .42rem 1.1rem}
.kpi.k .gk{font-size:.64rem;display:block}
.kpi.k strong{font-size:1.5rem;height:1.6rem}
.kpi.k strong small{font-weight:500;font-size:.8rem;color:var(--leise)}
.kpi.k .fm i{width:.82rem;height:.82rem}
.sl{display:flex;align-items:center;gap:.5rem;padding:.4rem 1.05rem .4rem 1rem;background:rgba(14,19,29,.82);border:1px solid var(--linie);clip-path:polygon(.75rem 0,100% 0,calc(100% - .75rem) 100%,0 100%);color:var(--leise)}
.sl.an{background:linear-gradient(180deg,rgba(240,195,90,.22),rgba(14,19,29,.9));border-top:2px solid var(--gold);color:var(--tinte)}
.sl u{text-decoration:none;font-weight:700;font-size:.8rem;padding:.1rem .4rem;border:1px solid var(--linie-2);border-radius:.2rem}
.sl b{display:block;font:400 1.2rem/1 var(--haus);color:inherit}
.sl small{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.sl strong{font-size:1.5rem;line-height:1;color:var(--creme);margin-left:.5rem}
.regie{display:flex;align-items:center;gap:.55rem;flex:none}
.chip{display:flex;flex-direction:column;justify-content:center;gap:.22rem;height:3rem;padding:0 .75rem;border-radius:.5rem;background:rgba(14,19,29,.78);border:1px solid var(--linie)}
.chip:hover,.ikn:hover{border-color:var(--linie-2);background:var(--flaeche-2)}
.chip .o{display:flex;align-items:baseline;gap:.4rem;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--leise)}
.chip .o b{font-size:1.12rem;letter-spacing:0;color:var(--creme);font-weight:700;text-transform:none}
.chip .o span{letter-spacing:0;text-transform:none;font-size:.82rem}
.tk{display:flex;gap:.14rem}
.tk i{width:.34rem;height:.5rem;transform:skewX(-14deg);background:rgba(255,255,255,.13);border-radius:1px}
.tk i.s{background:var(--gut)} .tk i.u{background:var(--acht)} .tk i.n{background:var(--warn)}
.tk i.j{background:var(--gold);box-shadow:0 0 .4rem var(--gold);height:.7rem;margin-top:-.1rem}
.ikn{position:relative;width:3rem;height:3rem;border-radius:.5rem;display:grid;place-items:center;font-size:1.2rem;color:var(--leise);background:rgba(14,19,29,.78);border:1px solid var(--linie)}
.ikn kbd{position:absolute;right:.2rem;bottom:.12rem;font:600 .56rem/1 var(--zahl);color:var(--stumm)}
.ikn .zahl{position:absolute;right:-.3rem;top:-.3rem;min-width:1.05rem;height:1.05rem;border-radius:.55rem;background:var(--warn);color:#fff;font:700 .7rem/1.05rem var(--zahl);text-align:center;padding:0 .2rem}
.ikn.wack{animation:wack .5s} @keyframes wack{25%{transform:rotate(-14deg)}60%{transform:rotate(10deg)}}

/* --- Taktgeber: Status + Hauptaktion in einem --- */
.takt{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:.22rem;width:16rem;margin-left:.25rem}
.tb{position:relative;height:2.6rem;padding:0 1.3rem;display:flex;align-items:center;justify-content:center;gap:.45rem;font-weight:700;font-size:1.02rem;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#17120a;clip-path:polygon(.6rem 0,100% 0,calc(100% - .6rem) 100%,0 100%);overflow:hidden;white-space:nowrap}
.tb:hover{filter:brightness(1.08)}
.tb .fuell{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);z-index:0}
.tb>*:not(.fuell){position:relative;z-index:1}
.ts{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--leise);padding-left:.7rem;overflow:hidden}
.ts:hover{color:var(--tinte)}
.ts i{width:.5rem;height:.5rem;border-radius:50%;background:var(--acht);flex:none}
.ts b{color:var(--tinte);font-weight:600}
.ts span{overflow:hidden;text-overflow:ellipsis}
/* gesperrt */
.takt.zu .tb{background:var(--flaeche-3);color:var(--leise);box-shadow:inset 0 0 0 1px var(--linie-2)}
.takt.zu .ts i{background:var(--warn)}
.takt.ruck .tb{animation:ruck .3s} @keyframes ruck{25%{transform:translateX(-.3rem)}75%{transform:translateX(.3rem)}}
/* Aktion laeuft */
.takt.laeuft .tb{background:var(--flaeche-3);color:var(--creme);cursor:progress}
.takt.laeuft .tb .fuell{background:linear-gradient(90deg,rgba(240,195,90,.25),rgba(240,195,90,.6));transition:width .18s linear}
.takt.laeuft .ts i{background:var(--gold);animation:blink .8s infinite alternate} @keyframes blink{to{opacity:.25}}
.band .lauf{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;opacity:0}
.band .lauf::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:lauf 1.1s linear infinite}
@keyframes lauf{from{left:-30%}to{left:100%}}
body.s-laeuft .band .lauf{opacity:1}
/* Spieltag bereit */
.takt.weiter .tb{animation:puls 1.6s ease-in-out infinite}
.takt.weiter .tb::after{content:"";position:absolute;top:0;bottom:0;width:2.2rem;left:-3rem;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:glanz 2.4s ease-in-out infinite}
@keyframes glanz{0%,55%{left:-3rem}100%{left:110%}}
@keyframes puls{50%{filter:brightness(1.18) drop-shadow(0 0 .5rem rgba(240,195,90,.8))}}
.takt.weiter .ts i{background:var(--gut)}
.takt.weiter::before{content:"";position:absolute;inset:-.35rem -.3rem 1rem -.3rem;z-index:-1;background:radial-gradient(closest-side,rgba(240,195,90,.35),transparent);animation:blink 1.6s infinite alternate}

/* --- Aufklapper (Ablauf, Inbox) --- */
.klapp{position:absolute;z-index:70;top:4.2rem;width:23rem;background:var(--flaeche-1);border:1px solid var(--linie-2);border-radius:var(--r);box-shadow:0 1.2rem 3rem rgba(0,0,0,.7);display:none;white-space:normal;overflow:hidden}
.klapp.auf{display:block;animation:hoch .18s both}
.klapp h3{margin:0;padding:.7rem .9rem .55rem;font:400 1.1rem/1 var(--haus);color:var(--creme);border-bottom:1px solid var(--linie)}
.klapp h3 small{font:600 .72rem/1 var(--zahl);letter-spacing:.12em;text-transform:uppercase;color:var(--leise);margin-left:.5rem}
.klapp .ent{max-height:none;min-height:3.2rem;flex:none}
.klapp .fuss{padding:.5rem .9rem;border-top:1px solid var(--linie);font-size:.82rem;color:var(--leise)}
#k-ablauf{right:1rem} #k-inbox{right:18rem}
.ent.ok .tx{color:var(--leise)}

/* --- Buehne und Seitenwechsel --- */
main.buehne{display:block;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--grund)}
.seite{position:absolute;inset:0}
.seite:not(.an){display:none!important}
.seite.raus{opacity:0;transform:translateY(-.35rem);transition:opacity .11s ease,transform .11s ease}
.seite.rein>*{animation:auf .34s cubic-bezier(.2,.8,.3,1) both}
.seite.rein>:nth-child(2){animation-delay:.03s} .seite.rein>:nth-child(3){animation-delay:.06s} .seite.rein>:nth-child(4){animation-delay:.09s}
.seite.rein>:nth-child(5){animation-delay:.12s} .seite.rein>:nth-child(6){animation-delay:.15s} .seite.rein>:nth-child(7){animation-delay:.18s}
@keyframes auf{from{opacity:0;transform:translateY(.9rem)}to{opacity:1;transform:none}}
/* Sendewisch: nur beim Wechsel in die Arena und zurueck */
.wisch{position:fixed;inset:0;z-index:200;pointer-events:none;overflow:hidden;display:none}
.wisch.an{display:block}
.wisch i{position:absolute;top:-10%;bottom:-10%;width:140%;left:-160%;transform:skewX(-14deg)}
.wisch i:nth-child(1){background:var(--gold);animation:wisch .72s cubic-bezier(.6,0,.3,1) both}
.wisch i:nth-child(2){background:#06080c;animation:wisch .72s cubic-bezier(.6,0,.3,1) .07s both}
.wisch b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:400 4.2rem/1 var(--haus);color:var(--creme);white-space:nowrap;opacity:0;animation:wtext .72s .07s both}
.wisch b small{display:block;text-align:center;font:700 1rem/1.6 var(--zahl);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
@keyframes wisch{0%{left:-160%}45%,55%{left:-20%}100%{left:120%}}
@keyframes wtext{0%,25%{opacity:0}40%,60%{opacity:1}75%,100%{opacity:0}}

/* --- Meldungen (Bauchbinden unten rechts) --- */
.meld{position:fixed;z-index:80;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;width:24rem}
.mb{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.7rem;align-items:center;padding:.65rem .9rem .7rem 1rem;background:rgba(12,16,23,.97);border:1px solid var(--linie-2);border-left:.25rem solid var(--gold);border-radius:.35rem;box-shadow:0 .8rem 2rem rgba(0,0,0,.6);animation:mrein .32s cubic-bezier(.2,.8,.3,1) both;overflow:hidden}
.mb.w{border-left-color:var(--warn)} .mb.g{border-left-color:var(--gut)}
.mb .ic{font-size:1.4rem;color:var(--gold)} .mb.w .ic{color:var(--warn)} .mb.g .ic{color:var(--gut)}
.mb b{display:block;font:400 1.08rem/1.15 var(--haus);color:#fff}
.mb small{font-size:.86rem;color:var(--leise)}
.mb a{color:var(--gold);font-weight:600;font-size:.86rem}
.mb u{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--gold);opacity:.6;animation:ablauf 6s linear both}
.mb.geht{animation:mraus .25s both}
@keyframes mrein{from{opacity:0;transform:translateX(2rem)}to{opacity:1;transform:none}}
@keyframes mraus{to{opacity:0;transform:translateX(2rem)}}
@keyframes ablauf{from{width:100%}to{width:0}}
body.arena .meld{display:none}

/* --- Suche (Befehlspalette) --- */
.schleier{position:fixed;inset:0;z-index:100;background:rgba(2,3,5,.72);display:none;backdrop-filter:blur(3px)}
.schleier.auf{display:block}
.pal{position:absolute;left:50%;top:16%;width:38rem;margin-left:-19rem;background:var(--flaeche-1);border:1px solid var(--linie-2);border-radius:var(--r);box-shadow:0 2rem 5rem rgba(0,0,0,.8);overflow:hidden;animation:hoch .18s both}
.pal input{width:100%;height:3.4rem;padding:0 1.1rem;background:none;border:0;border-bottom:1px solid var(--linie);color:var(--tinte);font:500 1.25rem var(--zahl);outline:0}
.pal .gk{display:block;padding:.6rem 1.1rem .2rem}
.pal a{display:flex;align-items:center;gap:.7rem;padding:.5rem 1.1rem;font-size:1.05rem;color:var(--tinte)}
.pal a img{width:1.8rem;height:1.8rem;border-radius:.25rem;object-fit:cover}
.pal a svg{font-size:1.2rem;color:var(--leise);width:1.8rem}
.pal a small{margin-left:auto;color:var(--stumm);font-size:.82rem}
.pal a.an,.pal a:hover{background:rgba(240,195,90,.14)}
.pal .fuss{display:flex;gap:1.2rem;padding:.5rem 1.1rem;border-top:1px solid var(--linie);font-size:.8rem;color:var(--stumm)}
/* --- Office als Blatt --- */
.blatt{position:absolute;right:0;top:0;bottom:0;width:30rem;background:var(--flaeche-1);border-left:1px solid var(--linie-2);box-shadow:-2rem 0 4rem rgba(0,0,0,.7);display:flex;flex-direction:column;animation:brein .26s cubic-bezier(.2,.8,.3,1) both}
@keyframes brein{from{transform:translateX(100%)}to{transform:none}}
.blatt .pk{height:4.5rem} .blatt .pk h2{font-size:1.6rem}
.blatt .ents{flex:none} .blatt .ent{min-height:4.2rem;flex:none}
.blatt p{margin:auto 1rem 1rem;font-size:.86rem;color:var(--stumm)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
/* ===================== BEREICH ENTWICKLUNG: TRAINING UND GEBAEUDE (neu, 18.11.) ===================== */
:root{--pow:#e2574c;--spe:#5fc27a;--men:#5aa2e6;--soc:#e8c34a;--reha:#9aa7ba;--z0:#62d394;--z1:#e8c34a;--z2:#f08a3c;--z3:#ff5a52}
.reiter a small{font-size:.6rem;margin-left:.3rem;padding:.02rem .3rem;border-radius:.6rem;background:var(--warn);color:#fff;letter-spacing:0;align-self:flex-end;margin-bottom:.15rem}
.takt.warn .ts i{background:var(--warn);animation:blink .7s infinite alternate}
.seite{display:grid;gap:.72rem;padding:.8rem 1rem}
.pk small{font-size:.86rem;color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .seg{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--linie-2);border-radius:.3rem;overflow:hidden;flex:none}
.seg a{padding:.16rem .6rem;font-size:.82rem;font-weight:700;letter-spacing:.04em;color:var(--leise);border-left:1px solid var(--linie)}
.seg a:first-child{border-left:0}
.seg a:hover{color:var(--tinte);background:var(--flaeche-3)}
.seg a.an{background:var(--gold);color:#17120a}
.seg a.an.l{background:var(--z0)} .seg a.an.h{background:var(--z2)}
.seg a.wu{box-shadow:inset 0 -2px 0 var(--gast)}
.mk{display:inline-flex;align-items:center;gap:.25rem;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:.1rem .42rem;border-radius:.2rem;border:1px solid var(--linie-2);color:var(--leise);white-space:nowrap}
.mk.p{color:var(--gut);border-color:rgba(98,211,148,.5);background:rgba(98,211,148,.1)}
.mk.n{color:var(--gast);border-color:rgba(69,176,201,.5);background:rgba(69,176,201,.1)}
.mk.w{color:var(--warn);border-color:rgba(255,96,88,.55);background:rgba(255,96,88,.12)}
.mk.a{color:var(--acht);border-color:rgba(243,181,74,.5);background:rgba(243,181,74,.1)}
.mk.g{color:var(--gold);border-color:rgba(240,195,90,.55);background:rgba(240,195,90,.12)}
.mk.neu{color:#c9a7ff;border-color:rgba(201,167,255,.5);background:rgba(201,167,255,.1)}
.ax{display:inline-block;width:.55rem;height:.55rem;border-radius:1px;transform:skewX(-14deg);flex:none}
.ax.a0{background:var(--pow)} .ax.a1{background:var(--spe)} .ax.a2{background:var(--men)} .ax.a3{background:var(--soc)}
.dk{display:inline-block;min-width:2.3rem;text-align:center;font-weight:700;font-size:.8rem;letter-spacing:.04em;padding:.08rem .3rem;border-radius:.2rem;background:var(--flaeche-3);color:var(--creme)}
.kn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:2.3rem;padding:0 1rem;font-weight:700;font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--linie-2);border-radius:.3rem;color:var(--creme);white-space:nowrap}
.kn:hover{border-color:var(--gold);color:#fff}
.kn.gold{background:var(--gold);color:#17120a;border-color:var(--gold)}
.kn.rot{background:rgba(255,96,88,.16);border-color:var(--warn);color:#ffd9d6}
.kn.zu{opacity:.45;cursor:not-allowed}
.hinw{font-size:.84rem;color:var(--leise);line-height:1.3}
/* ===================== GEMEINSAME BAUSTEINE DER VIER SEITEN-MOCKUPS (18.11., fehlende Seiten) ===================== */
:root{--chris:#F2A03D;--franky:#45B0C9;--ramona:#c9a7ff;--ki:#66738a}
.demo{gap:.6rem}
.demo .dg{display:inline-flex;gap:.3rem;align-items:center}
.pb.sc{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#2a3344 transparent}
.pb.eng{padding:.45rem .5rem}
.pk .zz{font-size:.8rem;font-weight:700;color:var(--leise);padding:.05rem .45rem;border:1px solid var(--linie-2);border-radius:.6rem}
.pk .zz.w{color:#fff;background:var(--warn);border-color:var(--warn)}
.ptr{width:2.5rem;height:2.5rem;border-radius:.4rem;object-fit:cover;object-position:center 18%;border:1px solid var(--linie-2);flex:none;background:#111}
.ptr.k{width:1.9rem;height:1.9rem;border-radius:.3rem}
.ptr.g{width:5.5rem;height:5.5rem;border-radius:.6rem}
.lg{width:2.2rem;height:2.2rem;border-radius:.35rem;object-fit:cover;border:1px solid var(--linie-2);flex:none}
.lg.k{width:1.5rem;height:1.5rem;border-radius:.25rem}
/* Menschen am Tisch: Chris, Franky, Ramona, KI */
.mn{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;font-weight:700;font-size:.92rem;color:#0b0e14;flex:none;background:var(--ki)}
.mn.c{background:var(--chris)} .mn.f{background:var(--franky)} .mn.r{background:var(--ramona)} .mn.k{background:#2a3344;color:var(--leise)}
.mn.g{width:3rem;height:3rem;font-size:1.4rem}
.mn.s{width:1.3rem;height:1.3rem;font-size:.7rem}
/* schraeger Balken */
.bal{position:relative;height:.5rem;background:rgba(255,255,255,.08);transform:skewX(-14deg);border-radius:1px;min-width:2rem}
.bal i{display:block;height:100%;background:var(--gold);border-radius:1px}
.bal i.g{background:var(--gut)} .bal i.w{background:var(--warn)} .bal i.a{background:var(--acht)} .bal i.b{background:var(--gast)}
.bal u{position:absolute;top:-.2rem;bottom:-.2rem;width:2px;background:#fff}
.bal s{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(90deg,rgba(240,195,90,.5) 0 2px,transparent 2px 5px)}
/* Kachel mit Zahl */
.ka{padding:.5rem .7rem .55rem;background:var(--flaeche-2);border:1px solid var(--linie);border-radius:.45rem;min-width:0}
.ka strong{display:block;font-size:1.6rem;line-height:1.05;color:var(--creme);white-space:nowrap}
.ka strong small{font-size:.85rem;font-weight:500;color:var(--leise)}
.ka small{font-size:.82rem;color:var(--leise)}
.kas3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.kas2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.kas4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
/* Abschnittstitel in einer Karte */
.ab{display:flex;align-items:center;gap:.5rem;margin:.75rem 0 .4rem;flex:none}
.ab:first-child{margin-top:0}
.ab::after{content:"";flex:1;height:1px;background:var(--linie)}
.ab b{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);font-weight:700;white-space:nowrap}
.ab span{font-size:.82rem;color:var(--stumm);white-space:nowrap}
/* Schalter */
.sw{position:relative;width:2.9rem;height:1.5rem;border-radius:.2rem;background:var(--flaeche-3);border:1px solid var(--linie-2);flex:none;transform:skewX(-14deg);transition:background .15s}
.sw::after{content:"";position:absolute;top:.14rem;left:.14rem;width:1.1rem;height:1.1rem;background:var(--leise);border-radius:1px;transition:left .15s,background .15s}
.sw.an{background:rgba(240,195,90,.3);border-color:var(--gold)} .sw.an::after{left:1.55rem;background:var(--gold)}
.txt{font-size:.95rem;line-height:1.35;color:var(--leise)} .txt b{color:var(--tinte);font-weight:600}
.neu-m{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:.05rem .35rem;border-radius:.2rem;color:#c9a7ff;border:1px solid rgba(201,167,255,.5);background:rgba(201,167,255,.1);white-space:nowrap;vertical-align:.1em}
.leer{margin:auto;text-align:center;color:var(--leise);font-size:1rem;max-width:26rem}
.leer b{display:block;font:400 1.5rem/1.2 var(--haus);color:var(--creme);margin-bottom:.3rem}
.leer svg{font-size:2.6rem;color:var(--gut);margin-bottom:.4rem}

/* ===================== INBOX ===================== */
.seite.ib{grid-template-columns:17.5rem minmax(0,1fr) 37rem;grid-template-rows:minmax(0,1fr)}
.fl{display:flex;align-items:center;gap:.6rem;height:2.5rem;padding:0 .6rem;border-radius:.45rem;font-size:1.02rem;color:var(--leise);flex:none}
.fl:hover{background:var(--flaeche-2);color:var(--tinte)}
.fl.an{background:linear-gradient(90deg,rgba(240,195,90,.2),rgba(240,195,90,.04));color:var(--creme)}
.fl i{width:.6rem;height:.6rem;transform:skewX(-14deg);background:var(--stumm);flex:none}
.fl i.k{background:var(--warn)} .fl i.h{background:var(--acht)} .fl i.s{background:var(--gast)} .fl i.e{background:var(--gut)}
.fl b{margin-left:auto;font-size:1.05rem;color:var(--tinte)} .fl.null b{color:var(--stumm)}
.fl svg{font-size:1.05rem}
.kats{display:flex;flex-wrap:wrap;gap:.3rem;flex:none}
.kat{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .5rem;border:1px solid var(--linie);border-radius:1rem;font-size:.85rem;color:var(--leise)}
.kat:hover{border-color:var(--linie-2);color:var(--tinte)} .kat.an{background:var(--gold);border-color:var(--gold);color:#17120a;font-weight:700}
.kat b{font-weight:700}
.tisch{display:flex;flex-direction:column;gap:.35rem;margin-top:auto;flex:none}
.sitz{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.55rem;align-items:center;padding:.4rem .5rem;border:1px solid var(--linie);border-radius:.45rem;background:var(--flaeche-2)}
.sitz b{display:block;font-size:.98rem;color:var(--tinte);line-height:1.1} .sitz small{display:block;font-size:.8rem;color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitz .st{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sitz .st.ok{color:var(--gut)} .sitz .st.wa{color:var(--acht)}
/* Liste */
.gr{display:flex;align-items:center;gap:.6rem;margin:.9rem .4rem .35rem;flex:none}
.gr:first-child{margin-top:.2rem}
.gr b{font:400 1.12rem/1 var(--haus);color:var(--creme)} .gr span{font-size:.85rem;color:var(--leise)}
.gr i{flex:1;height:1px;background:var(--linie)}
.gr.k b{color:#ffb4ae}
.ei{position:relative;display:grid;grid-template-columns:2.2rem 2.5rem minmax(0,1fr) auto;gap:.7rem;align-items:center;min-height:4.1rem;padding:.45rem .8rem .45rem 1rem;border:1px solid var(--linie);border-radius:.5rem;background:var(--flaeche-2);margin-bottom:.35rem;flex:none}
.ei::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.25rem;border-radius:.5rem 0 0 .5rem;background:var(--gast)}
.ei.k::before{background:var(--warn)} .ei.h::before{background:var(--acht)} .ei.e::before{background:var(--gut)} .ei.b::before{background:var(--stumm)}
.ei:hover{border-color:var(--linie-2)}
.ei.an{border-color:var(--gold);background:linear-gradient(90deg,rgba(240,195,90,.13),var(--flaeche-2) 60%)}
.ei .ek{width:2.2rem;height:2.2rem;border-radius:.4rem;display:grid;place-items:center;font-size:1.15rem;background:var(--flaeche-3);color:var(--leise)}
.ei.k .ek{color:var(--warn);background:rgba(255,96,88,.14)} .ei.h .ek{color:var(--acht);background:rgba(243,181,74,.12)}
.ei .et{min-width:0}
.ei .et b{display:flex;align-items:center;gap:.45rem;font:400 1.14rem/1.15 var(--haus);color:#fff;white-space:nowrap}
.ei .et small{display:block;font-size:.9rem;color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ei .er{display:flex;flex-direction:column;align-items:flex-end;gap:.2rem}
.ei .er .go{color:var(--gold);font-size:.88rem;font-weight:600;white-space:nowrap}
.ei.e{opacity:.62} .ei.e .et b{color:var(--leise);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.ei .lgp{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:.4rem;background:var(--flaeche-3);color:var(--stumm);font-size:1.2rem}
/* Detail */
.dk2{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center;padding:1rem 1.1rem;border-bottom:1px solid var(--linie);isolation:isolate;overflow:hidden;flex:none}
.dk2 .bg{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center 30%;opacity:.3;-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%)}
.dk2 h3{margin:.25rem 0 .2rem;font:400 1.75rem/1.05 var(--haus);color:#fff}
.dk2 small{font-size:.9rem;color:var(--leise)}
.dk2 .big{display:grid;place-items:center;width:5.5rem;height:5.5rem;border-radius:.6rem;background:var(--flaeche-3);font-size:2.6rem;color:var(--gold);border:1px solid var(--linie-2)}
.wahl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem .8rem;align-items:center;padding:.6rem .8rem;border:1px solid var(--linie-2);border-radius:.5rem;background:var(--flaeche-2);margin-bottom:.4rem;width:100%;flex:none}
.wahl:hover{border-color:var(--gold);background:var(--flaeche-3)}
.wahl b{font-size:1.08rem;color:var(--tinte);display:flex;align-items:center;gap:.5rem}
.wahl small{grid-column:1;font-size:.88rem;color:var(--leise);line-height:1.25}
.wahl .ar{grid-row:1/3;grid-column:2;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--leise);display:flex;align-items:center;gap:.3rem}
.wahl.emp{border-color:rgba(240,195,90,.6);background:linear-gradient(90deg,rgba(240,195,90,.14),var(--flaeche-2))}
.schr{display:grid;grid-template-columns:1.5rem minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.42rem .2rem;border-top:1px solid rgba(244,230,196,.07);font-size:.98rem;flex:none}
.schr:first-of-type{border-top:0}
.schr .hk2{width:1.3rem;height:1.3rem;border-radius:50%;display:grid;place-items:center;font-size:.8rem;border:1px solid var(--linie-2);color:transparent}
.schr.ok .hk2{background:var(--gut);border-color:var(--gut);color:#06080c} .schr.ok span{color:var(--leise)}
.schr a{color:var(--gold);font-weight:600;font-size:.88rem}
.fuss2{display:flex;gap:.5rem;align-items:center;padding:.6rem .9rem;border-top:1px solid var(--linie);flex:none}
.fuss2 .sp{flex:1}
/* Chronik */
.tag2{display:grid;grid-template-columns:5.2rem minmax(0,1fr);gap:.8rem;margin-bottom:.4rem}
.tag2 .dt{padding-top:.5rem;text-align:right}
.tag2 .dt b{display:block;font-size:1.7rem;line-height:1;color:var(--creme)} .tag2 .dt small{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--stumm);font-weight:700}
.tag2 .dt .dd{display:block;font-size:.8rem;color:var(--leise);margin-top:.15rem}
.tag2 .ls{border-left:2px solid var(--linie);padding-left:.8rem}
.story{position:relative;flex:none;height:15rem;border-radius:.6rem;overflow:hidden;border:1px solid var(--linie-2);background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:1rem}
.story::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(4,6,10,.95) 85%)}
.story>*{position:relative}
.story h3{margin:.3rem 0 0;font:400 2rem/1.05 var(--haus);color:#fff}
</style>
</head>
